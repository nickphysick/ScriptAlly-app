<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agents. Queries. Materials. Tasks. QueryHawk tracks your entire querying campaign and gives your manuscript the best chance of success. We're bringing 50 founding writers on board to test it. In return, they'll get the full package, free for their whole journey." />
    <!-- Sharing preview (Open Graph + Twitter/X), launch readiness 2 Nov. Crawlers do not run JavaScript,
         so these live in the static head (META-1 reads the built file). The image is
         public/images/og-share.png (1200×630). The older JPEG share image stays on disk, unreferenced. -->
    <meta property="og:title" content="QueryHawk: Your smart querying companion" />
    <meta property="og:description" content="Agents. Queries. Materials. Tasks. QueryHawk tracks your entire querying campaign and gives your manuscript the best chance of success. We're bringing 50 founding writers on board to test it. In return, they'll get the full package, free for their whole journey." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://queryhawk.net/" />
    <meta property="og:site_name" content="QueryHawk" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://queryhawk.net/images/og-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QueryHawk: Hunting for a literary agent? No more winging it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QueryHawk: Your smart querying companion" />
    <meta name="twitter:description" content="Agents. Queries. Materials. Tasks. QueryHawk tracks your entire querying campaign and gives your manuscript the best chance of success. We're bringing 50 founding writers on board to test it. In return, they'll get the full package, free for their whole journey." />
    <meta name="twitter:image" content="https://queryhawk.net/images/og-share.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- ICO carries 32-bit alpha, so this one is transparent too — it exists because a browser asks
         for /favicon.ico at the root whether or not anything links to it. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Mobile Pass 1: installable app shell — theme colour = the capsule ground token
         (--shell-ground), background = the content capsule (--shell-canvas). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e7e0d5" />
    <!-- (The Tabler icons webfont is GONE — Tier 3+4 · Phase 9: zero .ti consumers anywhere in
         src, TypeGlyph is hand-rolled SVG, and the CDN stylesheet was a render-blocking external
         request on every page load.) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- App font stack: Playfair Display (serif/display) + Source Sans 3 (sans/body) + JetBrains Mono (labels) + Caveat (handwriting).
         ⚠️ SOURCE SANS PRO IS STILL REQUESTED, AND ONLY BECAUSE ~20 COMPONENTS NAME IT AS A LITERAL.
         `--font-sans` is Source Sans 3 (the same typeface, renamed at its own version 3, and what
         every design ref declares); the literals are a follow-up sweep, and until they read the
         token, dropping Pro would fall those surfaces back to a system sans. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Source+Sans+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Special Elite and Source Serif 4. The public pages use both (marketing.css); the signed-in
         dashboard's greeting uses Special Elite too (.os-greet .os-hello in oneScreen.css), so this
         link must stay app-wide rather than move to a marketing-only load. -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <title>QueryHawk: Your smart querying companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
