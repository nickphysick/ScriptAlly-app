<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ScriptAlly — the literary querying companion for fiction authors. Track agent queries, submissions, and follow-ups, and query with confidence." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Mobile Pass 1: installable app shell — theme colour = the capsule ground token
         (--shell-ground), background = the content capsule (--shell-canvas). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e7e0d5" />
    <!-- (The Tabler icons webfont is GONE — Tier 3+4 · Phase 9: zero .ti consumers anywhere in
         src, TypeGlyph is hand-rolled SVG, and the CDN stylesheet was a render-blocking external
         request on every page load.) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- App font stack: Playfair Display (serif/display) + Source Sans Pro (sans/body) + JetBrains Mono (labels) + Caveat (handwriting). -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>ScriptAlly: Query With Confidence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
