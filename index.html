<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ScriptAlly — the literary querying companion for fiction authors. Track agent queries, submissions, and follow-ups, and query with confidence." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Mobile Pass 1: installable app shell — theme colour = the capsule ground token
         (--shell-ground), background = the content capsule (--shell-canvas). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e7e0d5" />
    <!-- (The Tabler icons webfont is GONE — Tier 3+4 · Phase 9: zero .ti consumers anywhere in
         src, TypeGlyph is hand-rolled SVG, and the CDN stylesheet was a render-blocking external
         request on every page load.) -->
    <!-- The marketing nav's wordmark face, self-hosted (see the @font-face in marketing.css).
         PRELOADED BECAUSE `font-display: swap` GUARANTEES A FLASH BY DESIGN — it paints the
         fallback and swaps when the file lands. At 14.5KB, starting the fetch here rather than
         after the CSS that references it has been parsed is what makes the swap land before first
         paint instead of after it. `crossorigin` is required even same-origin: fonts are fetched
         in CORS mode, and without it the preload misses and the file is fetched twice. -->
    <link rel="preload" href="/fonts/archivo-expanded-700.woff2?v=7b773c44" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- App font stack: Playfair Display (serif/display) + Source Sans 3 (sans/body) + JetBrains Mono (labels) + Caveat (handwriting).
         ⚠️ SOURCE SANS PRO IS STILL REQUESTED, AND ONLY BECAUSE ~20 COMPONENTS NAME IT AS A LITERAL.
         `--font-sans` is Source Sans 3 (the same typeface, renamed at its own version 3, and what
         every design ref declares); the literals are a follow-up sweep, and until they read the
         token, dropping Pro would fall those surfaces back to a system sans. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Source+Sans+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- The landing page's feature rows only: Special Elite for their headings and Source Serif 4 for their
         paragraphs, named by .mk-frow h3 and .mk-fcopy p in marketing.css and by nothing else. -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <title>ScriptAlly: Query With Confidence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
