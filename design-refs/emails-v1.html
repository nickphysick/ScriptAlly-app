<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryHawk emails v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2433;--navy:#2d3a50;--sheet:#f2eee8;--paper:#fffdf9;--terra:#d9967a;--rust:#9a5638;--line:rgba(27,36,51,.14);--mute:#5b6472;--serif:"Source Serif 4",Georgia,serif;--tw:"Special Elite","Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);font:400 16px/1.5 var(--serif);color:var(--ink)}
button{font:inherit;color:inherit}
.wrap{display:grid;grid-template-columns:380px 1fr;height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:22px 0 28px}
.side h1{font:400 24px/1.25 var(--tw);margin:0 22px 6px}
.side .sum{margin:0 22px 14px;font-size:15px;color:var(--mute)}
.grp{margin:18px 22px 6px;font:600 16px/1.3 var(--serif);color:var(--ink)}
.it{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:10px 22px 10px 19px;cursor:pointer}
.it:hover{background:rgba(27,36,51,.04)}
.it[aria-current=true]{background:#f4ece2;border-left-color:var(--rust)}
.it:focus-visible,.seg button:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.it .s{display:block;font-weight:600;font-size:16px;line-height:1.35}
.it .p{display:block;font-size:14px;color:var(--mute);line-height:1.4;margin-top:2px}
.chip{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:99px;font-size:14px;line-height:1.4;border:1px solid var(--line);color:var(--mute);background:#fff}
.chip.new{border-color:var(--terra);color:var(--rust);background:#fbf1eb}
.chip.launch{border-style:dashed}
.main{background:var(--sheet);overflow-y:auto;min-width:0}
.meta{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 28px 16px;position:sticky;top:0;z-index:2}
.meta-top{display:flex;align-items:flex-start;gap:16px}
.meta h2{font:400 21px/1.3 var(--tw);margin:0 0 8px;flex:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:15px}
.dl dt{color:var(--mute)}.dl dd{margin:0}
.why{margin:10px 0 0;font-size:15px;color:#3c4656;max-width:74ch}
.seg{display:inline-flex;border:1px solid rgba(27,36,51,.28);border-radius:8px;overflow:hidden;flex:none}
.seg button{min-height:38px;padding:0 14px;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:600}
.stage{padding:24px 16px 60px;display:flex;justify-content:center}
.frame{width:100%;max-width:640px;background:#f2eee8;border-radius:10px;box-shadow:0 1px 2px rgba(27,36,51,.08),0 18px 40px -22px rgba(27,36,51,.4);overflow:hidden;transition:max-width .2s}
.frame.phone{max-width:375px}
@media (prefers-reduced-motion:reduce){.frame{transition:none}}
@media(max-width:820px){
  .wrap{display:block;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  .main{overflow:visible}.meta{position:static;padding:16px}
  .meta-top{flex-direction:column;gap:8px}
  .stage{padding:16px 8px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="side" aria-label="Emails">
    <h1>Every email QueryHawk sends</h1>
    <p class="sum" id="sum"></p>
    <div id="list"></div>
  </nav>
  <main class="main">
    <div class="meta">
      <div class="meta-top">
        <h2 id="m-subj"></h2>
        <div class="seg" role="group" aria-label="Preview width">
          <button data-w="desk" aria-pressed="true">Desktop</button><button data-w="phone" aria-pressed="false">Phone</button>
        </div>
      </div>
      <dl class="dl">
        <dt>From</dt><dd id="m-from"></dd>
        <dt>Preview</dt><dd id="m-pre"></dd>
        <dt>Sent</dt><dd id="m-when"></dd>
      </dl>
      <p class="why" id="m-why"></p>
    </div>
    <div class="stage"><div class="frame" id="frame"></div></div>
  </main>
</div>

=\"margin:0 0 14px;font-family:'Special Elite','Courier New',Courier,monospace;font-size:28px;line-height:1.2;font-weight:400;color:#1c130f\">One click and you're on the list.<\/h1><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 20px\"><tr><td width=\"44\" height=\"3\" bgcolor=\"#2a3a52\" style=\"width:44px;height:3px;background:#2a3a52;border-radius:3px;font-size:0;line-height:0\">&nbsp;<\/td><\/tr><\/table><p style=\"margin:0 0 16px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#57504c\">Thanks for putting your name down as a QueryHawk founding writer. There's just one thing left to do.<\/p><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:6px 0 10px\"><tr><td bgcolor=\"#2a3a52\" style=\"background:#2a3a52;border-radius:12px\"><a href=\"#\" onclick=\"return false\" style=\"display:inline-block;padding:15px 30px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:17px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:12px\">Confirm my place<\/a><\/td><\/tr><\/table><p style=\"margin:0 0 6px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.6;color:#827d79\">This link works for 48 hours.<\/p><p style=\"margin:0 0 20px;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:11.5px;line-height:1.5;color:#827d79;word-break:break-all\">https://queryhawk.net/api/waitlist/verify?token=\u2026<\/p><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"margin:8px 0 22px\"><tr><td bgcolor=\"#f7ece6\" style=\"background:#f7ece6;border-radius:14px;padding:16px 18px\"><p style=\"margin:0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:15.5px;line-height:1.6;color:#1c130f\"><b>Your place isn't held until you click.<\/b> There are fifty founding places and they go in the order people confirm. If the last one goes while this sits in your inbox, you'll go on the reserve list instead, and I'll let you know.<\/p><\/td><\/tr><\/table><p style=\"margin:0 0 16px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#57504c\">Once you've confirmed, you'll get your founding writer pass, and your invite follows when your wave opens.<\/p><p style=\"margin:0 0 4px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.6;color:#827d79\">Didn't ask for this? Just ignore it. Nothing happens without that click, and we won't write again.<\/p><\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:18px 26px 0\"><p style=\"margin:0 0 8px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:13.5px;line-height:1.6;color:#726b66\">Questions, or something you'd like QueryHawk to do? Just reply, or write to <a href=\"#\" onclick=\"return false\" style=\"color:#726b66;text-decoration:underline\">hello@queryhawk.net<\/a>. I read every one.<\/p><p style=\"margin:0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.55;color:#87807c\"><a href=\"#\" onclick=\"return false\" style=\"color:#87807c;text-decoration:underline\">Unsubscribe<\/a> \u00b7 This takes you off the list and frees your place for another writer.<br>QueryHawk \u00b7 Made in the UK, for writers<\/p><\/td><\/tr><\/table><\/td><\/tr><\/table>"}, {"id": "welcome", "group": "Founding writers", "status": "built", "frm": "Nick at QueryHawk &lt;nick@queryhawk.net&gt;", "subject": "You're on the list: founding writer No. 14", "pre": "Your founding writer pass is inside.", "when": "When they click Confirm and a founding place is free.", "why": "Sent today, unchanged. The small capitals on the pass are the label style you've ruled out in the app; on a ticket I'd leave them, but say if you want them changed.", "html": "<table role=\"presentation\" cellpadding=\"0\" cells rier,monospace;font-size:28px;line-height:1.2;font-weight:400;color:#1c130f\">That's your place confirmed.<\/h1><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 20px\"><tr><td width=\"44\" height=\"3\" bgcolor=\"#2a3a52\" style=\"width:44px;height:3px;background:#2a3a52;border-radius:3px;font-size:0;line-height:0\">&nbsp;<\/td><\/tr><\/table><p style=\"margin:0 0 20px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#57504c\">Welcome aboard. You'll be one of the first fifty writers to use QueryHawk.<\/p><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"margin:6px 0 24px\"><tr><td style=\"border-left:3px solid #e8b4a3;padding:2px 0 2px 18px\"><p style=\"margin:0 0 12px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#1c130f\">Hi, I'm Nick. I spent a year designing and building QueryHawk alongside my day job, driven by the belief that good stories shouldn't be lost to a messy querying campaign.<\/p><p style=\"margin:0 0 12px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#1c130f\">I truly believe these tools give your manuscript the very best chance of landing with the right agent. Please use everything QueryHawk has to offer and let me know how you find it.<\/p><p style=\"margin:0 0 12px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#1c130f\">Very best of luck with your campaign, and thank you for being part of the journey. We'll speak soon.<\/p><p style=\"margin:0 0 2px;font-family:Caveat,'Comic Sans MS',cursive;font-size:34px;line-height:1;font-weight:600;color:#a2452a\">Nick<\/p><p style=\"margin:0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:14px;line-height:1.6;color:#827d79\">Founder, QueryHawk<\/p><\/td><\/tr><\/table><h2 style=\"margin:0 0 8px;font-family:'Special Elite','Courier New',Courier,monospace;font-size:20px;line-height:1.3;font-weight:400;color:#1c130f\">What you get<\/h2><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 20px\"><tr><td valign=\"top\" style=\"padding:5px 10px 5px 0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;font-weight:700;color:#a2452a\">&#10003;<\/td><td style=\"padding:5px 0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16px;line-height:1.45;color:#1c130f\"><b>QueryHawk Pro, free<\/b> for your entire querying campaign<\/td><\/tr><tr><td valign=\"top\" style=\"padding:5px 10px 5px 0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;font-weight:700;color:#a2452a\">&#10003;<\/td><td style=\"padding:5px 0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16px;line-height:1.45;color:#1c130f\"><b>A direct line<\/b> to the founder<\/td><\/tr><tr><td valign=\"top\" style=\"padding:5px 10px 5px 0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;font-weight:700;color:#a2452a\">&#10003;<\/td><td style=\"padding:5px 0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16px;line-height:1.45;color:#1c130f\"><b>Smart Import<\/b> to bring your list across<\/td><\/tr><tr><td valign=\"top\" style=\"padding:5px 10px 5px 0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;font-weight:700;color:#a2452a\">&#10003;<\/td><td style=\"padding:5px 0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16px;line-height:1.45;color:#1c130f\"><b>An exclusive Early Bird discount<\/b> for the writers you invite when we launch<\/td><\/tr><\/table><h2 style=\"margin:0 0 8px;font-family:'Special Elite','Courier New',Courier,monospace;font-size:20px;line-height:1.3;font-weight:400;color:#1c130f\">What happens next<\/h2><p style=\"margin:0 0 4px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6;color:#57504c\">We're opening QueryHawk to founding writers in waves rather than all at once, so we can fix what the first group finds before the next arrives. When your wave opens, you'll get an invite with a link to set up your account.<\/p><\/td><\/tr><\/table><\/td><\/tr><tr><td style=\"padding:18px 26px 0\"><p style=\"margin:0 0 8px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:13.5px;line-height:1.6;color:#726b66\">Questions, or something you'd like QueryHawk to do? Just reply, or write to <a href=\"#\" onclick=\"return false\" style=\"color:#726b66;text-decoration:underline\">hello@queryhawk.net<\/a>. I read every one.<\/p><p style=\"margin:0;font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.55;color:#87807c\"><a href=\"#\" onclick=\"return false\" style=\"color:#87807c;text-decoration:underline\">Unsubscribe<\/a> \u00b7 This takes you off the list and frees your place for another writer.<br>QueryHawk \u00b7 Made in the UK, for writers<\/p><\/td><\/tr><\/table><\/td><\/tr><\/table>"}, {"id": "reserve", "group": "Founding writers", "status": "built", "frm": "Nick at QueryHawk &lt;nick@queryhawk.net&gt;", "subject": "You're on the founding writers' reserve list", "pre": "The fifty places went, but you're on the reserve list.", "when": "When they click Confirm after the fiftieth place has gone.", "why": "Sent today, unchanged. Moving the next reserve writer into a freed place was built on 2 November, so the promise here holds.", "html": "<table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" bgcolor=\"#f2eee8\" style=\"background:#f2eee8\"><tr><td align=\"center\" style=\"padding:26px 14px 30px\"><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"max-width:560px;margin:0 auto\"><tr><td style=\"pa
