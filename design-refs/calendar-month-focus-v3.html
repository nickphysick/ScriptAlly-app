<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>ScriptAlly — Calendar v2 (design ref)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f2ede7;--parchment:#fdfaf5;--white:#fff;--ink:#3a1c14;--muted:#8a7a6c;--label:#9c8878;
    --burgundy:#7c3a2a;--pink-bg:#f5e2da;--pink-border:#e8c8bc;--pink-band:#f3e0d6;
    --sage-a:#d7ddd5;--sage-b:#d5dbd3;--sage-text:#5a6e58;--sage:#8a9e88;
    --hairline:#ece0d2;--chip-line:#e0d0c4;--dashed:#c9a89e;--record:#b9a48f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);font-family:'Inter',sans-serif;color:var(--ink);padding:24px 28px;-webkit-font-smoothing:antialiased}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.17em;text-transform:uppercase;font-weight:500;color:var(--label)}

  .bar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
  .mtitle{font-family:'Playfair Display',serif;font-size:36px;font-weight:500;line-height:1}
  .mtitle .yr{color:var(--muted);font-style:italic;font-size:28px;margin-left:8px}
  .btn{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em;border-radius:10px;
       padding:9px 15px;cursor:pointer;background:var(--white);border:1px solid var(--chip-line);color:#6a5a50;line-height:1}
  .btn:hover{border-color:var(--dashed);color:var(--burgundy)}
  .btn.icon{padding:9px 11px}
  .btn.primary{background:var(--pink-bg);border-color:var(--pink-border);color:var(--burgundy)}
  .nav{display:flex;gap:7px;align-items:center;margin-bottom:2px}
  .ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:500;
        padding:6px 11px;border-radius:999px;cursor:pointer;background:var(--white);border:1px solid var(--chip-line);
        color:var(--label);display:inline-flex;align-items:center;gap:6px;line-height:1}
  .chip .sw{width:7px;height:7px;border-radius:50%}
  .chip[data-on="true"]{color:var(--ink);border-color:var(--dashed);background:var(--parchment)}
  .chip[data-on="false"]{opacity:.42}
  .sep{width:1px;height:18px;background:var(--chip-line);margin:0 3px}
  .chip.record[data-on="true"]{background:#f6f1ea;border-color:var(--record)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start;margin-bottom:28px}
  @media(max-width:1080px){.layout{grid-template-columns:1fr}.panel{position:static!important}}

  .month{background:var(--parchment);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(135deg,var(--sage-a),var(--sage-b));border-bottom:1px solid var(--hairline)}
  .wk div{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--sage-text);text-align:center;padding:9px 0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{height:112px;overflow:hidden;padding:6px;border-bottom:1px solid var(--hairline);border-right:1px solid var(--hairline);
        display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--parchment)}
  .cell:nth-child(7n){border-right:none}
  .grid .cell:nth-last-child(-n+7){border-bottom:none}
  .cell.wknd{background:#fbf7f0}
  .cell.other{background:#f8f4ed}.cell.other .dn{color:#d5c8ba}
  .cell:hover{background:#faf3ec}
  .cell.sel{background:#fdf5f2;box-shadow:inset 0 0 0 1.5px var(--burgundy)}
  .dn{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;color:var(--label);
      width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .cell.today .dn{background:var(--burgundy);color:#f8f5f0;border-radius:50%}
  .past .dn{color:#c3b3a4}

  .pip{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;padding:3px 9px;border-radius:999px;
       line-height:1.15;overflow:hidden;white-space:nowrap}
  .pip .txt{overflow:hidden;text-overflow:ellipsis}
  .pip .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .pip.agent{background:var(--pink-band);border:1px solid var(--pink-border)}
  .pip.agent .d{background:var(--pink-bg);border:1.5px solid var(--burgundy)}
  .pip.task{background:var(--white);border:1px solid var(--chip-line)}
  .pip.task .d{border-radius:2px;border:1.5px solid var(--burgundy)}
  .pip.snoozed{background:transparent;border:1px dashed var(--dashed);color:#7a685c}
  .pip.snoozed .d{border:1.5px dashed var(--dashed)}
  .pip.done{opacity:.5;background:var(--white);border:1px solid var(--hairline)}
  .pip.done .txt{text-decoration:line-through}
  .pip.done .d{background:var(--burgundy)}
  /* the record layer — settled, recessive, no fill */
  .pip.rec{background:transparent;border:none;color:#7d6b5d;padding-left:2px}
  .pip.rec .d{width:6px;height:6px;background:var(--record)}
  .pip.rec.in .d{background:var(--sage)}
  .more{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dashed);margin-top:auto;align-self:center}

  .panel{position:sticky;top:18px;background:var(--white);border:1px solid var(--hairline);border-top:5px solid var(--sage);
         border-radius:4px;box-shadow:0 4px 14px rgba(58,28,20,.07);display:flex;flex-direction:column;min-height:500px;max-height:calc(100vh - 50px)}
  .ph{padding:16px 18px 13px;border-bottom:1px solid var(--hairline)}
  .pdate{font-family:'Playfair Display',serif;font-size:28px;font-weight:500;margin-top:5px;line-height:1.1}
  .pcount{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--label);margin-top:6px}
  .pill{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
        background:var(--pink-bg);border:1px solid var(--pink-border);color:var(--burgundy);border-radius:999px;padding:3px 9px}
  .pb{flex:1;overflow-y:auto;padding:4px 18px 14px}
  .sec{margin-top:15px}
  .sech{display:flex;align-items:center;gap:9px}
  .sech::after{content:'';flex:1;height:1px;background:var(--hairline)}
  .rows{margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .row{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:9px;background:var(--parchment);border:1px solid var(--hairline)}
  .row.act{background:#fff8f4;border-color:#f0dcd0}
  .row.prov{background:transparent;border:1px dashed var(--dashed)}
  .row.rec{background:transparent;border:none;border-left:2px solid var(--record);border-radius:0;padding:7px 11px;cursor:pointer}
  .row.rec.in{border-left-color:var(--sage)}
  .row.rec:hover{background:#faf7f2}
  .row.rec.open{background:#faf7f2}
  .rmain{flex:1;min-width:0}
  .rname{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;line-height:1.25}
  .rname em{font-style:italic;color:var(--burgundy)}
  .row.rec .rname{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:#5c4a3e}
  .rsub{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--label);margin-top:4px}
  .rbtn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.07em;font-weight:500;background:var(--white);
        border:1px solid var(--chip-line);color:var(--burgundy);border-radius:8px;padding:6px 11px;cursor:pointer;line-height:1}
  .rbtn:hover{background:var(--pink-bg);border-color:var(--pink-border)}
  .rbtn.quiet{color:#6a5a50}
  .detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline)}
  .dg{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;align-items:baseline}
  .dk{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
  .dv{font-size:11.5px;line-height:1.35}
  .dacts{display:flex;gap:7px;margin-top:11px}
  .empty{text-align:center;padding:54px 18px 34px}
  .empty .big{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;color:var(--muted)}
  .pf{border-top:1px solid var(--hairline);padding:11px 16px;background:#fdfbf7;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pf .note{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
</style>
</head>
<body>

<div class="bar">
  <div style="display:flex;align-items:flex-end;gap:16px">
    <div>
      <div class="lbl" style="margin-bottom:6px">Tasks · Calendar</div>
      <h1 class="mtitle" id="mt">August<span class="yr">2026</span></h1>
    </div>
    <div class="nav">
      <button class="btn icon" id="prev">‹</button><button class="btn" id="today">TODAY</button><button class="btn icon" id="next">›</button>
    </div>
  </div>
  <div class="ctrls">
    <button class="btn primary" id="addBtn">+ NEW</button>
    <div class="chips" id="chips">
      <button class="chip" data-f="agent" data-on="true"><span class="sw" style="background:var(--pink-bg);border:1.5px solid var(--burgundy)"></span>Agent</button>
      <button class="chip" data-f="task" data-on="true"><span class="sw" style="border:1.5px solid var(--burgundy);border-radius:2px"></span>Tasks</button>
      <button class="chip" data-f="snoozed" data-on="true"><span class="sw" style="border:1.5px dashed var(--dashed)"></span>Snoozed</button>
      <button class="chip" data-f="done" data-on="true"><span class="sw" style="background:var(--burgundy)"></span>Done</button>
      <span class="sep"></span>
      <button class="chip record" data-f="rec" data-on="true"><span class="sw" style="background:var(--record)"></span>The record</button>
    </div>
  </div>
</div>

<div class="layout">
  <div class="month">
    <div class="wk"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <aside class="panel">
    <div class="ph">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="lbl" id="pwd">Wednesday</span><span class="pill" id="ppill">Today</span>
      </div>
      <div class="pdate" id="pdate">19 August</div>
      <div class="pcount" id="pcount"></div>
    </div>
    <div class="pb" id="pb"></div>
    <div class="pf">
      <span class="note">Add tasks on the To-do list</span>
      <button class="btn" id="goTodo">GO THERE ›</button>
    </div>
  </aside>
</div>

<script>
const TODAY=new Date(2026,7,19);
let view={y:2026,m:7}, selected=iso(TODAY), openRow=null;
const on={agent:true,task:true,snoozed:true,done:true,rec:true};

/* families: agent | task | snoozed | done  (the shared feed, projected on action dates)
   rec = the record layer, derived from activities — past only */
const D={
 '2026-08-03':[rec('out','Query sent','R. Whitmore',{agency:'Whitmore & Bond',ms:'Murphy’s Day',what:'Query letter, synopsis, first 10 pages',tl:'Exchange 1 · opened the conversation',log:'Logged 3 Aug 2026'})],
 '2026-08-05':[rec('out','Query sent','D. Okafor',{agency:'Castle Lane Literary',ms:'Murphy’s Day',what:'Query letter, synopsis',tl:'Exchange 1 · opened the conversation',log:'Logged 5 Aug 2026'})],
 '2026-08-07':[card('done','Polish the synopsis')],
 '2026-08-11':[rec('in','Partial requested','L. Marchetti',{agency:'Marchetti Literary',ms:'Murphy’s Day',what:'She asked for the first 3 chapters',tl:'Exchange 2 · she replied in 6 days',log:'Logged 11 Aug 2026'})],
 '2026-08-12':[rec('out','Partial sent','L. Marchetti',{agency:'Marchetti Literary',ms:'Murphy’s Day',what:'First 3 chapters, synopsis',tl:'Exchange 3 · you replied in 1 day',log:'Logged 12 Aug 2026'})],
 '2026-08-14':[rec('in','Holding reply','R. Whitmore',{agency:'Whitmore & Bond',ms:'Murphy’s Day',what:'Still reading — will be in touch',tl:'Exchange 2 · the waiting clock restarted',log:'Logged 14 Aug 2026'})],
 '2026-08-17':[rec('out','Nudge sent','P. Kaur',{agency:'Kaur & Finch',ms:'Murphy’s Day',what:'Polite follow-up on the query',tl:'Exchange 2 · 8 weeks after the query',log:'Logged 17 Aug 2026'})],
 '2026-08-19':[card('agent','Send your full · J. Ashworth'),card('task','Book the library room')],
 '2026-08-22':[card('snoozed','Research five new agents')],
 '2026-08-24':[card('agent','Window expires · R. Whitmore')],
 '2026-08-26':[card('task','Follow up with Castle Lane')],
 '2026-08-28':[card('agent','Window expires · D. Okafor')],
};
function card(family,label){return{k:'card',family,label}}
function rec(dir,label,agent,x){return Object.assign({k:'rec',dir,label,agent},x)}

const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
const W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function vis(i){return i.k==='rec'?on.rec:on[i.family]}
function day(k){return (D[k]||[]).filter(vis)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function pillLabel(i){
  if(i.k==='rec') return i.label;                       /* record labels are already two words */
  const l=i.label;
  if(/^Send your full/.test(l)) return 'Send full';
  if(/^Send your partial/.test(l)) return 'Send partial';
  if(/^Window expires/.test(l)) return 'Window expires';
  if(/^Nudge/.test(l)) return 'Nudge due';
  if(i.family==='snoozed') return 'Task returns';
  return l;                                             /* writer's own tasks keep their words */
}
function pipHTML(i,k,idx){
  if(i.k==='rec') return `<div class="pip rec ${i.dir==='in'?'in':''}" data-ridx="${idx}"><span class="d"></span><span class="txt">${esc(pillLabel(i))}</span></div>`;
  return `<div class="pip ${i.family}"><span class="d"></span><span class="txt">${esc(pillLabel(i))}</span></div>`;
}

function renderGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  const first=new Date(view.y,view.m,1), pad=(first.getDay()+6)%7;
  const start=new Date(view.y,view.m,1-pad);
  for(let n=0;n<42;n++){
    const d=new Date(start);d.setDate(start.getDate()+n);
    const k=iso(d), dow=(d.getDay()+6)%7;
    const c=document.createElement('div');
    c.className='cell'+(d.getMonth()!==view.m?' other':'')+(dow>=5?' wknd':'')
      +(k===iso(TODAY)?' today':'')+(k===selected?' sel':'')+(d<TODAY?' past':'');
    const items=day(k), cap=items.length<=3?3:2, show=items.slice(0,cap), rest=items.length-show.length;
    const recIdx=new Map(items.filter(i=>i.k==='rec').map((r,n)=>[r,n]));
    c.innerHTML=`<span class="dn">${d.getDate()}</span>`+show.map(i=>pipHTML(i,k,recIdx.has(i)?recIdx.get(i):-1)).join('')
      +(rest>0?`<span class="more">+${rest} MORE</span>`:'');
    c.onclick=e=>{
      const p=e.target.closest('.pip[data-ridx]');
      sel(k);
      if(p && Number(p.dataset.ridx)>=0){ openRow=k+'-r-'+p.dataset.ridx; renderPanel(); }
    };
    g.appendChild(c);
  }
  document.getElementById('mt').innerHTML=`${M[view.m]}<span class="yr">${view.y}</span>`;
}

function renderPanel(){
  const d=fromIso(selected), items=day(selected);
  document.getElementById('pwd').textContent=W[d.getDay()];
  document.getElementById('pdate').textContent=d.getDate()+' '+M[d.getMonth()];
  document.getElementById('ppill').style.display=selected===iso(TODAY)?'':'none';
  const live=items.filter(i=>i.k==='card'), recs=items.filter(i=>i.k==='rec');
  document.getElementById('pcount').textContent =
    items.length?`${items.length} ITEM${items.length>1?'S':''}${recs.length?' · '+recs.length+' ON THE RECORD':''}`:'';

  const pb=document.getElementById('pb');
  if(!items.length){pb.innerHTML=`<div class="empty"><div class="big">A clear day.</div><div class="lbl" style="margin-top:9px">Nothing scheduled · nothing waiting</div></div>`;return}

  let h='';
  const act=live.filter(i=>i.family==='agent'||i.family==='task');
  const prov=live.filter(i=>i.family==='snoozed');
  const done=live.filter(i=>i.family==='done');

  if(act.length) h+=sec('Over to you',act.map(i=>`
    <div class="row act">
      <div class="rmain"><div class="rname">${esc(i.label)}</div><div class="rsub">${i.family==='agent'?'Your turn':'Your task'}</div></div>
      <button class="rbtn">OPEN</button>
    </div>`));
  if(prov.length) h+=sec('Coming back',prov.map(i=>`
    <div class="row prov"><div class="rmain"><div class="rname">${esc(i.label)}</div><div class="rsub">Snoozed · returns today</div></div></div>`));
  if(done.length) h+=sec('Done',done.map(i=>`
    <div class="row"><div class="rmain"><div class="rname" style="text-decoration:line-through;opacity:.6">${esc(i.label)}</div></div></div>`));

  if(recs.length) h+=sec('On the record',recs.map((r,n)=>{
    const key=selected+'-r-'+n, o=openRow===key;
    return `<div class="row rec ${r.dir==='in'?'in':''} ${o?'open':''}" data-r="${key}">
      <div class="rmain">
        <div class="rname">${esc(r.label)} — <em>${esc(r.agent)}</em></div>
        <div class="rsub">${r.dir==='in'?'From the agent':'From you'}</div>
        ${o?`<div class="detail">
          <div class="dg">
            <span class="dk">Agent</span><span class="dv">${esc(r.agent)} · ${esc(r.agency)}</span>
            <span class="dk">Manuscript</span><span class="dv">${esc(r.ms)}</span>
            <span class="dk">Detail</span><span class="dv">${esc(r.what)}</span>
            <span class="dk">Timeline</span><span class="dv">${esc(r.tl)}</span>
            <span class="dk">Record</span><span class="dv">${esc(r.log)}</span>
          </div>
          <div class="dacts"><button class="rbtn">OPEN QUERY</button><button class="rbtn quiet">EDIT THIS ENTRY</button></div>
        </div>`:''}
      </div>
    </div>`;
  }));
  pb.innerHTML=h;
  pb.querySelectorAll('.row.rec').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.rbtn'))return;
    openRow=openRow===r.dataset.r?null:r.dataset.r;renderPanel();
  });
}
function sec(t,rows){return `<div class="sec"><div class="sech"><span class="lbl">${t}</span></div><div class="rows">${rows.join('')}</div></div>`}

function sel(k){if(k!==selected)openRow=null;selected=k;
  const d=fromIso(k);if(d.getMonth()!==view.m||d.getFullYear()!==view.y)view={y:d.getFullYear(),m:d.getMonth()};
  render()}
function shift(n){view.m+=n;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}render()}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>sel(iso(TODAY));
document.getElementById('chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
  on[c.dataset.f]=!on[c.dataset.f];c.dataset.on=on[c.dataset.f];render()};
document.addEventListener('keydown',e=>{const d=fromIso(selected);
  if(e.key==='ArrowLeft')d.setDate(d.getDate()-1);else if(e.key==='ArrowRight')d.setDate(d.getDate()+1);
  else if(e.key==='ArrowUp')d.setDate(d.getDate()-7);else if(e.key==='ArrowDown')d.setDate(d.getDate()+7);
  else if(e.key==='t'||e.key==='T')return sel(iso(TODAY));else return;
  sel(iso(d))});
function render(){renderGrid();renderPanel()}
render();
</script>
</body>
</html>
