<title>Smart Querying on Phones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one row of phones per decision, each option a scaled phone you can pick */
:root{--bg:#f2eee8;--card:#fff;--ink:#1c130f;--muted:#655c55;--navy:#2a3a52;--blush:#e8c8bc;--wash:#f5e6df;--rule:#e2dbd2;--display:"Special Elite","Courier New",monospace;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b26;--card:#1f2836;--ink:#f1ece6;--muted:#b7aea6;--navy:#9fb3d1;--blush:#5a4440;--wash:#2e3646;--rule:#2f3a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b26;--card:#1f2836;--ink:#f1ece6;--muted:#b7aea6;--navy:#9fb3d1;--blush:#5a4440;--wash:#2e3646;--rule:#2f3a4b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 120px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0 0 8px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px}
.dec{margin:0 0 34px}
.dec h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px}
.dec>p{color:var(--muted);margin:0 0 14px;max-width:70ch}
.strip{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 12px}
.oc{flex:none;width:300px;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:18px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:10px;align-content:start}
.oc[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.oc:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ph{width:276px;height:552px;border-radius:26px;overflow:hidden;background:#1b2433;position:relative}
.ph iframe{border:0;width:390px;height:780px;transform:scale(.7077);transform-origin:0 0;}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.phs{display:flex;gap:10px}
.oc.fixed{cursor:default}
.l{display:flex;gap:10px;align-items:center}.l .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--rule)}
.oc[aria-pressed="true"] .k{background:#2a3a52;color:#fff}
.l b{font-weight:600}.d{font-size:14.5px;color:var(--muted)}
.rec{display:inline-block;background:var(--blush);color:var(--ink);border-radius:999px;padding:0 9px;font-size:12.5px;font-weight:600;justify-self:start}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2a3a52;color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:16px;align-items:center;justify-content:space-between;z-index:5}
.bar p{margin:0;font-size:14.5px;min-width:0}.bar button{flex:none;font:inherit;font-weight:700;background:#e8c8bc;color:#1c130f;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
textarea{width:100%;min-height:80px;border:1px solid var(--rule);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
</style>
<div class="wrap">
<h1>Smart querying on a phone</h1>
<p class="lede">Materials, packages, versions and comps as a proper part of the app, built from the desktop Submission packages page: Harbour blue for packages, soft pink for letters and synopses. The phones work. Pick by clicking the label under a phone.</p>
<div id="decs"></div>
<div class="dec"><h2>Anything else?</h2><textarea id="notes" placeholder="Notes go into what you copy"></textarea></div>
</div>
<div class="bar"><p id="sum"></p><button type="button" id="copy">Copy my picks</button></div>
<script>const DEC=[["bands", "Coloured bands, or navy everywhere?", "Honest answer: it's not common. Apple's own apps, Monzo, Strava, Airbnb and Revolut keep the same top on every tab, and get character from what's in each tab. A few colour-code sections (Apple Health, Things), but rarely the header itself. I'd keep navy and give each tab its own hero instead.", [["C", "Your pick: each tab its own band", "Blush To-do, slate Agents. Distinctive, but the app changes colour as you tap round it, and blush competes with the + button.", ["tab=queries&opt=c3,p3", "tab=todo&opt=c3,t1", "tab=agents&opt=c3"]], ["D", "Navy everywhere, each tab its own hero", "Same navy band on every tab, as the desktop's navy panels do. The character comes from what's in it: tappable counts on Queries, the week on To-do, the queried ring on Agents. Cards and tiles below, as in C.", ["tab=queries&opt=c4,p3", "tab=todo&opt=c4,t1", "tab=agents&opt=c4"], 1]]], ["nav", "Where packages live on a phone", "Today they're buried at the bottom of the Manuscript page. To give them priority they need a front door.", [["A", "A card on Home, and the menu", "Home gets a Packages card under Up next: what new queries go out with, and what's landing. The tab bar doesn't change.", ["opt=n1,f1&tab=home&scroll=700", "opt=n1,c4&page3=hub"]], ["B", "Its own tab; To-do moves onto Home", "Packages takes To-do's place in the tab bar. Home shows today's tasks under Up next, with \"See all\". The badge moves to Home.", ["opt=n2,f1&tab=home&scroll=600", "opt=n2,c4&tab3=packages"], 1], ["C", "Its own tab; Agents moves to the menu", "Packages takes Agents' place. Agents and Discover open from the menu and from search.", ["opt=n3,c4&tab3=packages"]]]], ["hub", "The Packages page", "Everything you send, in one place: what new queries go out with, what's landing, your packages, then each kind of piece on its own shelf. Scroll the phone.", [["A", "One page with shelves", "The active package at the top, then What's landing, Your packages, and a shelf each for versions, letters, synopses and comps. Tap anything to open it.", ["opt=n2,c4&tab3=packages", "opt=n2,c4&tab3=packages&scroll=560", "opt=n2,c4&tab3=packages&scroll=1000"], 1], ["B", "Tabs (this afternoon's 5B)", "Overview, Materials, Packages and Comps as tabs on the Manuscript page.", ["tab=home&page=manuscript&opt=m2&seg=packages&scroll=300"]]]], ["land", "What's landing", "How your pieces are doing, at the top of the page. Same numbers in every option: how often an agent asked for more.", [["A", "Showcase cards", "Your best package, letter, version and comp as cards you swipe, the figure as the heading. Like the desktop's \"How your packages are doing\".", "opt=n2,c4&tab3=packages&scroll=250", 1], ["B", "Head to head", "Two pieces leaning into each other, as on the desktop's Versions page. Pick what to compare from the chips.", "opt=n2,c4&tab3=packages&scroll=250&land=B"], ["C", "A league table", "Ranked, with a bar each, for packages, letters, synopses, versions or comps.", "opt=n2,c4&tab3=packages&scroll=250&land=C"]]], ["build", "Building a package", "", [["A", "One step at a time", "Your pick from yesterday: the package card builds in the navy band while you choose the version, the letter, the synopsis and extras.", "opt=n2&page3=build&build=A"], ["B", "What an agent receives", "As the desktop builder: the email an agent would get, with each piece in place. Tap one to change it. The steps along the top tick off as you go.", "opt=n2&page3=build", 1]]], ["screens", "The rest of it", "Not choices: what opens when you tap things. Tell me in the notes if something you'd do on the desktop is missing.", [["F", "A package", "Its numbers and how far it gets. Locked once it's gone out, with Make a copy.", "opt=n2&page3=pkgpage", 0, 1], ["F", "A letter", "Read it, its numbers, the comps it names, its packages and earlier versions.", "opt=n2&page3=letter", 0, 1], ["F", "Editing a letter", "Full screen. One that's gone out saves as the next version.", "opt=n2&page3=editor", 0, 1], ["F", "A version", "What changed from the one before, and how far it gets.", "opt=n2&page3=ver", 0, 1], ["F", "Comps", "Index cards with their age, why they compare, and which letters name them.", "opt=n2&page3=comps", 0, 1], ["F", "Comps in a letter", "Tick the comps a letter names.", "opt=n2&page3=compslog", 0, 1], ["F", "Logging a query", "\"What did you send?\" leads with the package you're using, checked against what the agency asks for.", "opt=n2&ov3=logsent", 0, 1]]]];
let P={};DEC.forEach(d=>{if(d[3][0][5])return;const r=d[3].find(o=>o[4]);P[d[0]]=r?r[0]:'A'});
try{Object.assign(P,JSON.parse(localStorage.getItem('qh-sq-picks')||'{}'))}catch(e){}
const ph=(h,t)=>h.startsWith('img:')?`<div class="ph"><img alt="${t}" src="${h.slice(4)}"></div>`:`<div class="ph"><iframe src="app.html#${h}" title="${t}" loading="lazy"></iframe></div>`;
function render(){
 document.getElementById('decs').innerHTML=DEC.map((d,i)=>`<section class="dec"><h2>${i+1}. ${d[1]}</h2><p>${d[2]}</p><div class="strip">${d[3].map(o=>{const hs=Array.isArray(o[3])?o[3]:[o[3]];const pick=!o[5]&&o[0]!=='T';return `<div class="oc ${pick?'':'fixed'}" ${pick?'role="button" tabindex="0"':''} data-d="${d[0]}" data-v="${o[0]}" aria-pressed="${P[d[0]]===o[0]}" style="width:${hs.length*286+14}px"><div class="phs">${hs.map(h=>ph(h,o[1])).join('')}</div><div class="l">${o[5]?'':`<span class="k">${o[0]}</span>`}<b>${o[1]}</b></div>${o[4]?'<span class="rec">Recommended</span>':''}<div class="d">${o[2]}</div></div>`}).join('')}</div></section>`).join('');
 summ();}
function summ(){document.getElementById('sum').textContent='Picks: '+DEC.map((d,i)=>{if(!(d[0] in P))return null;const o=d[3].find(x=>x[0]===P[d[0]]);return `${i+1}${o[0]} ${o[1]}`}).filter(Boolean).join(' · ');try{localStorage.setItem('qh-sq-picks',JSON.stringify(P))}catch(e){}}
document.getElementById('decs').addEventListener('click',e=>{const c=e.target.closest('.oc[role="button"]');if(!c)return;P[c.dataset.d]=c.dataset.v;document.querySelectorAll(`.oc[data-d="${c.dataset.d}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===P[c.dataset.d]));summ();});
document.getElementById('decs').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('oc')){e.preventDefault();e.target.click();}});
document.getElementById('copy').addEventListener('click',()=>{const n=document.getElementById('notes').value.trim();const t=document.getElementById('sum').textContent+(n?'\nNotes: '+n:'');const b=document.getElementById('copy');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy my picks',1600)}).catch(()=>{const ta=document.getElementById('notes');ta.value=t;ta.focus();ta.select();b.textContent='Copy from the box';});});
render();</script>
