<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryHawk search position — options v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#242c3c;--page:#f5f5f3;--cream:#f3eee6;--text:#1c130f;--muted:#5d636e;--navy:#2d3a50;
--type:'Special Elite','Courier New',monospace;--serif:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:#fbf9f5;color:#1f2633;font-family:var(--serif);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1760px;margin:0 auto;padding:32px 24px 80px}
h1{font-family:var(--type);font-weight:400;font-size:28px;line-height:1.2;margin:0 0 8px}
h2{font-family:var(--type);font-weight:400;font-size:22px;line-height:1.25;margin:0}
p{margin:0 0 12px}.lede{color:var(--muted);max-width:860px}
.ctl{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.ctl span{font-size:15px;color:var(--muted)}
.switch{display:inline-flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}
.switch button{appearance:none;border:0;background:#fff;color:var(--navy);font:600 15px var(--serif);height:36px;padding:0 16px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.switch button:focus-visible{outline:2px solid #6a89a7;outline-offset:-4px}
.opt{margin:34px 0 0}
.opt-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.pick{font:600 13px var(--serif);background:var(--navy);color:var(--cream);border-radius:12px;padding:2px 10px}
.opt>p{color:#3a3f4a;max-width:860px;margin-bottom:10px}
.case{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;margin-top:10px}
.case small{font-size:14px;color:var(--muted)}
.fit{border-radius:10px;overflow:hidden;box-shadow:0 8px 22px rgba(30,39,56,.16);background:var(--ink)}
.strip{background:var(--ink);display:grid;grid-template-columns:80px 1fr;transform-origin:0 0}
.stub{display:grid;place-items:center;height:66px;padding-top:2px}
.stub img{width:44px;height:37px;display:block}
.body{grid-column:2;height:34px;background:var(--page);border-radius:14px 0 0 0}
.bar{height:66px;display:flex;align-items:flex-end;position:relative}
.tabs{display:flex;align-items:flex-end;gap:2px;padding-left:24px}
.tab{position:relative;white-space:nowrap;font-family:var(--type);font-size:17px;height:40px;padding:11px 20px 0;border-radius:11px 11px 0 0;color:rgba(243,238,230,.76)}
.tab.on{background:var(--page);color:var(--text)}
.tab.on::before,.tab.on::after{content:"";position:absolute;bottom:0;width:10px;height:10px}
.tab.on::before{left:-10px;background:radial-gradient(circle at 0 0,transparent 9.5px,var(--page) 10px)}
.tab.on::after{right:-10px;background:radial-gradient(circle at 100% 0,transparent 9.5px,var(--page) 10px)}
.tab.more{color:rgba(243,238,230,.76)}
.tools{margin-left:auto;display:flex;align-items:center;height:68px;align-self:flex-start;padding-right:22px;flex-shrink:0;white-space:nowrap}
.search{height:38px;border-radius:9px;border:1px solid #424751;background:#2c323f;color:#8d9099;display:flex;align-items:center;gap:9px;padding:0 9px 0 13px;font-size:15px;flex:none}
.search svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.search kbd{margin-left:auto;font:10px var(--serif);background:#3e434e;color:#8a8b8e;border-radius:4px;padding:2px 5px}
.search.icon{width:38px!important;padding:0;justify-content:center}.search.icon span,.search.icon kbd{display:none}
.search.mid{position:absolute;top:15px}
.log{height:36px;border-radius:8px;background:var(--cream);color:var(--text);font-weight:600;font-size:15px;display:flex;align-items:center;margin-left:12px}
.log span{padding:0 16px 0 14px;display:flex;align-items:center;gap:9px}
.log svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.log em{font-style:normal;width:30px;border-left:1px solid #1d2432;height:100%;display:grid;place-items:center}
.sep{width:1px;height:26px;background:#3f454f;margin:0 10px 0 9px}
.help{width:33px;height:33px;border-radius:50%;border:1px solid #3f454f;color:#aaa9a9;display:grid;place-items:center;font-size:13px;font-weight:600}
.note{font-size:14px;color:#8a4a2f;margin:0;grid-column:2}
.note.ok{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Where the search field sits</h1>
  <p class="lede">Your bar on three places: one tab, three tabs and five. Change the window width to see what each option does when room runs out. Only the search field moves; everything else is as built.</p>
  <div class="ctl"><span>Window width</span><span class="switch" id="ws" role="group" aria-label="Window width"></span></div>
  <div id="opts"></div>
</div>

const PLACES=[["Dashboard",["Dashboard"]],["Queries",["Queries","Responses","Analytics"]],["Materials",["Letters","Packages","Comps","Versions","Manuscript"]]];
const OPTS=[
 {k:"right",h:"1 · Right, with more room",pick:true,p:"The field stays where it is, in the same spot on every page, and grows from 168px to 280px when the bar has the room. Its right edge never moves. When tabs need the space it shrinks back, then folds to its icon."},
 {k:"asbuilt",h:"2 · As built",p:"168px at the right on every page."},
 {k:"centre",h:"3 · Always centred, tabs give way",p:"The field is always dead centre. Tabs that would run into it fold into “More”."},
 {k:"jump",h:"4 · Centred when it fits, right when it doesn't",p:"Centred on places with few tabs, back to the right on places with many."}
];
const sIco='<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="m10.6 10.6 3.2 3.2"/></svg>';
const search=(cls,w)=>`<div class="search ${cls}" style="width:${w}px">${sIco}<span>Search</span><kbd>⌘K</kbd></div>`;
const rest=`<div class="log"><span><svg viewBox="0 0 12 12"><path d="M1.5 10.5c2-5 5-8 9-9-1 4-4 7-9 9Z"/></svg>Log a query</span><em><svg viewBox="0 0 12 12"><path d="m3 4.5 3 3 3-3"/></svg></em></div><div class="sep"></div><div class="help">?</div>`;
let W=1512;
function build(){
  const root=document.getElementById("opts");root.innerHTML="";
  OPTS.forEach(o=>{
    const sec=document.createElement("section");sec.className="opt";
    root.appendChild(sec);
    sec.innerHTML=`<div class="opt-h"><h2>${o.h}</h2>${o.pick?'<span class="pick">My pick</span>':""}</div><p>${o.p}</p>`;
    PLACES.forEach(([name,tabs])=>{
      const c=document.createElement("div");c.className="case";
      c.innerHTML=`<small>${name}</small><div class="fit"><div class="strip" style="width:${W}px"><div class="stub"><img src="${LOGO}" alt=""></div><div class="bar"></div><div class="body"></div></div></div><p class="note"></p>`;
      sec.appendChild(c);lay(c,o.k,tabs);
    });
  });
  size();
}
function lay(c,k,names){
  const bar=c.querySelector(".bar"),note=c.querySelector(".note");const BW=W-80,GAP=24;
  const draw=(list,more,tools,mid)=>{bar.innerHTML=`<div class="tabs">${list.map((n,i)=>`<span class="tab${i===0?" on":""}">${n}</span>`).join("")}${more?'<span class="tab more">More ⌄</span>':""}</div>${mid||""}<div class="tools">${tools}</div>`};
  const tabsEnd=()=>{const t=bar.querySelector(".tabs").getBoundingClientRect(),b=bar.getBoundingClientRect(),s=b.width/BW;return (t.right-b.left)/s};
  const toolsLeft=()=>{const t=bar.querySelector(".tools").getBoundingClientRect(),b=bar.getBoundingClientRect(),s=b.width/BW;return (t.left-b.left)/s};
  let msg="",ok=true;
  if(k==="asbuilt"||k==="right"){
    let w=k==="right"?280:168,cls="";
    draw(names,false,search("",w)+rest);
    if(k==="right"&&tabsEnd()+GAP>toolsLeft()){w=168;draw(names,false,search("",w)+rest);msg="Back to 168px here, to leave the tabs their room."}
    if(tabsEnd()+GAP>toolsLeft()){draw(names,false,search("icon",38)+rest);msg="Folds to its icon here, as it does today."}
    if(!msg){msg=k==="right"?"280px.":"";}
  }else{
    const sw=280,left=Math.round((BW-sw)/2);
    const mid=search("mid",sw).replace('style="','style="left:'+left+'px;');
    let list=names.slice(),more=false;
    draw(list,more,rest,mid);
    const fits=()=>tabsEnd()+GAP<=left;
    if(k==="jump"){
      if(!fits()){draw(names,false,search("",168)+rest);msg="No room in the middle, so the field is back on the right. It has moved from where it sits on Dashboard.";ok=false;
        if(tabsEnd()+GAP>toolsLeft())draw(names,false,search("icon",38)+rest)}
      else msg="Centred.";
    }else{
      while(!fits()&&list.length>1){list.pop();more=true;draw(list,more,rest,mid)}
      if(more){const lost=names.slice(list.length);msg=`${lost.join(", ")} ${lost.length===1?"is":"are"} now a click away, behind “More”.`;ok=false}
      else msg="Centred.";
    }
  }
  note.textContent=msg;note.className="note"+(ok?" ok":"");
}
function size(){document.querySelectorAll(".fit").forEach(f=>{const s=f.firstElementChild,k=Math.min(1,f.clientWidth/W);s.style.transform=`scale(${k})`;f.style.height=(100*k)+"px"})}
const ws=document.getElementById("ws");
[1280,1512,1710].forEach(w=>{const b=document.createElement("button");b.textContent=w+"px";b.setAttribute("aria-pressed",w===W);
  b.onclick=()=>{W=w;[...ws.children].forEach(x=>x.setAttribute("aria-pressed",x===b));build()};ws.appendChild(b)});
addEventListener("resize",()=>build());
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(build);build();
</script>
