<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryHawk Plans — three columns v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root,.acct-page{--sp-serif:"Source Serif 4",Georgia,serif;--sp-type:"Special Elite","Courier New",Courier,monospace;--sp-ink:#1c130f;--ink-band:#2d3a50;--ink-band-rgb:45,58,80;--ink-cream:#f4eee5;--ink-cream-66:rgba(244,238,229,.66);--ink-on-light:#1c130f;--ink-paper:#fffdf9;--ink-paper-2:#f8f3ec;--ink-terra-deep:#9a5638;--ink-terra-rgb:217,150,122;--ink-shell:#1b2433;--font-serif:var(--sp-serif);--font-sans:var(--sp-serif);--font-mono:"JetBrains Mono",monospace}
/**
 * @license
 * SPDX-License-Identifier: Apache-2.0
 *
 * Settings chassis — the page shell, the scroll plane and the section rail.
 *
 * ⚠️ ONLY THE PLANE SCROLLS, AND IT DOES IT THROUGH A `min-height: 0` FLEX CHAIN — never
 * viewport-height arithmetic. `100vh` minus a bar height is a number that is wrong the moment a
 * bar changes, and in this app it is wrong immediately: the stage, not the window, is the scroll
 * container, so page heights are stage-relative (CLAUDE.md). The chain is
 * StagePage `layout="fill"` (flex:1; min-height:0) → `.acct-page` (height:100%) →
 * `.acct-plane` (flex:1; min-height:0; overflow-y:auto). Every link needs its `min-height: 0`:
 * a flex item's default `min-height: auto` refuses to shrink below its content, which is how a
 * page ends up scrolling in two places at once.
 *
 * ⚠️ THE WORK COLUMN IS NO LONGER SIZED PER SECTION. It used to be a 500px track widened to 660
 * for Plan alone, which meant the card changed WIDTH as well as height when you navigated. The
 * column is now one width for every section — rail 224, gap 22, the rest — and sections that need
 * two groups side by side get them INSIDE the card (`.acct-two`) rather than by resizing it.
 */

/* ── The page: a fill column inside the stage slot ─────────────────────────── */
.acct-page {
  /* ⚠️ `--acct-rail` AND `--acct-gap` ARE GONE. They described a two-column grid this page no
     longer has; the rail is in the shell's own 224px slot and reads `--shell-panelw` there, which
     is the element that OWNS that width. A token kept here would be a second declaration of one
     number, agreeing by coincidence until somebody moved one of them. */
  --acct-max: 1120px;

  /* ⚠️ ONE VERTICAL RHYTHM, DEFINED HERE AND NOWHERE ELSE (law 3). Every gap in the settings scope
     is one of these four; a component that wants a fifth is a component that has found a case the
     rhythm does not cover, and that is a conversation rather than a `style={{ marginTop: 14 }}`.
     The build this replaces carried EIGHTY inline margin/padding declarations, which is how a page
     ends up with nine different gaps that all look like mistakes for each other.
     ⚠️ AND NONE OF THEM MAY BE NEGATIVE (law 2). The ref pulls its helper notes up into the control
     above with `margin: -8px 0 16px`; a note sits BELOW its control by a stated gap, and a pull-up
     is how a note ends up inside the thing it describes at a width nobody tested. */
  /* ⚠️ TWO OF THE FOUR CHANGED VALUE WITH THE CHASSIS, AND THEIR ROLES DID NOT (settings-mode pack,
     Phase 2). A token names a ROLE; the chassis sets what that role measures. `--acct-s-block` was
     the gap between field blocks inside one card and is now the gap between CARDS; `--acct-s-rule`
     was the air above and below a hairline and is now a row's vertical padding, which is the same
     air said the other way round — rows are separated by hairlines, so a row's padding IS the space
     around one. Both take the ref's values.
     ⚠️ BENDING A VALUE TO KEEP A TOKEN ALIVE WOULD HAVE BEEN THE WRONG FIX. The check that found
     these reported them as defined-and-unread, and the honest answers were either "the role is gone,
     delete it" or "the role moved, repoint it". It was the second, twice. */
  --acct-s-label: 6px;   /* label → control */
  --acct-s-note: 8px;    /* control → its helper note */
  --acct-s-block: 22px;  /* between cards */
  --acct-s-rule: 14px;   /* above and below a hairline — a row's own padding */
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

/* ── The scroll plane — the ONE scroll region on this page ──────────────────── */
.acct-plane {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 30px 40px 70px;
}

/* Everything in the plane sits inside one column, so the header and the work share both edges. */

/* ── The work column ────────────────────────────────────────────────────────
   ⚠️ THE SECOND TRACK IS GONE WITH THE RAIL (settings-mode pack, Phase 1). The rail moved into the
   shell's 224px panel slot, so this is one column and no longer a grid in anything but name — the
   class is kept because it is the width-and-scroll chain the sections hang off, and renaming it in
   the same commit that moves the rail would put two unrelated changes in one diff.

   ⚠️ AND THE TWO `.acct-grid` RULES ARE NOW ONE. This selector was declared twice — once for its
   width above, once for its flex behaviour here — which is the duplicate-base-rule fault this
   repo records at length: the cascade takes the last, a reader takes the first, and every
   reasonable-looking edit to the earlier one is spent. The width declaration moves up here and the
   shared block above keeps only `.acct-hdr`. */
.acct-grid {
  max-width: var(--acct-max);
  margin-inline: auto;
}
/* ⚠️ `.acct-aside*` IS GONE — `RailAside` is deleted (settings-mode pack, Phase 1). Its one real
   statement, the plan, is the settings rail's foot strip in the shell; the rest of it existed to
   give the left COLUMN depth beside a taller work column, and that column no longer lives on this
   page. Rules kept for a component that no longer renders are a stylesheet selecting on nothing —
   the `.wpg--record` fault, from the other end. */

.acct-work {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ⚠️ THE SECTION CARD HAS A FLOOR, AND THE FLOOR IS THE POINT. Security is short and Plan is tall;
   without a minimum the card resized under the pointer on every click — the third of the three
   faults. The floor does not CAP anything: Plan grows past it, which is correct. It exists so the
   short sections do not collapse and take the rail's depth with them. */

/* ⚠️ A FLOOR, NEVER A CEILING (law 4). Nothing here caps a text container's height; the card grows
   past 460 whenever its content needs to, and Plan does. */

/* ⚠️ CONTENT → SPACER → ILLUSTRATION, IN THAT ORDER, ALL IN FLOW (law 1). The spacer is what puts
   the mark at the foot of a short card; the mark is a sibling of the content, never a layer over
   it. Overlap is not prevented here — it is made structurally impossible, which is why the Phase 6
   gate has nothing left to find. */


/* ⚠️ THE ≤900px BLOCK IS GONE WITH THE RAIL IT STACKED. It turned the left column into a header
   strip and hid the aside; there is no left column on this page any more, and the shell's own
   below-md rules already decide what the panel does at that width. A media query re-arranging
   elements that do not render is the same silence as a rule selecting on a class nobody emits. */

/* ── Two-column section bodies ──────────────────────────────────────────────
   ⚠️ ONLY WHERE THE CONTENT IS TWO INDEPENDENT GROUPS. Profile is name | country, Security is
   email | password, Notifications is querying | marketing, Preferences is workspace | tasks, Your
   data is export+retention | deletion. Plan is NOT in here: the plan table is already two
   columns of its own, and nesting a two-column comparison inside a two-column body would give
   four columns of 250px and a table nobody can read across. */
/* ⚠️ `.acct-two` AND ITS DIVIDER ARE GONE (settings-mode pack, Phase 2). Sections used to split
   into two columns inside one card, with a hairline drawn as a BORDER on the second cell so it
   could run the full height of the taller one. The chassis is a single 760px column of stacked
   cards now: what used to be a column is a card, and what used to be the divider is the gap
   between two of them. */

/* ⚠️ `.acct-navlist` / `.acct-navitem` ARE GONE — the rail they styled is `settings/SettingsRail`
   now, in the shell's panel slot, and its rules live beside it in `settingsRail.css`
   (settings-mode pack, Phase 1). The two decisions those rules recorded went across with them and
   are restated there: the active state is the DROPDOWN's selected-option grammar (#f5e2da fill,
   burgundy ink) rather than a nav pill, and the focus ring is sage rather than burgundy so that
   tabbing through does not read as choosing. */

/* ⚠️ THE ACCOUNT HEADER'S RULES ARE GONE WITH `AccountHeader` (settings-mode pack, Phase 2), AND
   SO IS ITS ≤900px BLOCK. Its own note recorded that this block had been deleted once by accident
   and nothing went red — the measurement that should have caught it compared six sections to EACH
   OTHER and was satisfied by six equally-broken pages. It is deleted on purpose this time: the
   illustrated plate, the monogram, the name, the email and the facts strip are all retired, and
   identity is one 48px row at the top of Profile. A rule for a component that no longer renders is
   a stylesheet selecting on nothing. */

/* ⚠️ THE SECTION HEAD AND THE ILLUSTRATION SLOTS ARE BOTH RETIRED. The sage band went with
   `SectionCard`; the three `SettingsIllo` mounts went with the no-illustrations rule this chassis
   ships under, and the component is deleted.

   ⚠️ ONE THING FROM THAT BLOCK IS WORTH CARRYING FORWARD RATHER THAN LOSING WITH IT: an
   illustration in this scope lived in the LAYOUT FLOW and never shared space with text. The old
   build positioned all three absolutely, and `.acct-illo--header` proved why — its plate was not a
   positioned ancestor, so a 210x152 desk scene flew to the bottom-right of the whole page while
   the plate it belonged to sat empty, with nothing about the plate broken. If art ever returns
   here, it returns in flow. */


/* ── Field furniture — the rhythm, applied ─────────────────────────────────
   ⚠️ THESE EXIST SO THE PAGE STOPS CARRYING SPACING IN `style=""`. Every class below is one of the
   four tokens; nothing here invents a number. */
.acct-label {
  display: block;
  font-family: var(--font-mono, "JetBrains Mono", monospace);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  color: #9c8878;
  margin-bottom: var(--acct-s-label);
}

/* A note sits BELOW the control it describes, by a stated gap. Never a pull-up. */
.acct-note {
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 12.5px;
  color: #8a7a6c;
  line-height: 1.5;
  margin: var(--acct-s-note) 0 0;
}

/* One field block — label, control, note — separated from the next by one token. */

/* A block that opens with a hairline. The rule's breathing room is one token on each side. */

/* A row of controls under a field. */
.acct-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: var(--acct-s-note);
}

/* ⚠️ A GROUP HEADING, AND THE GAP ABOVE IT IS THE BLOCK TOKEN — not a bespoke 22. */

/* ── The settings ROW — a labelled thing with a control beside it ───────────
   ⚠️ TEN COPIES OF THIS SHAPE CARRIED THEIR OWN `gap: 14` AND `marginBottom: 2`. One class each,
   so the row's internal rhythm is as governed as the page's. */

/* A row that closes with a hairline — export, correct, import all share it. */

/* An error line under a field. */
.acct-err {
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 12.5px;
  font-weight: 500;
  color: #A32D2D;
  margin: var(--acct-s-note) 0 0;
}

/* Two tight variants — a note or an action row that opens its block rather than following a
   control. Named rather than overridden inline, so the exception is visible in the stylesheet. */

/* ── The switch ─────────────────────────────────────────────────────────────
   A real checkbox, visually hidden, with the track painted beside it — so keyboard focus, the
   space key and the announced state all come from the platform. */

/* A select that matches the app's inputs rather than the OS's. */
.acct-select {
  width: auto;
  min-width: 200px;
  max-width: 100%;
  padding: 9px 12px;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 14px;
  color: #3a1c14;
  background: #fffdfa;
  border: 1px solid rgba(124, 58, 42, 0.18);
  border-radius: 8px;
}

/* A muted-rule row — a framed line with its own control. */

/**
 * @license
 * SPDX-License-Identifier: Apache-2.0
 *
 * The stacked-cards chassis (ref design-refs/settings-mode-stacked-cards-v2.html).
 *
 * ⚠️ ONE RHYTHM, AND IT IS THE SHEET NEXT DOOR'S. `settings.css` declares `--acct-s-label`,
 * `--acct-s-note`, `--acct-s-block` and `--acct-s-rule` exactly once each, and its own lock asserts
 * that. A second set of gaps here would be a second rhythm in the same scope, which is the state
 * that file was opened to end — so this sheet READS them and declares none of its own.
 *
 * ⚠️ AND EVERY `var()` HERE RESOLVES BECAUSE `.acct-page` IS AN ANCESTOR OF EVERY CARD. That is a
 * scope claim, not a hope: the tokens are declared on `.acct-page` rather than `:root`, so a card
 * rendered outside that subtree would silently take its fallback. The test is where a token is
 * EVALUATED, never whether it is a token.
 */

/* ── the page column ────────────────────────────────────────────────────────
   ⚠️ 760px, AND IT IS THE MEASURE RATHER THAN THE CONTAINER. The rail is out of this column now —
   it is in the shell — so what is left is one column of reading, and a settings row is a sentence
   with a control at the end of it. The old 1120 cap was a two-column figure with nothing in the
   second column. */
.acct-work { max-width: 760px; margin-inline: auto; }

/* ── the title block ────────────────────────────────────────────────────── */
.sc-ttl { margin-bottom: 26px; }
.sc-ttl-h {
  margin: 0;
  font-family: var(--font-serif, "Playfair Display", Georgia, serif);
  font-weight: 400;
  font-size: 30px;
  /* ⚠️ 1.3 FLOOR ON MIXED-CASE PLAYFAIR — the ref draws 1.15, which is a value tuned to the words
     someone typed into a mockup. "Sign-in & security" and "Plan & billing" both carry a `g`, and a
     tight line box crops it. The house rule, applied where the ref could not have seen it. */
  line-height: 1.3;
  color: #3a2b23;
}
.sc-ttl-d {
  margin: 6px 0 0;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 14.5px;
  line-height: 1.55;
  color: #6a5a50;
}

/* ── one flat card per concern ──────────────────────────────────────────────
   ⚠️ NO SHADOW, NO RIM, NO INNER FRAME. Those three are `MountPanel`'s definition and this is
   deliberately not one — see the note in `SettingsCards.tsx`. What separates one card from the next
   is the gap and a single hairline, which is all a group of settings needs to read as a group. */
.sc-card {
  background: #fdf9f5;
  border: 1px solid rgba(28, 19, 15, 0.13);
  border-radius: 12px;
  margin-top: var(--acct-s-block);
  /* the foot strip's fill has to meet the radius — see SettingsCards.tsx */
  overflow: hidden;
}
.sc-card:first-of-type { margin-top: 0; }

/* ⚠️ THE WARNING IS A HAIRLINE AND AN INK, NEVER A FILL (see the component). */
.sc-card--danger { border-color: rgba(140, 47, 47, 0.28); }
.sc-card--danger .sc-ch-h { color: #8c2f2f; }

.sc-ch { padding: 20px 24px 4px; }
.sc-ch-h {
  margin: 0;
  font-family: var(--font-serif, "Playfair Display", Georgia, serif);
  font-weight: 400;
  font-size: 20px;
  line-height: 1.3;
  color: #3a2b23;
}
.sc-ch-p {
  margin: 4px 0 0;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 13.5px;
  line-height: 1.55;
  color: #6a5a50;
}

.sc-cb { padding: 6px 24px 18px; }

/* ── the row: a sentence on the left, its control at the end ────────────────
   ⚠️ THE CONTROL COLUMN IS A FIXED 280px, NOT A FRACTION. Every control on the page then starts at
   the same x whatever its row says, which is what makes a column of mixed toggles, selects and
   buttons read as one column rather than as a ragged edge. A fraction would move that edge with the
   longest label on the card. */
.sc-row {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 24px;
  align-items: center;
  padding: var(--acct-s-rule) 0;
  border-top: 1px solid rgba(28, 19, 15, 0.08);
}
.sc-row:first-child { border-top: 0; }
.sc-row--full { grid-template-columns: 1fr; }
.sc-row-l { min-width: 0; }

.sc-lbl {
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 14.5px;
  font-weight: 600;
  color: #3a2b23;
}
.sc-dsc {
  margin-top: var(--acct-s-label);
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 13.5px;
  line-height: 1.5;
  color: #6a5a50;
  /* ⚠️ `em`, ON THE ELEMENT THAT SETS ITS OWN FONT-SIZE. A `ch` or `rem` measure here would be
     counting a size this element does not paint at — the fault this repo has now recorded three
     times on the marketing pages, each time from a different direction. */
  max-width: 46em;
}

.sc-ctl { display: flex; justify-content: flex-end; align-items: center; gap: 10px; min-width: 0; }
/* A field that should take the column rather than sit at its right edge. */
.sc-ctl > .sc-grow { flex: 1; min-width: 0; }

.sc-note {
  margin: 0;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 13.5px;
  line-height: 1.55;
  color: #6a5a50;
}

/* ── the foot strip ─────────────────────────────────────────────────────────
   ⚠️ IT IS THE CARD'S NOTE *AND* ITS SAVE, TOGETHER, BECAUSE THE NOTE IS USUALLY ABOUT THE SAVE.
   "Your name saves when you press Save; everything else saves as you change it" belongs beside the
   button it describes, not three rows above it. */
.sc-cf {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 24px;
  background: rgba(28, 19, 15, 0.025);
  border-top: 1px solid rgba(28, 19, 15, 0.08);
}
.sc-cf-note {
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 12.5px;
  line-height: 1.5;
  color: #6a5a50;
}

/* ── identity: once, at the top of Profile ─────────────────────────────────- */
.sc-id { display: flex; align-items: center; gap: 14px; }
.sc-id-av {
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fffdfa;
  border: 1px solid rgba(28, 19, 15, 0.13);
  font-family: var(--font-serif, "Playfair Display", Georgia, serif);
  font-size: 16px;
  color: #7c3a2a;
}
.sc-id-t { min-width: 0; }
.sc-id-n {
  display: block;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 15.5px;
  font-weight: 600;
  color: #3a2b23;
}
.sc-id-m {
  display: block;
  margin-top: 1px;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 13px;
  color: #8a7d6c;
  overflow-wrap: anywhere;
}

/* ── narrow ─────────────────────────────────────────────────────────────────
   ⚠️ THE CONTROL COLUMN STACKS RATHER THAN SHRINKING. A 280px column inside a 360px page leaves the
   label 56px, which wraps a two-word label onto four lines while the control sits comfortably. Below
   the point where both fit, the control goes under its own label and aligns left with it. */
@media (max-width: 620px) {
  .sc-row { grid-template-columns: 1fr; gap: 10px; }
  .sc-ctl { justify-content: flex-start; }
  .sc-ch, .sc-cb, .sc-cf { padding-inline: 16px; }
}

/* ── the status chip ────────────────────────────────────────────────────────
   ⚠️ IT IS A STATEMENT, NOT A CONTROL, AND IT MUST NOT LOOK LIKE ONE. "Connected" and "Not set"
   report what the account IS; a chip with a button's fill and border would invite a click that
   does nothing. Hairline, no fill, muted ink — the same grammar the verified chip already uses. */
.acct-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 0.5px solid rgba(59, 109, 17, 0.22);
  background: rgba(59, 109, 17, 0.07);
  color: #3B6D11;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
/* Absence is not a failure — it is stated in the muted ink, never in the warning one. */
.acct-chip--muted {
  border-color: rgba(124, 58, 42, 0.16);
  background: rgba(124, 58, 42, 0.06);
  color: #8a7d6c;
}

/* ── "Add a password" — the form that opens inside a row's control column ────
   ⚠️ IT IS A `full` ROW'S CHILD, NOT A 280px CONTROL. Two labelled fields and two buttons do not
   fit a control column, and squeezing them there would give a security form the narrowest box on
   the page. The row goes full-width the moment the form opens — see the render. */
.ap-form { display: flex; flex-direction: column; gap: 6px; max-width: 360px; }
.ap-lbl {
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 12.5px;
  font-weight: 600;
  color: #6a5a50;
}
.ap-lbl + input { margin-bottom: 4px; }
.ap-hint {
  margin: 0;
  font-family: var(--font-sans, "Source Sans Pro", system-ui, sans-serif);
  font-size: 12.5px;
  color: #8a7d6c;
}
.ap-acts { display: flex; gap: 8px; margin-top: 6px; }

/* ⚠️ A VALUE INSIDE A DESCRIPTION — the reader's own address, their own count, above the sentence
   that explains it. It is not a second label: it is the thing the row is ABOUT, and a row whose
   subject is a value has to state that value somewhere. */
.sc-val {
  font-weight: 600;
  color: #3a2b23;
  overflow-wrap: anywhere;
}

/**
 * @license
 * SPDX-License-Identifier: Apache-2.0
 *
 * SETTINGS, SET LIKE THE REST OF THE APP (ink shell v1, follow-up 2 §5 · ref shell-menus-settings-v1.html
 * sections 3 and 4: `.set` `.hd` `.sec` `.cd` `.row` `.inp` `.tg2` `.btn` `.note` `.cf`). The page reads
 * like a ledger: each section named on the left, its card on the right, left-aligned at the sheet's 56px
 * inset rather than floating in a centred column.
 *
 * ⚠️ DESKTOP ONLY. Every rule is inside one ≥768px block, so the phone's Settings page is `main`'s (MS15).
 *
 * ⚠️ NO PLAYFAIR, INTER OR SOURCE SANS. `brand.tsx` forces h1/h2 to the brand serif with `!important`
 * at runtime and gives bare elements Source Sans 3, and the page itself still carries inline
 * `FONT_SANS` styles on its controls. The headings therefore take two classes and `!important` (the
 * house claw-back), and the controls' inline styles are overridden by class with `!important` — the
 * only thing that beats an inline declaration, and confined to this breakpoint so the phone's inline
 * styles still apply.
 */
@media (min-width: 768px) {
  /* ── the page: 44/56/40 of padding, a 1060px measure, LEFT-aligned at the sheet's 56px inset ── */
  .acct-page .acct-plane { padding: 44px 56px 40px; }

.rail .av{width:30px;height:30px;border-radius:50%;background:rgba(244,238,229,.16);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:6px}
.stage{display:flex;flex-direction:column;min-width:0;padding-right:8px;padding-bottom:8px}
.top{display:flex;align-items:flex-end;height:62px;flex:none}
.tab{background:#f2eee8;border-radius:12px 12px 0 0;padding:10px 22px 12px;font:400 19px/1 var(--sp-type);height:40px}
.top .r{margin-left:auto;align-self:center;display:flex;gap:12px;align-items:center;color:#f4eee5}
.top .back{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(244,238,229,.25);border-radius:10px;padding:8px 14px;font-size:15px}
.top .back kbd{font:400 10px var(--font-mono);background:rgba(244,238,229,.14);padding:3px 5px;border-radius:4px}
.top .q{width:34px;height:34px;border-radius:50%;border:1px solid rgba(244,238,229,.25);display:grid;place-items:center}
.sheet{flex:1;min-height:0;background:#f2eee8;border-radius:0 14px 14px 14px;overflow:hidden}
.sheet .acct-page{height:100%}
/* ── NEW: the three columns. Cards are the page's own .pl-tier; only layout and the status strip are added ── */
.pl3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch;margin-top:8px}
.pl3 .pl-tier{display:flex;flex-direction:column;padding:0;overflow:hidden}
.pl3-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:8px 20px;font-size:14px;line-height:1.35;font-weight:600;background:#f3ece2;color:var(--sp-ink);border-bottom:1px solid #e0d5c8}
.pl3 .pl-tier--pro .pl3-strip{background:#243044;border-bottom-color:#243044;color:var(--ink-cream)}
.pl3 .pl3-found{background:#f3cfc3;border-color:#e8b4a3;color:var(--sp-ink)}
.pl3 .pl3-found .pl3-strip{background:#e8b4a3;border-bottom-color:#e8b4a3;color:#1c130f}
.pl-page .sc-ttl{display:block!important}
.pl-page .sc-ttl .sc-ttl-d{margin:12px 0 0!important;font-size:18px!important}
.pl3{margin-top:26px!important;padding:6px 0 10px}
.pl3 .is-wait{opacity:.8;filter:saturate(.85);transform:scale(.97)}
.pl3 .is-lead{position:relative;z-index:1;transform:rotate(-1.4deg) translateY(-10px);box-shadow:0 0 0 2px var(--ink-terra-deep),0 30px 44px -22px rgba(28,19,15,.55)}
.pl3 .pl-tier--pro.is-lead{box-shadow:0 0 0 2px var(--ink-band),0 30px 44px -22px rgba(28,19,15,.55)}
.pl3-strip .plt-chip{background:#fff;font-weight:400;white-space:nowrap}.pl3-strip .plt-chip svg{width:14px;height:14px}
.pl3 .pl-len{grid-template-columns:repeat(2,minmax(0,1fr))}
.pl3-in{padding:20px;display:flex;flex-direction:column;flex:1}
.pl3 .pl-tier{border-radius:18px}
.pl3-art{position:relative;height:176px;display:flex;align-items:flex-end;justify-content:center;background:#fbf7f1;border-bottom:1px solid rgba(28,19,15,.08)}
.pl3-art img{height:164px;width:auto;display:block}
.pl3 .pl-tier--pro .pl3-art{background:var(--ink-cream)}
.pl3 .pl3-found .pl3-art{background:#fdf4ef}
.pl3-pill{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:999px;font-size:14px;line-height:1.4;background:#fff;color:var(--sp-ink);box-shadow:0 0 0 1px rgba(28,19,15,.12)}
.pl3 .is-lead .pl3-pill{background:var(--ink-band);color:var(--ink-cream);box-shadow:none;font-weight:600}
.pl3 .pl-tier--pro.is-lead .pl3-pill{background:var(--ink-band)}
.pl3-art .plt-chip{position:absolute;top:12px;right:12px;background:#fff;color:var(--sp-ink);box-shadow:0 0 0 1px rgba(28,19,15,.12)}
.pl3-art .plt-chip svg{width:14px;height:14px}
.pl3 .pl-tier h3{font-size:26px}
.pl3-tag{margin:6px 0 0;font-size:16px;line-height:1.4;min-height:45px;opacity:.86}
.pl3 .pl-price{margin-top:14px}
.pl3 .pl-price b{font-size:38px;line-height:1}
.pl3-in{padding:22px 24px 24px!important}
.pl3 .pl-price span{opacity:.85}
.pl3 .pl-sub{min-height:20px}
.pl3-foot{margin-top:auto;padding-top:18px;font-size:14px}
.pl3-foot .plt-cream{display:block;text-align:center;box-sizing:border-box;width:100%}
.pl3-foot .plt-cream:focus-visible{outline:2px solid var(--ink-cream);outline-offset:2px}
.pl3 .is-closed{background:#f8e6df}.pl3 .is-closed .pl3-in{opacity:.6}.pl3 .is-closed .pl3-art img{opacity:.55}
.pl3-under{margin:18px 0 0;font-size:16px;color:rgba(28,19,15,.72)}
.pl3-under a{color:var(--ink-terra-deep)}
.pl3-more{margin-top:22px;border-top:1px solid rgba(28,19,15,.1)}
.pl3-more>details{border-bottom:1px solid rgba(28,19,15,.1)}
.pl3-more>details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-size:17px;font-weight:600;min-height:24px}
.pl3-more>details>summary::-webkit-details-marker{display:none}
.pl3-more>details>summary svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.pl3-more>details[open]>summary svg{transform:rotate(180deg)}
.pl3-more>details>summary:focus-visible{outline:2px solid var(--ink-band);outline-offset:2px}
.pl3-more .plt{margin-bottom:18px}
.pl3-more .pl-q:first-of-type{border-top:0}
.pl3-more .pl-q:last-child{margin-bottom:8px}
svg.ck{stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:900px){.pl3{grid-template-columns:1fr}.pl3 .is-lead{order:-1;transform:rotate(-.8deg)}.pl3 .is-wait{transform:none}}
@media(max-width:767.98px){.app{display:block;height:auto}.stage{display:block}.acct-page,.acct-work,.acct-grid{display:block;min-width:0;max-width:100%}.pl3{margin-top:18px}.rail,.top .r{display:none}.stage{padding:0 8px 8px}.sheet{overflow:visible}.sheet .acct-page{height:auto}.acct-page .acct-plane{padding:22px 16px 40px;overflow:visible}.acct-page .sc-ttl .sc-ttl-h,.sc-ttl-h{font-family:var(--sp-type);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 8px}.sc-ttl-d{margin:0 0 6px}}
</style>

function li(a){return a.map(function(t){return '<li>'+CK+'<span>'+t+'</span></li>';}).join('');}
function chip(navy){return '<span class="plt-chip'+(navy?' plt-chip--navy':'')+'">'+CK+'Your plan</span>';}
function card(o){
  return '<div class="pl-tier'+(o.pro?' pl-tier--pro':'')+(o.found?' pl3-found':'')+(o.lead?' is-lead':'')+(o.wait?' is-wait':'')+(o.closed?' is-closed':'')+'"><div class="pl3-art"><span class="pl3-pill'+(o.lead&&!o.yours?'':'')+'">'+(o.lead&&!o.yoursOnly?'<span aria-hidden="true">\u2728 </span>':'')+o.strip+'</span>'+(o.yours?chip(false):'')+'<img src="'+o.art+'" alt=""></div><div class="pl3-in">'
   +'<h3>'+o.name+'</h3><p class="pl3-tag">'+o.tag+'</p>'
   +'<div class="pl-price"><b>'+o.price+'</b><span>'+o.unit+'</span></div><p class="pl-sub">'+o.sub+'</p>'+(o.extra||'')
   +'<hr><ul class="pl-feat">'+(o.leadline?'<li class="pl-lead">'+o.leadline+'</li>':'')+li(o.list)+'</ul>'
   +(o.foot?'<div class="pl3-foot">'+o.foot+'</div>':'')+'</div></div>';
}
function lens(){
  return '<div class="pl-len" role="radiogroup" aria-label="How long do you need Pro for?">'+PLANS.map(function(p){return '<button type="button" role="radio" aria-checked="'+(p.m===len)+'" tabindex="'+(p.m===len?0:-1)+'" data-len="'+p.m+'"><b>'+p.m+(p.m>1?' months':' month')+'</b><span>£'+p.p+'</span></button>';}).join('')+'</div>';
}
function table(){
  var h='<section class="plt"><div class="plt-scroll"><table class="plt-t"><thead><tr><td></td><th scope="col"><b>Free</b><span>£0</span><small>First 14 days are Pro</small></th><th scope="col" class="plt-p"><b>Pro and founding</b><span>from £3.75 a month</span><small>Free for founding writers</small></th></tr></thead><tbody>';
  function cell(v){return v===1?'<span class="plt-yes">'+CK+'</span>':v===0?'<span class="plt-no">'+MN+'</span>':'<span class="plt-val">'+v+'</span>';}
  GROUPS.forEach(function(g){h+='<tr class="plt-grp"><th scope="colgroup">'+g[0]+'</th><td></td><td class="plt-p"></td></tr>';g[1].forEach(function(r){h+='<tr><th scope="row"><b>'+r[0]+'</b></th><td>'+cell(r[1])+'</td><td class="plt-p">'+cell(r[2])+'</td></tr>';});});
  return h+'</tbody><tfoot><tr><td></td><td></td><td class="plt-p"></td></tr></tfoot></table></div></section>';
}
function render(keep){
  var st=document.getElementById('st').value, s=S[st], now=st==='founding', cur=PLANS.filter(function(p){return p.m===len;})[0];

document.getElementById('st').addEventListener('change',function(){len=6;render();});
document.getElementById('work').addEventListener('click',function(e){var b=e.target.closest('[data-len]');if(b){len=+b.getAttribute('data-len');render(state());document.querySelector('[data-len="'+len+'"]').focus();}});
document.getElementById('work').addEventListener('keydown',function(e){var b=e.target.closest('[data-len]');if(!b)return;var i=PLANS.map(function(p){return p.m;}).indexOf(len),n=PLANS.length,j=(e.key==='ArrowRight'||e.key==='ArrowDown')?(i+1)%n:(e.key==='ArrowLeft'||e.key==='ArrowUp')?(i-1+n)%n:-1;if(j<0)return;e.preventDefault();len=PLANS[j].m;render(state());document.querySelector('[data-len="'+len+'"]').focus();});
render();
})();
</script>
</body>
</html>
