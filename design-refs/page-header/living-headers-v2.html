<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living page headers v2</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c130f;--ink70:rgba(28,19,15,.7);--ink45:rgba(28,19,15,.45);--hair:rgba(28,19,15,.1);
 --line:rgba(28,19,15,.45);--btn:#2a3a52;--frame:#7c3a2a;--page:#f5f1eb;--side:#e7e3dc;--blush:#e9c9b8;--rust:#8a4a3c;
 --sand:#f7efe3;--rose:#f5e6df;--sage:#e0e5dd;--offer:#d7e0e8;--stone:#e4e1db;
 --machine:'Special Elite',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace;
 --cw:1360px;--gut:clamp(28px,3.2vw,52px);--rail:336px;--rgap:36px}
*{box-sizing:border-box}
html,body{margin:0;background:#2b3547;color:var(--ink);font-family:var(--serif)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden;border-top:10px solid #2b3547}
.side{background:var(--side);border-right:1px solid var(--hair);padding:16px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;padding:4px 6px 14px}
.brand i{width:30px;height:30px;border-radius:50%;background:#5f7b93}
.side h6{margin:12px 8px 4px;font:400 9px var(--mono);letter-spacing:.16em;color:var(--ink45)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:15px;cursor:pointer}
.side a::before{content:"";width:14px;height:14px;border:1.4px solid var(--ink70);border-radius:3px}
.side a.on{background:var(--btn);color:#fff}.side a.on::before{border-color:#fff}
.main{display:flex;flex-direction:column;min-width:0;background:var(--page)}
.bar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--side);border-bottom:1px solid var(--hair);position:relative;z-index:5}
.tog{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink70)}
.bar .sp{flex:1}
.ms{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 6px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.06),inset 0 0 0 1px var(--hair);white-space:nowrap}
.ms .cov{width:30px;height:30px;border-radius:7px;background:#b4553f;flex:none}
.ms b{font-family:var(--machine);font-weight:400;font-size:15px;display:block;line-height:1.1}
.ms small{display:block;font:400 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink45);margin-top:3px}
.tools{display:flex;align-items:center;gap:4px}
.tb{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;border:0;border-radius:10px;background:none;color:var(--ink70);font-family:var(--serif);font-size:15px}
.scroll{flex:1;min-height:0;overflow:auto}
.wrap{max-width:var(--cw);margin:0 auto;padding:18px var(--gut) 70px}

/* ===== the hero: FULL content width, left-aligned, art anchored right ===== */
.hd{position:relative;padding:14px 0 26px;min-height:250px;border-bottom:1px solid rgba(28,19,15,.16)}
.hin{position:relative;min-height:214px}
.bc{margin:0 0 10px;font:400 9.5px var(--mono);letter-spacing:.16em;color:var(--ink45);text-transform:uppercase}
.tt{position:relative;z-index:2;max-width:46%}
h1{margin:0;font-family:var(--machine);font-weight:400;font-size:clamp(40px,3.7vw,56px);line-height:1.02;min-height:1.05em;white-space:nowrap}
.sub{margin:14px 0 0;font-size:18px;line-height:1.45;color:var(--ink70);min-height:52px}
.sub b{color:var(--ink);font-weight:600}
.sub code{font-family:var(--machine);color:var(--ink);font-size:17px}
.acts{display:flex;gap:10px;margin-top:22px;width:fit-content;position:relative;z-index:2}
.b1{height:48px;padding:0 22px;border-radius:24px;background:var(--btn);color:#fff;display:flex;align-items:center;font-family:var(--machine);font-size:16px;border:0;cursor:pointer}
.b1:hover{background:#233145}
.b2{height:48px;padding:0 22px;border-radius:24px;background:#fff;display:flex;align-items:center;font-family:var(--machine);font-size:16px;box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 6px var(--frame);border:0;cursor:pointer}
.art{position:absolute;right:0;bottom:-26px;width:46%;height:286px;pointer-events:none}
.art img{width:100%;height:100%;object-fit:contain;object-position:right bottom;display:block}
.swap{animation:swapin .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== below the rule: main column + rail ===== */
.pg{padding-top:26px;display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:var(--rgap);align-items:start}
.mc{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.tile .st{display:flex;align-items:center;height:30px;padding:0 12px;border-bottom:1px solid var(--line);font:700 9px var(--mono);letter-spacing:.14em;color:var(--ink70);background:var(--stone)}
.tile .st i{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--rust)}
.tile .bd{display:flex;align-items:baseline;gap:11px;padding:11px 14px 4px}
.tile .bd b{font-family:var(--serif);font-weight:600;font-size:30px}
.tile .bd span{font-family:var(--machine);font-size:17px}
.tile .s2{padding:0 14px 11px;font:700 8.5px var(--mono);letter-spacing:.12em;color:var(--ink70);min-height:11px}
.tile:nth-child(1){background:#faf1ea}.tile:nth-child(1) .st{background:var(--rose)}
.tile:nth-child(2) .st{background:var(--sand)}
.lbar{display:flex;align-items:baseline;gap:12px;margin:28px 0 14px;font-family:var(--machine);font-size:25px;line-height:1.1}
.lbar span{border-bottom:1px dashed rgba(28,19,15,.35);padding-bottom:4px;cursor:pointer}
.row{display:grid;grid-template-columns:34px minmax(0,1.15fr) minmax(0,1fr) auto 52px;align-items:center;gap:14px;height:82px;margin-bottom:10px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.05),0 10px 24px -18px rgba(28,19,15,.22)}
.row.new{animation:arrive .5s cubic-bezier(.2,.8,.2,1) both, wash 2s ease-out .5s both}
@keyframes arrive{from{max-height:0;margin-bottom:0;opacity:0;transform:translateY(-10px)}to{max-height:82px;opacity:1;transform:none}}
@keyframes wash{0%{background:var(--sand)}100%{background:#fff}}
.gl{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(28,19,15,.35)}
.rn b{display:block;font-weight:600;font-size:17px}
.rn small{display:block;font-style:italic;font-size:14px;color:var(--ink45);margin-top:2px}
.rs b{display:block;font-family:var(--machine);font-weight:400;font-size:15.5px}
.rs small{display:block;font:700 8.5px var(--mono);letter-spacing:.1em;color:var(--ink45);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:flex;gap:9px;color:var(--ink45)}
.ic i{width:14px;height:12px;border:1.3px solid currentColor;border-radius:2px;display:block}
.dt{width:52px;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center}
.dt b{display:block;font:700 8px var(--mono);letter-spacing:.12em;background:var(--stone);padding:3px 0;border-bottom:1px solid var(--line)}
.dt i{display:block;font-style:normal;font-family:var(--serif);font-weight:600;font-size:20px;padding:3px 0 5px}

/* the rail */
.rail{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.rh{background:var(--blush);padding:15px 16px 13px}
.rh h3{margin:0;font-family:var(--machine);font-weight:400;font-size:25px}
.rh small{display:block;font:700 8.5px var(--mono);letter-spacing:.1em;color:var(--ink70);margin-top:7px}
.rtabs{display:flex;gap:4px;padding:9px;background:#efe9e2;border-bottom:1px solid var(--hair)}
.rtabs b{flex:1;text-align:center;font-weight:400;font-size:13.5px;padding:7px 0;border-radius:8px;color:var(--ink70)}
.rtabs b.on{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(28,19,15,.12)}
.rsec{display:flex;align-items:center;gap:9px;padding:13px 14px 4px;font-family:var(--machine);font-size:17px}
.rsec em{font-style:normal;font:700 9px var(--mono);background:var(--stone);border-radius:9px;padding:3px 8px}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 14px;font-size:13.5px}
.rrow .a{width:22px;height:22px;border-radius:50%;background:var(--stone);font:700 7px var(--mono);display:flex;align-items:center;justify-content:center;color:var(--ink70)}
.rrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .d{font:700 8px var(--mono);letter-spacing:.08em;color:var(--ink45);text-align:right}
.rfoot{padding:10px 14px;border-top:1px solid var(--hair);font:700 7.5px var(--mono);letter-spacing:.1em;color:var(--ink45)}

/* ===== the empty state: no page title, no rule. art + the action + an exhibition ===== */
body[data-n0="1"] .hd{border-bottom:0;min-height:0;padding-bottom:6px}
body[data-n0="1"] .hin{min-height:206px}
.eh2{margin:0;font-family:var(--machine);font-weight:400;font-size:29px;line-height:1.18}
.exw{margin:30px 0 0}
.exl{display:flex;align-items:center;gap:12px;font:700 9px var(--mono);letter-spacing:.16em;color:var(--ink45);margin-bottom:13px}
.exl::after{content:"";flex:1;height:1px;background:rgba(28,19,15,.12)}
.exb{position:relative;border-radius:16px;border:1px solid rgba(28,19,15,.12);background:rgba(255,255,255,.28);padding:16px;overflow:hidden}
.exb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;pointer-events:none;background:linear-gradient(180deg,rgba(245,241,235,0),rgba(245,241,235,.94))}
.exb .pg{padding-top:0}
.exb .tile .bd b{font-size:26px}
.exb .lbar{margin:22px 0 12px;font-size:21px}
.exb .row{height:70px}
.ehint{margin:20px 0 0;font-size:14.5px;color:var(--ink45)}
.ehint a{color:var(--ink70);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* review pill */
#rvp{position:fixed;left:272px;bottom:18px;z-index:40;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 10px 30px -12px rgba(28,19,15,.45),inset 0 0 0 1px var(--hair);font-family:var(--machine);font-size:13.5px}
#rvp button{border:0;background:none;padding:5px 10px;border-radius:999px;cursor:pointer;color:var(--ink70)}
#rvp button[aria-pressed=true]{background:var(--ink);color:#fff}
#rvp .go{background:var(--rust);color:#fff}
#rvp .lb{color:var(--ink45);font-size:12px}
#rvp .sp{width:1px;height:18px;background:var(--hair)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head>

 `<div class="tile"><div class="st">${lab}${i===0&&v>0?'<i></i>':''}</div><div class="bd"><b>${v}</b><span>${t}</span></div><div class="s2">${s2||'&nbsp;'}</div></div>`).join('')}</div>`}
function rowsHTML(P,k,anim){return P.rows.slice(0,k).map((r,i)=>
 `<div class="row${anim&&i===0&&k===1?' new':''}"><span class="gl"></span>`
 +`<span class="rn"><b>${r[1]}</b><small>${r[2]}</small></span>`
 +`<span class="rs"><b>${r[3]}</b><small>${r[4]}</small></span>`
 +`<span class="ic"><i></i><i></i><i></i><i></i></span>`
 +`<span class="dt"><b>${r[5]}</b><i>${r[6]}</i></span></div>`).join('')}
function railHTML(pg){const R=RAIL[pg];return `<aside class="rail"><div class="rh"><h3>${R.t}</h3><small>${R.s}</small></div>`
 +`<div class="rtabs"><b>Everything</b><b class="on">With you</b><b>With the agent</b></div>`
 +`<div class="rsec">${R.sec}<em>${R.cnt}</em></div>`
 +R.rows.map(r=>`<div class="rrow"><span class="a">${r[0]}</span><span class="n">${r[1]}</span><span class="d">${r[2]}</span></div>`).join('')
 +`<div class="rfoot">TO THE DATE · PAST IT · NO DATE</div></aside>`}
function listHTML(P,n,k,anim){return `<div class="mc">${tilesHTML(P,n)}`
 +`<div class="lbar"><span>All ${n} ${P.listN} ⌄</span><span>latest activity first ⌄</span></div>`
 +rowsHTML(P,k,anim)+`</div>`}
function render(anim){const P=PAGES[ST.pg],n=ST.n;
 document.body.dataset.n0 = n===0?'1':'';
 $('bc').textContent=P.bc; $('art').src=P.art; $('msSub').textContent=P.ms(n);
 if(n===0){const E=P.empty;
  $('tt').innerHTML=`<h2 class="eh2">${E.h}</h2><p class="sub">${E.p}</p>`
   +`<div class="acts"><button class="b1">${P.b1}</button><button class="b2">${P.b2}</button></div>`;
  lastLine='';
  $('pg').innerHTML=`<div class="exw"><div class="exl">${E.exl}</div>`
   +`<div class="exb"><div class="pg">${listHTML(P,ST.pg==='qc'?27:16,3,false)}${railHTML(ST.pg)}</div></div></div>`
   +`<p class="ehint">${E.alt}</p>`;
 }else{
  const [h,s]=P.line(n);const changed=(h+s)!==lastLine;lastLine=h+s;
  $('tt').innerHTML=`<h1 id="hl">${h}</h1><p class="sub" id="sb">${s}</p>`
   +`<div class="acts"><button class="b1">${P.b1}</button><button class="b2">${P.b2}</button></div>`;
  if(anim&&changed){[$('hl'),$('sb')].forEach((e,i)=>{e.style.animationDelay=(i*60)+'ms';e.classList.add('swap')})}
  $('pg').innerHTML=`<div class="pg">${listHTML(P,n,Math.min(n,5),anim)}${railHTML(ST.pg)}</div>`;
 }
 document.querySelectorAll('#rvp [data-pg]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pg===ST.pg));
 document.querySelectorAll('#rvp [data-n]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.n==='many'?ST.n>1:+b.dataset.n===ST.n)));
 $('navQ').classList.toggle('on',ST.pg==='qc');$('navC').classList.toggle('on',ST.pg==='cl');
}
function setN(n,anim){ST.n=n;render(anim)}
function playIt(){ST.n=0;render(false);setTimeout(()=>setN(1,true),700)}
document.querySelectorAll('#rvp [data-pg]').forEach(b=>b.onclick=()=>{ST.pg=b.dataset.pg;lastLine='';render(false)});
document.querySelectorAll('#rvp [data-n]').forEach(b=>b.onclick=()=>setN(b.dataset.n==='many'?(ST.pg==='qc'?27:16):+b.dataset.n,true));
render(false);
</script></body></html>
