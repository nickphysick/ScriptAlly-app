<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscripts v29 — the book on the page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Source Serif 4",Georgia,serif; --type:"Special Elite","Courier New",monospace; --mono:"JetBrains Mono",monospace;
  --ink-shell:#1b2433; --cream:#f4eee5; --ink:#1c130f; --navy:#2a3a52; --btn:#2d3a50;
  --t62:rgba(28,19,15,.62); --t72:rgba(28,19,15,.72); --line:rgba(28,19,15,.12);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#10161f;font-family:var(--serif);color:var(--ink);font-size:16px;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p,dl,dd,dt{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* mock controls — not part of the app */
.mock{position:sticky;top:0;z-index:70;display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:52px;padding:10px 16px;background:#10161f;color:rgba(244,238,229,.7);font:400 13px/1 var(--mono)}
.mock b{font-weight:500;color:var(--cream)}
.mock button{height:32px;padding:0 12px;border:0;border-radius:8px;background:rgba(244,238,229,.1);color:var(--cream);font:400 13px/1 var(--mono)}
.mock button[aria-pressed="true"]{background:var(--cream);color:var(--ink-shell)}
.mock button:focus-visible{outline-color:var(--cream)}
.mock i{width:1px;height:18px;background:rgba(244,238,229,.2)}

/* the ink shell, as built (Versions v6 reference) */
.app{background:var(--ink-shell);padding-left:14px;min-height:calc(100vh - 52px)}
.bar{position:relative;z-index:3;height:64px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-right:22px}
.tabs{position:absolute;left:0;bottom:-1px;display:flex;align-items:flex-end;gap:18px}
.ftab{position:relative;height:41px;padding:0 22px;border-radius:12px 12px 0 0;background:#f6f3ee;display:flex;align-items:center;white-space:nowrap}
.ftn{font:400 19px/1.3 var(--type)}
.sibs{display:flex;gap:6px;padding-bottom:1px}
.sib{height:34px;display:inline-flex;align-items:center;padding:0 16px;border:0;border-radius:10px 10px 0 0;background:rgba(244,238,229,.09);color:rgba(244,238,229,.66);font:400 16px/1 var(--type);white-space:nowrap}
.sib:hover{background:rgba(244,238,229,.16);color:#fffaf3}
.sfield{width:168px;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;background:rgba(244,238,229,.07);box-shadow:inset 0 0 0 1px rgba(244,238,229,.11);color:rgba(244,238,229,.42);font-size:14.5px}
.sfield span{flex:1}.sfield kbd{font:400 10px/1 var(--mono);padding:3px 6px;border-radius:5px;background:rgba(244,238,229,.09)}
.capb{height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;background:var(--cream);color:var(--ink);font:600 14.5px/1 var(--serif)}
.help{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(244,238,229,.2);color:rgba(244,238,229,.66);font:400 14px/1 var(--mono);margin-left:10px}
.sheet{position:relative;background:#f6f3ee;border-radius:0 14px 0 0;min-height:calc(100vh - 116px);padding:28px 32px 56px}
.col{max-width:1596px;margin-inline:auto}

/* header — the navy panel every workspace page carries, same box as Versions v6 */
.head{display:grid;grid-template-columns:300px minmax(0,1fr) auto;align-items:center;min-height:227px;margin-bottom:24px;padding:0 30px 0 0;border-radius:28px;background:#2a3a52;color:#f4eee5;box-shadow:0 22px 36px -26px rgba(28,19,15,.55)}
.art{display:grid;place-items:center;align-self:stretch;padding:22px 0 22px 30px}
.ph{display:grid;place-items:center;text-align:center;border-radius:16px;border:1.5px dashed rgba(244,238,229,.4);color:rgba(244,238,229,.75);font:italic 400 14px/1.35 var(--serif);padding:12px}
.art .ph{width:190px;height:180px}
.hmid{padding:28px 0;min-width:0}
.title{font:400 66px/1.05 var(--type);font-size:clamp(44px,4.3vw,66px);color:#f4eee5;overflow-wrap:anywhere}
.title.long{font-size:clamp(36px,3.2vw,48px)}
.by{display:flex;align-items:center;gap:16px;margin:16px 0 22px;max-width:600px}
.by i{flex:1 1 0;height:1px;background:rgba(244,238,229,.4)}
.by span{flex:none;font:400 21px/1 var(--type)}.by em{margin-right:6px;font:italic 400 21px/1 var(--serif);color:rgba(244,238,229,.85)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border:0;border-radius:999px;font:600 18px/1 var(--serif);white-space:nowrap}
.hb svg{width:17px;height:17px}
.hb.n{background:#fff;color:#1c130f}.hb.n:hover{background:#fffaf2}
.head :focus-visible{outline:2px solid #e8bdb4;outline-offset:3px}
/* right block: the book's vitals, as built */
.vit{display:flex;align-items:center;gap:22px;margin-left:32px;padding:6px 8px 6px 0}
.vit-n{font:400 44px/1 var(--type);white-space:nowrap}
.vit-n small{display:block;margin-top:8px;font:italic 400 15px/1 var(--serif);color:rgba(244,238,229,.8)}
.vit>i{width:1px;align-self:stretch;background:rgba(244,238,229,.25)}
.vit-g b{display:block;font:400 22px/1.2 var(--type)}
.vit-g span{display:block;margin-top:6px;font:italic 400 15px/1.35 var(--serif);color:rgba(244,238,229,.8)}
.vit-g .dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#f4eee5;vertical-align:1px}
.vit-add{padding:0;border:0;background:none;color:#f4eee5;font:600 16px/1.3 var(--serif);text-decoration:underline;text-underline-offset:4px;min-height:32px}

/* the frames, as on Versions v6 and the Dashboard */
.frame{background:#fff;border-radius:28px;padding:10px;box-shadow:0 22px 40px -28px rgba(28,19,15,.4),0 0 0 1px rgba(28,19,15,.03);min-width:0}
.in{border:1px solid rgba(28,19,15,.13);border-radius:20px;overflow:hidden;background:#fff}
.fband{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:76px;padding:18px 26px}
.fband h2{font:400 26px/1.15 var(--type)}.fband p{margin-top:4px;font:italic 400 15px/1.3 var(--serif);color:var(--t62)}
.fband.sand{background:#f3e6da}.fband.stone{background:#ebe7e2}
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;white-space:nowrap;height:40px;border-radius:999px;font:600 15px/1 var(--serif)}
.b1{padding:0 20px;background:var(--btn);color:var(--cream)}.b1:hover{background:#24324a}
.b2{padding:0 16px;background:#fff;box-shadow:0 0 0 1px rgba(28,19,15,.14),0 4px 10px -6px rgba(28,19,15,.3)}
.b2:hover{box-shadow:0 0 0 1px rgba(28,19,15,.3),0 6px 12px -6px rgba(28,19,15,.3)}
.b2 svg{width:15px;height:15px;flex:none}
.b2.done{background:#e0e5dd;box-shadow:0 0 0 1px rgba(28,19,15,.14)}
.lk{padding:0;border:0;background:none;min-height:32px;font:600 16px/1.3 var(--serif);color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;white-space:nowrap}
.lk:hover{color:#2a3a52}

/* the desk: the pitch · the details */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
.pt{display:grid;grid-template-columns:176px minmax(0,1fr) auto;gap:8px 28px;align-items:start;padding:26px 26px 28px}
.pt+.pt{border-top:1px dashed rgba(28,19,15,.18)}
.pt-h h3{font:400 20px/1.2 var(--type)}
.pt-h em{display:block;margin-top:4px;font:italic 400 14px/1.3 var(--serif);color:var(--t62)}
.pt-a{display:flex;align-items:center;gap:16px}
.pt-x{min-width:0;max-width:74ch}
.pt-x p{font-size:17px;line-height:1.6;white-space:pre-line}
.pt-x p.q{font:italic 400 24px/1.4 var(--serif)}
.pt-x p.cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.pt-x .lk{margin-top:8px;font-size:15px}
.pt-x .cnt{margin-left:14px;font:italic 400 14px var(--serif);color:var(--t62)}
.pt.no .pt-x p{font:italic 400 16px/1.5 var(--serif);color:var(--t62)}
.pt.no .pt-x p b{display:block;margin-bottom:2px;font:400 17px/1.4 var(--serif);font-style:normal;color:var(--ink)}
.pt.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%{background:#f3e6da}100%{background:#fff}}

.dt{padding:6px 26px 8px}
.dt-r{display:flex;align-items:baseline;gap:10px;width:100%;min-height:52px;padding:14px 0;border:0;border-bottom:1px dashed rgba(28,19,15,.18);background:none;text-align:left}
.dt-r:last-child{border-bottom:0}
.dt-r dt{flex:none;font:italic 400 15px/1.3 var(--serif);color:var(--t62)}
.dt-r i{flex:1;min-width:16px;border-bottom:1.5px dotted rgba(28,19,15,.25);transform:translateY(-4px)}
.dt-r dd{font:400 18px/1.3 var(--type);text-align:right;max-width:230px}
.dt-r dd small{display:block;margin-top:3px;font:italic 400 14px/1.3 var(--serif);color:var(--t62)}
.dt-r dd.mu{font:italic 400 16px/1.3 var(--serif);color:var(--t62)}
.dt-r .dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:var(--navy)}
.dt-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px 16px;border-top:1px solid rgba(28,19,15,.08);background:#fbf9f5}
.dt-f span{font:italic 400 15px var(--serif);color:var(--t72)}.dt-f span b{font:400 18px var(--type);font-style:normal;color:var(--ink);margin-right:6px}

/* your manuscripts: the active book, and room for the next */
.side{display:flex;flex-direction:column;gap:24px;min-width:0}
.sh{display:grid;gap:12px;padding:18px 18px 20px}
.bk{position:relative;display:flex;align-items:center;gap:16px;min-height:88px;padding:16px 20px 16px 34px;border-radius:14px;background:#2a3a52;color:#f4eee5;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.bk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(0,0,0,.22);box-shadow:inset -1px 0 0 rgba(244,238,229,.18)}
.bk-t{flex:1;min-width:0}
.bk-t b{display:block;font:400 20px/1.2 var(--type);overflow-wrap:anywhere}
.bk-t span{display:block;margin-top:4px;font:italic 400 14px/1.3 var(--serif);color:rgba(244,238,229,.8)}
.bk-f{flex:none;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:999px;background:#fff;color:var(--ink);font:600 14px/1 var(--serif)}
.bk-f i{width:8px;height:8px;border-radius:50%;background:#2a3a52}
.nx{display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 16px;border-radius:14px;border:1.5px dashed rgba(28,19,15,.28);background:#fbf9f5}
.nx-p{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ece7df;color:rgba(28,19,15,.55)}
.nx-p svg{width:18px;height:18px}
.nx-t{flex:1;min-width:0}
.nx-t p{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.nx-t b{font:400 19px/1.2 var(--type);color:rgba(28,19,15,.72);white-space:nowrap}
.nx-t span{display:block;margin-top:4px;font:italic 400 15px/1.3 var(--serif);color:var(--t62)}
.soon{flex:none;display:inline-flex;align-items:center;height:28px;padding:0 12px;font-style:normal;border-radius:999px;background:#f5e2da;color:#5a2a22;font:600 14px/1 var(--serif);white-space:nowrap}

/* the edit drawer, as built (v28): navy head, five numbered sections, one save */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(16,22,31,.5);opacity:0;transition:opacity .2s ease-out}
.scrim.on{opacity:1}
.drw{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(640px,54vw);display:flex;flex-direction:column;background:#fbf9f5;box-shadow:-24px 0 48px -24px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .26s ease-out}
.drw.on{transform:none}
.dh{background:#2c3a53;color:#f4eee5;padding:22px 24px;display:flex;align-items:flex-start;gap:14px}
.disc{flex:none;display:grid;place-items:center;width:46px;height:60px;padding:4px;border-radius:4px;background:#f8f3ea;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),3px 3px 0 rgba(0,0,0,.2);color:var(--ink);text-align:center;overflow:hidden;font:400 7px/1.2 var(--type);text-transform:uppercase;overflow-wrap:anywhere}
.dh-t{flex:1;min-width:0}.dh-t h3{font:400 26px/1.15 var(--type);color:#f8f3ea;overflow-wrap:anywhere}
.dh-t small{display:block;margin-top:6px;font:italic 400 15px var(--serif);color:rgba(244,238,229,.72)}
.dx{flex:none;width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.dx:hover{background:rgba(255,255,255,.22)}.dx svg{width:14px;height:14px}.dx:focus-visible{outline-color:#fff}
.db{flex:1;overflow:auto;padding:22px 28px 28px}
.df{display:flex;align-items:center;gap:12px;padding:16px 28px;border-top:1px solid rgba(28,19,15,.08);background:#fff}
.df>span:first-child{flex:1;min-width:0;font-size:14px;color:rgba(28,19,15,.58)}
.df .err{font-size:14px;color:#7c2d2d}
.cb{height:42px;padding:0 20px;border:0;border-radius:21px;font:400 15px var(--type);white-space:nowrap}
.cb.p{background:var(--navy);color:#fff}.cb.p:hover{background:#1b2433}
.cb.g{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px rgba(42,58,82,.35)}.cb.g:hover{box-shadow:inset 0 0 0 1.5px var(--navy)}
.sect{margin-bottom:26px;scroll-margin-top:20px}
.sect>h4{display:flex;align-items:center;gap:10px;margin-bottom:14px;font:400 18px var(--type)}
.sect>h4 .n{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #a0452e;color:#a0452e;display:grid;place-items:center;font:600 10.5px var(--mono)}
.sect>h4 .tg{font:italic 14px var(--serif);color:rgba(28,19,15,.5)}
.sect>h4 em{margin-left:auto;font:italic 400 14px var(--serif);color:rgba(28,19,15,.5)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;margin-bottom:7px;font:400 14px var(--serif);color:rgba(28,19,15,.62)}
.fld>:is(input,textarea,select){width:100%;height:46px;padding:0 14px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px rgba(28,19,15,.14);font:400 16px var(--serif);color:var(--ink);outline:none}
.fld>input.big{height:52px;font-size:19px}
.fld>textarea{height:auto;min-height:92px;padding:12px 14px;line-height:1.5;resize:vertical}
.fld>:is(input,textarea,select):focus{box-shadow:inset 0 0 0 2px var(--navy)}
.hint{margin-top:6px;font:italic 14px var(--serif);color:rgba(28,19,15,.55)}
.frow{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:14px;background:#efe9e1}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg button{height:40px;border:0;border-radius:10px;background:none;font:400 15px var(--type);color:rgba(28,19,15,.58)}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,19,15,.12),0 0 0 1px rgba(28,19,15,.08)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(28,19,15,.12)}
.sr b{display:block;font:400 16px var(--type)}.sr small{display:block;margin-top:3px;font:italic 14px var(--serif);color:rgba(28,19,15,.55)}
.tog{position:relative;flex:none;width:46px;height:32px;border:0;background:none;padding:0}
.tog::before{content:"";position:absolute;left:0;top:3px;width:46px;height:26px;border-radius:99px;background:#d9d1c5;transition:background .2s}
.tog i{position:absolute;left:3px;top:6px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-checked="true"]::before{background:#2a3a52}.tog[aria-checked="true"] i{transform:translateX(20px)}

/* snackbar */
.snack{position:fixed;left:50%;bottom:28px;z-index:90;display:flex;align-items:center;gap:16px;min-height:48px;padding:8px 10px 8px 20px;border-radius:999px;background:#1b2433;color:#f4eee5;font-size:15px;box-shadow:0 16px 32px -14px rgba(0,0,0,.6);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .18s ease-out,transform .18s ease-out}
.snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{height:32px;padding:0 14px;border:0;border-radius:999px;background:rgba(244,238,229,.14);color:#f4eee5;font:600 14px var(--serif)}
.snack button:hover{background:rgba(244,238,229,.24)}.snack button:focus-visible{outline-color:#f4eee5}

@media (max-width:1360px){.head{grid-template-columns:250px minmax(0,1fr) auto}}
@media (max-width:1180px){
  .desk{grid-template-columns:1fr}
  .head{grid-template-columns:220px minmax(0,1fr)}.vit{grid-column:1/-1;margin:0 0 26px 30px;justify-self:start}
}
@media (max-width:860px){
  .pt{grid-template-columns:1fr}
  .head{grid-template-columns:1fr;padding:0 24px}.art{display:none}.vit{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const FULL={
  title:"Murphy’s Day Out",author:"Nick Physick",genre:"Literary mystery",also:["Book club","Crime"],age:"Adult",words:84000,
  status:"Querying",since:"10 March 2026",sinceShort:"10 Mar 2026",series:false,queries:14,
  logline:"Murphy has twelve hours to get his father’s ashes across the Irish Sea before his sister finds out he took them.",
  pitch:"It’s a road trip with an urn. Murphy steals his father’s ashes on the morning of the funeral to scatter them where the old man actually wanted, and has one day, one ferry and one very determined sister between him and Holyhead. It’s funny until it isn’t, and it’s really about who gets to decide how someone is remembered.",
  synopsis:"On the morning of his father’s funeral, MURPHY (41) takes the urn from the undertaker’s and drives for the Dublin ferry. His father asked, once and only to him, to be scattered off the Welsh coast where he worked as a young man. The family plot in Kildare has been paid for; his sister ORLA (44) has organised everything, and nobody else believes the request was ever made.\n\nMurphy misses the first sailing after his car is clamped. Stuck in the port, he meets DES, a retired lorry driver who knew his father under a different name. Des’s account of those Welsh years does not match the one the family tells. There was another household, and a daughter, CERYS, who still lives in Holyhead.\n\nOrla tracks Murphy to the terminal. She boards the same ferry, and the crossing becomes the argument they have avoided for twenty years: who looked after their father at the end, and who simply left. Murphy admits he cannot prove what their father asked for. Orla admits she has known about Cerys since she was sixteen and kept it from him.\n\nIn Holyhead they find Cerys together. She does not want the ashes or an apology; she wants the letters her father stopped answering. Murphy and Orla scatter half the ashes from the breakwater with Cerys present, and take the other half home to Kildare. Murphy drives back alone, with the funeral rearranged for the following week and his sister’s number, for the first time in years, at the top of his phone."
};
const NEW={title:"Murphy’s Day Out",author:"Nick Physick",genre:"Literary mystery",also:[],age:"Adult",words:0,status:"Drafting",since:null,sinceShort:null,series:false,queries:0,logline:"",pitch:"",synopsis:""};
const GENRES=["Literary mystery","Literary fiction","Crime","Thriller","Book club","Historical","Fantasy","Science fiction","Romance","Horror"];
const STATUSES=["Drafting","Revising","Ready to query","Querying","On submission","Shelved"];
const AGES=["Adult","Young adult","Middle grade","Other"];
let ms={...FULL}, open3=false, prev=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nwords=s=>s.trim()?s.trim().split(/\s+/).length:0;
const ICON={
  copy:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>',
  tick:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8.5 3.2 3.2L13 5"/></svg>',
  pen:'<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="m11.5 3.5 3 3L6 15H3v-3z"/><path d="m10 5 3 3"/></svg>',
  plus:'<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"/></svg>',
  x:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg>'
};
const PIECES=[
  {k:"logline",h:"Logline",tag:"one sentence",none:"No logline yet.",why:"The hook in a single sentence. It’s the line that opens your query letter."},
  {k:"pitch",h:"Elevator pitch",tag:"30 seconds, out loud",none:"No elevator pitch yet.",why:"What you’d say if someone asked what your book’s about. Keep it on the tip of your tongue."},
  {k:"synopsis",h:"Synopsis",tag:"the whole story",none:"No synopsis yet.",why:"The whole story in brief, ending included."}
];
function piece(p){
  const v=ms[p.k];
  if(!v) return `<section class="pt no" data-k="${p.k}"><div class="pt-h"><h3>${p.h}</h3><em>${p.tag}</em></div>
    <div class="pt-x"><p><b>${p.none}</b>${p.why}</p></div>
    <div class="pt-a"><button class="b2" data-edit="${p.k}">${ICON.plus}Add one</button></div></section>`;
  let body;
  if(p.k==="logline") body=`<p class="q">“${esc(v)}”</p>`;
  else if(p.k==="synopsis"){
    const long=nwords(v)>90;
    body=`<p class="${long&&!open3?"cl":""}" id="synP">${esc(v)}</p>${long?`<button class="lk" data-more aria-expanded="${open3}" aria-controls="synP">${open3?"Show less":"Read it all"}</button>`:""}<span class="cnt">${nwords(v)} words</span>`;
  } else body=`<p>${esc(v)}</p>`;
  return `<section class="pt" data-k="${p.k}"><div class="pt-h"><h3>${p.h}</h3><em>${p.tag}</em></div>
    <div class="pt-x">${body}</div>
    <div class="pt-a"><button class="b2" data-copy="${p.k}" aria-label="Copy the ${p.h.toLowerCase()}">${ICON.copy}<span>Copy</span></button><button class="lk" data-edit="${p.k}" aria-label="Edit the ${p.h.toLowerCase()}">Edit</button></div></section>`;
}
function row(l,v,mu,sub){return `<button class="dt-r" data-edit="basics" aria-label="${l}: ${esc(String(v).replace(/<[^>]+>/g,""))}. Edit"><dt>${l}</dt><i></i><dd class="${mu?"mu":""}">${v}${sub?`<small>${sub}</small>`:""}</dd></button>`;}
function render(){
  const filled=PIECES.filter(p=>ms[p.k]).length;
  $("#page").innerHTML=`
  <header class="head">
    <div class="art"><div class="ph">Illustration<br>the Scribe with his quill</div></div>
    <div class="hmid">
      <h1 class="title${ms.title.length>22?" long":""}">${esc(ms.title)}</h1>
      <div class="by"><i></i><span><em>by</em>${esc(ms.author)}</span><i></i></div>
      <div class="acts"><button class="hb n" data-edit="basics">${ICON.pen}Edit details</button></div>
    </div>
    <div class="vit">
      <div class="vit-n">${ms.words?ms.words.toLocaleString("en-GB")+"<small>words</small>":`<button class="vit-add" data-edit="words">Add a word count</button>`}</div><i></i>
      <div class="vit-g"><b>${esc(ms.genre)}</b><span>${esc(ms.age)}</span><span><i class="dot"></i>${ms.since?`${ms.status} since ${ms.sinceShort}`:ms.status}</span></div>
    </div>
  </header>
  <div class="desk">
    <section class="frame" aria-labelledby="pH"><div class="in">
      <div class="fband sand"><div><h2 id="pH">The pitch</h2><p>${filled===3?"Your book in one line, in thirty seconds and in full.":filled===0?"Three ways of telling people what your book is. Add them when you’re ready.":`${filled} of 3 written.`}</p></div></div>
      ${PIECES.map(piece).join("")}
    </div></section>
    <div class="side">
    <section class="frame" aria-labelledby="dH"><div class="in">
      <div class="fband stone"><div><h2 id="dH">Details</h2></div><button class="lk" data-edit="basics">Edit</button></div>
      <dl class="dt">
        ${row("Where it stands",`<span class="dot"></span>${ms.status}`,false,ms.since?`since ${ms.since}`:"")}
        ${row("Genre",esc(ms.genre),false,ms.also.length?`also fits ${ms.also.map(esc).join(", ")}`:"")}
        ${row("Age category",esc(ms.age))}
        ${row("Word count",ms.words?ms.words.toLocaleString("en-GB"):"Not set",!ms.words)}
        ${row("Series",ms.series?"Part of a series":"Standalone")}
      </dl>
      <div class="dt-f">${ms.queries?`<span><b>${ms.queries}</b>queries sent for this book</span><button class="lk" data-go>See them</button>`:`<span>No queries sent for this book yet.</span><button class="lk" data-go>Log a query</button>`}</div>
    </div></section>
  <section class="frame" aria-labelledby="sH"><div class="in">
    <div class="fband stone"><div><h2 id="sH">Your manuscripts</h2></div></div>
    <div class="sh">
      <div class="bk"><div class="bk-t"><b>${esc(ms.title)}</b><span>${esc(ms.genre)}</span></div><span class="bk-f"><i></i>Active</span></div>
      <div class="nx"><span class="nx-p">${ICON.plus}</span><div class="nx-t"><p><b>Add a manuscript</b><em class="soon">Coming soon</em></p><span>We’re working on this – watch this space.</span></div></div>
    </div>
  </div></section>
    </div>
  </div>`;
}

/* ---- snackbar ---- */
let snackT;
function snack(msg,undo){
  $("#snackT").textContent=msg; const u=$("#snackU"); u.hidden=!undo; u.onclick=()=>{undo&&undo();hideSnack();};
  $("#snack").classList.add("on"); clearTimeout(snackT); snackT=setTimeout(hideSnack,undo?6000:2600);
}
function hideSnack(){$("#snack").classList.remove("on");}

/* ---- the drawer ---- */
let d=null,lastFocus=null;
function openDrawer(field){
  lastFocus=document.activeElement; d={...ms,also:[...ms.also],wordsT:ms.words?ms.words.toLocaleString("en-GB"):""};
  const seg=(name,opts,val,c4)=>`<div class="seg${c4?" c4":""}" role="radiogroup" aria-label="${name}" data-seg="${name}">${opts.map(o=>`<button type="button" role="radio" aria-checked="${o===val}" data-v="${o}">${o}</button>`).join("")}</div>`;
  $("#over").innerHTML=`<div class="scrim" id="scrim"></div>
  <aside class="drw" id="drw" role="dialog" aria-modal="true" aria-label="Edit details: ${esc(ms.title)}">
    <div class="dh"><span class="disc" aria-hidden="true">${esc(ms.title)}</span><div class="dh-t"><h3>${esc(ms.title)}</h3><small>The book’s details. Edit anything; save once.</small></div><button class="dx" id="dClose" aria-label="Close">${ICON.x}</button></div>
    <div class="db" id="dBody">
      <section class="sect" data-sect="basics"><h4><span class="n">1</span>The book</h4>
        <label class="fld"><span>Title</span><input class="big" id="fTitle" value="${esc(d.title)}"></label>
        <label class="fld"><span>Genre</span><select id="fGenre">${GENRES.map(g=>`<option${g===d.genre?" selected":""}>${g}</option>`).join("")}</select></label>
        <div class="frow"><label class="fld"><span>Word count</span><input id="fWords" inputmode="numeric" value="${d.wordsT}"></label><span></span></div>
        <div class="fld"><span>Age category</span>${seg("age",AGES,d.age,true)}</div>
        <div class="fld"><span>Where it stands</span>${seg("status",STATUSES,d.status)}</div>
      </section>
      <section class="sect" data-sect="logline"><h4><span class="n">2</span>Logline<span class="tg">one sentence</span></h4>
        <label class="fld"><textarea id="fLog" rows="3" aria-label="Logline">${esc(d.logline)}</textarea><p class="hint">The hook in a single sentence. It’s the line that opens your query letter.</p></label></section>
      <section class="sect" data-sect="pitch"><h4><span class="n">3</span>Elevator pitch<span class="tg">30 seconds, out loud</span><em>optional</em></h4>
        <label class="fld"><textarea id="fPitch" rows="4" aria-label="Elevator pitch" placeholder="e.g. A ferry skipper races the tide to bring his brother home.">${esc(d.pitch)}</textarea><p class="hint">What you’d say if someone asked what your book’s about: the hook, then the stakes and what makes it yours. Keep it on the tip of your tongue. You never know when the right person might ask.</p></label></section>
      <section class="sect" data-sect="synopsis"><h4><span class="n">4</span>Synopsis<em>optional</em></h4>
        <label class="fld"><textarea id="fSyn" rows="8" aria-label="Synopsis">${esc(d.synopsis)}</textarea><p class="hint">The whole story in brief, ending included.</p></label></section>
      <section class="sect" data-sect="series"><h4><span class="n">5</span>Series</h4>
        <div class="sr"><span><b>Part of a series?</b><small id="srL"></small></span><button type="button" class="tog" id="fSeries" role="switch" aria-checked="${d.series}" aria-label="Part of a series"><i></i></button></div></section>
    </div>
    <div class="df"><span>${ms.since?`Querying since ${ms.since}.`:"Not querying yet."}</span><span class="err" id="dErr" role="alert"></span>
      <button class="cb g" id="dCancel">Cancel</button><button class="cb p" id="dSave">Save details</button></div>
  </aside>`;
  const srL=()=>$("#srL").textContent=d.series?"Yes, it’s part of a series":"No, it’s a standalone"; srL();
  $("#fSeries").onclick=e=>{d.series=!d.series;e.currentTarget.setAttribute("aria-checked",d.series);srL();};
  document.querySelectorAll("[data-seg]").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;d[g.dataset.seg]=b.dataset.v;g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",x===b));});
  $("#dClose").onclick=$("#dCancel").onclick=$("#scrim").onclick=closeDrawer;
  $("#dSave").onclick=save;
  requestAnimationFrame(()=>{$("#scrim").classList.add("on");$("#drw").classList.add("on");
    const map={basics:"#fTitle",words:"#fWords",logline:"#fLog",pitch:"#fPitch",synopsis:"#fSyn"};
    const el=$(map[field]||"#fTitle"); const sect=el.closest(".sect"); const body=$("#dBody");
    if(field!=="basics"&&field!=="words") body.scrollTop=sect.offsetTop-body.offsetTop-12;
    el.focus({preventScroll:true}); try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){}
  });
}
function closeDrawer(){
  const s=$("#scrim"),w=$("#drw"); if(!w)return; s.classList.remove("on");w.classList.remove("on");
  setTimeout(()=>{$("#over").innerHTML="";},240); d=null; if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function save(){
  const t=$("#fTitle").value.trim(); if(!t){$("#dErr").textContent="A manuscript needs a title.";$("#fTitle").focus();return;}
  const before={...ms,also:[...ms.also]};
  const w=parseInt($("#fWords").value.replace(/[^0-9]/g,""),10);
  const next={...ms,title:t,genre:$("#fGenre").value,words:w>0?w:0,age:d.age,status:d.status,series:d.series,logline:$("#fLog").value.trim(),pitch:$("#fPitch").value.trim(),synopsis:$("#fSyn").value.trim()};
  if(next.genre!==ms.genre)next.also=[];
  if(next.status==="Querying"&&!next.since){next.since="18 November 2026";next.sinceShort="18 Nov 2026";}
  const changed=PIECES.filter(p=>next[p.k]!==ms[p.k]).map(p=>p.k);
  ms=next; lastFocus=null; closeDrawer(); render();
  changed.forEach(k=>{const el=$(`.pt[data-k="${k}"]`);el&&el.classList.add("flash");});
  snack("Saved the book’s details.",()=>{ms=before;render();snack("Put back as it was.");});
}

/* ---- the page's clicks ---- */
document.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed&&!e.target.closest(".drw")){openDrawer(ed.dataset.edit);return;}
  const cp=e.target.closest("[data-copy]");
  if(cp){const k=cp.dataset.copy; try{navigator.clipboard&&navigator.clipboard.writeText(ms[k]).catch(()=>{});}catch(_){}
    cp.classList.add("done");cp.innerHTML=ICON.tick+"<span>Copied</span>";
    setTimeout(()=>{if(document.contains(cp)){cp.classList.remove("done");cp.innerHTML=ICON.copy+"<span>Copy</span>";}},1800);
    snack(PIECES.find(p=>p.k===k).h+" copied.");return;}
  const mo=e.target.closest("[data-more]"); if(mo){open3=!open3;render();$("[data-more]").focus();return;}
  if(e.target.closest("[data-go]")){snack(ms.queries?"Goes to Queries, filtered to this book.":"Opens Log a query.");return;}
  const md=e.target.closest("[data-mode]"); if(md){ms=md.dataset.mode==="new"?{...NEW,also:[]}:{...FULL,also:[...FULL.also]};open3=false;
    document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b===md));render();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#drw")){closeDrawer();return;}
  if(e.key==="Tab"&&$("#drw")){const f=[...$("#drw").querySelectorAll("button,input,select,textarea")].filter(x=>!x.disabled);
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}
});
render();
</script>
</body>
</html>
