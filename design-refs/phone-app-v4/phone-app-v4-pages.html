<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryHawk Today – states and details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--page:#f8f6f2;--navy:#2a3a52;--navyd:#1f2c40;--blush:#e8c8bc;--ink:#1f2633;--body:#4a4f5a;--muted:#676b74;--rule:#e6e0d6;--fill:#ece7de;--sand:#f7efe3;--pink:#f5e6df;--slate:#d7e0e8;--onnavy:#c9d2df;
--type:"Special Elite","Courier New",monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#e9e6e0;font-family:var(--sans);color:var(--ink);font-synthesis:none;-webkit-font-smoothing:antialiased;padding:0 0 96px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.intro{padding:32px 32px 8px;max-width:860px}
.intro h1{font:400 28px/1.2 var(--type);margin:0 0 8px}
.intro p{margin:0 0 8px;font-size:16px;line-height:1.5;color:var(--body)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;padding:16px 32px 8px;max-width:1240px}
.rules div{background:#fff;border-radius:16px;padding:16px}
.rules b{display:block;font-size:15px;margin-bottom:4px}
.rules span{font-size:14px;line-height:1.45;color:var(--body)}
.rowx{display:flex;gap:40px;overflow-x:auto;padding:24px 32px 24px;align-items:flex-start}
.opt{flex:none;width:391px}
.opt h2{font:400 20px/1.2 var(--type);margin:0 8px 4px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.opt h2 em{font:600 12px/1 var(--sans);font-style:normal;background:var(--navy);color:#fff;border-radius:12px;padding:6px 10px}
.opt .from{font-size:14px;line-height:1.45;color:var(--muted);margin:0 8px 16px;min-height:62px}
.ph{width:375px;height:780px;margin:8px;background:var(--page);border-radius:40px;overflow:hidden;box-shadow:0 0 0 8px #1b1f27,0 24px 48px rgba(0,0,0,.22);display:flex;flex-direction:column}
.sc{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.leg{margin:24px 8px 16px;padding:0;list-style:none;counter-reset:n}
.leg li{position:relative;padding:0 0 12px 36px;font-size:14px;line-height:1.45;color:var(--body);counter-increment:n}
.leg li::before{content:counter(n);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font:600 13px/24px var(--sans);text-align:center}
.leg b{color:var(--ink)}
.pick{display:block;width:calc(100% - 16px);margin:0 8px;height:48px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1.5px #cfc9bd;font-weight:600;font-size:15px;text-align:center}
.pick.on{background:var(--navy);color:#fff;box-shadow:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--navyd);color:#fff;padding:12px 32px;display:flex;gap:16px;align-items:center;font-size:15px;z-index:10}
#bar span{flex:1}
#bar button{background:#fff;color:var(--navy);font-weight:600;border-radius:20px;height:40px;padding:0 16px}

/* the phone's own system: 8pt grid, 24px margins, three text sizes plus one display size */
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.T{font-family:var(--type);font-weight:400}
.ph{--k:1;position:relative}
.d{font:400 calc(28px*var(--k))/1.2 var(--type)}            /* display */
.h{font-size:calc(20px*var(--k));line-height:1.3;font-weight:600}  /* title */
.b{font-size:calc(16px*var(--k));line-height:1.5}                 /* body */
.s{font-size:calc(14px*var(--k));line-height:1.43;color:var(--muted)} /* secondary */
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:28px;background:var(--navy);color:#fff;font-size:calc(17px*var(--k));font-weight:600;padding:0 16px;text-align:center}
.cta.inv{background:var(--blush);color:var(--ink)}
.link{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;font-size:calc(16px*var(--k));font-weight:600;color:var(--navy)}
.gl{flex:none;border-radius:50%;display:grid;place-items:center;color:#1c130f}
.gl svg{fill:none;stroke:currentColor;stroke-width:2}
.chev{flex:none}
.tap{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;text-align:left}
.tap+.tap{border-top:1px solid var(--rule)}
.tap .x{flex:1;min-width:0}
.chev{color:#a9a49b;width:20px;height:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(31,38,51,.05),0 12px 32px rgba(31,38,51,.10)}
.figs{display:flex}
.figs div{flex:1;padding:0 16px}
.figs div+div{border-left:1px solid var(--rule)}
.figs div:first-child{padding-left:0}
.figs b{display:block;font:400 28px/32px var(--type)}
.tb{flex:none;display:flex;align-items:center;background:#fff;border-top:1px solid var(--rule);padding:8px 8px 16px}
.tb div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#7b7f88;min-height:48px;justify-content:center}
.tb div.on{color:var(--navy);font-weight:600}
.tb .p{flex:none;width:64px}
.tb .p span{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.jr{display:flex;align-items:center}
.jr i{flex:none;width:16px;height:16px;border-radius:50%;background:#fff}
.jr i.end{background:var(--blush)}
.jr u{flex:1;height:2px;background:rgba(255,255,255,.55)}
.jl{display:flex;justify-content:space-between;margin-top:8px}
.jl span{font-size:14px;line-height:20px;color:var(--onnavy);width:64px}
.jl span:nth-child(2){text-align:center;margin-left:-4%}
.jl span:nth-child(3){text-align:center;margin-right:-4%}
.jl span:last-child{text-align:right}
.jl b{display:block;font:400 20px/24px var(--type);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:4px}
.seg span{flex:1;height:40px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--body)}
.seg span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(31,38,51,.12)}
@media (max-width:700px){.intro,.rules{padding-left:16px;padding-right:16px}.rowx{padding:16px 8px;gap:16px}}
.d2{font:400 calc(24px*var(--k))/1.33 var(--type)}
.n{font:400 calc(20px*var(--k))/1.2 var(--type);display:block}
.tb{position:absolute;left:0;right:0;bottom:0;transition:transform .25s}
.tb.hide{transform:translateY(100%)}
.sc{padding-bottom:80px}
.mini{position:absolute;left:0;right:0;top:0;z-index:4;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:40px 12px 0 24px;height:96px;transform:translateY(-100%);transition:transform .22s}
.mini.on{transform:none}
.jl span{font-size:calc(14px*var(--k))}
.jl b{font:400 calc(20px*var(--k))/1.2 var(--type)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:calc(14px*var(--k));font-weight:600;white-space:nowrap}
.tog{display:inline-flex;align-items:center;gap:12px;margin:0 32px 0;height:48px;padding:0 20px;border-radius:24px;background:#fff;font-size:15px;font-weight:600}
.tog i{width:44px;height:26px;border-radius:13px;background:#c9ccd3;position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on i{background:var(--navy)}.tog.on i::after{transform:translateX(18px)}
.pips{display:flex;gap:4px;margin-bottom:16px}.pips i{flex:1;height:4px;border-radius:2px;background:var(--fill)}.pips i.on{background:var(--navy)}
@keyframes sweep{from{stroke-dasharray:0 201.100}}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.200);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){.tog{margin:0 16px}}
.nav{position:sticky;top:0;z-index:20;background:#e9e6e0;display:flex;gap:8px;align-items:center;padding:12px 32px;border-bottom:1px solid #d8d3c9;overflow-x:auto}
.nav a{flex:none;height:40px;padding:0 16px;border-radius:20px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--body);text-decoration:none;background:#fff}
.nav .tog{margin:0 0 0 auto;height:40px}
section{scroll-margin-top:72px;padding-top:24px}
section>h2{font:400 26px/1.2 var(--type);margin:0 32px 4px}
section>p{margin:0 32px;font-size:16px;line-height:1.5;color:var(--body);max-width:820px}
.rowx{padding-top:16px}
.hdr{background:var(--navy);color:#fff;padding:56px 24px 24px;position:relative;overflow:hidden}
.hdr.lap{padding-bottom:88px}
.hdr .cast{flex:none;height:auto;margin:0 -16px -6px 4px;filter:drop-shadow(-8px 10px 12px rgba(0,0,0,.35))}
.cap{display:flex;align-items:center;gap:12px;width:100%;height:48px;border-radius:24px;background:#fff;color:var(--muted);padding:0 16px;text-align:left;position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 16px 0}
.chips::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.chipb{flex:none;height:48px;display:flex;align-items:center}
.chipb span{height:36px;padding:0 14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule);display:flex;align-items:center;gap:6px;font-size:calc(14px*var(--k));font-weight:600;white-space:nowrap}
.chipb.on span{background:var(--navy);color:#fff;box-shadow:none}
.chipb i{font-style:normal;font-weight:400;opacity:.7}
.seal{flex:none;border-radius:50%;background:var(--fill);color:var(--ink);font-weight:600;display:grid;place-items:center;position:relative}
.seal.dk{background:var(--navy);color:#fff}
.seal .gl{position:absolute;right:-4px;bottom:-4px;box-shadow:0 0 0 2px var(--page)}
.ib{display:flex;gap:16px;align-items:center;width:100%;min-height:72px;padding:8px 24px;text-align:left}
.ib .x{flex:1;min-width:0}
.ib .l1{display:flex;align-items:baseline;gap:8px}
.ib .nm{flex:1;font-size:calc(16px*var(--k));line-height:1.5;font-weight:500}
.ib.un .nm{font-weight:700}
.ib .pv{display:block;font-size:calc(14px*var(--k));line-height:1.43;color:var(--muted)}
.ib.un .pv{color:var(--ink)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--blush);box-shadow:0 0 0 1.5px #8a4a3c}
.prog{display:block;height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:var(--navy)}
.grp{display:flex;align-items:baseline;gap:8px;padding:24px 24px 4px}
.band{flex:none;padding:16px 24px}
.th{display:flex;flex-direction:column;gap:8px;padding:16px}
.bub{max-width:82%;padding:10px 14px 8px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(31,38,51,.08);align-self:flex-end;border-bottom-right-radius:6px}
.bub.t{align-self:flex-start;border-radius:18px;border-bottom-left-radius:6px}
.bub time{display:block;text-align:right;margin-top:2px}
.act{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);padding:12px 16px 20px}
.snack{position:absolute;left:16px;right:16px;bottom:148px;min-height:48px;border-radius:24px;background:var(--navyd);color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px 0 20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dim{position:absolute;inset:0;background:rgba(20,26,36,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;scrollbar-width:none;background:var(--page);border-radius:24px 24px 0 0;padding:8px 16px 24px}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(31,38,51,.22);margin:4px auto 20px}
.face{flex:none;width:64px;min-height:88px;display:flex;flex-direction:column;align-items:center;gap:8px}
.face .rg{border-radius:50%;padding:3px}
.face.on .rg{box-shadow:0 0 0 2.5px var(--navy)}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 16px}
.kv{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;text-align:left}
.kv+.kv,.kv+.ed,.ed+.kv{border-top:1px solid var(--rule)}
.kv .k{flex:none;width:108px}
.kv .v{flex:1;font-weight:600}
.sw{flex:none;width:48px;height:28px;border-radius:14px;background:var(--navy);position:relative}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.tag{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:calc(14px*var(--k));white-space:nowrap}
.stars{color:var(--navy);letter-spacing:2px;font-size:calc(16px*var(--k))}
.stars i{font-style:normal;color:#d4cec3}
.ck{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--navy)}
.ck.off{background:none;box-shadow:inset 0 0 0 2px #c9ccd3}
.paper{flex:none;width:164px;background:#fffdf8;border-radius:6px;box-shadow:0 1px 2px rgba(31,38,51,.05),0 8px 20px rgba(31,38,51,.10);padding:16px;text-align:left}
.paper u{display:block;height:4px;border-radius:2px;background:var(--fill);margin-top:8px;text-decoration:none}
.stp{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule);display:grid;place-items:center;font-size:24px}
.bsw{display:flex;height:48px;border-radius:24px;background:rgba(255,255,255,.14);padding:4px}
.bsw span{flex:1;display:grid;place-items:center;border-radius:20px;font-size:calc(16px*var(--k));font-weight:600;color:#fff}
.bsw .on{background:#fff;color:var(--navy)}
.bwrap{padding:0 24px}
.bmon{position:relative;height:48px;margin-top:16px}
.bmon span{position:absolute;top:0;height:28px;display:grid;place-items:center;font:400 calc(14px*var(--k))/1 var(--type);color:var(--body);border-radius:6px}
.bmon b{position:absolute;top:26px;transform:translateX(-50%);font:600 14px/18px system-ui;color:#fff;background:#8a4a3c;border-radius:9px;padding:0 8px;white-space:nowrap}
.brow{display:block;width:100%;min-height:68px;padding:10px 0 12px;text-align:left}
.brow.dimd{opacity:.3}
.btr{display:block;position:relative;height:14px;margin-top:10px;border-radius:7px;background:rgba(31,38,51,.05)}
.btr i{position:absolute;top:0;height:14px;border-radius:7px}
.btr .bpast{opacity:.75;box-shadow:inset 0 0 0 1px rgba(31,38,51,.18)}
.btr .brem{box-shadow:inset 0 0 0 1.5px rgba(42,58,82,.35)}
.btr .bdone{background:var(--navy)}
.btr .bover{top:6px;height:2px;border-radius:0;background:var(--navy)}
.btr .btick{top:-5px;height:24px;width:2px;margin-left:-1px;border-radius:1px;background:#8a4a3c}
.btr .bbeacon{top:-2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--page);box-shadow:inset 0 0 0 3px #8a4a3c;animation:bpulse 1.8s ease-out infinite}
@keyframes bpulse{0%{box-shadow:inset 0 0 0 3px #8a4a3c,0 0 0 0 rgba(138,74,60,.45)}100%{box-shadow:inset 0 0 0 3px #8a4a3c,0 0 0 10px rgba(138,74,60,0)}}
@media (prefers-reduced-motion:reduce){.btr .bbeacon{animation:none}}
.peek{position:sticky;bottom:0;margin:-200px 0 0;background:#fff;border-radius:24px 24px 0 0;padding:24px 16px 16px;box-shadow:0 -8px 32px rgba(31,38,51,.18)}
@media (max-width:700px){.nav{padding:8px 12px}section>h2,section>p{margin-left:16px;margin-right:16px}}
</style>
</head>

const gs0=gs;gs=function(k){const s=SP[k];if(s[0]==="nd")return'<circle cx="12" cy="12" r="10"/><path d="M12 7v6.500M12 16.800v.200" stroke-linecap="round"/>';if(s[1]==="b")return'<circle cx="12" cy="12" r="10"/><path d="M7.500 12h9" stroke-linecap="round"/>';return gs0(k)};
const ini=n=>{const w=n.split(" ");return w.length>2?"":w.map(x=>x[0]).join("")};
const seal=(n,z,dk,g)=>`<span class="seal${dk?" dk":""}" style="width:${z}px;height:${z}px;font-size:${Math.max(14,Math.round(z*.33))}px">${ini(n)}${g?G(g,Math.round(z*.46)):""}</span>`;
const stars=n=>`<span class="stars" role="img" aria-label="${n} of 5">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`;
const X=`<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`,BACK=`<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>`,CHECK=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>`,GEAR=`<svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/></svg>`,CLOCK=`<svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2"/></svg>`;
const ibtn=(svg,l)=>`<button style="width:48px;height:48px;display:grid;place-items:center;flex:none" aria-label="${l}">${svg}</button>`;
const tbar=a=>`<div class="tb">${[["today","Today"],["queries","Queries"],0,["agents","Agents"],["user","You"]].map(t=>t?`<div class="${a===t[1]?"on":""}">${ic(t[0])}${t[1]}</div>`:`<div class="p"><span>${ic("plus")}</span></div>`).join("")}</div>`;
function hdr(o){return`<div class="hdr${o.lap?" lap":""}" style="background:var(--navy) ${DOODLE}"><img src="${SHADOW}" alt="" style="position:absolute;left:-90px;top:120px;width:280px;opacity:.06;transform:rotate(-8deg)">
<div style="display:flex;align-items:flex-end;position:relative;min-height:${o.h||136}px;margin-bottom:${o.after?24:0}px"><div style="flex:1;min-width:0;padding-bottom:8px"><div class="s" style="color:var(--onnavy);margin-bottom:8px">${o.kick}</div><div class="d2">${o.head}</div>${o.sub?`<div class="s" style="color:var(--onnavy);margin-top:8px">${o.sub}</div>`:""}</div>${o.img?`<img class="cast" src="${o.img}" alt="" style="width:${o.w||104}px;${o.imgStyle||""}">`:""}${o.right?`<div style="position:absolute;right:-12px;top:-44px">${o.right}</div>`:""}</div>${o.after||""}</div>`}
const ib=(n,g,pv,t,un,extra)=>`<button class="ib${un?" un":""}">${seal(n,48,un,g)}<span class="x"><span class="l1"><span class="nm">${n}</span><span class="s T">${t}</span></span><span style="display:flex;align-items:center;gap:8px"><span class="pv" style="flex:1">${pv}</span>${un?'<i class="dot"></i>':""}</span>${extra||""}</span></button>`;
const chips=(l)=>`<div class="chips">${l.map((c,k)=>`<button class="chipb${k?"":" on"}"><span>${c[0]} <i>${c[1]}</i></span></button>`).join("")}</div>`;
const tr4=n=>`<div class="jr" style="flex:1">${[0,1,2,3].map(k=>(k?`<u style="background:${k<=n?"#1c130f":"rgba(28,19,15,.2)"}"></u>`:"")+`<i style="${k<=n?"background:#1c130f":"background:none;box-shadow:inset 0 0 0 2px rgba(28,19,15,.3)"}"></i>`).join("")}</div>`;
const bub=(t,sub,d,them,fill,neu)=>`<div class="bub${them?" t":""}" style="${them?`background:${fill}`:""}${neu?";animation:stampin .35s both;transform-origin:right bottom":""}"><span class="b" style="display:block">${t}</span>${sub?`<span class="s" style="display:block">${sub}</span>`:""}<time class="s T">${d}</time></div>`;
const gap=(t,r)=>`<div class="s" style="padding:4px 8px;${r?"text-align:right":""}">${t}</div>`;
const topbar=(n,sub)=>`<div style="background:var(--navy);color:#fff;padding:40px 4px 8px;display:flex;align-items:center;gap:4px">${ibtn(BACK,"Back")}${seal(n,40)}<div style="flex:1;min-width:0;padding-left:8px"><div class="b" style="font-weight:600;line-height:1.25">${n}</div><div class="s" style="color:var(--onnavy)">${sub}</div></div>${ibtn(ic("user"),"About "+n)}</div>`;
const face=(n,on,g)=>`<button class="face${on?" on":""}"><span class="rg">${seal(n,48,on,g)}</span><span class="s" style="${on?"color:var(--ink);font-weight:600":""}">${n.split(" ")[0]}</span></button>`;
const kv=(k,v,r)=>`<button class="kv"><span class="s k">${k}</span><span class="b v">${v}</span>${r||ic("chev","chev")}</button>`;
const under=`<div style="position:absolute;inset:0;background:var(--page)"><div style="background:var(--navy);height:230px"></div>${[0,1,2,3,4].map(()=>`<div style="display:flex;gap:16px;padding:16px 24px"><i style="width:48px;height:48px;border-radius:50%;background:var(--fill)"></i><div style="flex:1"><i style="display:block;width:60%;height:12px;border-radius:6px;background:var(--fill);margin:6px 0 10px"></i><i style="display:block;width:85%;height:10px;border-radius:5px;background:var(--fill)"></i></div></div>`).join("")}</div><div class="dim"></div>`;

 return`<div class="bmon">${out.map((m,k)=>`<span style="left:${m[1]}%;width:${m[2]-m[1]}%;${k%2?"":"background:rgba(42,58,82,.07)"}">${m[2]-m[1]>9?m[0]:""}</span>`).join("")}<b style="left:${ax.t}%">Today</b></div>`}
function track(r,ax,deep){const l=ax.p(r.from),e=ax.p(r.to),t=ax.t,gone=+r.to<+TODAY,clip=+r.to>ax.b;
 let h=`<span class="btr">`;
 if(deep)r.past.forEach(s=>{const a=ax.p(s[1]),b=ax.p(s[2]);if(b>a)h+=`<i class="bpast" style="left:${a}%;width:${b-a}%;background:${FILL[s[0]]}"></i>`});
 if(gone)h+=`<i class="bdone" style="left:${l}%;width:${e-l}%"></i><i class="bover" style="left:${e}%;width:${t-e}%"></i><i class="bbeacon" style="left:${t}%"></i>`;
 else h+=`<i class="brem" style="left:${l}%;width:${e-l}%;background:${FILL[r.g]};${clip?"border-radius:7px 0 0 7px":""}"></i><i class="bdone" style="left:${l}%;width:${Math.max(t-l,2.500)}%"></i><i class="btick" style="left:${t}%"></i>`;
 return h+`</span>`}
const pct=r=>(TODAY-r.from)/(r.to-r.from);
function ptrack(r){const p=pct(r);return p>=1?`<span class="btr" style="margin-right:9px"><i class="bdone" style="left:0;width:100%"></i><i class="bbeacon" style="left:100%"></i></span>`:`<span class="btr"><i class="brem" style="left:0;width:100%;background:${FILL[r.g]}"></i><i class="bdone" style="left:0;width:${p*100}%"></i></span>`}

{t:"2 · Filled in",sub:"Four lines, already answered. Tap one only if it went differently.",h:under+`<div class="sheet"><div class="grab"></div><div class="d" style="margin:0 8px 16px">Query to Imogen</div>${facesRow(1)}<div class="card" style="padding:0 24px;margin:8px 0 12px">${kv("Sent","Today, 11 Nov")}${kv("With it","Letter, synopsis, first 3 chapters")}${kv("Reply expected","In 8 weeks, by 6 Jan")}${kv("Nudge reminder","7 Jan",'<span class="sw"></span>')}</div><div class="s" style="margin:0 8px 24px">Filled in from Imogen's card.</div><button class="cta">Log query</button></div>`},
{t:"3 · Changing a line",sub:"The full sample control, only when you ask for it.",h:under+`<div class="sheet"><div class="grab"></div><div class="d" style="margin:0 8px 16px">What went with it?</div><div class="card" style="padding:0 24px;margin-bottom:16px">${["Query letter","Synopsis"].map(x=>`<button class="kv"><span class="b v">${x}</span><i class="ck">${CHECK}</i></button>`).join("")}<button class="kv"><span class="v"><span class="b" style="display:block;font-weight:600">Opening sample</span><span class="s">First 3 chapters</span></span><i class="ck">${CHECK}</i></button>
<div class="ed" style="padding:16px 0"><div class="seg" style="margin-bottom:16px"><span class="on">Chapters</span><span>Pages</span><span>Words</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="stp" aria-label="Fewer">&minus;</button><div style="flex:1;height:48px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--navy);display:flex;align-items:center;justify-content:center;gap:8px"><span class="d">3</span><span class="s">chapters</span></div><button class="stp" aria-label="More">+</button></div><div style="display:flex;gap:0 8px;flex-wrap:wrap"><button class="chipb on"><span>From the start</span></button><button class="chipb"><span>From somewhere else</span></button></div></div>
<button class="kv"><span class="b v" style="font-weight:400">Something else</span><i class="ck off"></i></button></div><button class="cta">Done</button></div>`},
{t:"4 · Logged",sub:"What happened, what's next, and a way back.",h:under+`<div class="sheet"><div class="grab"></div><div style="position:relative;padding:8px 8px 0"><div style="position:absolute;right:8px;top:0;width:88px;height:88px;border-radius:50%;border:2.500px solid #8a4a3c;color:#8a4a3c;display:grid;place-content:center;text-align:center;transform:rotate(-12deg);background:#fffdf9;animation:stampin .35s cubic-bezier(.3,1.500,.5,1) both"><i style="position:absolute;inset:4px;border:1px solid #8a4a3c;border-radius:50%"></i><span class="T" style="font-size:18px;line-height:20px;display:block">Sent</span><span class="T" style="font-size:14px;line-height:16px">11 Nov</span></div><img src="${COURIER}" alt="" style="width:136px;display:block;margin:0 0 8px -12px"><div class="d" style="margin-bottom:8px">Query 15 is out.</div><p class="b" style="margin:0 0 24px;color:var(--body)">Imogen Vale, Vale &amp; Winter Literary. Reply expected by 6 Jan, and a nudge reminder is set for the day after.</p></div><button class="cta">Done</button><button class="link">Log another</button></div>`}
];
const SECS=[["queries","Queries","Find a query fast and see whose move it is. Borrowed: Slack's message list, Uber's progress.",QUERIES],["query","One query","The whole story with one agent, and the one thing to do next. Borrowed: WhatsApp's thread, a delivery tracker's estimate.",QUERY],["agents","Agents","Decide who to query next. Borrowed: Airbnb's featured card and shelves, your phone's contact sheet.",AGENTS],["you","You","How the campaign is going, shown so it rewards a look. Borrowed: Strava's profile, PayUp's figures row.",YOU],["log","Logging a query","Record a sent query in two taps. Borrowed: TickTick's quick add, Duolingo's finish screen.",LOG]];SECS.splice(1,0,["birds","Birds-eye view","How close every query is to its date, in one look. It answers a different question from the list, so it gets the same billing: a switch at the top of Queries and a preview on Today.",BIRDS]);
document.getElementById("nav").innerHTML=SECS.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join("")+`<button class="tog" id="tog"><i></i>Larger text</button>`;
document.getElementById("out").innerHTML=SECS.map(s=>`<section id="${s[0]}"><h2>${s[1]}</h2><p>${s[2]}</p><div class="rowx">${s[3].map(o=>`<div class="opt"><h2>${o.t}</h2><p class="from" style="min-height:44px">${o.sub}</p><div class="ph"><div class="sc" style="${o.tb?"":"padding-bottom:0"}">${o.h}</div>${o.tb?tbar(o.tb):""}</div></div>`).join("")}</div></section>`).join("");
document.getElementById("tog").addEventListener("click",e=>{const on=e.currentTarget.classList.toggle("on");document.querySelectorAll(".ph").forEach(p=>p.style.setProperty("--k",on?1.25:1))});
</script>
</body>
