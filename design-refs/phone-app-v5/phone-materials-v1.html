<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QueryHawk phone – Materials</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--page:#f8f6f2;--navy:#2a3a52;--navyd:#1f2c40;--blush:#e8c8bc;--pink:#f5e6df;--sand:#f7efe3;--slate:#d7e0e8;--rust:#8a4a3c;--ink:#1f2633;--body:#4a4f5a;--muted:#676b74;--on:#c9d2df;--rule:#e6e0d6;--fill:#ece7de;--type:'Special Elite','Courier New',monospace}
*{box-sizing:border-box;margin:0}body{background:#e9e6e0;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.intro{padding:32px 32px 0;max-width:900px}.intro h1{font:400 28px/1.2 var(--type);margin-bottom:8px}.intro p{color:var(--body)}
.rowx{display:flex;gap:40px;overflow-x:auto;padding:24px 32px 40px;align-items:flex-start}
.opt{flex:none;width:375px}.opt h2{font:400 20px/1.3 var(--type);margin-bottom:4px}.opt>p{font-size:14px;color:var(--body);min-height:84px;margin-bottom:12px}
.ph{position:relative;width:375px;height:780px;background:var(--page);border-radius:40px;box-shadow:0 0 0 10px #141a24,0 24px 48px rgba(20,26,36,.25);overflow:hidden;display:flex;flex-direction:column}
.sc{flex:1;overflow-y:auto;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.T{font-family:var(--type)}.s{font-size:14px;line-height:20px;color:var(--muted)}.h{font-size:20px;line-height:1.3;font-weight:600}.b{font-size:16px}
.hd{background:var(--navy);color:#fff;padding:52px 24px 24px;position:relative}
.hd h3{font:400 32px/1.1 var(--type)}.hd .s{color:var(--on)}
.bar{flex:none;background:var(--navy);color:#fff;padding:44px 8px 8px;display:flex;align-items:center;gap:4px}.bar b{flex:1;font:400 22px/1.2 var(--type)}
.ib{width:48px;height:48px;display:grid;place-items:center;font-size:22px;flex:none}
.stabs{position:sticky;top:0;z-index:3;display:flex;background:var(--page);border-bottom:1px solid var(--rule);padding:0 4px}
.stabs span{flex:1;height:52px;display:grid;place-items:center;font-weight:600;color:var(--muted);position:relative;font-size:15px}
.stabs .on{color:var(--navy)}.stabs .on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--navy)}
.card{background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(31,38,51,.06),0 8px 24px rgba(31,38,51,.08)}
.cta{display:block;width:100%;height:56px;border-radius:28px;background:var(--navy);color:#fff;font-weight:600;font-size:17px;text-align:center}
.link{display:block;width:100%;min-height:48px;font-weight:600;color:var(--navy);text-align:center}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;background:var(--fill);font-size:14px;white-space:nowrap}
.tag.use{background:var(--navy);color:#fff;font-weight:600}.tag.b2{background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule)}
.paper{background:#fffdf8;border-radius:4px;box-shadow:0 1px 2px rgba(31,38,51,.08),0 6px 14px rgba(31,38,51,.12);padding:10px 10px 0;overflow:hidden;position:relative}
.paper em{display:block;font:italic 11px/1.3 Georgia,serif;color:var(--body);margin-bottom:6px}.paper u{display:block;height:3px;border-radius:2px;background:var(--fill);margin-bottom:5px}
.bundle{position:relative;height:150px;width:170px;flex:none;margin-right:16px}.bundle .paper{position:absolute;width:96px;height:128px}
.bundle .p1{left:0;top:14px;transform:rotate(-8deg)}.bundle .p2{left:38px;top:6px;transform:rotate(1deg)}.bundle .p3{left:74px;top:16px;transform:rotate(9deg);border-top:8px solid var(--rust)}
.band{position:absolute;left:-6px;right:-10px;top:74px;height:22px;background:var(--blush);transform:rotate(-2deg);box-shadow:0 2px 4px rgba(0,0,0,.15);display:grid;place-items:center;font:400 14px/1 var(--type);color:var(--ink)}
.mini .bundle{transform:scale(.6);transform-origin:left top;height:90px;width:104px;margin-right:0}
.stat{position:absolute;right:16px;top:-14px;background:var(--navy);color:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 6px 16px rgba(31,38,51,.25);text-align:right}.stat b{display:block;font:400 22px/1.1 var(--type)}.stat span{font-size:14px;color:var(--on)}
.kv{display:flex;align-items:center;gap:12px;width:100%;min-height:60px}.kv+.kv{border-top:1px solid var(--rule)}.kv .x{flex:1;min-width:0}.chev{color:var(--muted);font-size:20px}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:400 18px/1 var(--type)}
.shelf{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 16px;margin:0 -16px}
.sheet{flex:none;width:156px}.sheet .paper{height:150px;padding:14px 14px 0}
.tree{position:relative;padding-left:28px}.tree::before{content:"";position:absolute;left:11px;top:24px;bottom:60px;width:2px;background:var(--rule)}
.node{position:relative;margin-bottom:12px}.node::before{content:"";position:absolute;left:-24px;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--navy)}.node.use::before{background:var(--navy)}
.chg{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--body)}.chg::before{content:"+";font-family:var(--type);color:var(--navy)}
.book{flex:none;width:52px;height:74px;border-radius:3px 6px 6px 3px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(31,38,51,.18);display:grid;place-items:center;font:400 18px/1 var(--type);color:#fff}
.tb{flex:none;height:64px;background:#fff;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-around;font-size:12px;color:var(--muted);padding-bottom:6px}.tb .on{color:var(--navy);font-weight:700}.tb .p{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:24px}
.act{flex:none;background:#fff;border-top:1px solid var(--rule);padding:12px 16px 16px}
.slot{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--rule);width:100%;min-height:72px;margin-bottom:8px}.slot.on{box-shadow:inset 0 0 0 2px var(--navy)}
.lt{font:15px/1.6 Georgia,serif;color:var(--ink)}.lt p{margin-bottom:12px}
</style></head><body>
<div class="intro"><h1>Materials on the phone</h1><p>One tab for everything that goes out with a query. Same pattern as Today: a header that says what matters, then four tabs that pin as you scroll. Sample data throughout.</p></div>
<div class="rowx" id="out"></div>
<script>
const tb=`<div class="tb"><span>Today</span><span>To do</span><span class="p">+</span><span class="on">Materials</span><span>Profile</span></div>`;
const paper=(t,cls)=>`<div class="paper ${cls||""}"><em>${t}</em><u style="width:90%"></u><u></u><u style="width:70%"></u><u style="width:84%"></u><u></u><u style="width:55%"></u></div>`;
const bundle=(name)=>`<div class="bundle">${paper("Dear agent,","p1")}${paper("Synopsis","p2")}${paper("Chapter one","p3")}<div class="band">${name}</div></div>`;
const tabs=on=>`<div class="stabs">${["Packages","Letters","Versions","Comps"].map(t=>`<span class="${t===on?"on":""}">${t}</span>`).join("")}</div>`;
const hd=`<div class="hd"><div style="display:flex"><div style="flex:1"><h3>Materials</h3><div class="s" style="margin-top:4px">What goes out with The Salt Road</div></div><button class="ib" style="margin:-6px -12px 0 0" aria-label="Search">⌕</button></div>
<div style="display:flex;gap:8px;align-items:center;margin-top:20px">${bundle("Autumn round")}<div style="flex:1;min-width:0"><div class="s">Going out with new queries</div><div class="T" style="font-size:40px;line-height:1.1;white-space:nowrap">3 <span style="font-size:18px">from 7</span></div><div class="s" style="color:#fff">asked for more</div></div></div></div>`;
const pk=(n,pieces,stat,sub,use)=>`<button class="card" style="display:block;width:100%;padding:44px 16px 16px;margin-top:24px;position:relative"><div class="stat"><b>${stat}</b><span>${sub}</span></div><div style="display:flex;gap:4px;align-items:center" class="mini">${bundle("")}<div style="flex:1;min-width:0"><div class="h">${n}</div>${use?`<span class="tag use" style="margin-top:6px">Going out now</span>`:`<span class="s">Not in use</span>`}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${pieces.map(p=>`<span class="tag">${p}</span>`).join("")}</div></button>`;
const P1=`<div class="ph"><div class="sc">${hd}${tabs("Packages")}<div style="padding:0 16px 24px">${pk("Autumn round",["Hook-first letter","One-page synopsis","Version 3"],"3 from 7","asked for more",1)}${pk("Summer round",["Comp-led letter","One-page synopsis","Version 2"],"1 from 5","asked for more")}${pk("First batch",["Short and plain letter","Original"],"0 from 2","asked for more")}<button class="link" style="margin-top:16px;min-height:56px">New package</button></div></div>${tb}</div>`;
const P2=`<div class="ph"><div class="bar"><button class="ib">‹</button><b>Autumn round</b><button class="ib">⋯</button></div><div class="sc" style="padding:16px"><div class="card" style="padding:20px"><div class="s">How it's doing</div><div style="display:flex;margin-top:8px">${[["7","queries sent"],["3","asked for more"],["43%","request rate"]].map((x,i)=>`<div style="flex:1;${i?"border-left:1px solid var(--rule);padding-left:12px":""}"><div class="T" style="font-size:28px;line-height:1.1">${x[0]}</div><div class="s">${x[1]}</div></div>`).join("")}</div><div class="s" style="margin-top:12px">Best of your three packages so far.</div></div>
<div class="h" style="margin:24px 8px 8px">What an agent receives</div><div class="card" style="padding:0 16px">${[["L","Query letter","Hook-first · mentions 2 comps","var(--pink)"],["S","Synopsis","One page","var(--sand)"],["M","Manuscript","Version 3 · Tighter middle","var(--slate)"]].map(x=>`<button class="kv"><span class="ico" style="background:${x[3]}">${x[0]}</span><span class="x"><span class="s" style="display:block">${x[1]}</span><span class="b" style="font-weight:600">${x[2]}</span></span><span class="chev">›</span></button>`).join("")}</div>
<p class="s" style="margin:8px 8px 0">The opening sample is set per agent when you log a query.</p>
<div class="h" style="margin:24px 8px 8px">Sent to</div><div class="card" style="padding:0 16px">${[["Rachel Lin","Partial requested"],["Imogen Farr","Queried"],["Priya Nair","Queried"]].map(x=>`<button class="kv"><span class="x"><span class="b" style="font-weight:600;display:block">${x[0]}</span><span class="s">${x[1]}</span></span><span class="chev">›</span></button>`).join("")}<button class="link" style="border-top:1px solid var(--rule)">See all 7</button></div></div><div class="act"><button class="cta">Going out with new queries ✓</button><button class="link">Change what's in it</button></div></div>`;
const sheet=(n,first,l1,l2,use)=>`<button class="sheet"><div class="paper"><em style="font-size:12px">${first}</em><u style="width:92%"></u><u></u><u style="width:76%"></u><u style="width:88%"></u><u></u><u style="width:60%"></u><u style="width:80%"></u></div><div class="b" style="font-weight:600;margin-top:10px">${n}</div><div class="s">${l1}</div><div class="s">${l2}</div>${use?`<span class="tag use" style="margin-top:6px">In Autumn round</span>`:""}</button>`;
const P3=`<div class="ph"><div class="sc">${hd}${tabs("Letters")}<div style="padding:16px 16px 24px"><div style="display:flex;align-items:baseline;margin:8px 8px 8px"><div class="h" style="flex:1">Query letters</div><span class="s">3</span></div><div class="shelf">${sheet("Hook-first","Dear agent, On the night the salt road floods…","3 from 7 asked for more","Mentions 2 comps",1)}${sheet("Comp-led","Dear agent, For readers of The Glass Tide…","1 from 5 asked for more","Mentions 3 comps")}${sheet("Short and plain","Dear agent, I'm seeking representation…","0 from 2","No comps")}</div>
<div style="display:flex;align-items:baseline;margin:8px 8px 8px"><div class="h" style="flex:1">Synopses</div><span class="s">2</span></div><div class="shelf">${sheet("One page","Mara Venn inherits a salt works and a debt…","In 2 packages","",0)}${sheet("Two page","Part one. Mara Venn returns to Harrow Sands…","Not in a package","")}</div>
<button class="link" style="min-height:56px">Add a letter or synopsis</button></div></div>${tb}</div>`;
const P4=`<div class="ph"><div class="bar"><button class="ib">‹</button><b>Hook-first</b><button class="ib">⋯</button></div><div class="sc" style="padding:16px"><div class="paper" style="padding:24px 20px 8px;border-radius:6px"><div class="lt"><p>Dear agent,</p><p>On the night the salt road floods, Mara Venn finds her father's ledger in the brine shed, and learns the works she has just inherited was never his to leave.</p><p>THE SALT ROAD is an upmarket historical novel, complete at 92,000 words. It will appeal to readers of The Glass Tide and Salt and Ash.</p><p style="color:var(--muted)">…</p></div></div>
<div class="h" style="margin:24px 8px 8px">Comps in this letter</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 8px"><span class="tag b2" style="height:36px">The Glass Tide</span><span class="tag b2" style="height:36px">Salt and Ash</span><button class="tag" style="height:36px;font-weight:600;color:var(--navy)">+ Add</button></div>
<div class="h" style="margin:24px 8px 8px">How it's doing</div><div class="card" style="padding:16px 20px"><div class="b"><b class="T" style="font-size:22px">3 from 7</b> asked for more</div><div class="s">Sent in Autumn round · last used 8 Nov</div></div></div><div class="act"><button class="cta">Edit the wording</button><button class="link">Save as a new letter</button></div></div>`;
const node=(n,sub,chg,stat,use)=>`<div class="node${use?" use":""}"><button class="card" style="display:block;width:100%;padding:16px 16px 14px;border-radius:20px"><div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><div class="b" style="font-weight:600">${n}</div><div class="s">${sub}</div></div>${use?`<span class="tag use">In use</span>`:""}</div>${chg.length?`<div style="margin-top:10px">${chg.map(c=>`<div class="chg">${c}</div>`).join("")}</div>`:""}<div class="s" style="margin-top:10px;color:var(--ink)"><b class="T" style="font-size:18px">${stat}</b> asked for more</div></button></div>`;
const P5=`<div class="ph"><div class="sc">${hd}${tabs("Versions")}<div style="padding:16px 16px 24px"><div class="s" style="margin:4px 8px 16px">3 versions of your manuscript saved. New queries go out with the one in use.</div><div class="tree">${node("Version 3 · Tighter middle","Saved 2 Oct · 89,400 words",["Cut the harbour subplot","Moved the fire to chapter 14"],"3 from 7",1)}${node("Version 2 · New opening","Saved 14 Jul · 93,100 words",["Added a prologue","Cut chapter 3"],"1 from 5")}${node("Original","Where you started · 92,000 words",[],"0 from 2")}</div><button class="link" style="min-height:56px">Save a new version</button></div></div>${tb}</div>`;
const comp=(t,a,y,c,n)=>`<button class="kv" style="min-height:96px"><span class="book" style="background:${c}">${t.split(" ").map(w=>w[0]).join("").slice(0,2)}</span><span class="x"><span class="b" style="font-weight:600;display:block">${t}</span><span class="s" style="display:block">${a} · ${y}</span><span class="s">${n}</span></span><span class="chev">›</span></button>`;
const P6=`<div class="ph"><div class="sc">${hd}${tabs("Comps")}<div style="padding:16px 16px 24px"><div class="s" style="margin:4px 8px 8px">Your comparable titles. Pick from these when you write a letter.</div><div class="card" style="padding:0 16px">${comp("The Glass Tide","M. Ellory","2023","#2a3a52","In 2 letters")}${comp("Salt and Ash","R. Okonjo","2022","#8a4a3c","In 1 letter")}${comp("A Quiet Harbour","L. Marsh","2024","#56677f","In 1 letter")}${comp("The Tidewright","S. Aubrey","2021","#a88a6a","Not in a letter yet")}</div><button class="link" style="min-height:56px;margin-top:8px">Add a comp</button></div></div>${tb}</div>`;
const O=[["Materials · Packages","The header leads with the package going out now, drawn as a banded bundle, and its result. Packages is the first tab: each is a bundle with its pieces and a result badge, because the package is the thing that's tracked.",P1],["A package","How it's doing, then what an agent receives: its letter, synopsis and manuscript version. Tap a piece to swap it. One button sets which package goes out with new queries.",P2],["Letters","Letters and synopses as sheets of paper you can read the first line of, each with its result and how many comps it mentions.",P3],["A letter","The full wording to read, the comps it mentions as chips (picked from your Comps list), and its result. Editing is plain text, as on desktop.",P4],["Versions","Your manuscript's versions as a tree growing from the Original, each with what changed and its result. A founding and Pro feature, as on desktop.",P5],["Comps","The list letters pick from: each comp with how many letters mention it.",P6]];
document.getElementById("out").innerHTML=O.map(o=>`<div class="opt"><h2>${o[0]}</h2><p>${o[1]}</p>${o[2]}</div>`).join("");
</script></body></html>
