<style>

/* the phone's own system: 8pt grid, 24px margins, three text sizes plus one display size */
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.be.play .be-tr{animation:bedraw 1.600s cubic-bezier(.65,0,.35,1) both}

.dk{position:relative;margin-top:16px;padding-bottom:16px;touch-action:pan-y}
.dk .dkc{position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.dlab{position:absolute;top:20px;z-index:3;height:32px;padding:0 12px;border-radius:16px;font-weight:700;font-size:15px;display:flex;align-items:center;pointer-events:none}
.dlab.l{right:16px;background:var(--fill);color:var(--ink);opacity:var(--l,0)}.dlab.r{left:16px;background:var(--navy);color:#fff;opacity:var(--r,0)}
.dim2{position:absolute;inset:0;background:rgba(20,26,36,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}.dim2.on{opacity:1;pointer-events:auto}
.sh3{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--page);border-radius:24px 24px 0 0;padding:8px 16px 24px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}.sh3.on{transform:none}
.sh3 .grab{width:40px;height:4px;border-radius:2px;background:rgba(31,38,51,.22);margin:4px auto 16px}
.xbtn{width:48px;height:48px;display:grid;place-items:center;font-size:18px}
.kv2{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left}.kv2+.kv2{border-top:1px solid var(--rule)}.kv2 .k{flex:none;width:112px}.kv2 .v{flex:1;font-weight:600}.chev2{color:var(--muted);font-size:20px}
.stmp{position:absolute;right:18px;top:64px;z-index:4;width:96px;height:96px;border-radius:50%;border:2.500px solid #8a4a3c;color:#8a4a3c;display:grid;place-content:center;text-align:center;transform:rotate(-12deg);background:rgba(255,253,249,.92);animation:stampin .35s cubic-bezier(.3,1.500,.5,1) both;font-size:14px;line-height:16px;padding:8px}
@keyframes stampin{from{transform:rotate(-12deg) scale(1.6);opacity:0}}
.snk{position:absolute;left:16px;right:16px;bottom:84px;z-index:7;min-height:48px;border-radius:24px;background:var(--navyd,#1f2c40);color:#fff;display:flex;align-items:center;padding:0 8px 0 20px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}.snk.on{transform:none;opacity:1;pointer-events:auto}.snk span{flex:1;font-size:15px}
</style>

let lastY=0;sc1.addEventListener("scroll",()=>{const y=sc1.scrollTop;ph.querySelector(".mini").classList.toggle("on",y>300);ph.querySelector(".tb").classList.toggle("hide",y>lastY&&y>80);lastY=y},{passive:true});
document.getElementById("tog").addEventListener("click",e=>{const on=e.currentTarget.classList.toggle("on");document.querySelectorAll(".ph").forEach(p=>p.style.setProperty("--k",on?1.25:1))});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("play");io.unobserve(e.target)}}),{threshold:.15});document.querySelectorAll(".be").forEach(b=>io.observe(b));
