<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Header</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c130f;--ink70:rgba(28,19,15,.7);--ink45:rgba(28,19,15,.45);--hair:rgba(28,19,15,.1);--btn:#2a3a52;--frame:#7c3a2a;--page:#f5f1eb;--side:#ebe6de;--blush:#e9c9b8;
 --machine:'Special Elite',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace;--acc:#e9e8f0}
body[data-p=contacts]{--acc:#e3e9ee}body[data-p=manuscripts]{--acc:#f1e2d8}
*{box-sizing:border-box}
html,body{margin:0;background:#2b3547;color:var(--ink);font-family:var(--serif)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:var(--page);border-top:10px solid #2b3547}
/* sidebar */
.side{background:var(--side);padding:16px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:calc(100vh - 10px)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Source Serif 4';font-weight:600;font-size:21px;padding:4px 6px 12px}
.brand i{width:30px;height:30px;border-radius:50%;background:#5f7b93;display:block}
.ms{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(28,19,15,.06)}
.ms small{display:block;font-weight:400;color:var(--ink70);font-size:12px}
.side h6{margin:12px 8px 4px;font:400 9px var(--mono);letter-spacing:.16em;color:var(--ink45)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer}
.side a::before{content:"";width:14px;height:14px;border:1.4px solid var(--ink70);border-radius:3px}
.side a.on{background:var(--btn);color:#fff}.side a.on::before{border-color:#fff}
/* top bar */
.main{min-width:0}
.bar{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--hair)}
.disc{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);flex:none}
.crumb{font-size:16px;color:var(--ink70)}.crumb b{color:var(--ink);font-weight:600}
.bar .sp{flex:1}
.pill{height:40px;padding:0 16px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(28,19,15,.2);display:flex;align-items:center;font-family:var(--machine);font-size:14px;background:#fff}
.bartitle{display:none;font-family:var(--machine);font-size:28px;line-height:1}
/* content */
.wrap{max-width:1480px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:28px}
.pg{min-width:0}
.rail{position:sticky;top:16px;align-self:start;margin-top:24px;height:calc(100vh - 110px);border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.05),0 18px 40px -22px rgba(28,19,15,.28);padding:8px;display:flex;flex-direction:column;gap:10px}
.rtray{height:122px;border-radius:14px;background:var(--blush);padding:24px 20px;font-family:var(--machine);font-size:28px}
.rtray small{display:block;font:700 8.5px var(--mono);letter-spacing:.1em;margin-top:12px;color:rgba(28,19,15,.62)}
.rrow{height:40px;margin:0 6px;border-radius:10px;background:#f7f3ee}
/* the header, shared parts */
.hd{position:relative}
.eyebrow{display:none;font:400 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink45);margin-bottom:10px}
.eyebrow b{color:var(--ink70);font-weight:400}
h1{margin:0;font-family:var(--machine);font-weight:400;line-height:1;font-size:56px;white-space:nowrap}
.intro{margin:14px 0 0;font-size:18px;line-height:1.45;color:var(--ink70);max-width:460px}
.intro code{font-family:var(--machine);color:var(--ink);font-size:17px}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.b1{height:48px;padding:0 22px;border-radius:24px;background:var(--btn);color:#fff;display:flex;align-items:center;font-family:var(--machine);font-size:16px}
.b2{height:48px;padding:0 22px;border-radius:24px;background:#fff;display:flex;align-items:center;font-family:var(--machine);font-size:16px;box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 6px var(--frame)}
.art{position:absolute;pointer-events:none}
.art img{display:block;width:100%;height:auto}
.slot{border:1.5px dashed rgba(28,19,15,.3);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font:400 9px var(--mono);letter-spacing:.12em;color:var(--ink45);text-transform:uppercase;padding:10px;background:rgba(255,255,255,.35)}
/* body content under the header */
.body{margin-top:28px;display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{height:118px;border-radius:16px;background:#fff;padding:6px;box-shadow:0 2px 8px rgba(28,19,15,.06)}
.tile i{display:block;height:100%;border-radius:11px;box-shadow:inset 0 0 0 1px var(--frame);background:linear-gradient(#f5e6df 0 30px,#fff 30px)}
.tile:nth-child(2) i{background:linear-gradient(#f7efe3 0 30px,#fff 30px)}.tile:nth-child(3) i{background:linear-gradient(#e4e1db 0 30px,#fff 30px)}
.sent{font-family:var(--machine);font-size:26px;margin:12px 0 2px}
.row{height:78px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.05),0 10px 24px -18px rgba(28,19,15,.22)}

/* layout: the header sits over the page column; the rail runs beside both */
.wrap{grid-template-rows:auto 1fr}
.hd{grid-column:1;grid-row:1;align-self:start}
.pg{grid-column:1;grid-row:2}
.rail{grid-column:2;grid-row:1/3}
.art img{width:100%;height:100%;object-fit:contain;object-position:right bottom}
.tt,.hd .acts{position:relative;z-index:1}
.hd .acts{width:fit-content}

/* ===== the header card, no breadcrumb ===== */
.crumb{display:none!important}
.wrap{grid-template-rows:auto 1fr}
.hd{grid-column:1/-1;grid-row:1;position:relative;border-radius:24px;background:var(--acc);padding:34px 36px 32px;min-height:232px}
.pg{grid-column:1;grid-row:2}
.rail{grid-column:2;grid-row:2;margin-top:24px}
.eyebrow{display:block}
.tt,.hd .acts{position:relative;z-index:1;max-width:50%}
.hd .acts{width:fit-content}
.art{right:44px;bottom:0;width:42%;height:276px}
.art img{width:100%;height:100%;object-fit:contain;object-position:right bottom}
.htools{display:none;position:absolute;top:18px;right:18px;z-index:3;gap:10px;align-items:center}
.htools .disc{background:rgba(255,255,255,.75)}
.htools .pill{background:rgba(255,255,255,.75);box-shadow:none}
.sidetoggle{display:none;margin-left:auto;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--hair)}

/* 1 · slim bar: the bar keeps the sidebar toggle and the tools, nothing else; the card below carries the page */
body[data-cv="1"] .bar{height:56px;border-bottom:0}
body[data-cv="1"] .hd{margin-top:8px}

/* 2 · no bar: the tools sit in the card's top-right corner, the sidebar toggle moves beside the wordmark */
body[data-cv="2"] .bar{display:none}
body[data-cv="2"] .htools{display:flex}
body[data-cv="2"] .sidetoggle{display:block}
body[data-cv="2"] .hd{margin-top:22px;min-height:246px}
body[data-cv="2"] .art{height:calc(100% - 72px)}
body[data-cv="2"] .rail{top:16px}

/* working pages: the same card, compact — title, intro and actions in one row, no art */
body[data-p=todo] .hd{min-height:0;padding:26px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;column-gap:24px}
body[data-p=todo] h1{font-size:44px}
body[data-p=todo] .intro{margin-top:8px;font-size:16px}
body[data-p=todo] .tt{max-width:none}
body[data-p=todo] .hd .acts{grid-column:2;grid-row:1;margin:0;max-width:none;flex-wrap:nowrap}
body[data-p=todo] .art{display:none}
body[data-cv="2"][data-p=todo] .hd{padding-top:30px;align-items:end}
body[data-cv="2"][data-p=todo] .hd .acts{align-self:end}
body[data-cv="2"][data-p=todo] .tt{padding-top:26px}


/* ===== v4: a sticky bar with no breadcrumb; the content centred with wider gutters ===== */
:root{--cw:1360px;--gut:clamp(28px,3.2vw,52px)}
.bar{position:sticky;top:0;z-index:20;height:60px!important;padding:0;background:var(--page);border-bottom:1px solid transparent;transition:border-color .15s,box-shadow .15s}
body.scrolled .bar{border-bottom-color:var(--hair);box-shadow:0 8px 16px -14px rgba(28,19,15,.35)}
.barin{flex:1;width:100%;max-width:var(--cw);margin:0 auto;height:100%;padding:0 var(--gut);display:flex;align-items:center;gap:12px}
.barin .sp{flex:1}
.wrap{max-width:var(--cw)!important;padding:0 var(--gut) 48px!important}
.hd{margin-top:10px!important}
.rail{top:76px!important;height:calc(100vh - 96px)!important}
/* framed sheet: the page sits on a softly edged panel inset from the shell */
body[data-g=sheet] .main{padding:0 18px 18px}
body[data-g=sheet] .bar{background:transparent}
body[data-g=sheet] .sheet{background:#faf7f2;border:1px solid rgba(28,19,15,.08);border-radius:22px;box-shadow:0 1px 2px rgba(28,19,15,.04)}
body[data-g=sheet] .wrap{padding-top:22px!important}
body[data-g=sheet] .hd{margin-top:0!important}
body[data-g=sheet] .bar{position:sticky}
body[data-g=sheet].scrolled .bar{background:var(--page)}


/* ===== v5 ===== */
/* the bar keeps to the column: no full-width band; the row itself becomes the surface when scrolled */
.bar{background:transparent!important;border-bottom:0!important;box-shadow:none!important;pointer-events:none}
.barin{pointer-events:auto;border-radius:0 0 18px 18px;transition:background .15s,box-shadow .15s}
body.scrolled .barin{background:rgba(245,241,235,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--hair),0 10px 20px -16px rgba(28,19,15,.4)}
body[data-g=sheet].scrolled .bar{background:transparent!important}
/* the bar's row sits inside the same margins as the content */
.bar{display:flex!important;justify-content:center}
.barin{flex:0 1 auto!important;margin:0!important;max-width:calc(var(--cw) - 2 * var(--gut));padding:0 !important;width:calc(100% - 2 * var(--gut))}
body.scrolled .barin{padding:0 12px!important;width:calc(100% - 2 * var(--gut) + 24px);max-width:calc(var(--cw) - 2 * var(--gut) + 24px)}

/* header styles */
body[data-hs=white] .hd{background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.05),0 18px 40px -26px rgba(28,19,15,.3)}
body[data-hs=outline] .hd{background:transparent;box-shadow:inset 0 0 0 1px rgba(28,19,15,.14)}
body[data-hs=framed] .hd{background:#fff;padding:40px 42px 38px;box-shadow:0 2px 8px rgba(28,19,15,.06),inset 0 0 0 6px #fff,inset 0 0 0 7px var(--frame)}
body[data-hs=framed] .art{bottom:7px;right:50px;height:calc(100% - 20px)}
body[data-hs=open] .hd{background:transparent;border-radius:0;padding:26px 0 26px;border-bottom:1.5px solid rgba(28,19,15,.16)}
body[data-hs=open] .art{right:0}
body[data-p=todo][data-hs=open] .hd{padding:20px 0 22px}


/* ===== v6: the bar as on dev — full width, hairline beneath, sticky — without the breadcrumb ===== */
.bar{display:flex!important;justify-content:flex-start;background:var(--page)!important;border-bottom:1px solid var(--hair)!important;pointer-events:auto;height:64px!important}
.barin{flex:1 1 auto!important;width:auto!important;max-width:none!important;margin:0!important;padding:0 24px!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.scrolled .bar{box-shadow:0 8px 16px -14px rgba(28,19,15,.35)!important}
.hd{margin-top:18px!important}
.rail{top:80px!important;height:calc(100vh - 100px)!important}

/* review pill */
.rv{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px 6px 5px 14px;border-radius:22px;background:#fff;box-shadow:0 10px 30px -10px rgba(28,19,15,.45),0 0 0 1px var(--hair);font:400 12px var(--machine);z-index:50;white-space:nowrap}
.rv button{border:0;background:none;font:inherit;padding:7px 11px;border-radius:16px;cursor:pointer;color:var(--ink)}
.rv button[aria-pressed=true]{background:var(--ink);color:#fff}
.rv i{width:1px;height:18px;background:var(--hair);margin:0 6px}
@media (max-width:1360px){h1{font-size:50px}}
.hd{grid-column:1/-1!important}
</style></head>

function render(){const b=document.body,p=P[b.dataset.p];
 document.getElementById('crumb').innerHTML='QueryHawk / '+p.sec+' / <b>'+p.t+'</b>';document.getElementById('bartitle').textContent=p.t;
 document.getElementById('eye').innerHTML=p.sec+' / <b>'+p.t+'</b>';document.getElementById('h1').textContent=p.t;document.getElementById('intro').innerHTML=p.intro;
 document.getElementById('acts').innerHTML='<span class="b1">'+p.acts[0]+'</span><span class="b2">'+p.acts[1]+'</span>';
 const a=document.getElementById('art');a.className='art'+(p.art?'':' slotart');a.innerHTML=p.art?'<img alt="" src="'+p.art+'">':'<div class="slot" style="width:100%;height:100%">Art slot<br>the Archivist tying<br>a manuscript bundle</div>';
 document.getElementById('rail').innerHTML='<div class="rtray">'+p.rail[0]+'<small>'+p.rail[1]+'</small></div>'+'<div class="rrow"></div>'.repeat(9);
 document.getElementById('body').innerHTML=p.body==='qc'?'<div class="tiles"><div class="tile"><i></i></div><div class="tile"><i></i></div><div class="tile"><i></i></div></div><div class="sent">All 26 queries, latest activity first</div>'+'<div class="row"></div>'.repeat(5):p.body==='rows'?'<div class="sent">'+(b.dataset.p==='todo'?'19 tasks, most pressing first':'42 agents, most recent first')+'</div>'+'<div class="row"></div>'.repeat(7):'<div class="row" style="height:160px"></div><div class="sent">Materials and packages</div><div class="row" style="height:220px"></div>';
 document.querySelectorAll('.side a[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===b.dataset.p));
 document.querySelectorAll('.rv button').forEach(x=>{const k=x.dataset.hs?'hs':x.dataset.g?'g':'p';x.setAttribute('aria-pressed',b.dataset[k]===x.dataset[k])})}
document.querySelectorAll('.rv button,.side a[data-p]').forEach(x=>x.addEventListener('click',()=>{if(x.dataset.hs)document.body.dataset.hs=x.dataset.hs;if(x.dataset.g)document.body.dataset.g=x.dataset.g;if(x.dataset.p)document.body.dataset.p=x.dataset.p;render()}));
render();
