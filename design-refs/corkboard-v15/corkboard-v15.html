const dueChips=k=>`<div class="chips" id="dues">${DUE.map(d=>`<button class="chip two ${d[0]===k?'on':''}" data-due="${d[0]}">${d[1]}<small>by ${dayLabel(d[2])}</small></button>`).join('')}</div>`;

function openNote(id,colour){
 const n=id?notes.find(x=>x.id===id):null;
 const preTag=!n&&(S.view==='piles'?S.pile:S.tag)||'';
 const d=n?{t:n.t,c:n.c,tag:n.tag||'',link:n.link||null,pinned:!!n.pinned}:{t:'',c:colour||'butter',tag:preTag,link:(!n&&S.about)?L(S.about):null,pinned:false};
 let finding=false;
 showDlg(`<div class="dh"><h3>${n?'Your note':'New note'}</h3><button class="x" data-x aria-label="Close">×</button></div>
  <div class="db"><div class="dpaper" id="dp" style="--c:${hex(d.c)}"><textarea id="dt" placeholder="Write it down…" aria-label="Note">${esc(d.t)}</textarea></div>
   <div class="drow"><span class="l">Colour</span><div class="sws" id="dsw">${PAPERS.map(p=>`<button data-c="${p[0]}" style="--c:${p[2]}" aria-label="${p[1]}" class="${p[0]===d.c?'on':''}"></button>`).join('')}</div></div>
   <div class="drow"><span class="l">Stack</span><div class="chips" id="dtags"></div></div>
   <div class="drow"><span class="l">About</span><div id="dlk"></div></div>
   <div class="drow"><span class="l">Pin</span><button class="sw ${d.pinned?'on':''}" id="dpin" role="switch" aria-checked="${d.pinned}"><i></i>Keep it at the top of the board</button></div></div>
  <div class="df">${n?`<button class="btn t" id="drm">Remove note</button>${n.due?'':`<button class="btn t" id="dtask">Turn into a task</button>`}`:''}<span class="sp"></span><span class="k">⌘ Enter saves</span><button class="btn s" data-x>Cancel</button><button class="btn p" id="dsave">Save note</button></div>`,n?'Your note':'New note');
 const ta=$('dt'),save=$('dsave');const en=()=>save.disabled=!ta.value.trim();en();ta.oninput=en;
 $('dsw').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;d.c=b.dataset.c;$('dp').style.setProperty('--c',hex(d.c));$('dsw').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
 const tg=()=>{$('dtags').innerHTML=tagsAll().map(t=>`<button class="chip ${d.tag===t?'on':''}" data-t="${esc(t)}">#${esc(t)}</button>`).join('')+`<input class="tin" id="dnt" placeholder="New stack" aria-label="New stack name" value="${tagsAll().includes(d.tag)?'':esc(d.tag)}">`;
  $('dnt').oninput=e=>{d.tag=slug(e.target.value);$('dtags').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'))}};
 tg();$('dtags').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;d.tag=d.tag===b.dataset.t?'':b.dataset.t;tg()};
 const lk=()=>{const el=$('dlk');
  if(d.link&&!finding){el.innerHTML=`<div class="chips"><span class="lchip" style="box-shadow:inset 0 0 0 1px #d9d0c3"><i class="${d.link.kind==='manuscript'?'ms':''}">${ini(d.link.name)}</i><span>${esc(d.link.name)}</span>${who(d.link.name).g?G[who(d.link.name).g]:''}</span><button class="btn t" data-lk="find">Change</button><button class="btn t" data-lk="none">Remove link</button></div>`}
  else if(!finding){el.innerHTML=`<button class="chip" data-lk="find">Link to an agent or a query</button>`}
  else{el.innerHTML=`<div class="finder"><input class="tin big" id="dfi" placeholder="Find an agent, a query or your manuscript" aria-label="Find an agent or a query" style="height:40px;font-size:15px"><div class="res" id="dres"></div></div>`;
   const res=()=>{const q=$('dfi').value.trim().toLowerCase();$('dres').innerHTML=PEOPLE.filter(p=>!q||(p.n+' '+p.a).toLowerCase().includes(q)).slice(0,40).map(p=>`<button data-pick="${esc(p.n)}"><i class="${p.k==='manuscript'?'ms':''}">${ini(p.n)}</i><span>${esc(p.n)}</span><small>${p.k==='manuscript'?'Manuscript':esc(p.a)+' · '+(p.k==='query'?esc(p.s):'Agent')}</small></button>`).join('')||'<button disabled>No one by that name</button>'};
   res();$('dfi').oninput=res;$('dfi').focus()}};
 lk();$('dlk').onclick=e=>{const b=e.target.closest('[data-lk],[data-pick]');if(!b)return;
  if(b.dataset.pick){d.link=L(b.dataset.pick);finding=false}else if(b.dataset.lk==='find')finding=true;else{d.link=null;finding=false}lk()};
 $('dpin').onclick=()=>{d.pinned=!d.pinned;$('dpin').classList.toggle('on',d.pinned);$('dpin').setAttribute('aria-checked',d.pinned)};
 dlgSave=()=>{const t=ta.value.trim();if(!t)return;const s=snap();
  if(n){Object.assign(n,{t,c:d.c,tag:d.tag||undefined,link:d.link||undefined,pinned:d.pinned});fresh=null}
  else{const x={id:'n'+(uid++),t,c:d.c,tag:d.tag||undefined,link:d.link||undefined,pinned:d.pinned,at:TODAY.getTime()};notes.unshift(x);S.order.unshift(x.id);fresh=x.id;
   if(!match(x)){S.tag=null;S.special=null;S.about=null;S.q='';if(S.view==='piles')S.pile=x.tag||''}}
  S.started=S.started.filter(k=>k!==d.tag);closeDlg();render();snack(n?'Note saved':'Note added to your board',s);
  if(fresh){const el=B.querySelector(`.note[data-id="${fresh}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}};
 save.onclick=dlgSave;
 if(n){$('drm').onclick=()=>{closeDlg();change(()=>{notes=notes.filter(x=>x!==n)},'Note removed')};const tk=$('dtask');if(tk)tk.onclick=()=>{closeDlg();openTurn(n.id)}}
}
function openTask(){let k='this';
 showDlg(`<div class="dh"><h3>Add a task</h3><button class="x" data-x aria-label="Close">×</button></div><p class="dsub">It goes on your to-do list, and stays on your board as a note.</p>
  <div class="db"><input class="tin big" id="tt" placeholder="What needs doing?" aria-label="Task"><div class="drow"><span class="l">Do it</span>${dueChips(k)}</div></div>
  <div class="df"><span class="sp"></span><button class="btn s" data-x>Cancel</button><button class="btn p" id="dsave" disabled>Add to my to-do list</button></div>`,'Add a task');
 const tt=$('tt'),save=$('dsave');tt.oninput=()=>save.disabled=!tt.value.trim();
 $('dues').onclick=e=>{const b=e.target.closest('[data-due]');if(!b)return;k=b.dataset.due;$('dues').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
 dlgSave=()=>{const t=tt.value.trim();if(!t)return;const s=snap(),due=DUE.find(d=>d[0]===k)[2];const x={id:'n'+(uid++),t,c:'butter',due,at:TODAY.getTime()};notes.unshift(x);S.order.unshift(x.id);fresh=x.id;
  if(!match(x)){S.tag=null;S.special=null;S.about=null;S.q='';if(S.view==='piles')S.pile=''}closeDlg();render();snack(`On your to-do list for ${dayLabel(due)}`,s)};
 save.onclick=dlgSave}
function openTurn(id){const n=notes.find(x=>x.id===id);let k='this';
 showDlg(`<div class="dh"><h3>Turn into a task</h3><button class="x" data-x aria-label="Close">×</button></div><p class="dsub">The note stays on your board. It also goes on your to-do list.</p>
  <div class="db"><div class="dpaper mini" style="--c:${hex(n.c)}">${esc(n.t)}</div><div class="drow"><span class="l">Do it</span>${dueChips(k)}</div></div>
  <div class="df"><span class="sp"></span><button class="btn s" data-x>Cancel</button><button class="btn p" id="dsave">Put it on my to-do list</button></div>`,'Turn into a task');
 $('dues').onclick=e=>{const b=e.target.closest('[data-due]');if(!b)return;k=b.dataset.due;$('dues').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
 dlgSave=()=>{const due=DUE.find(d=>d[0]===k)[2];closeDlg();change(()=>{n.due=due},`On your to-do list for ${dayLabel(due)}`)};
 $('dsave').onclick=dlgSave;$('dsave').focus({preventScroll:true})}
function openPile(noteId){const have=tagsAll(),sug=SUGGEST.filter(s=>!have.includes(s)).slice(0,6);
 showDlg(`<div class="dh"><h3>Start a stack</h3><button class="x" data-x aria-label="Close">×</button></div><p class="dsub">A stack is a tag. Notes with the same tag sit together.</p>
  <div class="db"><input class="tin big" id="pn" placeholder="Name it" aria-label="Stack name">${sug.length?`<div class="drow"><span class="l">Or pick</span><div class="chips" id="psg">${sug.map(s=>`<button class="chip" data-s="${s}">#${s}</button>`).join('')}</div></div>`:''}</div>
  <div class="df"><span class="sp"></span><button class="btn s" data-x>Cancel</button><button class="btn p" id="dsave" disabled>${noteId?'Start stack and move note':'Start stack'}</button></div>`,'Start a stack');
 const pn=$('pn'),save=$('dsave');pn.oninput=()=>save.disabled=!slug(pn.value);
 if($('psg'))$('psg').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;pn.value=b.dataset.s;save.disabled=false;pn.focus()};
 dlgSave=()=>{const k=slug(pn.value);if(!k)return;const s=snap();if(noteId)notes.find(x=>x.id===noteId).tag=k;else if(!tagsAll().includes(k))S.started.push(k);
  closeDlg();render();snack(noteId?`Moved to #${k}`:`#${k} is ready. Drag notes onto it.`,s)};
 save.onclick=dlgSave}
dlg.addEventListener('click',e=>{if(e.target.closest('[data-x]'))closeDlg()});

/* ───────── clicks ───────── */
function setPile(n,k,msg){change(()=>{n.tag=k||undefined;S.started=S.started.filter(x=>x!==k)},msg||(k?`Moved to #${k}`:'Moved to Loose notes'))}
function shownIds(){return sorted(notes).map(n=>n.id)}
function act(a,el,e){
 const ne=el.closest('.note'),n=ne&&notes.find(x=>x.id===ne.dataset.id);
 if(a==='new')return openNote(null,el.dataset.c);
 if(a==='addtask')return openTask();
 if(a==='startpile')return openPile();
 if(a==='allpiles'){S.pile=null;S.special=null;S.about=null;S.q='';return body()}
 if(a==='clear'){S.tag=null;S.special=null;S.about=null;S.q='';return render()}
 if(!n)return;
 if(a==='edit')return openNote(n.id);
 if(a==='link')return snack(n.link.kind==='manuscript'?'This opens the manuscript':`This opens ${n.link.name}’s ${n.link.kind==='query'?'query card':'agent card'}`);
 if(a==='pin')return change(()=>{n.pinned=!n.pinned},n.pinned?'Unpinned':'Pinned to top');
 if(a==='task')return n.due?change(()=>{delete n.due},'Taken off your to-do list'):openTurn(n.id);
 if(a==='colour'){const p=pop(el,`<h6>Paper</h6><div class="sws">${PAPERS.map(x=>`<button data-c="${x[0]}" style="--c:${x[2]}" aria-label="${x[1]}" class="${x[0]===n.c?'on':''}"></button>`).join('')}</div>`);
  p.onclick=ev=>{const b=ev.target.closest('[data-c]');if(!b)return;closePop();change(()=>{n.c=b.dataset.c},'Colour changed')};return}
 if(a==='more'){const tags=tagsAll().filter(t=>t!==n.tag);
  const p=pop(el,`<button data-m="edit">${I.edit}Edit</button>${n.pinned?'':`<button data-m="front">${I.up}Move to front</button><button data-m="back">${I.down}Move to back</button>`}<hr><h6>Move to stack</h6>${tags.map(t=>`<button data-m="pile" data-k="${esc(t)}">#${esc(t)}</button>`).join('')}${n.tag?`<button data-m="pile" data-k="">Loose notes</button>`:''}<button data-m="newpile">New stack…</button><hr><button data-m="remove">${I.bin}Remove</button>`);
  p.onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;closePop();
   if(m==='edit')openNote(n.id);else if(m==='newpile')openPile(n.id);else if(m==='pile')setPile(n,b.dataset.k);
   else if(m==='remove')change(()=>{notes=notes.filter(x=>x!==n)},'Note removed');
   else change(()=>{const ids=shownIds().filter(x=>x!==n.id);S.order=m==='front'?[n.id,...ids]:[...ids,n.id];S.sort='mine'},m==='front'?'Moved to the front. Order is now My order.':'Moved to the back. Order is now My order.')};return}
}
document.addEventListener('click',e=>{
 const t=e.target;
 const st=t.closest('.pal [data-st]');if(st){document.querySelectorAll('.pal [data-st]').forEach(b=>b.classList.toggle('on',b===st));notes=st.dataset.st==='full'?FULL():st.dataset.st==='few'?FEW():[];kept=new Set();fresh=null;
  S={state:st.dataset.st,view:'board',sort:'new',tag:null,special:null,about:null,q:'',pile:null,order:[],started:[]};render();scrollTo(0,0);return}
 if(dlg.contains(t)||(popEl&&popEl.contains(t)))return;
 const a=t.closest('[data-act]');if(a){e.preventDefault();return act(a.dataset.act,a,e)}
 const kp=t.closest('[data-keep]');if(kp){const i=+kp.dataset.keep,ex=EXAMPLES[i];const s=snap();notes.unshift({id:'n'+(uid++),t:ex.t,c:ex.c,at:TODAY.getTime()});fresh=notes[0].id;render();snack('Kept. It’s your note now.',s);return}
 const v=t.closest('[data-view]');if(v){S.view=v.dataset.view;S.pile=null;S.tag=null;remember();body();return}
 const so=t.closest('[data-sort]');if(so){S.sort=so.dataset.sort;body();return}
 const dd=t.closest('#sortdd>button');if(dd){dd.parentNode.classList.toggle('open');return}
 const cl=t.closest('[data-clear]');if(cl){S[cl.dataset.clear]=null;render();return}
 const tg=t.closest('.pill[data-tag]');if(tg){S.tag=tg.dataset.tag||null;pills();wall();return}
 const op=t.closest('[data-open]');if(op){S.view='piles';S.pile=op.dataset.open;body();return}
 const ab=t.closest('[data-about]');if(ab){S.about=S.about===ab.dataset.about?null:ab.dataset.about;S.tag=null;render();if(S.about)toTools();return}
 const ne=t.closest('.note[data-id]');if(ne&&!t.closest('button'))openNote(ne.dataset.id);
});
document.addEventListener('keydown',e=>{
 if(dlg.classList.contains('on')){if(e.key==='Escape'){e.preventDefault();closeDlg()}else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&dlgSave){e.preventDefault();dlgSave()}
  else if(e.key==='Enter'&&e.target.matches('#tt,#pn')&&dlgSave){e.preventDefault();dlgSave()}
  else if(e.key==='Tab'){const f=[...dlg.querySelectorAll('button:not([disabled]),input,textarea')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}return}
 if(e.key==='Escape'){if(popEl)return closePop();if(e.target.id==='find'&&S.q){S.q='';e.target.value='';pills();wall()}return}
 if(e.target.matches('input,textarea'))return;
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='n'||e.key==='N'){e.preventDefault();openNote()}
 else if(e.key==='/'){const f=$('find');if(f){e.preventDefault();f.focus()}}
 else if(e.key==='Enter'&&e.target.matches('.note[data-id]')){e.preventDefault();openNote(e.target.dataset.id)}
});

/* ───────── drag: reorder on the wall, or drop onto a tag or a stack ───────── */
let dragId=null;
const clearMarks=()=>document.querySelectorAll('.dt,.drop').forEach(x=>x.classList.remove('dt','drop'));
document.addEventListener('dragstart',e=>{const ne=e.target.closest&&e.target.closest('.note[data-id]');if(!ne)return;dragId=ne.dataset.id;closePop();e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}
 setTimeout(()=>{ne.classList.add('drag');document.body.classList.add('dragging')},0)});
document.addEventListener('dragover',e=>{if(!dragId)return;const d=notes.find(x=>x.id===dragId);clearMarks();
 const dr=e.target.closest('[data-drop]');if(dr){if((d.tag||'')!==dr.dataset.drop){e.preventDefault();dr.classList.add('drop')}return}
 const ne=e.target.closest('.note[data-id]');if(!ne||ne.dataset.id===dragId)return;const t=notes.find(x=>x.id===ne.dataset.id);
 if(!!t.pinned!==!!d.pinned)return;e.preventDefault();ne.classList.add('dt')});
document.addEventListener('drop',e=>{if(!dragId)return;const d=notes.find(x=>x.id===dragId);
 const dr=e.target.closest('[data-drop]');
 if(dr&&(d.tag||'')!==dr.dataset.drop){e.preventDefault();const k=dr.dataset.drop;dragId=null;document.body.classList.remove('dragging');return setPile(d,k)}
 const ne=e.target.closest('.note[data-id]');if(!ne||ne.dataset.id===d.id)return;const t=notes.find(x=>x.id===ne.dataset.id);if(!!t.pinned!==!!d.pinned)return;e.preventDefault();
 const was=S.sort,id=d.id;dragId=null;document.body.classList.remove('dragging');
 change(()=>{const ids=shownIds().filter(x=>x!==id);ids.splice(ids.indexOf(t.id),0,id);S.order=ids;S.sort='mine'},was==='mine'?'Order saved':'Order saved. Now showing My order.')});
document.addEventListener('dragend',()=>{dragId=null;document.body.classList.remove('dragging');clearMarks();document.querySelectorAll('.note.drag').forEach(x=>x.classList.remove('drag'))});

let rz,lastCols=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!$('wall')&&notes.length)return;const c=colCount();if(c!==lastCols){lastCols=c;notes.length?wall():body()}},120)});
render();lastCols=colCount();
</script>
</body></html>
