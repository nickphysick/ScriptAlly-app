<title>Phone Fixes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one row of phones per decision, each option a scaled phone you can pick */
:root{--bg:#f2eee8;--card:#fff;--ink:#1c130f;--muted:#655c55;--navy:#2a3a52;--blush:#e8c8bc;--wash:#f5e6df;--rule:#e2dbd2;--display:"Special Elite","Courier New",monospace;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b26;--card:#1f2836;--ink:#f1ece6;--muted:#b7aea6;--navy:#9fb3d1;--blush:#5a4440;--wash:#2e3646;--rule:#2f3a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b26;--card:#1f2836;--ink:#f1ece6;--muted:#b7aea6;--navy:#9fb3d1;--blush:#5a4440;--wash:#2e3646;--rule:#2f3a4b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 120px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0 0 8px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px}
.dec{margin:0 0 34px}
.dec h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px}
.dec>p{color:var(--muted);margin:0 0 14px;max-width:70ch}
.strip{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 12px}
.oc{flex:none;width:300px;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:18px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:10px;align-content:start}
.oc[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.oc:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ph{width:276px;height:552px;border-radius:26px;overflow:hidden;background:#1b2433;position:relative}
.ph iframe{border:0;width:390px;height:780px;transform:scale(.7077);transform-origin:0 0;}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fixk{background:var(--wash)!important}
.oc.fixed{cursor:default}
.l{display:flex;gap:10px;align-items:center}.l .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--rule)}
.oc[aria-pressed="true"] .k{background:#2a3a52;color:#fff}
.l b{font-weight:600}.d{font-size:14.5px;color:var(--muted)}
.rec{display:inline-block;background:var(--blush);color:var(--ink);border-radius:999px;padding:0 9px;font-size:12.5px;font-weight:600;justify-self:start}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2a3a52;color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:16px;align-items:center;justify-content:space-between;z-index:5}
.bar p{margin:0;font-size:14.5px;min-width:0}.bar button{flex:none;font:inherit;font-weight:700;background:#e8c8bc;color:#1c130f;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
textarea{width:100%;min-height:80px;border:1px solid var(--rule);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
</style>
<div class="wrap">
<h1>Phone fixes</h1>
<p class="lede">Your five headline problems, in the real prototype. The phones work: scroll them, type in search, tap rows. Pick by clicking the label under a phone. "Today" shows the bug where it can be drawn.</p>
<div id="decs"></div>
<div class="dec"><h2>Anything else?</h2><textarea id="notes" placeholder="Notes go into what you copy"></textarea></div>
</div>
<div class="bar"><p id="sum"></p><button type="button" id="copy">Copy my picks</button></div>
<script>const DEC=[["bar", "The tab bar and the fade", "Your build has a white fade floating above the bar with a gap under it. Best in class (iOS's own apps, Apple Music, Instagram) lets the page scroll clearly behind a floating bar. Every option also adds room at the bottom of each page so the last card scrolls clear of the bar. Scroll the phones.", [["T", "Today", "The fade floats above the bar with a gap.", "tab=queries&opt=b0&scroll=560"], ["A", "Frosted bar, no fade", "The bar is see-through with a blur, so cards pass softly behind it. Nothing else.", "tab=queries&opt=b1&scroll=560"], ["B", "Frosted bar and an edge fade", "As A, plus a fade that starts at the very bottom of the screen and runs up behind the bar, so they read as one. It goes when the bar tucks away.", "tab=queries&opt=b2&scroll=560", 1], ["C", "Solid bar", "A white bar with a firm shadow. Cards scroll behind it but don't show through.", "tab=queries&opt=b3&scroll=560"]]], ["scroll", "Every page scrolls", "Not a choice, just the fix: one scroller per page, so To-do, Agents, Queries and the menu pages all scroll by touch to their last item.", [["F", "To-do", "Scroll to the end: the last task clears the bar.", "tab=todo&opt=b2&scroll=0", 0, 1], ["F", "Agents", "The same on Agents.", "tab=agents&opt=b2&scroll=0", 0, 1]]], ["search", "Search", "The search button does nothing today. Type in any of these: try a name such as Hugo or Priya.", [["A", "Full screen", "As designed: the whole screen, keyboard up, suggestions and \"Jump to\" while it's empty, results grouped as you type.", "tab=home&ov=search&opt=s1", 1], ["B", "A tall sheet", "The same search in a sheet over the page, which you can pull down to close.", "tab=home&ov=search&opt=s2"], ["C", "In the navy band", "The field sits in the navy band at the top, results on the page below it.", "tab=home&ov=search&opt=s3"]]], ["birds", "Birds-eye view", "Today it opens a plain list of queries. These are all progress views; tap a row to open the query.", [["A", "Progress bars, as designed", "Each query as a card with a bar towards its next step: where it's been, and what's next.", "tab=queries&ov=birds&opt=e1", 1], ["B", "Stages along a track", "Queried, Partial, Full and Offer marked on every track, so you can see where each one has reached.", "tab=queries&ov=birds&opt=e2"], ["C", "Compact rows", "A thinner bar beside each name, so more queries fit on the screen.", "tab=queries&ov=birds&opt=e3"]]], ["log", "Log a query", "It will always open at the top with the card in full view. Which way should \"New query\" be larger?", [["A", "Bigger in the card's strip", "The strip across the top of the card gets taller, with \"New query\" in the display face.", "tab=queries&ov=log&opt=l1"], ["B", "A heading above the card", "\"New query\" in large type on the navy, with the card beneath it.", "tab=queries&ov=log&opt=l2"], ["C", "A heading inside the card", "\"New query\" in large type at the top of the white card, \"Day 0\" beside it.", "tab=queries&ov=log&opt=l3", 1]]]];
let P={};DEC.forEach(d=>{if(d[3][0][5])return;const r=d[3].find(o=>o[4]);P[d[0]]=r?r[0]:'A'});
try{Object.assign(P,JSON.parse(localStorage.getItem('qh-fix-picks')||'{}'))}catch(e){}
function render(){
 document.getElementById('decs').innerHTML=DEC.map((d,i)=>`<section class="dec"><h2>${i+1}. ${d[1]}</h2><p>${d[2]}</p><div class="strip">${d[3].map(o=>`<div class="oc ${o[5]?'fixed':''}" ${o[5]||o[0]==='T'?'':'role="button" tabindex="0"'} data-d="${d[0]}" data-v="${o[0]}" aria-pressed="${P[d[0]]===o[0]}"><div class="ph"><iframe src="app.html#${o[3]}" title="${o[1]}" loading="lazy"></iframe></div><div class="l">${o[5]?'':`<span class="k">${o[0]}</span>`}<b>${o[1]}</b></div>${o[4]?'<span class="rec">Recommended</span>':''}<div class="d">${o[2]}</div></div>`).join('')}</div></section>`).join('');
 summ();}
function summ(){document.getElementById('sum').textContent='Picks: '+DEC.map((d,i)=>{if(!(d[0] in P))return null;const o=d[3].find(x=>x[0]===P[d[0]]);return `${i+1}${o[0]} ${o[1]}`}).filter(Boolean).join(' · ');try{localStorage.setItem('qh-fix-picks',JSON.stringify(P))}catch(e){}}
document.getElementById('decs').addEventListener('click',e=>{const c=e.target.closest('.oc[role="button"]');if(!c)return;P[c.dataset.d]=c.dataset.v;document.querySelectorAll(`.oc[data-d="${c.dataset.d}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===P[c.dataset.d]));summ();});
document.getElementById('decs').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('oc')){e.preventDefault();e.target.click();}});
document.getElementById('copy').addEventListener('click',()=>{const n=document.getElementById('notes').value.trim();const t=document.getElementById('sum').textContent+(n?'\nNotes: '+n:'');const b=document.getElementById('copy');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy my picks',1600)}).catch(()=>{const ta=document.getElementById('notes');ta.value=t;ta.focus();ta.select();b.textContent='Copy from the box';});});
render();</script>
