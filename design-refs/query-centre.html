<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptAlly — Query Centre, full page</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f2ede7;--parchment:#fdfaf5;--ink:#1c130f;--heading-ink:#2e3a2c;--body-ink:#3a1c14;--muted:#8a7a6c;--label:#9c8878;
    --burgundy:#7c3a2a;--frame:rgba(124,58,42,0.28);--sage-a:#dce0d9;--sage-b:#d0d6cc;--sage-accent:#8a9e88;--sage-text:#5a6e58;--sage-sub:#6a7e68;
    --pink:#f5e2da;--pink-border:#e8c8bc;--pink-hover:#efd5ca;--field-border:#e0d5c8;--hairline:#ece0d2;--grey:#cfc6bb;
    --stage-out-1:#e6eae3;--stage-out-2:#d7ddd3;--stage-out-3:#c7d0c2;--stage-in-1:#f8e9e2;--stage-in-2:#f1dbd0;--stage-in-3:#e8c9bb;
    --stage-offer:#d7e0e8;--stage-closed:#e4e1db;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--ground);font-family:'Inter',sans-serif;color:var(--body-ink);font-size:13px;overflow-x:hidden}
  .mono{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
  .page{max-width:1600px;margin:0 auto;padding:28px 36px 80px}
  button{font-family:inherit}

  /* ---------- hero (existing; illustration slot kept) ---------- */
  .hero{background:var(--parchment);border-radius:16px;padding:30px 36px;display:flex;align-items:center;gap:30px;
    box-shadow:0 1px 2px rgba(58,28,20,.04),0 8px 22px rgba(58,28,20,.07);margin-bottom:22px;overflow:hidden;position:relative}
  .hero .eyebrow{display:inline-block;border:1px solid rgba(58,28,20,.35);border-radius:99px;padding:5px 12px;margin-bottom:16px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:500;font-size:44px;color:var(--ink);line-height:1}
  .hero .strap{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:#6a5a50;margin-top:12px}
  .hero .art{margin-left:auto;width:520px;height:150px;border-radius:12px;background:repeating-linear-gradient(135deg,#f7f1e9 0 8px,#f2ebe1 8px 16px);
    display:flex;align-items:center;justify-content:center;color:#c0b0a0;flex:none}
  .hero .desk{position:absolute;right:36px;bottom:16px;color:var(--label)}

  /* ---------- quick filters ---------- */
  .quick{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;max-width:1480px;margin-left:auto;margin-right:auto}
  .qf{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--field-border);border-radius:99px;padding:7px 13px 7px 10px;cursor:pointer;color:#6a5a50;transition:background .15s,border-color .15s}
  .qf:hover{border-color:#cdbfae}
  .qf .sw{width:10px;height:10px;border-radius:50%;border:.5px solid rgba(0,0,0,.08)}
  .qf .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--label)}
  .qf.on{background:var(--parchment);border-color:var(--ink);color:var(--ink)}
  .qf.on .n{color:var(--ink)}
  .qf .mk{width:14px;height:14px;border-radius:50%;border:1.3px solid var(--ink);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
  .quick .sep{width:.5px;height:20px;background:#d8ccbc;margin:0 4px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;max-width:1480px;margin-left:auto;margin-right:auto}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--field-border);border-radius:9px;padding:9px 13px;flex:0 0 260px}
  .search input{border:none;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--body-ink);width:100%}
  .search input::placeholder{color:#c8b8a8}
  .search .kbd{font-family:'JetBrains Mono',monospace;font-size:9px;color:#b8a898;border:.5px solid #e0d5c8;border-radius:4px;padding:1px 5px}
  .search:focus-within{border-color:var(--sage-accent);box-shadow:0 0 0 3px rgba(138,158,136,.12)}
  .tbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--field-border);border-radius:9px;padding:9px 14px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#6a5a50;position:relative}
  .tbtn:hover{border-color:#cdbfae}
  .tbtn .chev{transition:transform .15s}
  .tbtn.open .chev{transform:rotate(180deg)}
  .tbtn .cnt{font-size:9px;background:var(--pink);border:1px solid var(--pink-border);color:var(--body-ink);border-radius:99px;padding:1px 7px}
  .tbtn .val{color:var(--ink)}
  .spacer{flex:1}
  .primary{display:inline-flex;align-items:center;gap:8px;background:var(--pink);border:1px solid var(--pink-border);border-radius:10px;padding:11px 20px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--body-ink)}
  .primary:hover{background:var(--pink-hover)}
  .pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--parchment);border:1px solid var(--field-border);border-radius:10px;min-width:220px;
    box-shadow:0 4px 10px rgba(58,28,20,.07),0 14px 34px rgba(58,28,20,.12);padding:8px;animation:fade .15s ease;text-align:left;cursor:default;text-transform:none;letter-spacing:0}
  .pop.wide{min-width:300px}
  .tbtn.edge .pop{left:auto;right:0}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .pop .grp{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--label);padding:8px 9px 4px}
  .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--body-ink)}
  .opt:hover{background:#fff}
  .opt.on{background:var(--pink)}
  .opt .box{width:14px;height:14px;border:1px solid var(--field-border);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .opt .box svg,.opt .tick{opacity:0}
  .opt.on .box svg,.opt.on .tick{opacity:1}
  .opt .tick{margin-left:auto}
  .opt .hint{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--label)}
  .pop .clr{margin:6px 4px 2px;padding:7px;text-align:center;border-top:.5px solid var(--hairline);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .pop .clr:hover{color:var(--body-ink)}
  .pop .two{display:grid;grid-template-columns:1fr 1fr;gap:0 6px}

  /* active filter chips */
  .active{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;min-height:0;max-width:1480px;margin-left:auto;margin-right:auto}
  .chipf{display:inline-flex;align-items:center;gap:6px;background:var(--parchment);border:1px solid var(--field-border);border-radius:99px;padding:4px 6px 4px 10px;font-size:11.5px;color:var(--body-ink)}
  .chipf .k{color:var(--label);font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
  .chipf .x{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#a08a78}
  .chipf .x:hover{background:var(--pink);color:var(--body-ink)}
  .active .clear{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:4px 6px;background:none;border:none}
  .active .clear:hover{color:var(--body-ink)}

  /* ---------- grid + groups ---------- */
  .stage{position:relative;max-width:1480px;margin:0 auto}
  .ghead{display:flex;align-items:baseline;gap:10px;margin:8px 0 12px;padding-top:6px}
  .ghead:not(:first-child){margin-top:26px}
  .ghead h3{font-family:'Playfair Display',serif;font-weight:500;font-size:19px;color:var(--ink)}
  .ghead .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--label)}
  .ghead .line{flex:1;height:.5px;background:#d8ccbc;margin-left:8px;align-self:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .card{background:#fff;border-radius:14px;cursor:pointer;position:relative;
    box-shadow:0 1px 2px rgba(58,28,20,.05),0 8px 22px rgba(58,28,20,.09);transition:box-shadow .18s;will-change:transform}
  .card:hover{box-shadow:0 2px 4px rgba(58,28,20,.06),0 14px 32px rgba(58,28,20,.13)}
  .card:focus-visible{outline:2px solid var(--sage-accent);outline-offset:2px}
  .card.sel{box-shadow:0 0 0 1.5px var(--pink-border),0 2px 4px rgba(58,28,20,.06),0 14px 32px rgba(58,28,20,.13)}
  .card.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1) both}
  @keyframes enter{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
  .band{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:.5px solid rgba(0,0,0,.06);border-radius:14px 14px 0 0}
  /* trial: white → tint, left to right */
  body.fade .band.sand{background:linear-gradient(90deg,#fdfaf5 0%,var(--t-sand-a) 45%,var(--t-sand-b) 100%)}
  body.fade .band.you{background:linear-gradient(90deg,#fdfaf5 0%,var(--t-you-a) 45%,var(--t-you-b) 100%)}
  body.fade .band.agent{background:linear-gradient(90deg,#fdfaf5 0%,var(--t-agent-a) 45%,var(--t-agent-b) 100%)}
  body.fade .band.offer{background:linear-gradient(90deg,#fdfaf5 0%,var(--t-offer-a) 45%,var(--t-offer-b) 100%)}
  body.fade .band.closed{background:linear-gradient(90deg,#fdfaf5 0%,var(--t-closed-a) 45%,var(--t-closed-b) 100%)}
  /* chip variants */
  body.chip-lift .chip{background:var(--parchment);box-shadow:0 1px 2px rgba(58,28,20,.08),0 3px 8px rgba(58,28,20,.10);border:.5px solid #ece2d6}
  body.chip-band .card .band.sand ~ .body .chip{background:linear-gradient(135deg,var(--t-sand-a),var(--t-sand-b))}
  body.chip-band .card .band.you ~ .body .chip{background:linear-gradient(135deg,var(--t-you-a),var(--t-you-b))}
  body.chip-band .card .band.agent ~ .body .chip{background:linear-gradient(135deg,var(--t-agent-a),var(--t-agent-b))}
  body.chip-band .card .band.offer ~ .body .chip{background:linear-gradient(135deg,var(--t-offer-a),var(--t-offer-b))}
  body.chip-band .card .band.closed ~ .body .chip{background:linear-gradient(135deg,var(--t-closed-a),var(--t-closed-b))}
  body.chip-band .chip,body.chip-lift .chip{color:var(--ink)}
  .card{--band-a:var(--stage-out-1);--band-b:var(--stage-out-1)}
  .card.s-out-2{--band-a:var(--stage-out-2);--band-b:var(--stage-out-2)}.card.s-out-3{--band-a:var(--stage-out-3);--band-b:var(--stage-out-3)}
  .card.s-in-1{--band-a:var(--stage-in-1);--band-b:var(--stage-in-1)}.card.s-in-2{--band-a:var(--stage-in-2);--band-b:var(--stage-in-2)}.card.s-in-3{--band-a:var(--stage-in-3);--band-b:var(--stage-in-3)}
  .card.offer{--band-a:var(--stage-offer);--band-b:var(--stage-offer)}.card.closed{--band-a:var(--stage-closed);--band-b:var(--stage-closed)}
  .band{background:var(--band-a)}
  .leaf{width:46px;border-radius:7px;background:#fff;border:.5px solid #dccfc0;box-shadow:0 1px 2px rgba(58,28,20,.06),0 3px 8px rgba(58,28,20,.08);overflow:hidden;text-align:center;flex:none;position:relative;margin-left:auto}
  .leaf .mo{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:4px 0 3px;background:var(--band-a);border-bottom:.5px solid rgba(0,0,0,.08)}
  .leaf .dy{font-family:'Playfair Display',serif;font-size:19px;color:var(--ink);line-height:1;padding:6px 0 5px}
  .leaf .cap{font-family:'JetBrains Mono',monospace;font-size:6.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label);padding-bottom:5px}
  .leaf::before,.leaf::after{content:'';position:absolute;top:-2px;width:3px;height:6px;border-radius:2px;background:#cdbfae}
  .leaf::before{left:12px}.leaf::after{right:12px}
  .band .word{font-family:'Playfair Display',serif;font-size:15px;color:var(--ink)}
  .band .r{margin-left:auto;color:#6a5a50}
  .body{padding:20px 20px 18px}
  .who{display:flex;align-items:center;gap:15px}
  .who>div:nth-child(2){flex:1}
  .chip{width:48px;height:48px;border-radius:50%;background:var(--parchment);box-shadow:0 1px 2px rgba(58,28,20,.08),0 3px 8px rgba(58,28,20,.10);border:.5px solid #e6dccf;color:var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em}
  .nm{font-family:'Playfair Display',serif;font-weight:500;font-size:20px;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ag{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:#6a5a50;margin-top:4px}
  .fact{margin-top:18px;padding-top:15px;border-top:.5px solid var(--hairline);display:flex;align-items:flex-end;gap:14px}
  .fact .txt{flex:1;min-width:0}
  .fact .s{font-size:12px;line-height:1.5;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
  .fact .s>span{overflow:hidden;text-overflow:ellipsis}
  .fact .s b{font-weight:500}
  .fact .m{color:var(--label);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mk1{display:inline-flex;align-items:center;justify-content:center;flex:none;width:16px;height:16px;border-radius:50%;border:1.4px solid var(--ink);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink);line-height:1}
  .dot{flex:none}
  .mats{position:relative;display:inline-flex;align-items:center;gap:4px;flex:none}
  .mats .ic{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#6a5a50;border:.5px solid #e6dccf;background:#fff}
  .mats .ic.off{opacity:.28}
  .mats:hover .tip{opacity:1;transform:translateY(0);pointer-events:auto}
  .tip{position:absolute;right:0;bottom:calc(100% + 8px);width:230px;background:var(--parchment);border:1px solid var(--field-border);border-radius:10px;
    box-shadow:0 4px 10px rgba(58,28,20,.07),0 14px 34px rgba(58,28,20,.12);padding:10px 12px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none;z-index:10;text-align:left;cursor:default}
  .tip::after{content:'';position:absolute;right:10px;top:100%;border:6px solid transparent;border-top-color:var(--parchment)}
  .tip .th{color:var(--label);margin-bottom:6px}
  .tip .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--body-ink);padding:3px 0}
  .tip .row .v{color:#8a7a6c;text-align:right;white-space:nowrap}
  .tip .row.no{color:#c0b0a0}.tip .row.no .v{color:#d0c4b6}

  .none{text-align:center;padding:70px 0 60px;color:var(--muted);font-family:'Playfair Display',serif;font-style:italic;font-size:16px}
  .none button{display:block;margin:14px auto 0;background:#fff;border:1px solid var(--field-border);border-radius:9px;padding:8px 14px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a5a50}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:14px;border-top:.5px solid #d8ccbc;color:var(--label);max-width:1480px;margin-left:auto;margin-right:auto}
  .pfoot b{color:var(--ink);font-weight:500}
  .pfoot .lnk{cursor:pointer;color:#6a5a50}.pfoot .lnk:hover{color:var(--ink)}

  /* ---------- panel ---------- */
  .scrim{position:fixed;inset:0;background:rgba(58,28,20,.10);z-index:60;opacity:0;pointer-events:none;transition:opacity .26s}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:580px;max-width:94vw;z-index:70;transform:translateX(102%);transition:transform .28s cubic-bezier(.32,.72,.28,1);
    display:flex;flex-direction:column;background:var(--parchment);box-shadow:-6px 0 30px rgba(58,28,20,.14)}
  .panel.on{transform:translateX(0)}
  .panel .inner{overflow-y:auto;flex:1;padding-bottom:30px}
  .panel{position:fixed}
  .pbar{display:flex;align-items:center;gap:6px;padding:14px 16px;border-bottom:.5px solid var(--hairline);position:sticky;top:0;background:var(--parchment);z-index:5}
  .icb{width:32px;height:32px;border-radius:8px;border:1px solid var(--field-border);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#a08a78}
  .icb:hover{color:var(--body-ink);border-color:#cdbfae}
  .pbar .pos{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:var(--label);margin-left:4px}
  .pbar .act{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--field-border);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#6a5a50;white-space:nowrap}
  .pbar .act:hover{border-color:#cdbfae;color:var(--body-ink)}
  .pbar .act.pink{background:var(--pink);border-color:var(--pink-border);color:var(--body-ink)}
  .pband{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:.5px solid rgba(0,0,0,.06);border-radius:0}
  .pband .word{font-family:'Playfair Display',serif;font-size:20px;color:var(--ink)}
  .pband .r{margin-left:auto;color:#6a5a50}
  .phead{padding:22px 26px 20px;display:flex;align-items:center;gap:16px}
  .avatar{width:58px;height:58px;border-radius:50%;background:var(--pink);flex:none;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px}
  .phead .nm{font-size:27px;white-space:normal}
  .phead .ag{font-size:14px;margin-top:5px}
  .phead .snt{margin-left:auto;text-align:right;color:var(--label)}
  .sect{margin:0 20px 18px;background:var(--parchment);border-radius:14px;padding:6px;box-shadow:0 1px 2px rgba(58,28,20,.04),0 6px 18px rgba(58,28,20,.07)}
  .frame{border:1px solid var(--frame);border-radius:10px;overflow:hidden}
  .sband{background:linear-gradient(135deg,var(--sage-a),var(--sage-b));border-bottom:.5px solid #c4ccc0;padding:12px 16px;display:flex;align-items:center;gap:9px}
  .sband .ttl{font-family:'Playfair Display',serif;font-weight:500;font-size:15px;color:var(--heading-ink)}
  .sband .tag{margin-left:auto;color:var(--sage-text)}
  .sbody{padding:16px}
  .stats{display:flex;gap:12px}
  .stat{flex:1;display:flex;align-items:center;gap:11px;background:#fffdf9;border:.5px solid var(--hairline);border-radius:10px;padding:12px 14px}
  .stat .big{font-family:'Playfair Display',serif;font-size:24px;color:var(--ink);line-height:1}
  .stat .big span{font-size:13px;font-style:italic;margin-left:3px}
  .stat .cap{color:var(--label);margin-top:5px}
  .rail{margin-top:16px;position:relative;padding-left:26px}
  .rail::before{content:'';position:absolute;left:9px;top:10px;bottom:10px;width:1.5px;background:#e8dcd0}
  .rung{position:relative;margin-bottom:12px}.rung:last-child{margin-bottom:0}
  .rung .node{position:absolute;left:-26px;top:8px}
  .rcard{background:#fffdf9;border:.5px solid var(--hairline);border-radius:9px;padding:11px 13px}
  .rcard.pend{border-style:dashed;border-color:#ddd0c0;background:transparent}
  .rline{display:flex;align-items:baseline;gap:9px}
  .rline .ev{font-family:'Playfair Display',serif;font-size:15px;color:var(--ink)}
  .rline .via{font-size:11px;color:var(--muted)}
  .rline .when{margin-left:auto;color:var(--label)}
  .matrows .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--hairline);font-size:12.5px}
  .matrows .row:last-child{border-bottom:none}
  .matrows .row .v{color:var(--muted)}
  .matrows .row.no{color:#c0b0a0}
  .note{background:var(--pink);border:1px solid #f0d9cd;border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .note .nt{font-family:'Caveat',cursive;font-size:19px;color:var(--body-ink);line-height:1.25}

<script>
/* ---------- status dots (stand-ins; app imports StatusDot) ---------- */
const B="#7c3a2a",P="#f5e2da",SG="#8a9e88",SGD="#4c6249",SGC="#e2e7e0",G="#b8aa9a";
function dot(status,s=24){
  const c=s/2,r=s/2-2;
  const ring=(col,dash)=>`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="1.6" ${dash?'stroke-dasharray="2.6 2.8"':''}/>`;
  const half=col=>`<path d="M ${c} ${c-r} A ${r} ${r} 0 0 1 ${c} ${c+r}" fill="none" stroke="${col}" stroke-width="3.2"/>`;
  const out=`<path d="M ${c-4.5} ${c} h7.5 M ${c+0.8} ${c-2.8} l2.8 2.8 -2.8 2.8" stroke="${B}" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const inn=`<path d="M ${c+4.5} ${c} h-7.5 M ${c-0.8} ${c-2.8} l-2.8 2.8 2.8 2.8" stroke="${SGD}" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const f=col=>`<circle cx="${c}" cy="${c}" r="${r}" fill="${col}"/>`;
  const m={
    "Queried":f(P)+ring(B)+out,
    "Partial Requested":f(SGC)+ring("#c3ccbf")+half(SG)+inn,
    "Full Requested":f(SGC)+ring(SG)+inn,
    "Partial Sent":f(P)+ring("#e4cfc4")+half(B)+out,
    "Full Sent":f(P)+ring(B)+`<circle cx="${c}" cy="${c}" r="${r-2.6}" fill="none" stroke="${B}" stroke-width="1"/>`+out,
    "R&R":f(SGC)+ring(SG)+`<path d="M ${c-3.5} ${c+3.5} l1-3 5-5 2 2-5 5z" fill="${SGD}"/>`,
    "Offer":f(B)+`<path d="M ${c-4} ${c} l2.7 2.9 5-5.6" stroke="#fdfaf5" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
    "No Response":ring(G,true)+`<circle cx="${c-3.4}" cy="${c}" r="1.1" fill="${G}"/><circle cx="${c}" cy="${c}" r="1.1" fill="${G}"/><circle cx="${c+3.4}" cy="${c}" r="1.1" fill="${G}"/>`,
    "Closed":ring(G)+`<path d="M ${c-3.2} ${c-3.2} l6.4 6.4 M ${c+3.2} ${c-3.2} l-6.4 6.4" stroke="${G}" stroke-width="1.7" stroke-linecap="round"/>`,
  };
  return `<svg class="dot" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${m[status]||m["Queried"]}</svg>`;
}
const I={
  letter:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>`,
  synopsis:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg>`,

};
const ROWS=[["letter","Query letter"],["synopsis","Synopsis"],["pages","Opening sample"],["other","Other"]];

/* ---------- data ---------- */
const TODAY=new Date("2026-09-04T00:00:00");
const M=(l,s,p,o)=>({letter:l,synopsis:s,pages:p,other:o});
const STD=M("Sent","1 page","First 3 chapters · 7,400 words",null);
const DATA=[
 {id:"q01",name:"Harriet Vane-Coe",agency:"Stillwater Reps",status:"Queried",sent:"2026-08-12",last:"2026-08-12",via:"Email",win:6,mats:STD,note:{t:"Loved her MSWL note on rural crime.",w:"12 Aug · 21:11"}},

 {id:"q06",name:"Fenella Str",agency:"Brightwater Books",status:"No Response",sent:"2026-03-14",last:"2026-03-14",via:"Email",win:12,mats:STD},

];

/* ---------- derived (mirrors what recomputeQuery would supply) ---------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const D=s=>new Date(s+"T00:00:00");
const f1=s=>{const t=D(s);return `${t.getDate()} ${MON[t.getMonth()]}`;};
const f2=s=>{const t=D(s);return `${t.getDate()} ${MON[t.getMonth()]} ${t.getFullYear()}`;};
const days=(a,b)=>Math.round((D(b)-D(a))/86400000);
const span=n=>n<21?[n,n===1?"day":"days"]:n<70?[Math.round(n/7),"weeks"]:[Math.round(n/30.44),"months"];
const addDays=(s,n)=>{const t=D(s);t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);};
const iso=TODAY.toISOString().slice(0,10);
const YOU=["Partial Requested","Full Requested","R&R"], AGENT=["Partial Sent","Full Sent"];
function derive(q){
  const o={...q};
  o.turn = q.status==="Queried"?"sand":YOU.includes(q.status)?"you":AGENT.includes(q.status)?"agent":q.status==="Offer"?"offer":"closed";
  o.stage = {"Queried":"s-out-1","Partial Sent":"s-out-2","Full Sent":"s-out-3","Partial Requested":"s-in-1","Full Requested":"s-in-2","R&R":"s-in-3","Offer":"offer"}[q.status]||"closed";
  o.turnWord = o.turn==="sand"||o.turn==="agent"?"With the agent":o.turn==="you"?"With you":o.turn==="offer"?"Offer":q.status==="No Response"?"No response":"Closed";
  o.expect = (o.turn==="sand"||o.turn==="agent") ? (q.expectOverride||addDays(q.last,q.win*7)) : null;
  o.overdue = false;
  const [wn,wu]=span(days(q.last,iso));
  const lt=D(q.last); o.leaf=[MON[lt.getMonth()],lt.getDate(),""];
  if(o.turn==="sand"||o.turn==="agent"){
    const past=days(o.expect,iso);
    o.leaf[2]="sent";
    if(past>0){ o.overdue=true; o.s=`Reply was expected by ${f1(o.expect)} — <b>${past} days past</b>`; o.m=`${wn} ${wu} waiting · nudge available`; }
    else { o.s=`Reply expected by <b>${f1(o.expect)}</b>`; o.m=`${wn} ${wu} waiting`; }
  } else if(o.turn==="you"){
    const what=q.status==="Partial Requested"?"Partial":q.status==="Full Requested"?"Full":"Revisions";
    o.leaf[2]="requested"; o.s=`${what} — <b>not yet sent</b>`; o.m=`${days(q.last,iso)} days since request`;
    if(days(q.last,iso)>14) o.overdue=true;
  } else if(o.turn==="offer"){
    o.leaf[2]="received"; o.s=`<b>Awaiting your decision</b>`; o.m=`${days(q.last,iso)} days since offer`;
  } else if(q.status==="No Response"){
    o.leaf[2]="sent"; o.s=`<b>No reply</b> — window was ${q.win} weeks`; o.m=`${wn} ${wu} since sending`;
  } else {
    o.leaf[2]="closed"; o.s=q.closed.charAt(0).toUpperCase()+q.closed.slice(1); const [rn,ru]=span(days(q.sent,q.last)); o.m=`replied after ${rn} ${ru}`;
  }
  o.matCount=ROWS.filter(([k])=>q.mats[k]).length;
  return o;
}
const ALL=DATA.map(derive);
const ini=n=>n.split(/[\s-]+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

/* ---------- state ---------- */
const state={q:"",quick:"all",overdue:false,status:new Set(),agency:new Set(),via:new Set(),mats:new Set(),group:"none",sort:"activity",sel:null};
const SORTS=[["activity","Last activity"],["sent","Date sent"],["expect","Reply expected"],["name","Agent name"],["agency","Agency"]];
const GROUPS=[["none","None"],["turn","Whose court"],["status","Status"],["agency","Agency"],["month","Month sent"]];
const STATUSES=["Queried","Partial Requested","Partial Sent","Full Requested","Full Sent","R&R","Offer","No Response","Closed"];
const AGENCIES=[...new Set(DATA.map(d=>d.agency))].sort();
const QUICK=[["all","All",null],["you","With you","you"],["agent","With the agent","agent"],["offer","Offers","offer"],["closed","Closed","closed"]];

function inQuick(d,k){
  if(k==="all") return true;
  if(k==="agent") return d.turn==="sand"||d.turn==="agent";
  return d.turn===k;
}
function visible(){
  let rows=ALL.filter(d=>{
    if(!inQuick(d,state.quick)) return false;
    if(state.overdue&&!d.overdue) return false;
    if(state.q&&!(d.name+" "+d.agency).toLowerCase().includes(state.q)) return false;
    if(state.status.size&&!state.status.has(d.status)) return false;
    if(state.agency.size&&!state.agency.has(d.agency)) return false;
    if(state.via.size&&!state.via.has(d.via)) return false;
    if(state.mats.size&&![...state.mats].every(k=>d.mats[k])) return false;
    return true;
  });
  const by={
    activity:(a,b)=>b.last.localeCompare(a.last),
    sent:(a,b)=>b.sent.localeCompare(a.sent),
    expect:(a,b)=>(a.expect?0:1)-(b.expect?0:1)||(a.expect||"").localeCompare(b.expect||""),
    name:(a,b)=>a.name.localeCompare(b.name),
    agency:(a,b)=>a.agency.localeCompare(b.agency)||a.name.localeCompare(b.name),
  };
  return rows.sort(by[state.sort]);
}
function groupKey(d){
  if(state.group==="turn") return d.turnWord;
  if(state.group==="status") return d.status;
  if(state.group==="agency") return d.agency;
  if(state.group==="month"){const t=D(d.sent);return `${MON[t.getMonth()]} ${t.getFullYear()}`;}
  return null;
}
const GROUP_ORDER={turn:["With you","Offer","With the agent","No response","Closed"],status:STATUSES};

/* ---------- card ---------- */
function cardHTML(d){
  return `<div class="card ${d.stage} ${state.sel===d.id?'sel':''}" data-id="${d.id}" tabindex="0" role="button">

/* ---------- render with FLIP ---------- */
const stage=document.getElementById("stage"), noneEl=document.getElementById("none");
function render(animate=true){
  const first={};
  if(animate) stage.querySelectorAll(".card").forEach(c=>{first[c.dataset.id]=c.getBoundingClientRect();});
  const rows=visible();
  noneEl.hidden=rows.length>0;
  document.getElementById("showN").textContent=rows.length; document.getElementById("totN").textContent=ALL.length;
  if(state.group==="none"){
    stage.innerHTML=`<div class="grid">${rows.map(cardHTML).join("")}</div>`;
  } else {
    const map=new Map(); rows.forEach(d=>{const k=groupKey(d);(map.get(k)||map.set(k,[]).get(k)).push(d);});
    let keys=[...map.keys()];
    const ord=GROUP_ORDER[state.group]; if(ord) keys.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
    else if(state.group==="month") keys.sort((a,b)=>D(map.get(b)[0].sent)-D(map.get(a)[0].sent));
    else keys.sort();
    stage.innerHTML=keys.map(k=>`<div class="ghead"><h3>${k}</h3><span class="n">${map.get(k).length}</span><span class="line"></span></div><div class="grid">${map.get(k).map(cardHTML).join("")}</div>`).join("");
  }
  if(!animate) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  stage.querySelectorAll(".card").forEach(c=>{
    const id=c.dataset.id, f=first[id];
    if(!f){ if(!reduce) c.classList.add("enter"); return; }
    const l=c.getBoundingClientRect(), dx=f.left-l.left, dy=f.top-l.top;
    if(reduce||(!dx&&!dy)) return;
    c.style.transform=`translate(${dx}px,${dy}px)`; c.style.transition="none";
    requestAnimationFrame(()=>{ c.style.transition="transform .34s cubic-bezier(.2,.7,.2,1), box-shadow .18s"; c.style.transform=""; });
  });
  renderQuick(); renderChips();
}

      e.preventDefault();
      if(e.target.closest("[data-new]")){ form.newAgent={name:form.q,agency:"",email:"",win:"",via:"Email"}; form.open=false; renderForm(); pinner.querySelector("#naName")?.focus(); return; }
      const it=e.target.closest("[data-i]"); if(it){ const hits=AGENTS.filter(x=>!form.q||(x.name+" "+x.agency).toLowerCase().includes(form.q.toLowerCase())); pickAgent(hits[+it.dataset.i]); }
    });
  }
  pinner.querySelector(".ta .notl [data-new]")?.addEventListener("click",()=>{ form.newAgent={name:form.q,agency:"",email:"",win:"",via:"Email"}; form.open=false; renderForm(); pinner.querySelector("#naName")?.focus(); });
  if(form.newAgent){
    const na=form.newAgent;
    ["naName","naAgency","naEmail","naWin"].forEach(id=>{const el=pinner.querySelector("#"+id); el.oninput=e=>{na[id.slice(2).toLowerCase()]=e.target.value; pinner.querySelector("#naAdd").disabled=!na.name.trim(); if(id==="naName"||id==="naAgency") renderGhost();};});
    pinner.querySelector("#naVia").onclick=e=>{const b=e.target.closest("button"); if(b){na.via=b.dataset.v; pinner.querySelectorAll("#naVia button").forEach(x=>x.classList.toggle("on",x===b));}};
    pinner.querySelector("#naCancel").onclick=()=>{form.newAgent=null; form.open=true; renderForm(); pinner.querySelector("#agentIn")?.focus();};
    pinner.querySelector("#naAdd").onclick=()=>{ if(!na.name.trim()) return; const w=parseInt(na.win,10);
      const rec={name:na.name.trim(),agency:na.agency.trim()||"Agency not specified",win:isNaN(w)?null:w,via:na.via,open:true,wants:null,email:na.email};
      AGENTS.unshift(rec); form.newAgent=null; pickAgent(rec); showToast(`Added <b>${rec.name}</b> to your contact list`); };
  }
  pinner.querySelector("#chgAgent")?.addEventListener("click",()=>{form.agent=null;form.q="";form.open=true;form.step=1;renderForm();pinner.querySelector("#agentIn").focus();});
  pinner.querySelectorAll("[data-step],[data-go]").forEach(el=>el.addEventListener("click",()=>{const n=+(el.dataset.step||el.dataset.go);if(n===1){form.agent=null;form.q="";form.open=true;}form.step=n;renderForm();if(n===1)pinner.querySelector("#agentIn")?.focus();}));
  pinner.querySelector("#viaSeg")?.addEventListener("click",e=>{const b=e.target.closest("button");if(b){form.via=b.dataset.v;renderForm();}});
  pinner.querySelector("#nudgeChips")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-pick")){ e.stopPropagation(); openCal(b,form.nudgeDate||addDays(form.date,42),k=>{form.nudgeDate=k;form.nudge=null;renderForm();}); return; }
    form.nudge=+b.dataset.n||0;form.nudgeDate=null; renderForm();});
  pinner.querySelector("#dateBtn")?.addEventListener("click",e=>{ e.stopPropagation(); openCal(e.currentTarget,form.date,k=>{form.date=k;renderForm();}); });
  pinner.querySelectorAll(".cb").forEach(c=>c.onclick=()=>{form.mats[c.dataset.t]=!form.mats[c.dataset.t];renderForm();});
  pinner.querySelectorAll(".step [data-d]").forEach(b=>b.onclick=()=>{const u=UNITS[form.unit];setQty(form.qty+u.step*(+b.dataset.d));renderForm();});
  const qi=pinner.querySelector("#qtyIn");
  if(qi){ qi.addEventListener("change",()=>{setQty(parseInt(qi.value.replace(/[^0-9]/g,""),10));renderForm();});
  qi.addEventListener("keydown",e=>{if(e.key==="Enter"){qi.blur();}}); }
  pinner.querySelectorAll(".useg button").forEach(b=>b.onclick=()=>{form.unit=b.dataset.u;form.qty=UNITS[form.unit].def;form.qerr="";renderForm();});
  const oi=pinner.querySelector("#otherIn"); if(oi) oi.oninput=e=>{form.otherTxt=e.target.value;};
  const ni=pinner.querySelector("#noteIn"); if(ni) ni.oninput=e=>form.note=e.target.value;
  pinner.querySelector("#sumTri").onclick=()=>{SUMV=SUMV==="A"?"B":SUMV==="B"?"C":"A";renderForm();};
  pinner.querySelector("#cancelBtn").onclick=closePanel;
  pinner.querySelector("#goBtn").onclick=()=>submitForm(false);
  pinner.querySelector("#anotherBtn").onclick=()=>submitForm(true);
}
function pickAgent(a){ form.agent=a; form.open=false; form.q=""; form.via=a.via||"Email"; form.nudge=a.win||6; form.nudgeDate=null; form.step=2; renderForm(); renderGhost(true); }
function submitForm(another){
  const a=form.agent; if(!a) return;
  if(form.mats.pages&&form.qerr) return;
  const id="q"+Date.now();
  const rec={id,name:a.name,agency:a.agency,status:"Queried",sent:form.date,last:form.date,via:form.via,win:a.win,expectOverride:nudgeDateOf(),mats:formMats(),note:form.note?{t:form.note,w:`${f1(iso)} · now`}:null};
  DATA.unshift(rec); ALL.unshift(derive(rec));
  state.quick="all"; state.overdue=false; render();
  const c=stage.querySelector(`.card[data-id="${id}"]`); if(c){c.classList.add("fresh"); c.scrollIntoView({block:"nearest",behavior:"smooth"});}
  const undo=()=>{ const i=DATA.findIndex(d=>d.id===id); DATA.splice(i,1); ALL.splice(ALL.findIndex(d=>d.id===id),1); closePanel(); render(); showToast("Removed"); };
  if(another){
    newForm(false); pinner.classList.remove("swap"); void pinner.offsetWidth; pinner.classList.add("swap"); renderForm();
    setTimeout(()=>pinner.querySelector("#agentIn")?.focus(),50);
    showToast(`Query logged — <b>${a.name}</b>. Next one?`,undo);
  } else {
    restorePbar(); state.sel=id; c?.classList.add("sel");
    pinner.classList.remove("swap"); void pinner.offsetWidth; pinner.classList.add("swap"); renderPanel();
    showToast(`Query logged — <b>${a.name}</b>`,undo);
  }
}
let toastT;
function showToast(html,undo){
  const t=$("toast"); t.innerHTML=`<span>${html}</span>${undo?'<button id="undoBtn">Undo</button>':""}`; t.classList.add("on");
  if(undo) t.querySelector("#undoBtn").onclick=()=>{undo();};
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),5000);
}
$("newBtn").onclick=openLogPanel;
const _close=closePanel; closePanel=function(){ const wasForm=pbarState==="form"; if(wasForm) restorePbar(); _close(); if(wasForm) render(); };
</script>
</body>
</html>
