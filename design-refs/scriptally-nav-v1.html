<title>ScriptAlly — nav (locked)</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Source+Sans+3:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f7f4ee;--lower:#f2ede7;--parchment:#fdfaf5;--ink:#3a1c14;--nearblack:#1c130f;
  --muted:#7a655c;--burgundy:#7c3a2a;--cta:#f5e2da;--cta-bd:#e8c8bc;--hair:rgba(58,28,20,.12);
  --display:"Playfair Display",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
.pad{max-width:1300px;margin:0 auto;padding:0 56px}

/* ===== nav ===== */
.navwrap{position:sticky;top:0;z-index:60;background:var(--ground);transition:box-shadow .2s ease,background .2s ease,padding .2s ease}
.navwrap.scrolled{box-shadow:0 1px 0 var(--hair),0 6px 18px rgba(58,28,20,.05);background:rgba(247,244,238,.92);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;gap:40px;padding:20px 0}
.navwrap.scrolled .nav{padding:12px 0}
.lockup{display:flex;align-items:center;gap:13px;text-decoration:none}
.lockup img{height:34px;width:auto;display:block;transition:height .2s ease}
.navwrap.scrolled .lockup img{height:29px}
.wordmark{font-family:var(--display);font-weight:600;font-size:1.62rem;letter-spacing:-.012em;color:var(--nearblack);line-height:1}
.links{display:flex;align-items:center;gap:30px}
.links a{color:var(--ink);text-decoration:none;position:relative;padding:4px 0;line-height:1.2}
.links a:hover{color:var(--burgundy)}
.links a[aria-current]{color:var(--burgundy)}
.links a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--burgundy);opacity:.65}
.sp{margin-left:auto}
.login{color:var(--ink);text-decoration:none;margin-right:28px}
.login:hover{color:var(--burgundy)}
.pill{background:var(--cta);border:1px solid var(--cta-bd);color:var(--nearblack);border-radius:999px;
  padding:11px 24px;font-size:1rem;font-weight:500;text-decoration:none;font-family:var(--body);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 6px rgba(124,58,42,.08);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;white-space:nowrap}
.pill:hover{background:#f8e9e2;transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 14px rgba(124,58,42,.13)}
/* CTA: solid ink */
.pill{background:var(--nearblack);border-color:var(--nearblack);color:#f7f0e9;box-shadow:none}
.pill:hover{background:#2c1f19;transform:translateY(-1px);box-shadow:0 6px 14px rgba(28,19,15,.18)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:8px;margin-left:auto}
.burger span{display:block;width:22px;height:1.6px;background:var(--ink);margin:5px 0}

/* logo: black */
.logo-ink,.logo-burg{display:none}

/* nav links: body face */
.links a,.login{font-family:var(--body);font-size:1.06rem;font-weight:500}


/* page body for scroll context */
.hero{padding:76px 0 90px;max-width:34rem}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 0 26px}
h1{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1;letter-spacing:-.022em;color:var(--nearblack);margin:0}
.sub{margin-top:26px;font-family:var(--display);font-size:1.95rem;color:var(--nearblack)}
.filler{background:var(--lower);border-top:1px solid var(--hair);padding:90px 0 400px;font-family:var(--display);font-size:1.7rem;color:var(--nearblack);text-align:center}

/* controls */
a:focus-visible,button:focus-visible{outline:2px solid var(--burgundy);outline-offset:3px}
@media(max-width:820px){
  .pad{padding:0 22px}
  .links,.login{display:none}
  .burger{display:block}
  .pill{margin-left:12px}
  h1{font-size:2.4rem}
}
</style>
