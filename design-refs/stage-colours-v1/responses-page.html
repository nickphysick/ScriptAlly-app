:root{
  --type:"Special Elite","Courier New",monospace; --serif:"Source Serif 4",Georgia,serif;
  --ink:#1c130f; --mut:#5b4f47; --faint:#8a8076; --navy:#2a3a52; --line:#e3dbcf; --soft:#ebe5db;
  --sheet:#f6f3ee; --paper:#fbf9f5; --cream:#f4eee5; --terra:#e7a184; --rust:#a2452a; --shell:#1b2433;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--shell);font:400 16px/1.45 var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2.5px solid #6a89a7;outline-offset:2px}
[hidden]{display:none!important}

/* mock control bar (not part of the app) */
.pal{position:sticky;top:0;z-index:95;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow-x:auto;height:48px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);font-size:14px}
.pal>span{color:var(--mut);margin-right:6px}
.pal button{height:32px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px #d9d0c3;font-size:14px}
.pal button.on{background:var(--navy);color:#fff;box-shadow:none;font-weight:600}
.pal .hint{margin-left:auto;color:var(--faint);font-style:italic}

/* ── shell, as built (Query Centre v156.1 + Shell tabs v2) ── */
.sbar{position:fixed;left:0;top:48px;bottom:0;width:104px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;color:rgba(244,238,229,.7)}
.sb-logo{width:52px;height:52px;margin-bottom:6px;display:grid;place-items:center}
.sb-logo img{width:44px;height:44px}
.sb-ms{position:relative;width:52px;height:60px;margin-bottom:18px;display:grid;place-items:center;border-radius:8px;background:#fefaf4;color:var(--ink);font:600 15px var(--serif);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sb-ms i{position:absolute;left:12px;right:12px;bottom:10px;height:1px;background:#d9cfc1}
.sb-i{position:relative;width:88px;padding:12px 0 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px}
.sb-i svg{width:26px;height:26px}
.sb-i.on{background:var(--navy);color:var(--cream)}
.sb-i b{position:absolute;top:4px;right:14px;height:20px;padding:0 6px;border-radius:10px;background:#c9765d;color:#fff;font:600 11.5px/20px var(--serif)}
.sb-more{margin-top:auto;padding:6px 14px;border-radius:999px;background:rgba(244,238,229,.1);color:var(--cream);font-size:14px;letter-spacing:2px}
.shell{padding:0 14px 14px 104px}
.topbar{display:flex;align-items:flex-end;height:58px}
.tabs{display:flex;align-items:flex-end;padding-left:24px}
.tab{height:40px;padding:0 18px;display:flex;align-items:center;font:400 17px/1 var(--type);color:#e3d6c8;border-radius:12px 12px 0 0;position:relative}
.tab.on{background:var(--sheet);color:var(--ink);padding:0 24px}
.tab.on::before,.tab.on::after{content:"";position:absolute;bottom:0;width:12px;height:12px;background:radial-gradient(circle at 0 0,transparent 12px,var(--sheet) 12.5px)}
.tab.on::before{left:-12px;transform:scaleX(-1)}.tab.on::after{right:-12px}
.topbar .right{margin-left:auto;display:flex;gap:12px;align-self:center}
.srch{width:260px;height:40px;border-radius:12px;background:rgba(244,238,229,.08);box-shadow:inset 0 0 0 1px rgba(244,238,229,.16);color:rgba(244,238,229,.55);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:15px}
.srch kbd{margin-left:auto;font:12px var(--serif);padding:2px 7px;border-radius:6px;background:rgba(244,238,229,.12)}
.lq{height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;font-weight:600;font-size:15px;overflow:hidden}
.lq span{padding:0 14px 0 16px}.lq i{width:38px;height:100%;display:grid;place-items:center;border-left:1px solid var(--line);font-style:normal}
.help{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--cream);font-weight:600;box-shadow:inset 0 0 0 1px rgba(244,238,229,.25)}

.page{padding:0 40px;max-width:1660px;margin:0 auto}

/* ── navy header (workspace header, as built) ── */
.oh{display:grid;grid-template-columns:268px auto minmax(0,1fr);align-items:center;gap:36px 28px;margin:8px 0 30px;padding:22px 30px 22px 0;border-radius:20px;background:var(--navy);color:var(--cream);box-shadow:0 22px 34px -22px rgba(28,19,15,.55)}
.oh-art{display:grid;place-items:center}
.oh-art img{width:206px;height:auto;display:block}
.oh-t{margin:0;font:400 54px/1.05 var(--type);letter-spacing:-.54px;color:#fbf7f0}
.oh-for{display:flex;align-items:center;gap:18px;margin:8px 0 12px}
.oh-for i{flex:1;height:1px;background:rgba(244,238,229,.35)}
.oh-for span{font:400 21px var(--type);white-space:nowrap}
.oh-for em{font:italic 400 19px var(--serif);margin-right:6px}
.oh-acts{display:flex;gap:14px}
.oh-b{height:46px;padding:0 22px;border-radius:12px;display:flex;align-items:center;font:400 16.5px var(--type);white-space:nowrap;transition:transform .15s}
.oh-b:hover{transform:translateY(-1px)}
.oh-b.n{background:var(--cream);color:var(--navy)}
.oh-b.g{color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.6)}
.oh-main{min-width:400px}
.oh-rt{justify-self:end;width:100%;max-width:540px}
.oh-rt .st{font:400 32px/1.05 var(--type);color:#fbf7f0;white-space:nowrap}
.oh-rt .sl{margin-top:4px;font:italic 400 15.5px/1.35 var(--serif);color:rgba(244,238,229,.88)}
.tally{display:block;width:100%;height:58px;margin-top:16px}
.tally path{fill:none;stroke-width:3.4;stroke-linecap:round;transition:opacity .2s}
.tally .a{stroke:#e7a184}.tally .p{stroke:#f4eee5}.tally .w{stroke:rgba(244,238,229,.26)}
.oh-rt[data-h] .tally path{opacity:.25}
.oh-rt[data-h="a"] .tally .a,.oh-rt[data-h="p"] .tally .p,.oh-rt[data-h="w"] .tally .w{opacity:1}
.oh-rt[data-h="w"] .tally .w{stroke:rgba(244,238,229,.6)}
.tkey{display:flex;gap:6px;margin-top:8px;font-size:14px;color:rgba(244,238,229,.8)}
.tkey button{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;border-radius:9px;color:inherit}
.tkey button:hover{background:rgba(244,238,229,.1)}
.tkey i{width:4px;height:16px;border-radius:2px}
.tkey b{font:400 15px var(--type);color:#fbf7f0}

/* ── body grid: Views panel + main ── */
.cl{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;align-items:start}
.cl.wide{grid-template-columns:minmax(0,1fr)}
.views{position:sticky;top:64px;background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 18px 30px -24px rgba(28,19,15,.35);overflow:hidden}
.vh{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px;box-shadow:inset 0 -2px 0 var(--navy)}
.vh b{font:400 21px var(--type)}
.vh button{font:600 13.5px var(--serif);color:#756b61;height:24px}
.vl{padding:10px 8px 8px}
.vr{display:flex;align-items:center;gap:11px;width:100%;height:38px;padding:0 10px;border-radius:9px;font-size:15.5px;transition:background .15s}
.vr:hover{background:#f4efe7}
.vr svg{width:17px;height:17px;flex:none;color:var(--mut)}
.vr span{flex:1;white-space:nowrap}
.vr em{font:400 14px var(--type);color:var(--faint)}
.vr.on{background:var(--navy);color:#fbf7f0;font-weight:700}
.vr.on svg,.vr.on em{color:var(--cream)}
.vl hr{border:0;border-top:1px solid var(--soft);margin:6px 10px}
.vs{padding:14px 18px 10px;border-top:1px solid var(--soft)}
.vs h6{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font:400 16px var(--type)}
.vs h6 small{font:600 12.5px var(--serif);color:var(--faint)}
.vs p{margin:0 0 4px;font-size:14px;color:#6f655c}
.vc{display:flex;align-items:center;gap:10px;width:100%;height:32px;font-size:15px}
.vc>i{width:17px;height:17px;flex:none;border-radius:4.5px;background:#fff;box-shadow:inset 0 0 0 1.5px #b9ae9f;display:grid;place-items:center}
.vc.on>i{background:var(--navy);box-shadow:none}
.vc.on>i::after{content:"";width:8px;height:4.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.vc span{flex:1;display:flex;align-items:center;gap:7px;white-space:nowrap}
.vc span svg{width:15px;height:15px;color:var(--mut)}
.vc em{font:400 13.5px var(--type);color:var(--faint)}
.vf{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px 14px;border-top:1px solid var(--soft);font-size:14px;color:#6f655c}
.vf a{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* toolbar */
.tb{position:sticky;top:48px;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 0;margin:-12px 0 4px;background:linear-gradient(var(--sheet) 78%,rgba(246,243,238,0))}
.vsw{display:flex;padding:3px;border-radius:12px;background:#efe9df;flex:none}
.vsw button{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:14.5px;color:var(--mut);white-space:nowrap}
.vsw button svg{width:15px;height:15px}
.vsw button.on{background:var(--navy);color:#fff;font-weight:600}
.tcount{padding:0 6px 0 4px;font-size:15px;color:var(--mut);white-space:nowrap}
.tcount b{font:400 17px var(--type);color:var(--ink)}
.srch2{flex:1;display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #e3ddd3;color:var(--mut)}
.srch2 svg{width:17px;height:17px;flex:none}
.srch2 input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 15.5px var(--serif);color:var(--ink)}
.srch2 input::placeholder{color:#8a8076}
.srch2:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy)}
.srch2 kbd{font:12px var(--serif);padding:3px 8px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1px #e1d8cc,0 1px 0 #e1d8cc}
.dd{position:relative}
.dd>button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 11px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #d4cabd,0 1px 0 rgba(28,19,15,.06);font-size:14.5px;white-space:nowrap}
.dd>button b{font-weight:600}.dd>button small{font-size:14.5px;color:var(--mut)}
.mn{position:absolute;right:0;top:46px;z-index:50;width:230px;padding:8px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 36px -14px rgba(28,19,15,.4);display:none}
.dd.open .mn{display:block}
.mn h6{margin:4px 8px 6px;font:400 13.5px var(--serif);color:var(--faint)}
.mn button{display:block;width:100%;padding:8px 10px;border-radius:9px;font-size:15px}
.mn button small{display:block;font-size:13px;color:var(--faint)}
.mn button:hover{background:#f4efe7}.mn button.on{background:#eef1f5;font-weight:600}
.share{height:40px;padding:0 18px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;white-space:nowrap}

/* the line of facts */
.sum{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin:6px 0 4px;font-size:16px;color:var(--mut)}
.sum span{padding-right:18px;margin-right:18px;border-right:1px solid #ddd3c6}
.sum span:last-of-type{border:0}
.sum b{font:400 19px var(--type);color:var(--ink)}
.sum a{margin-left:auto;font-weight:600;font-size:15px;color:var(--navy);text-decoration:underline;text-underline-offset:4px;cursor:pointer;white-space:nowrap}

/* group heading (ruled line) */
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec b{font:400 21px var(--type)}
.sec small{display:grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:7px;font:400 13.5px var(--type);background:var(--sw,#ebe6dd);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 1px 2px rgba(28,19,15,.12)}
.sec i{flex:1;height:1px;background:#ddd3c6}
.sec em{font:italic 400 14px var(--serif);color:var(--faint)}

/* ── the query card, as built (v156.1 grid card) ── */
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qc{position:relative;display:block;width:100%;padding:6px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.08),0 18px 34px -22px rgba(28,19,15,.32);transition:transform .2s,box-shadow .2s}
.qc:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(28,19,15,.08),0 24px 38px -22px rgba(28,19,15,.42)}
.qc .in{display:flex;flex-direction:column;border:1px solid #e3d5c9;border-radius:13px;overflow:hidden}
.qc .hd{display:flex;align-items:center;gap:10px;height:76px;padding:12px 14px 12px 12px;background:var(--st)}
.mono{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--cream);font:400 13px/1 var(--type);box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(42,58,82,.35)}
.who{flex:1;min-width:0}
.who b{display:block;font:600 16.5px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{display:block;font:italic 400 13.5px/1.2 var(--serif);color:rgba(28,19,15,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{display:flex;align-items:center;flex:none;color:var(--tk)}
.trk .nd{position:relative;display:grid;place-items:center;width:26px;height:26px}
.trk .nd svg{width:21px;height:21px}
.trk .nd.off{color:#c9bfb2}
.trk .nd.cur{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 6px -2px rgba(28,19,15,.3)}
.trk .nd.cur svg{width:20px;height:20px}
.trk .ln{width:10px;height:2px;border-radius:1px;background:currentColor}
.trk .ln.off{background:repeating-linear-gradient(90deg,#b9afa3 0 2px,transparent 2px 4px)}
.trk .arw{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(28,19,15,.25)}
.trk .arw svg{width:11px;height:11px}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.fx>div{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px 11px;border-radius:10px;background:var(--paper);min-width:0}
.fx>div.hot{background:#f6eee8}
.fx span{font-size:12px;color:#756b61}
.fx b{margin-top:2px;font:400 15px var(--type);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx em{font:italic 400 12px var(--serif);color:#756b61;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(28,19,15,.45);opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
.qc:hover .act,.qc:focus-visible .act,.rw:hover .act,.rw:focus-visible .act{opacity:1;transform:none}
.clip{position:absolute;top:-16px;right:22px;z-index:6;display:flex;align-items:flex-start;gap:4px}
.clip svg{width:16px;height:38px}
.clip i{margin-top:14px;font:400 14px var(--type);font-style:normal;color:var(--mut)}

/* ── reply rows: the agent's reply as the thread bubble ── */
.feed{display:flex;flex-direction:column;gap:10px}
.rw{position:relative;display:grid;grid-template-columns:38px 178px minmax(0,1fr) 172px;align-items:center;gap:16px;width:100%;padding:14px 60px 14px 17px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.08),0 14px 26px -22px rgba(28,19,15,.3);transition:transform .2s,box-shadow .2s}
.rw:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(28,19,15,.08),0 20px 30px -22px rgba(28,19,15,.42)}
.rw .mono{box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(42,58,82,.25)}
.bub{justify-self:start;max-width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 14px 8px 12px;border-radius:16px 16px 16px 5px;background:var(--st)}
.bub .g{grid-row:1/3;width:26px;height:26px;display:grid;place-items:center;color:var(--tk)}
.bub .g svg{width:21px;height:21px}
.bub b{font:600 15.5px/1.3 var(--serif);align-self:center}
.bub b small{font:400 14px var(--serif);color:rgba(28,19,15,.66)}
.bub q{display:block;grid-column:2;font:400 15.5px/1.42 var(--serif);quotes:"“" "”"}
.bub time{grid-column:2;justify-self:end;font-size:12px;color:rgba(28,19,15,.62);margin-top:1px}
.bub.plain{grid-template-columns:auto auto auto;align-items:center;gap:0 10px}
.bub.plain .g{grid-row:auto}.bub.plain time{grid-column:auto;margin:0 0 0 8px;align-self:end}
.meta{white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:13px;color:#756b61}
.meta .trk .nd{width:20px;height:20px}.meta .trk .nd svg{width:16px;height:16px}.meta .trk .ln{width:7px}
.meta b{font:400 14.5px var(--type);color:var(--ink)}
.rw .act{top:50%;right:16px;bottom:auto;margin-top:-16px;transform:translateX(-4px)}
.rw.sel,.qc.sel{box-shadow:0 0 0 2px var(--navy),0 18px 30px -22px rgba(28,19,15,.4)}
.none{padding:34px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:center;color:var(--mut)}
.none b{display:block;font:400 20px var(--type);color:var(--ink);margin-bottom:4px}
.none button{margin-top:12px;font-weight:600;color:var(--navy);text-decoration:underline;text-underline-offset:4px;height:32px}
.calm{display:flex;align-items:center;gap:16px;margin-top:6px;padding:16px 20px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.calm p{margin:0;color:var(--mut)}.calm p b{color:var(--ink);font-weight:600}

/* ── wall of no ── */
.wtop{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;margin-top:6px}
.wt{padding:24px 28px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 30px -24px rgba(28,19,15,.35)}
.wt h2{margin:0;font:400 28px/1.1 var(--type)}
.wt.tw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 44px;align-items:center}.wt.tw p{margin:0;font-size:17px}
.wt p{margin:8px 0 0;max-width:62ch;color:var(--mut)}
.wt .tally{height:64px;width:260px;margin-top:18px}
.wt .tally path{stroke:#1c130f;stroke-width:3}
.wt .tally .n{stroke:#9b9288}
.wt small{display:block;margin-top:6px;font-size:14px;color:#756b61}

.wm{display:flex;align-items:center;gap:14px;margin:24px 0 14px;color:var(--cream)}
.wm b{font:400 21px var(--type)}
.wm i{flex:1;height:0;border-top:2px dashed rgba(244,238,229,.28)}
.wm em{font:italic 400 14px var(--serif);color:rgba(244,238,229,.75)}
.wall .qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.wall .qc{box-shadow:0 2px 3px rgba(0,0,0,.4),0 18px 26px -14px rgba(0,0,0,.7)}
.wall .trk .nd{width:20px;height:20px}.wall .trk .nd svg{width:16px;height:16px}.wall .trk .ln{width:6px}.wall .qc .hd{gap:9px;padding-right:10px}
.pin{position:absolute;left:50%;top:-5px;z-index:3;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1ede6,#9a968f 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}

/* ── nothing back yet ── */
.ww{padding:26px 30px 24px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 30px -24px rgba(28,19,15,.35)}
.ww h2{margin:0;font:400 28px/1.1 var(--type)}
.ww>p{margin:6px 0 0;color:var(--mut)}
.tl{position:relative;height:166px;margin:26px 8px 0}
.tl .ax{position:absolute;left:0;right:0;top:92px;height:2px;background:#ddd3c6}
.tl .wk{position:absolute;top:84px;bottom:28px;left:var(--x);width:calc(100%/16);background:#f8ebe4;border-radius:8px}
.tl .mo{position:absolute;top:120px;left:var(--x);font-size:13px;color:#756b61;padding-left:6px;border-left:1px solid #ddd3c6;height:20px;white-space:nowrap}
.tl .now{position:absolute;top:30px;bottom:30px;left:var(--x);border-left:2px solid var(--navy)}
.tl .now span{position:absolute;top:-24px;left:-34px;width:70px;text-align:center;font:400 14px var(--type);color:var(--navy)}
.tl .dot{position:absolute;left:var(--x);top:var(--y);margin-left:-17px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font:400 12px var(--type);box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(42,58,82,.3);transition:transform .15s,opacity .15s}
.tl .dot.q{background:#efe6d6;color:#5e4c36;box-shadow:0 0 0 3px #fff,0 0 0 4px #dccdb3}
.tl .dot.nx{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(42,58,82,.5),0 0 0 4px rgba(42,58,82,.35)}100%{box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(42,58,82,.5),0 0 0 14px rgba(42,58,82,0)}}
@media (prefers-reduced-motion:reduce){.tl .dot.nx{animation:none}*{transition:none!important}}
.tl:hover .dot{opacity:.35}.tl .dot:hover,.tl .dot:focus-visible{opacity:1;transform:scale(1.12);z-index:5}
.tip{position:absolute;z-index:8;left:50%;bottom:44px;transform:translateX(-50%);width:230px;padding:12px 14px;border-radius:12px;background:var(--navy);color:var(--cream);font:400 13.5px/1.4 var(--serif);text-align:left;box-shadow:0 14px 24px -10px rgba(28,19,15,.5);display:none;pointer-events:none}
.tip b{display:block;font:600 15px var(--serif);color:#fff}.tip em{display:block;color:rgba(244,238,229,.75)}.tip u{display:block;margin-top:6px;text-decoration:none;color:#fff}.tip u.q{color:#efe6d6}
.dot:hover .tip,.dot:focus-visible .tip{display:block}
.wfacts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center;font-size:14.5px;color:var(--mut)}
.wfacts .ch{height:32px;padding:0 12px;border-radius:9px;background:#f3efe8;display:inline-flex;align-items:center;font-size:14px;color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.ft{border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column}
.ft .ex{height:240px;padding:20px;display:grid;place-items:center;background:var(--paper);border-bottom:1px solid var(--soft);position:relative;overflow:hidden}
.ft .ex>em{position:absolute;right:14px;top:10px;font:italic 400 13px var(--serif);color:#756b61}

.ft .ex .qc{width:336px;pointer-events:none}
.ft .ex .bub{max-width:280px}
.ft h3{margin:18px 22px 4px;font:400 22px var(--type)}
.ft p{margin:0 22px 22px;color:var(--mut)}

/* ── the query card drawer (existing card; the desk dims) ── */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(27,20,14,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:110;top:12px;right:12px;bottom:12px;width:480px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;border-radius:20px;background:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);transform:translateX(calc(100% + 24px));transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.drawer.on{transform:none}
.cb{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 0 20px;background:var(--bc,var(--navy));color:var(--bt,#f4eee5);font-size:15px;flex:none}
.cb b{font-weight:600}.cb span{opacity:.8}
.cb .d{margin-left:auto;font:400 14px var(--type);opacity:.85}
.cb .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:inherit;margin-left:8px}
.cb.gr .x{background:rgba(28,19,15,.08)}
.ca{display:flex;align-items:center;gap:14px;padding:18px 20px 12px}
.ca .mono{width:42px;height:42px;font-size:14px}
.ca .nm{font:600 21px/1.15 var(--serif)}.ca em{font:italic 400 15px var(--serif);color:var(--mut)}
.pl{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 9px;border-radius:999px;background:var(--st);color:var(--tk);font-weight:600;font-size:14px}
.pl svg{width:16px;height:16px}
.cms{margin:0 16px;padding:12px 14px;border-radius:12px;background:#f6f1ea}
.cms b{font:400 19px var(--type)}
.chs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chs span{padding:3px 8px;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.ctabs{display:flex;gap:24px;margin:14px 18px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--faint)}
.ctabs span{padding-bottom:8px}.ctabs .on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.cbody{flex:1;overflow:auto;padding:18px 18px 8px}
.m{display:flex;margin-bottom:2px}.m.me{justify-content:flex-end}
.bx{max-width:84%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;padding:10px 14px 8px 12px;border-radius:16px;background:var(--b)}
.m.them .bx{border-bottom-left-radius:5px}.m.me .bx{border-bottom-right-radius:5px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--soft)}
.bx .g{grid-row:1/4;width:24px;height:24px;display:grid;place-items:center;margin-top:1px}
.bx .g svg{width:19px;height:19px}
.bx b{font-weight:600;font-size:15.5px}.bx q{display:block;font-size:15px;line-height:1.42;quotes:"“" "”";margin-top:2px}
.bx small{justify-self:end;font-size:12px;color:rgba(28,19,15,.62);margin-top:2px}
.later{margin:8px 4px;font:italic 400 13px var(--serif);color:#756b61}.later.me{text-align:right}
.rb{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 12px 12px;border-radius:16px;background:#f6f1ea;flex:none}
.rb div{flex:1;min-width:0}.rb b{display:block;font-weight:600;font-size:15px}.rb span{font-size:13.5px;color:var(--mut)}
.rbtn{height:44px;padding:0 18px;border-radius:999px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.rbtn.s{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d4cabd}
.snack{position:fixed;left:50%;bottom:26px;z-index:130;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;transition:opacity .2s,transform .2s}
.snack.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1360px){.oh{grid-template-columns:230px auto minmax(0,1fr)}.oh-t{font-size:48px}.rw{grid-template-columns:38px 160px minmax(0,1fr) 140px}}
@media (max-width:1180px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wall .qgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.oh{grid-template-columns:200px minmax(0,1fr)}.oh-rt{grid-column:1/-1;padding-left:30px;max-width:none}.rw{grid-template-columns:38px 150px minmax(0,1fr)}.rw .meta{display:none}.wtop,.three{grid-template-columns:1fr}}

/* ── v9: three parts, each its own surface ── */
.h2{display:flex;align-items:baseline;gap:18px;margin:46px 0 16px}
.h2 h2{margin:0;font:400 30px/1.1 var(--type)}
.h2 p{margin:0;font:italic 400 16.5px var(--serif);color:var(--mut)}
.h2 .sp{flex:1}
.nav{display:flex;gap:8px;align-self:center}
.nav button{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #d4cabd,0 1px 0 rgba(28,19,15,.06);transition:opacity .15s}
.nav button:disabled{opacity:.35;cursor:default}
.band{border-radius:20px;background:var(--paper);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 26px;padding:34px 26px 26px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,110px)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,110px)),transparent 100%)}
.car::-webkit-scrollbar{display:none}
.car .qc{flex:0 0 330px;scroll-snap-align:start}
.dots{display:flex;justify-content:center;gap:4px;padding:0 0 14px}
.dots button{width:24px;height:24px;display:grid;place-items:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:#d6cbbd;transition:background .15s,transform .15s}
.dots button.on::after{background:var(--navy);transform:scale(1.25)}
.seg{display:flex;padding:3px;border-radius:12px;background:#efe9df;align-self:center}
.seg button{height:34px;padding:0 13px;border-radius:9px;font-size:14.5px;color:var(--mut);white-space:nowrap}
.seg button em{font:400 13.5px var(--type);font-style:normal;margin-left:5px;opacity:.8}
.seg button.on{background:var(--navy);color:#fff;font-weight:600}
.words{columns:3;column-gap:16px}
.qt{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 16px;padding:22px 26px 18px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.08),0 18px 34px -22px rgba(28,19,15,.32);transition:transform .2s,box-shadow .2s}
.qt:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(28,19,15,.08),0 24px 38px -22px rgba(28,19,15,.42)}
.qt .mk{display:block;height:34px;font:400 64px/1 var(--type);color:var(--dp)}
.qt q{display:block;quotes:none;font:400 20px/1.45 var(--serif);margin:2px 0 18px}
.qt.big q{font-size:24px;line-height:1.4}
.qt .by{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px dashed #ddd3c6}
.qt .by .mono{width:34px;height:34px;font-size:12px}
.qt .pl{flex:none;font-size:13.5px;height:28px}
.qt .act{right:14px;top:14px;bottom:auto}
.qt:hover .act,.qt:focus-visible .act{opacity:1;transform:none}
.qt.sel{box-shadow:0 0 0 2px var(--navy),0 18px 30px -22px rgba(28,19,15,.4)}

.wsec .qc{color:var(--ink)}
.wsec .wall{margin:0;padding:0;background:none;box-shadow:none;border-radius:0}
.wsec .wm:first-child{margin-top:26px}
.whd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 40px;align-items:center}
.whd h2{margin:0;font:400 44px/1.05 var(--type);color:#fbf7f0}
.whd .tally{width:240px;height:54px;margin-top:12px}.whd .tally path{stroke:#f4eee5;stroke-width:3}.whd .tally .n{stroke:rgba(244,238,229,.45)}
.whd small{display:block;margin-top:6px;font-size:14px;color:rgba(244,238,229,.8)}
.whd p{margin:0;max-width:52ch;font:400 17px/1.5 var(--serif);color:rgba(244,238,229,.88)}
.whd .side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.whd .oh-b{font-family:var(--type)}
.wsec .seg{background:rgba(244,238,229,.12)}.wsec .seg button{color:rgba(244,238,229,.85)}.wsec .seg button.on{background:var(--cream);color:var(--navy)}
.nt{position:absolute;right:14px;bottom:-9px;z-index:3;display:flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--navy);color:var(--cream);font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.nt svg{width:11px;height:11px}
.sum{margin:-6px 0 0}.sum a{margin-left:auto}
.playb{margin-left:18px;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 8px;border-radius:999px;background:#fff;font-weight:600;font-size:15.5px;box-shadow:inset 0 0 0 1px #d4cabd,0 8px 16px -10px rgba(28,19,15,.4)}
.playb i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;padding-left:2px}.playb small{font-weight:400;font-size:14px;color:var(--mut)}
@media (max-width:1180px){.words{columns:2}.whd{grid-template-columns:1fr}.whd .side{align-items:flex-start}}

.rh{display:flex;flex-wrap:wrap;gap:14px 36px;align-items:center}
.rh .side{margin-left:auto}.rh p{flex-basis:100%}
.rh h2{margin:0;font:400 34px/1.05 var(--type)}
.rh .ct{display:flex;align-items:center;gap:14px;padding-left:36px;border-left:1px solid #ddd3c6}
.rj.brick .rh .ct{border-color:rgba(244,238,229,.25)}
.rh .ct b{font:400 44px/1 var(--type)}
.rh .ct .tally{width:150px;height:44px;margin:0}.rh .ct .tally path{stroke:currentColor;stroke-width:3}.rh .ct .tally .n{opacity:.45}
.rh .ct small{display:block;font-size:13.5px;opacity:.75;white-space:nowrap}
.rh p{margin:0;font-size:16px;line-height:1.5;color:var(--mut)}
.rj.brick .rh p{color:rgba(244,238,229,.88)}
.rh .side{display:flex;align-items:center;gap:12px}
.rbn{height:40px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;white-space:nowrap;background:#fff;box-shadow:inset 0 0 0 1px #d4cabd,0 1px 0 rgba(28,19,15,.06)}
.rj.brick .rbn{background:var(--cream);color:var(--navy);box-shadow:none}
.rj.brick .seg{background:rgba(244,238,229,.12)}.rj.brick .seg button{color:rgba(244,238,229,.85)}.rj.brick .seg button.on{background:var(--cream);color:var(--navy)}
.rm{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.rm b{font:400 19px var(--type)}.rm i{flex:1;height:1px;background:#ddd3c6}.rm em{font:italic 400 14px var(--serif);color:#756b61}
.rj.brick .rm i{height:0;border-top:2px dashed rgba(244,238,229,.28);background:none}.rj.brick .rm em{color:rgba(244,238,229,.75)}
/* A · collection tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{position:relative;display:block;width:100%;padding:14px 14px 12px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 12px 20px -18px rgba(28,19,15,.35);transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #d6cabb,0 18px 24px -18px rgba(28,19,15,.45)}
.tile .top{display:flex;align-items:center;gap:10px;padding-right:44px}
.tile .mono{width:32px;height:32px;font-size:11.5px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(42,58,82,.25)}
.tile .who b{font-size:15px}.tile .who em{font-size:13px}
.tile .ln2{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:10px;border-top:1px dashed #ddd3c6;font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.tile .ln2 svg{width:15px;height:15px;flex:none;color:#55504a}
.tile .ln2 b{font-weight:600;color:var(--ink)}
.tile .ln3{margin-top:3px;font:italic 400 13px var(--serif);color:#756b61;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{position:absolute;right:10px;top:9px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-align:center;font:400 10.5px/1.05 var(--type);color:#8c8379;box-shadow:inset 0 0 0 1.5px #b8afa4,inset 0 0 0 4px #fff,inset 0 0 0 5px #cfc7bc;transform:rotate(var(--r,-8deg))}
.tile.sel,.pc.sel,.lr.sel{box-shadow:0 0 0 2px var(--navy)}
.tile .nt,.pc .nt{bottom:-8px;right:12px}
/* B · denser wall */
.pcs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 14px}
.pc{position:relative;display:block;width:100%;padding:5px;border-radius:13px;background:#fff;color:var(--ink);box-shadow:0 2px 3px rgba(0,0,0,.4),0 16px 22px -12px rgba(0,0,0,.7);transform:rotate(var(--r,0deg));transition:transform .18s}
.pc:hover{transform:rotate(0) translateY(-3px)}
.pc .bd{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px 9px 0 0;background:#e6e4df}
.pc .mono{width:30px;height:30px;font-size:11px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(42,58,82,.25)}
.pc .who b{font-size:14.5px}.pc .who em{font-size:12.5px}
.pc .ft2{display:flex;justify-content:space-between;gap:8px;padding:9px 10px 8px;border-radius:0 0 9px 9px;background:var(--paper);font-size:13px;color:var(--mut);white-space:nowrap}
.pc .ft2 b{font:400 13.5px var(--type);color:var(--ink)}
/* C · list */
.lst{margin-top:22px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.lhd,.lr{display:grid;grid-template-columns:minmax(0,1.3fr) 120px 90px 210px minmax(0,1.7fr) 32px;gap:16px;align-items:center;padding:0 18px}
.lhd{height:40px;font-size:13.5px;color:#756b61;border-bottom:1px solid var(--soft)}
.lmo{padding:8px 18px;background:#f1efec;font:400 15px var(--type);display:flex;justify-content:space-between}
.lmo em{font:italic 400 13.5px var(--serif);color:#756b61}
.lr{width:100%;min-height:58px;border-bottom:1px solid var(--soft);font-size:14.5px;color:var(--ink);transition:background .15s}
.lr:hover{background:#faf7f2}
.lr .ag{display:flex;align-items:center;gap:12px;min-width:0}.lr .mono{width:32px;height:32px;font-size:11.5px;box-shadow:none}
.lr .an{display:flex;align-items:center;gap:7px}.lr .an svg{width:16px;height:16px;color:#55504a}
.lr .ty{font:400 14.5px var(--type)}
.lr .nq{font-style:italic;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .ch{color:var(--faint);opacity:0;transition:opacity .15s}.lr:hover .ch{opacity:1}
@media (max-width:1280px){.tiles,.pcs{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ── v12: the rejection collection as one list ── */
.rc{margin-top:46px}
.rc .rh{padding:0 2px}
.rc2{display:flex;align-items:center;gap:12px;margin-top:14px;padding:0 2px}.rc2 p{flex:1;margin:0;color:var(--mut)}
.rc-find{display:flex;align-items:center;gap:8px;height:40px;width:230px;padding:0 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #e3ddd3;color:var(--mut)}
.rc-find svg{width:16px;height:16px;flex:none}.rc-find input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 15px var(--serif);color:var(--ink)}
.rc-find:focus-within{box-shadow:inset 0 0 0 1.5px var(--navy)}
.rc .rbn{background:var(--navy);color:#fff;box-shadow:none}
.rcs{margin-top:18px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 30px -24px rgba(28,19,15,.35);overflow:hidden}
.rch,.rcr{display:grid;grid-template-columns:54px minmax(0,1.25fr) 112px 200px 92px minmax(0,1.7fr) 32px;gap:18px;align-items:center;padding:0 20px 0 16px}
.rch{height:44px;border-bottom:1px solid var(--soft)}
.rch button{display:inline-flex;align-items:center;gap:6px;height:32px;font-size:13.5px;color:#6f655c;white-space:nowrap}
.rch button:hover{color:var(--ink)}
.rch button.on{color:var(--ink);font-weight:600}
.rch button i{font-style:normal;font-size:11px;opacity:0}.rch button.on i{opacity:1}
.rcm{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 20px 0 16px;background:#f1efec;font:400 15px var(--type)}
.rcm em{font:italic 400 13.5px var(--serif);color:#756b61}
.rcr{position:relative;width:100%;min-height:68px;border-bottom:1px solid var(--soft);font-size:14.5px;color:var(--ink);transition:background .15s}
.rcr:last-child{border-bottom:0}
.rcr:hover,.rcr:focus-visible{background:#faf7f2}
.rcr.sel{background:#eef1f5;box-shadow:inset 3px 0 0 var(--navy)}
.rcr .stamp{position:static;width:46px;height:46px;font-size:11px;box-shadow:inset 0 0 0 1.5px #b8afa4,inset 0 0 0 4px #fff,inset 0 0 0 5px #cfc7bc}
.rcr:hover .stamp{color:#5b4f47;box-shadow:inset 0 0 0 1.5px #8c8379,inset 0 0 0 4px #fff,inset 0 0 0 5px #b8afa4}
.rcr .ag{display:flex;align-items:center;gap:12px;min-width:0}
.rcr .ag .mono{width:34px;height:34px;font-size:12px;box-shadow:none}
.rcr .an{display:flex;align-items:center;gap:7px;font-weight:600}.rcr .an svg{width:17px;height:17px;color:#55504a}
.rcr .tk b{font:400 15px var(--type)}
.rcr .tk u{display:block;height:5px;margin-top:6px;border-radius:3px;background:#efeae2;text-decoration:none;overflow:hidden}
.rcr .tk u i{display:block;height:100%;border-radius:3px;background:#8e99a9}
.rcr .tk.nr u i{background:repeating-linear-gradient(90deg,#b8afa4 0 4px,transparent 4px 7px)}
.rcr .trk .nd{width:20px;height:20px}.rcr .trk .nd svg{width:15px;height:15px}.rcr .trk .ln{width:5px}
.rcr .trk{color:#55504a}
.rcr .nq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.4;color:var(--mut)}
.rcr .nq.no{font-style:italic;color:#9a9086}
.rcr .act{position:static;opacity:0;transform:translateX(-4px);box-shadow:none;width:30px;height:30px}
.rcr:hover .act,.rcr:focus-visible .act{opacity:1;transform:none}
.rcf{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--soft);background:#fcfaf6}
.rcf button{height:36px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:inset 0 0 0 1px #d4cabd;background:#fff}
.rce{padding:28px;text-align:center;color:var(--mut)}
@media (max-width:1280px){.rch,.rcr{grid-template-columns:54px minmax(0,1.2fr) 100px 150px minmax(0,1.5fr) 32px}.rch>:nth-child(5),.rcr>:nth-child(5){display:none}}

/* ── v13: the grey word-on-rejections band (the founding writer band's construction, in grey) ── */
.gb{margin:-12px 0 26px;padding:7px;border-radius:22px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.08),0 22px 40px -22px rgba(28,19,15,.32)}
.gb-top{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 16px;border-radius:15px 15px 0 0;background:repeating-linear-gradient(-45deg,#e9e6e1 0 12px,#e1ded8 12px 24px)}
.gb.fold .gb-top{border-radius:15px}
.gb-tag{font:400 16px/1.3 var(--type);white-space:nowrap}
.gb-one{font-size:14.5px;color:#55504a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.gb.fold .gb-one{display:block}
.gb-fold{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:#55504a}
.gb-fold i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px #d3cfc8;font-style:normal;transition:transform .2s}
.gb.fold .gb-fold i{transform:rotate(180deg)}
.gb-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px 44px;align-items:center;padding:20px 26px 20px 22px;border:1px solid #dcd8d1;border-top:0;border-radius:0 0 15px 15px;background:radial-gradient(90% 160% at 0% 0%,#f3f1ed 0%,#fff 50%)}
.gb.fold .gb-body{display:none}
.gb-me{display:flex;align-items:flex-start;gap:18px}
.gb-badge{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#55504a;background:radial-gradient(circle at 40% 35%,#fff 0%,#ebe8e3 100%);box-shadow:0 0 0 3px #fff,0 0 0 5px #9b958c,0 0 0 10px rgba(120,114,105,.12)}
.gb-badge svg{width:30px;height:30px}
.gb-me h3{margin:0;font:400 27px/1.15 var(--type)}
.gb-me p{margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--mut);max-width:56ch}
.gb-me p b{color:var(--ink);font-weight:600}
.gb-road{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:0;list-style:none}
.gb-road::before{content:"";position:absolute;left:22px;right:22px;top:21px;border-top:2px solid #dedad3}
.gb-road button{position:relative;display:block;width:100%;padding:0 4px 6px 0;border-radius:12px}
.gb-road .n{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#55504a;box-shadow:0 0 0 3px #fff,0 0 0 4.5px #9b958c;transition:background .15s,color .15s}
.gb-road .n svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gb-road button:hover .n{background:var(--navy);color:#fff}
.gb-road b{display:block;margin-top:10px;font:400 17px/1.2 var(--type)}
.gb-road span{display:block;margin-top:3px;font-size:14px;line-height:1.4;color:var(--mut)}
.gb-road u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#b8afa4;color:var(--ink);font-weight:600}
.gb + .sum{margin-top:0}
@media (max-width:1180px){.gb-body{grid-template-columns:1fr}}

/* ── v14: In their words, three ways ── */
.spot{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:stretch}
.spl{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:18px;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.spi{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:58px;padding:8px 12px;border-radius:12px;overflow:hidden;transition:background .15s}
.spi:hover{background:#f1ece4}
.spi .mono{width:36px;height:36px;font-size:12px;box-shadow:none}
.spi small{font:400 13px var(--type);color:#756b61;white-space:nowrap}
.spi.on{background:#fff;box-shadow:0 0 0 1px var(--line),0 10px 18px -14px rgba(28,19,15,.4)}
.spi i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--navy);opacity:.0}
.spi.on.run i{opacity:.85;animation:spfill 9s linear forwards}
.spot:hover .spi.on.run i,.spot:focus-within .spi.on.run i{animation-play-state:paused}
@keyframes spfill{from{width:0}to{width:100%}}
.spq{position:relative;display:flex;flex-direction:column;padding:34px 44px 26px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.08),0 22px 40px -22px rgba(28,19,15,.32);min-height:330px}
.spq .mk{display:block;height:44px;font:400 86px/1 var(--type);color:var(--dp)}
.spq q{display:block;quotes:none;flex:1;margin:6px 0 22px;font:400 30px/1.38 var(--serif);max-width:26em;animation:spin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spq .by{display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px dashed #ddd3c6}
.spq .by .mono{width:42px;height:42px;font-size:14px}
.spq .by .who b{font-size:18px}.spq .by .who em{font-size:14.5px}
.spq .by .fc{margin-left:auto;text-align:right;font-size:14px;color:var(--mut);white-space:nowrap}
.spq .by .fc .pl{margin:0 0 4px auto}
.spq .by button{height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:inset 0 0 0 1px #d4cabd;white-space:nowrap}
.spq .pg{position:absolute;right:24px;top:22px;display:flex;align-items:center;gap:8px;font:400 14px var(--type);color:#756b61}
.spq .pg button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #d4cabd;background:#fff}
.reel{overflow:hidden;padding:6px 0 30px;margin:0 -40px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 120px,#000 calc(100% - 120px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 120px,#000 calc(100% - 120px),transparent 100%)}
.reel-t{display:flex;gap:18px;width:max-content;padding-left:40px;animation:reel linear infinite}
.reel:hover .reel-t,.reel:focus-within .reel-t,.reel.stop .reel-t{animation-play-state:paused}
@keyframes reel{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.reel .qt{flex:none;width:430px;margin:0;display:flex;flex-direction:column}
.reel .qt q{flex:1}
.reelc{display:flex;justify-content:center;margin-top:-14px}
.reelc button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);background:#fff;box-shadow:inset 0 0 0 1px #d4cabd}
@media (prefers-reduced-motion:reduce){.reel{overflow-x:auto}.reel-t{animation:none}.spi.on.run i{animation:none;width:100%}.spq q{animation:none}}
@media (max-width:1180px){.spot{grid-template-columns:1fr}}

/* ── v15: one even gap between sections; nothing inside a section moves ── */
:root{--sg:72px}
.gb{margin:6px 0 0}
.gb + .sum,.gb + .calm{margin-top:var(--sg)}
.h2{margin-top:var(--sg)}
.rc{margin-top:var(--sg)}
</style></head>

const said=i=>({offer:'Offered representation',fullReq:'Asked for the full manuscript',fullSent:'Asked for the full manuscript',partReq:'Asked for '+(i.want||'a partial'),partSent:'Asked for a partial',rr:'Asked you to revise and resubmit',passed:'Passed',noReply:'No reply'})[i.k];
const status=i=>({offer:'Offer',fullReq:'Full requested',fullSent:'Full sent',partReq:'Partial requested',partSent:'Partial sent',rr:'Revise & resubmit',passed:'Passed',noReply:'No reply'})[i.k];
const sty=i=>{const c=C[col(i)];return `--st:${c[0]};--tk:${c[1]}`};

let S={state:'full',view:'tray',v:'all',far:new Set(),q:'',sort:'new',group:'month',open:null};
const items=()=>SETS[S.state].items;
const replies=()=>items().filter(i=>i.k!=='noReply');

/* ───────── tally marks, drawn by hand (seeded so they hold still) ───────── */
function tally(classes,h){let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280-.5};
 let x=4,out='';const top=6,bot=h-6;
 classes.forEach((c,i)=>{const k=i%5;
  if(k<4){const xx=x+k*11;out+=`<path class="${c}" d="M${(xx+r()*3).toFixed(1)} ${(top+r()*4).toFixed(1)}Q${(xx+r()*5).toFixed(1)} ${h/2} ${(xx+r()*3).toFixed(1)} ${(bot+r()*4).toFixed(1)}"/>`}
  else{out+=`<path class="${c}" d="M${x-6} ${(bot-8+r()*5).toFixed(1)}L${x+40} ${(top+8+r()*5).toFixed(1)}"/>`;x+=62}
 });
 const w=x+((classes.length%5)?(classes.length%5)*11:-14)+6;
 return `<svg class="tally" viewBox="0 0 ${Math.max(w,60)} ${h}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Tally of ${classes.length}">${out}</svg>`}

/* ───────── header ───────── */
function header(){
 const it=items(),R=replies().length,Q=SETS[S.state].queried,more=it.filter(i=>grp(i)==='more').length,pass=it.filter(i=>i.k==='passed').length;
 ohT.textContent=R?`${R} response${R>1?'s':''}`:'No responses yet';
 shareTop.hidden=!it.some(i=>grp(i)!=='more');
 const cls=[...Array(more).fill('a'),...Array(pass).fill('p'),...Array(Q-R).fill('w')];
 const pct=Math.round(R/Q*100);
 ohR.removeAttribute('data-h');
 ohR.innerHTML=R?`<div class="st">${R} of ${Q} have replied</div>
  <div class="sl">${S.state==='early'?'It’s early days. Most of your queries are still with agents.':`That’s a ${pct}% response rate, counting the passes. ${more} asked to read more.`}</div>
  ${tally(cls,58)}
  <div class="tkey"><button data-h="a"><i style="background:#e7a184"></i><b>${more}</b> asked for more</button><button data-h="p"><i style="background:#f4eee5"></i><b>${pass}</b> passed</button><button data-h="w"><i style="background:rgba(244,238,229,.35)"></i><b>${Q-R}</b> no answer yet</button></div>`
 :`<div class="st">${Q} queries out</div><div class="sl">The next reply is due around ${fd(nextDue())}, going by the reply times your agents give.</div>${tally(cls,58)}
  <div class="tkey"><button data-h="w"><i style="background:rgba(244,238,229,.35)"></i><b>${Q}</b> no answer yet</button></div>`;
 ohR.querySelectorAll('.tkey button').forEach(b=>{const on=()=>ohR.dataset.h=b.dataset.h,off=()=>ohR.removeAttribute('data-h');b.onmouseenter=on;b.onfocus=on;b.onmouseleave=off;b.onblur=off;
  b.onclick=()=>{if(b.dataset.h==='w'){snack('The queries still out live in Queries');return}S.view='tray';S.v=b.dataset.h==='a'?'more':'passed';S.far.clear();body()}});
}

/* ───────── pieces ───────── */
function track(i,ask){const ks=['q','p','f','o'],cur=i.far;let h='';
 const closed=grp(i)!=='more';
 ks.forEach((k,j)=>{const skipped=(j===1&&i.far>=2&&!i.part&&!['partReq','partSent'].includes(i.k)&&i.k!=='rr'&&i.k!=='passed')||false;
  const off=j>cur||skipped;
  if(j)h+=`<i class="ln ${off?'off':''}"></i>`;
  const isCur=j===cur&&!closed;
  h+=`<span class="nd ${off?'off':''} ${isCur?'cur':''}" title="${['Queried','Partial','Full','Offer'][j]}">${G[k]}${isCur&&ask?`<b class="arw">${ARW}</b>`:''}</span>`});
 return `<span class="trk" aria-label="Got as far as: ${['the query','a partial','a full','an offer'][i.far]}">${h}</span>`}
function facts(i){
 if(i.k==='offer')return[['Offered',fd(i.at),days(i.at,TODAY)+' days ago'],['Next','Answer it','by '+fd(i.due),1]];
 if(i.k==='fullReq')return[['Asked',fd(i.at),days(i.at,TODAY)+' days ago'],['Next','Send the full','full manuscript',1]];
 if(i.k==='partReq')return[['Asked',fd(i.at),days(i.at,TODAY)+' days ago'],['Next','Send pages',i.want||'partial',1]];
 if(i.k==='rr')return[['Asked',fd(i.at),days(i.at,TODAY)+' days ago'],['Next','Send revision','when it’s ready',1]];
 if(i.mine)return[['You sent it',fd(i.mine),days(i.mine,TODAY)+' days ago'],['Next','Reply by '+fd(i.due),'the time they give']];
 return[['Queried',fd(i.sent),days(i.sent,TODAY)+' days ago'],[i.k==='passed'?'Passed':'Closed',fd(i.at),i.k==='passed'?`after ${days(i.sent,i.at)} days`:`no reply in ${Math.round(days(i.sent,i.at)/7)} weeks`]]}
function card(i,opt={}){const f=facts(i);
 return `<button class="qc ${S.open===i.n?'sel':''}" data-open="${i.n}" style="${sty(i)}">${opt.pin?'<span class="pin"></span>':''}
  <span class="in"><span class="hd"><span class="mono">${ini(i.n)}</span><span class="who"><b>${i.n}</b><em>${i.a}</em></span>${track(i,i.move)}</span>
  <span class="fx">${f.map(x=>`<div class="${x[3]?'hot':''}"><span>${x[0]}</span><b>${x[1]}</b><em>${x[2]}</em>${x[3]?`<span class="act">${GO}</span>`:''}</div>`).join('')}</span></span>
  ${opt.pin?'':`<span class="clip" aria-label="${i.mat} materials">${CLIP}<i>${i.mat}</i></span>`}</button>`}
function row(i){
 const w=i.k==='noReply'?`Closed after <b>${Math.round(days(i.sent,i.at)/7)} weeks</b>`:`Answered after <b>${days(i.sent,i.at)} days</b>`;
 const sub=i.k==='noReply'?'':(i.k==='passed'?(i.note?'':'<small>· no note</small>'):(i.mine?`<small>· you sent it ${fd(i.mine)}</small>`:''));
 const b=i.note?`<span class="bub"><span class="g">${G[gly(i)]}</span><b>${said(i)}</b><q>${i.note}</q><time>${fd(i.at)}</time></span>`
   :`<span class="bub plain"><span class="g">${G[gly(i)]}</span><b>${said(i)} ${sub}</b><time>${fd(i.at)}</time></span>`;
 return `<button class="rw ${S.open===i.n?'sel':''}" data-open="${i.n}" style="${sty(i)}"><span class="mono">${ini(i.n)}</span><span class="who"><b>${i.n}</b><em>${i.a}</em></span>${b}
  <span class="meta">${track(i)}<span>${w}</span></span><span class="act">${GO}</span></button>`}
const sec=(t,n,e,sw)=>`<div class="sec" ${sw?`style="--sw:${sw}"`:''}><b>${t}</b><small>${n}</small><i></i>${e?`<em>${e}</em>`:''}</div>`;

/* ───────── views ───────── */
const VIEWS=[
 ['all','All responses',i=>i.k!=='noReply','<path d="M3 5h12M3 9h12M3 13h12"/>'],
 ['move','Waiting on you',i=>i.move,'<circle cx="9" cy="9" r="6.5"/><path d="M9 5.500v4M9 12.200v.3"/>'],
 ['more','Asked for more',i=>grp(i)==='more','<path d="M5 2.500h6l3 3v10H5z"/><path d="M7.500 9h4M7.500 12h4"/>'],
 ['passed','Passed',i=>i.k==='passed','<circle cx="9" cy="9" r="6.500"/><path d="M6 9h6"/>'],
 ['note','With a note',i=>!!i.note,'<path d="M3 4h12v8H8l-3 3v-3H3z"/>'],
 ['noReply','No reply',i=>i.k==='noReply','<circle cx="9" cy="9" r="6.500" stroke-dasharray="2.600 2.600"/><path d="M9 5.500V9l2.500 1.800"/>'],
];
const FAR=[['Query only','q'],['A partial','p'],['A full','f'],['An offer','o']];
function shown(){const v=VIEWS.find(x=>x[0]===S.v);let l=items().filter(v[2]);
 if(S.far.size)l=l.filter(i=>S.far.has(i.far));
 const q=S.q.trim().toLowerCase();if(q)l=l.filter(i=>(i.n+' '+i.a+' '+(i.note||'')+' '+said(i)).toLowerCase().includes(q));
 return l}
function sortL(l){return l.slice().sort((a,b)=>S.sort==='new'?b.at-a.at:S.sort==='old'?a.at-b.at:S.sort==='quick'?days(a.sent,a.at)-days(b.sent,b.at):a.n.localeCompare(b.n))}

function viewsPanel(){const it=items(),inView=items().filter(VIEWS.find(x=>x[0]===S.v)[2]);
 return `<aside class="views"><div class="vh"><b>Views</b><button id="vreset">Reset</button></div>
 <div class="vl">${VIEWS.map((v,k)=>`${k===5?'<hr>':''}<button class="vr ${S.v===v[0]?'on':''}" data-v="${v[0]}"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${v[3]}</svg><span>${v[1]}</span><em>${it.filter(v[2]).length}</em></button>`).join('')}</div>
 <div class="vs"><h6>Refine<small>within this view</small></h6><p>How far it got</p>
 ${FAR.map((f,k)=>`<button class="vc ${S.far.has(k)?'on':''}" data-far="${k}" role="checkbox" aria-checked="${S.far.has(k)}"><i></i><span>${G[f[1]]}${f[0]}</span><em>${inView.filter(i=>i.far===k).length}</em></button>`).join('')}</div>
 <div class="vf"><span>${shown().length} showing</span><a>Export</a></div></aside>`}

function toolbar(n){const sl={new:'Newest',old:'Oldest',quick:'Quickest reply',az:'Agent'},gl={month:'Month',answer:'Answer'};
 return `<div class="tb"><div class="vsw" role="tablist"><button class="${S.view==='tray'?'on':''}" data-view="tray"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.500 4 3h8l2 6.500V13H2z"/><path d="M2 9.500h3.500l1 1.500h3l1-1.500H14"/></svg>Replies</button><button class="${S.view==='wall'?'on':''}" data-view="wall"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.500 3h13v10h-13zM1.500 6.300h13M1.500 9.700h13M6 3v3.300M10.500 6.300v3.400M5 9.700V13M11 9.700V13"/></svg>Wall of no</button></div>
 <span class="tcount"><b>${n}</b> ${S.view==='wall'?(n===1?'no':'nos'):(S.v==='noReply'?'closed':'response'+(n===1?'':'s'))}</span>
 ${S.view==='wall'?`<span style="flex:1"></span><button class="share" id="dl">Share your wall</button>`:
 `<label class="srch2"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.500" cy="8.500" r="5.500"/><path d="m13 13 4 4"/></svg><input id="fa" placeholder="Find an agent, an agency or a word from a note" value="${S.q.replace(/"/g,'&quot;')}" aria-label="Find a response"><kbd>/</kbd></label>
 <div class="dd" id="ddS"><button aria-haspopup="true">⇅ <small>Sort</small> <b>${sl[S.sort]}</b> ⌄</button><div class="mn"><h6>Sort each group by</h6>${Object.entries(sl).map(([k,v])=>`<button data-sort="${k}" class="${S.sort===k?'on':''}">${v}<small>${{new:'Latest reply first',old:'Earliest reply first',quick:'Shortest wait first',az:'A to Z'}[k]}</small></button>`).join('')}</div></div>
 <div class="dd" id="ddG"><button aria-haspopup="true">▤ <small>Group</small> <b>${gl[S.group]}</b> ⌄</button><div class="mn"><h6>Group responses by</h6>${Object.entries(gl).map(([k,v])=>`<button data-grp="${k}" class="${S.group===k?'on':''}">${v}<small>${{month:'When the reply came',answer:'Requests, passes, no reply'}[k]}</small></button>`).join('')}</div></div>`}</div>`}

function summary(){const r=replies();if(S.state==='early')return `<div class="calm"><p><b>It’s early days.</b> 7 of your 9 queries are still with agents, and two replies is too few to read anything into.</p></div>`;
 const avg=Math.round(r.reduce((s,i)=>s+(i.fr||days(i.sent,i.at)),0)/r.length),notes=r.filter(i=>i.note).length,past=r.filter(i=>i.far>0).length;
 return `<div class="sum"><span>A first reply has taken <b>${avg} days</b> on average</span><span><b>${notes}</b> came with a note</span><span><b>${past}</b> agents read past the query</span><a id="toAn">More in Analytics →</a></div>`}

function tray(){const l=shown();let h='';
 if(!l.length)return `<div class="none"><b>Nothing matches</b>No response fits this view${S.q?` and “${S.q.replace(/</g,'&lt;')}”`:''}${S.far.size?' with those boxes ticked':''}.<br><button id="clr">Clear and show all responses</button></div>`;
 const mv=l.filter(i=>i.move),rest=sortL(l.filter(i=>!i.move));
 if(mv.length){h+=sec('Waiting on you',mv.length,'Agents who asked for something you haven’t sent yet','#e4ebf2')+`<div class="qgrid" style="padding-top:8px">${mv.map(i=>card(i)).join('')}</div>`}
 if(S.group==='month'&&(S.sort==='new'||S.sort==='old')){const m=new Map();rest.forEach(i=>{const k=MOL[i.at.getMonth()];(m.get(k)||m.set(k,[]).get(k)).push(i)});
  m.forEach((v,k)=>{h+=sec(k,v.length,v.some(i=>grp(i)==='more')?'':'' )+`<div class="feed">${v.map(row).join('')}</div>`})}
 else if(S.group==='answer'){[['more','Asked for more','#e4ebf2','Your pages are with these agents'],['passed','Passed','#e6e4df',''],['noReply','No reply','#e6e4df','Closed after the wait']].forEach(g=>{const v=rest.filter(i=>grp(i)===g[0]);if(v.length)h+=sec(g[1],v.length,g[3],g[2])+`<div class="feed">${v.map(row).join('')}</div>`})}
 else h+=sec('Everything else',rest.length,'')+`<div class="feed">${rest.map(row).join('')}</div>`;
 return h}

function wall(){const nos=items().filter(i=>grp(i)!=='more').sort((a,b)=>b.at-a.at),p=nos.filter(i=>i.k==='passed').length,nr=nos.length-p;
 if(!nos.length)return `<div class="wt" style="margin-top:6px"><h2>Rejections are part of querying</h2><p>A manuscript won’t suit every agent’s taste, and it may land on a desk at the wrong time. When a pass comes in, it goes on your wall here.</p></div>`;
 const m=new Map();nos.forEach(i=>{const k=MOL[i.at.getMonth()];(m.get(k)||m.set(k,[]).get(k)).push(i)});let w='';
 m.forEach((v,k)=>{w+=`<div class="wm"><b>${k}</b><i></i><em>${v.length} ${v.length>1?'nos':'no'}</em></div><div class="qgrid">${v.map(i=>card(i,{pin:1})).join('')}</div>`});
 return `<div class="wtop"><div class="wt tw"><div><h2>${nos.length} nos so far</h2>${tally(nos.map(i=>i.k==='passed'?'':'n'),64)}<small>${p} passed${nr?` · ${nr} closed after no reply`:''}</small></div>
 <p>Rejections are part of querying. A manuscript won’t suit every agent’s taste, and it may land on a desk at the wrong time.</p></div>
 <div class="wt shr"><div class="pv"><div><b>${nos.length}</b><span>rejections so far</span><em>Murphy’s Day Out</em></div></div><div><h3>Share your wall</h3><p>Sharing it may help a writer at the start of theirs. No agent names are ever shown.</p><button class="rbtn" id="dl2">Make the image</button></div></div></div>
 <div class="wall">${w}</div>`}

const nextDue=()=>WAITING.filter(w=>w[3]).map(w=>new Date(+w[2]+w[3]*7*864e5)).filter(d=>d>=TODAY).sort((a,b)=>a-b)[0];
function empty(){const t0=D(10,1),span=19*7,x=d=>(days(t0,d)/span*100).toFixed(2)+'%';
 const dated=WAITING.filter(w=>w[3]).map(w=>({n:w[0],a:w[1],sent:w[2],wk:w[3],due:new Date(+w[2]+w[3]*7*864e5)})).sort((a,b)=>a.due-b.due);
 const nextI=dated.findIndex(d=>d.due>=TODAY);let lastX=-99,lvl=0;
 const dots=dated.map((d,k)=>{const px=days(t0,d.due);lvl=(px-lastX<5)?lvl+1:0;lastX=px;const quiet=d.due<TODAY,n=Math.abs(days(TODAY,d.due));
  return `<button class="dot ${quiet?'q':''} ${k===nextI?'nx':''}" style="--x:${x(d.due)};--y:${75-lvl*40}px" data-wait="${d.n}">${ini(d.n)}<span class="tip"><b>${d.n}</b><em>${d.a}</em>Queried ${fd(d.sent)} · they say ${d.wk} weeks<u class="${quiet?'q':''}">${quiet?`Their reply time passed ${n} days ago`:`Reply due ${fd(d.due)} · in ${n} days`}</u></span></button>`}).join('');
 const mos=[D(11,1),D(12,1),new Date(2027,0,1),new Date(2027,1,1)].map(d=>`<span class="mo" style="--x:${x(d)}">${MOL[d.getMonth()]}</span>`).join('');
 const quiet=dated.filter(d=>d.due<TODAY).length,nx=dated[nextI];
 const ex1=FULL[2],ex2=FULL[7];
 return `<div class="ww"><h2>While you wait</h2><p>Your 12 queries are with agents. Here’s when each agent says they’ll reply by.</p>
 <div class="tl"><div class="ax"></div>${mos}<span class="now" style="--x:${x(TODAY)}"><span>Today</span></span>${dots}</div>
 <div class="wfacts"><span>Next reply due <b style="font:400 16px var(--type);color:var(--ink)">${fd(nx.due)}</b> · ${quiet} past the time their agent gives · No reply time given:</span>${WAITING.filter(w=>!w[3]).map(w=>`<span class="ch">${w[0]} · queried ${fd(w[2])}</span>`).join('')}</div></div>
 <div class="three">
  <div class="ft"><div class="ex"><em>Example</em>${card(ex1).replace('data-open','data-x')}</div><h3>Track your requests</h3><p>When an agent asks for pages, their card sits at the top until you’ve sent them.</p></div>
  <div class="ft"><div class="ex"><em>Example</em><span class="bub" style="${sty(ex2)}"><span class="g">${G.x}</span><b>Passed</b><q>${ex2.note}</q><time>14 Nov</time></span></div><h3>Keep your notes</h3><p>Anything an agent says about your book is kept with their reply, so you can read them all together.</p></div>
  <div class="ft"><div class="ex"><em>Example</em><div style="display:flex;gap:10px">${[0,1,2].map(k=>`<span style="position:relative;display:block;width:86px;padding:4px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px #e3dbcf,0 10px 14px -10px rgba(28,19,15,.4);transform:rotate(${[-2,1.5,-1][k]}deg)"><span style="display:block;height:22px;border-radius:6px 6px 0 0;background:#e6e4df"></span><span style="display:block;height:34px;border-radius:0 0 6px 6px;background:#fbf9f5"></span></span>`).join('')}</div></div><h3>Rejection collection</h3><p>Every pass is kept in your Rejection collection. Rejections are part of querying, and you can share it when you’re ready.</p></div>
 </div>`}

/* ───────── page body ───────── */
function body(){header();const el=document.getElementById('body'),keep=document.activeElement&&document.activeElement.id==='fa';
 if(S.state==='none'){el.innerHTML=empty();wire();return}
 const n=S.view==='wall'?items().filter(i=>grp(i)!=='more').length:shown().length;
 el.innerHTML=S.view==='wall'?`<div class="cl wide"><div>${toolbar(n)}${wall()}</div></div>`
  :`<div class="cl">${viewsPanel()}<div>${toolbar(n)}${S.v==='all'&&!S.q&&!S.far.size?summary():''}${tray()}</div></div>`;
 wire();if(keep){const f=document.getElementById('fa');f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
function wire(){const $=(s,f)=>document.querySelectorAll(s).forEach(f);
 $('[data-v]',b=>b.onclick=()=>{S.v=b.dataset.v;S.far.clear();body()});
 $('[data-far]',b=>b.onclick=()=>{const k=+b.dataset.far;S.far.has(k)?S.far.delete(k):S.far.add(k);body()});
 $('[data-view]',b=>b.onclick=()=>{S.view=b.dataset.view;body()});
 $('[data-open]',b=>b.onclick=()=>openCard(b.dataset.open));
 $('[data-sort]',b=>b.onclick=()=>{S.sort=b.dataset.sort;body()});
 $('[data-grp]',b=>b.onclick=()=>{S.group=b.dataset.grp;body()});
 $('.dd>button',b=>b.onclick=e=>{e.stopPropagation();const d=b.parentNode,o=d.classList.contains('open');$('.dd',x=>x.classList.remove('open'));d.classList.toggle('open',!o)});
 $('[data-wait]',b=>b.onclick=()=>snack(b.dataset.wait+'’s query card opens here'));
 const by=id=>document.getElementById(id);
 if(by('fa'))by('fa').oninput=e=>{S.q=e.target.value;body()};
 if(by('vreset'))by('vreset').onclick=()=>{S.v='all';S.far.clear();S.q='';body()};
 if(by('clr'))by('clr').onclick=()=>{S.v='all';S.far.clear();S.q='';body()};
 if(by('toAn'))by('toAn').onclick=()=>snack('Opens Analytics, where the full figures live');if(by('playb'))by('playb').onclick=()=>snack('Plays your query story (see the desktop story mock)');
 ['dl','dl2'].forEach(id=>by(id)&&(by(id).onclick=()=>snack('Opens the share-image builder, as built')));
 document.querySelector('.vf a')&&(document.querySelector('.vf a').onclick=()=>snack('Exports the responses showing as a spreadsheet'))}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.getElementById('fa')){e.preventDefault();document.getElementById('fa').focus()}});

/* ───────── the query card (the existing drawer; nothing new here) ───────── */

document.querySelectorAll('.pal [data-st]').forEach(b=>b.addEventListener('click',()=>{S.rs='date';S.rd=-1;S.rall=false;S.rq='';body()}));
/* ───────── v13: a word on rejections ───────── */
let gbFold=false;
function gband(){const n=items().filter(i=>grp(i)!=='more').length;if(!n)return '';
 return `<section class="gb ${gbFold?'fold':''}" id="gb" aria-label="A word on rejections"><div class="gb-top"><span class="gb-tag">A word on rejections</span><span class="gb-one">They can be tough. Here, every one is kept, learned from and used to shape what you do next.</span>
 <button class="gb-fold" id="gbf" aria-expanded="${!gbFold}">${gbFold?'Read':'Hide'}<i>⌃</i></button></div>
 <div class="gb-body"><div class="gb-me"><span class="gb-badge">${G.x}</span><div><h3>Rejections can be tough.</h3><p>Nobody enjoys a no, and this page holds ${n===1?'yours':'all of yours'}. At QueryHawk we treat every rejection as <b>valuable data</b>. We keep it, we learn from it, and we use it to shape your campaign from here.</p></div></div>
 <ol class="gb-road"><li><button data-gj="wall"><span class="n"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM3 4h18v3H3zM10 11h4"/></svg></span><b>Keep it</b><span>Every answer is logged in your <u>Rejection collection</u>.</span></button></li>
 <li><button data-gj="words"><span class="n"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 4v-4H4z"/><path d="M8 9h8M8 12.500h5"/></svg></span><b>Learn from it</b><span>What agents told you is gathered <u>in their words</u>.</span></button></li>
 <li><button data-gj="an"><span class="n"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.500-4 3 2.500L19 8"/><path d="M15.500 8H19v3.500"/></svg></span><b>Shape what’s next</b><span>How far each query got shows up in <u>Analytics</u>.</span></button></li></ol></div></section>`}
function gbWire(){const f=document.getElementById('gbf');if(!f)return;f.onclick=()=>{gbFold=!gbFold;const g=document.getElementById('gb');g.classList.toggle('fold',gbFold);f.firstChild.textContent=gbFold?'Read':'Hide';f.setAttribute('aria-expanded',!gbFold)};
 document.querySelectorAll('[data-gj]').forEach(b=>b.onclick=()=>{const k=b.dataset.gj;if(k==='an')snack('Opens Analytics');else if(document.getElementById(k))jump(k);else snack('No notes recorded yet')})}
const body12=body;body=function(){body12();if(S.state!=='none'){document.getElementById('body').insertAdjacentHTML('afterbegin',gband());gbWire()}};
/* ───────── v14: In their words ───────── */
let IW='spot',spI=0,spT=null,spAuto=true;
const DP={p:'#a9bdd2',f:'#7391b3',o:'#dfb1ac',x:'#a8a199'};
const notesL=()=>{const all=items().filter(i=>i.note).sort((a,b)=>b.at-a.at);return{all,l:all.filter(i=>S.nk==='all'||(S.nk==='pass')===(i.k==='passed'))}};
const qcard=(i,cls='')=>`<button class="qt ${cls} ${S.open===i.n?'sel':''}" data-open="${i.n}" style="${sty(i)};--dp:${DP[col(i)]}"><span class="mk">“</span><q>${i.note}</q><span class="by"><span class="mono">${ini(i.n)}</span><span class="who"><b>${i.n}</b><em>${i.a}</em></span><span class="pl">${G[gly(i)]}${i.k==='passed'?'Passed':status(i)} · ${fd(i.at)}</span></span><span class="act">${GO}</span></button>`;
function spHTML(l){const i=l[spI];return `<div class="spl" role="tablist" aria-label="Agents who wrote a note">${l.map((x,k)=>`<button class="spi ${k===spI?'on':''} ${spAuto?'run':''}" role="tab" aria-selected="${k===spI}" data-sp="${k}"><span class="mono">${ini(x.n)}</span><span class="who"><b>${x.n}</b><em>${x.k==='passed'?'Passed':status(x)}</em></span><small>${fd(x.at)}</small><i></i></button>`).join('')}</div>
 <div class="spq" style="${sty(i)};--dp:${DP[col(i)]}"><span class="pg"><button id="spp" aria-label="Previous note">${GO.replace('<svg','<svg style="transform:scaleX(-1)"')}</button>${spI+1} of ${l.length}<button id="spn" aria-label="Next note">${GO}</button></span>
 <span class="mk">“</span><q>${i.note}</q><div class="by"><span class="mono">${ini(i.n)}</span><span class="who"><b>${i.n}</b><em>${i.a}</em></span><span class="fc"><span class="pl">${G[gly(i)]}${i.k==='passed'?'Passed':status(i)} · ${fd(i.at)}</span><br>${days(i.sent,i.at)} days after you queried · ${['on the query','after the partial','after the full','after the full'][i.far]}</span><button data-open="${i.n}">Open the card</button></div></div>`}
function spDraw(){const el=document.getElementById('spot');if(!el)return;const {l}=notesL();if(spI>=l.length)spI=0;el.innerHTML=spHTML(l);
 el.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{spI=+b.dataset.sp;spAuto=false;spDraw()});
 const mv=d=>{spI=(spI+d+l.length)%l.length;spAuto=false;spDraw()};spp.onclick=()=>mv(-1);spn.onclick=()=>mv(1);
 el.querySelector('[data-open]').onclick=e=>openCard(e.currentTarget.dataset.open);
 clearTimeout(spT);if(spAuto&&l.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const tick=()=>{if(!document.getElementById('spot'))return;if(el.matches(':hover')||el.contains(document.activeElement)||S.open){spT=setTimeout(tick,1500);return}spI=(spI+1)%l.length;spDraw()};spT=setTimeout(tick,9000)}}
words=function(){const {all,l}=notesL();if(!all.length)return '';const np=all.filter(i=>i.k==='passed').length;
 const head=`<div class="h2" id="words"><h2>In their words</h2><p>What agents wrote to you about Murphy’s Day Out, as you recorded it.</p><span class="sp"></span>${all.length>2&&np&&np<all.length?`<div class="seg">${[['all','All',all.length],['pass','From passes',np],['req','From requests',all.length-np]].map(x=>`<button data-nk="${x[0]}" class="${S.nk===x[0]?'on':''}">${x[1]}<em>${x[2]}</em></button>`).join('')}</div>`:''}</div>`;
 if(IW==='wall'||l.length<2)return head+`<div class="words">${l.map((i,k)=>qcard(i,k===0?'big':'')).join('')}</div>`;
 if(IW==='reel'){const row=l.map(i=>qcard(i)).join('');return head+`<div class="reel" id="reel"><div class="reel-t" style="animation-duration:${l.length*11}s">${row}${row.replace(/<button class="qt/g,'<button tabindex="-1" aria-hidden="true" class="qt')}</div></div><div class="reelc"><button id="reelp">❚❚&nbsp; Pause</button></div>`}
 return head+`<div class="spot" id="spot"></div>`};
const body13=body;body=function(){body13();spDraw();const r=document.getElementById('reelp');if(r)r.onclick=()=>{const on=document.getElementById('reel').classList.toggle('stop');r.innerHTML=on?'▶&nbsp; Play':'❚❚&nbsp; Pause'}};
document.querySelectorAll('.pal [data-iw]').forEach(b=>b.onclick=()=>{IW=b.dataset.iw;spI=0;spAuto=true;document.querySelectorAll('.pal [data-iw]').forEach(x=>x.classList.toggle('on',x===b));body();jump('words')});
document.querySelectorAll('.pal [data-st]').forEach(b=>b.addEventListener('click',()=>{spI=0;spAuto=true;body()}));
body();
</script>
