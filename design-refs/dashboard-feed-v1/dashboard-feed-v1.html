:root{
  --shell:#1b2433; --navy:#2a3a52; --band:#2d3a50; --slate:#6a89a7;
  --page:#f5f1eb; --ink:#1c130f; --ink2:#3b322c; --muted:#7d7067; --faint:#a39a91;
  --frame:rgba(124,58,42,.42); --hair:#e7ddd2; --hair2:#efe8de; --stone:#e4e1db; --fill:#ece7de;
  --st-sand:#f7efe3; --st-sage:#e0e5dd; --st-pink:#f5e6df; --st-slate:#d7e0e8;
  --k-offer:#b8862f; --k-offer-t:#f6ecd6; --k-req:#3d5070; --k-req-t:#e2e7ef; --k-sent:#8a6a3c; --k-sent-t:#f4ead9;
  --k-nudge:#a2452a; --k-nudge-t:#f3ddd2; --k-closed:#7c7168; --k-closed-t:#ece8e3; --k-admin:#a39c94; --k-admin-t:#f0ede9;
  --type:'Special Elite','Courier New',monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --top:64px; --edge:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--shell);font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased;font-synthesis:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.sd{fill:none;stroke:currentColor;stroke-width:2}
.gl{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.T{font-family:var(--type);font-weight:400}

/* shell, as built */
.rail{position:fixed;inset:50px auto 0 0;width:68px;background:var(--shell);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;z-index:30}
.rail img{width:38px;height:38px;margin-bottom:16px}
.rail .logo{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rail .logo img{margin:0}.rail .logo b{display:none;color:#fffaf3;font-size:20px}
.ni{display:flex;align-items:center;gap:12px;width:40px;height:40px;border-radius:10px;padding:0 10px;color:rgba(244,238,229,.7);font:15px var(--serif);white-space:nowrap;overflow:hidden}
.ni i{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1.5px currentColor}
.ni span{display:none}
.ni.on{background:rgba(255,255,255,.14);color:#fff}
.rail .fbk span,.rail .me span:last-child{display:none}
.rail .me{display:flex;align-items:center;gap:10px;color:#fffaf3;font:14px var(--serif)}
body.wide .rail{width:248px;align-items:stretch;padding:14px 14px}
body.wide .rail .logo b{display:block}
body.wide .ni{width:auto}
body.wide .ni span{display:inline}
body.wide .rail .fbk{width:auto;gap:8px;font:600 14px var(--serif)}
body.wide .rail .fbk span,body.wide .rail .me span:last-child{display:inline}
body.wide .tbar{left:248px}
body.wide .page{margin-left:248px}
.rail .fbk{margin-top:auto;width:44px;height:44px;border-radius:12px;border:1.5px solid #d9967a;display:grid;place-items:center;color:#d9967a}
.rail .av{width:34px;height:34px;border-radius:50%;background:#2d3a50;color:#f4eee5;display:grid;place-items:center;font:600 12px var(--serif);margin-top:10px}
.tbar{position:fixed;top:50px;left:68px;right:0;height:var(--top);background:var(--shell);display:flex;align-items:flex-end;padding:0 20px 0 12px;z-index:25}
.ftab{background:var(--page);border-radius:12px 12px 0 0;padding:12px 26px 14px;font:400 22px var(--type)}
.tbar .r{margin-left:auto;align-self:center;display:flex;gap:10px;align-items:center}
.srch{width:196px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(244,238,229,.6);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:15px}
.lq{display:flex;height:40px;border-radius:10px;background:#fffaf3;overflow:hidden;font:600 16px var(--serif)}
.lq b{display:flex;align-items:center;padding:0 14px}
.lq i{display:grid;place-items:center;width:34px;border-left:1px solid #e3dbd0;font-style:normal}
.help{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#f4eee5;font-weight:600}
.page{margin-left:68px;padding-top:calc(var(--top) + 50px)}
.sheet{background:var(--page);border-radius:0 18px 0 0;min-height:calc(100vh - var(--top));padding:14px var(--edge) 40px}
.cols{align-items:start!important}
.feedcol{position:sticky;top:calc(var(--top) + 64px);height:calc(100vh - var(--top) - 78px)}

/* header, as built */
.hero{background:var(--shell);border-radius:18px;color:#fffaf3;padding:14px 28px 16px;display:flex;align-items:center;gap:24px;margin-bottom:14px}
.hero .ey{font:500 11px var(--mono);letter-spacing:.14em;color:#d9967a}
.hero h1{margin:3px 0 0;font:400 38px/1 var(--type)}
.hero .by{display:flex;align-items:center;gap:12px;margin-top:6px;font:italic 17px var(--serif);color:rgba(244,238,229,.75)}
.hero .by::before,.hero .by::after{content:"";height:1px;width:40px;background:rgba(244,238,229,.3)}
.hero .acts{margin-left:auto;display:flex;gap:10px}
.hb{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:12px;font:600 17px var(--serif);border:1px solid rgba(244,238,229,.25);color:#fffaf3;white-space:nowrap}
.hb.pri{background:#fffaf3;color:var(--ink);border-color:#fffaf3}
.hb svg{width:17px;height:17px}

/* three columns */
.cols{display:grid;grid-template-columns:31fr 38fr 31fr;column-gap:30px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* framed card, as built */
.fc{background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 8px rgba(28,19,15,.06)}
.fc>.fr{border:1px solid var(--frame);border-radius:11px;overflow:hidden;height:100%;display:flex;flex-direction:column;background:#fff}
.bd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;font:400 23px var(--type);min-height:48px}
.bd.navy{background:var(--band);color:#fffaf3}
.bd.grey{background:var(--stone)}
.bd.slate{background:var(--slate);color:#fffaf3}

/* active / closed toggle */
.tg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.tg button{height:30px;padding:0 12px;border-radius:999px;font:600 13.5px var(--serif);color:rgba(255,250,243,.8)}
.tg button[aria-pressed="true"]{background:#fffaf3;color:var(--navy)}
.qv{position:relative;flex:1;min-height:262px}
.wks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font:11px var(--serif);color:var(--muted);text-align:center}
.qnote{font:italic 13.5px var(--serif);color:var(--muted)}
.cl{display:flex;align-items:center;justify-content:center;gap:24px;position:absolute;inset:0;padding:0 18px}
.cl .rg{width:190px;height:190px;position:relative;flex:none}
.cl .rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.cl .rg img{position:absolute;inset:20px;width:150px;height:150px;object-fit:contain}
.key{display:grid;gap:7px;font:16px var(--serif)}
.key div{display:flex;align-items:baseline;gap:9px}
.key i{width:10px;height:10px;border-radius:2px;flex:none}
.key b{font:400 21px var(--type);min-width:18px}
.key a{margin-top:4px;font:600 14.5px var(--serif);color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* agents on file */
.aof .body{flex:1;display:flex;align-items:center;gap:18px;padding:14px 18px}
.aof .rg{width:120px;height:120px;position:relative;flex:none}
.aof .rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.aof .rg .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 36px/1 var(--type)}
.aof .rg .n small{font:10px var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:4px}

/* up next, as built */
.un .pg{display:flex;align-items:center;gap:8px;font:15px var(--serif)}
.un .pg button{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center}
.un .pg svg{width:12px;height:12px}
.segs{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;padding:0 14px 9px;background:var(--stone)}
.segs i{height:3px;border-radius:2px;background:rgba(28,19,15,.14)}
.segs i.on{background:var(--ink)}.segs i.dn{background:rgba(28,19,15,.38)}
.un .who{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 0}
.un .ini{width:42px;height:42px;border-radius:50%;background:#b9b1a8;color:#fff;display:grid;place-items:center;font:600 13px var(--mono);flex:none}
.un h4{margin:0;font:400 20px/1.25 var(--serif)}
.un h4 b{font-weight:700}
.un .ag{font:11px var(--mono);letter-spacing:.08em;color:var(--muted);margin-top:4px}
.un .rule{font:11px var(--mono);letter-spacing:.06em;color:var(--ink2);margin:10px 16px 6px}
.hatch{height:10px;border-radius:6px;margin:0 16px;background:repeating-linear-gradient(-45deg,#d6d0c8 0 5px,#ece8e3 5px 10px);position:relative}
.hatch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8%;background:#a9a199;border-radius:6px 0 0 6px}
.hatch::after{content:"";position:absolute;left:8%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.hrow{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin:5px 16px 0}
.un .ft{display:flex;align-items:center;gap:12px;padding:10px 14px 11px;margin-top:12px;border-top:1px solid var(--hair2)}
.vt{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:9px;background:var(--navy);color:#fff;font:600 15px var(--serif)}
.un .ft>span:not(.vt){font:14.5px var(--serif);color:var(--muted)}

/* founding, as built (at 90% width) */
.fw{background:#fff;border-radius:16px;padding:6px;transform:rotate(-1.2deg);box-shadow:0 2px 8px rgba(28,19,15,.06),0 12px 26px rgba(28,19,15,.07);margin:6px 4px 0}
.fw .fr{border:1px solid var(--frame);border-radius:11px;overflow:hidden}
.fw-h{display:flex;align-items:center;gap:9px;padding:10px 14px;background:repeating-linear-gradient(-45deg,#f5e2da 0 12px,#efd5ca 12px 24px)}
.fw-h img{width:26px;height:26px}
.fw-h b{font:400 19px var(--type);white-space:nowrap}
.fw-h small{margin-left:auto;font:500 10px var(--mono);letter-spacing:.12em;white-space:nowrap}
.fw-h .i{width:21px;height:21px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:grid;place-items:center;font:600 11px var(--serif);margin-left:6px}
.fw-b{display:flex;gap:14px;padding:14px 14px 12px;background:#fdf8f5}
.egg{width:84px;height:100px;border-radius:12px;background:#f6e4dc;box-shadow:inset 0 0 0 1px #ead3c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:none}
.egg span{font:500 10px var(--mono);letter-spacing:.14em;color:var(--ink2)}
.fw-b h4{margin:2px 0 6px;font:400 20px/1.2 var(--type)}
.fw-b p{margin:0 0 10px;font:14.5px/1.4 var(--serif);color:var(--ink2)}
.pills{display:flex;gap:5px;flex-wrap:nowrap}
.pills span{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px;border-radius:9px;background:#fff;border:1px solid #e3cfc6;font:600 13.5px var(--serif)}
.pills svg{width:14px;height:14px}
.fw-f{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px dashed #e3cfc6;background:#fdf8f5}
.ranks{display:flex;flex:none}
.ranks span{width:28px;height:28px;border-radius:50%;background:#efe9e2;box-shadow:0 0 0 2px #fdf8f5;margin-left:-7px;display:grid;place-items:center;overflow:hidden}
.ranks span:first-child{margin-left:0;background:#fff;box-shadow:0 0 0 2px #fdf8f5,inset 0 0 0 1.5px var(--ink)}
.ranks img{width:20px;height:20px;filter:grayscale(1);opacity:.55}
.fw-f p{margin:0;font:13px/1.35 var(--serif);color:var(--ink2)}

/* ===== the feed, as first designed ===== */
.feedcol{min-height:0;display:flex;flex-direction:column}
.fsw{display:flex;background:var(--fill);border-radius:999px;padding:3px;margin-bottom:10px;flex:none}
.fsw button{flex:1;height:32px;border-radius:999px;font:600 14px var(--serif);color:var(--ink2)}
.fsw button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,19,15,.12)}
.fscroll{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px 8px;mask-image:linear-gradient(#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.day{display:flex;align-items:baseline;gap:8px;margin:12px 2px 8px;font:600 14px var(--serif)}
.day:first-child{margin-top:2px}
.day span{color:var(--muted);font-weight:400}
.day::after{content:"";flex:1;height:1px;background:#ddd5ca;transform:translateY(-4px)}
.entry{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,19,15,.07);padding:16px 16px 14px;margin-bottom:10px}
.eh{display:flex;gap:11px;align-items:center}
.disc{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 13px var(--serif);flex:none}
.disc.me{background:#8a4a3c}
.eh b{display:block;font:600 15.5px var(--serif)}
.eh small{display:block;font:13px var(--serif);color:var(--muted)}
.et{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.et .ico{width:24px;flex:none;display:grid;place-items:center}
.et h3{margin:0;font:400 21px/1.2 var(--type)}
.figs{display:flex;margin-left:34px}
.figs div{padding-right:14px;margin-right:14px;border-right:1px solid var(--hair2)}
.figs div:last-child{border:0;margin-right:0}
.figs small{display:block;font:12.5px var(--serif);color:var(--muted)}
.figs b{display:block;font:400 19px var(--type);margin-top:1px}
.journey{margin-top:12px;border-radius:10px;background:var(--t,#fdfaf5);padding:14px 14px 10px}
.trk{display:flex}
.trk .s{flex:1;position:relative;min-width:0}
.trk .s .d{position:relative;z-index:1;width:18px;height:18px;display:block}
.trk .s .d svg{width:18px;height:18px;background:var(--t,#fdfaf5);border-radius:50%}
.trk .s .ln{position:absolute;top:8px;left:21px;right:3px;height:2px;background:var(--ink)}
.trk .s.to .ln{background:none;border-top:2px dashed rgba(28,19,15,.3);height:0}
.trk .s.last{flex:none;width:88px}.trk .s.last .ln{display:none}
.trk .s.nx{opacity:.5}
.trk .s b{display:block;font:400 11.5px/1.2 var(--type);margin-top:6px;padding-right:4px}
.trk .s small{display:block;font:11px var(--serif);color:var(--muted);margin-top:1px}
.jf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(28,19,15,.08);font:13px var(--serif);color:var(--muted)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:#ece8f3;box-shadow:inset 0 0 0 1px #ddd6ea;font:600 12px var(--serif);color:var(--ink)}
.btn{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;font:600 13px var(--serif);background:#fff;box-shadow:inset 0 0 0 1px #d9cfc1;color:var(--ink);white-space:nowrap}
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mat{border-radius:8px;padding:10px 10px 9px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;background:#fbf6ee;box-shadow:inset 0 0 0 1px var(--hair2)}
.mat .lines{display:grid;gap:4px}
.mat .lines i{display:block;height:3px;border-radius:2px;background:#e3d9cb}
.mat .lines i:nth-child(2){width:86%}.mat .lines i:nth-child(3){width:62%}
.mat b{font:600 12.5px var(--serif)}
.mat small{display:block;font:11px var(--serif);color:var(--muted)}
.mini{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,19,15,.07);margin-bottom:8px;font:14.5px/1.35 var(--serif)}
.mini .g{flex:none;display:grid}
.mini .tx{flex:1}
.mini time{font:11.5px var(--mono);color:var(--faint);white-space:nowrap}
.fend{text-align:center;padding:10px 0 14px;font:14px var(--serif);color:var(--muted)}
.fend a{color:var(--ink);font-weight:600}

/* manuscript card (replaces the navy band) */
.book{background:var(--shell);color:#fffaf3;border-radius:16px;padding:14px 14px 12px;box-shadow:0 8px 20px rgba(27,36,51,.18)}
.bk-top{display:flex;gap:14px;align-items:center}
.book .cov{width:46px;height:66px;border-radius:2px 5px 5px 2px;flex:none;background:linear-gradient(135deg,#efd5cb,#e3bfb2);box-shadow:0 6px 14px rgba(0,0,0,.35);padding:7px 5px 0 8px;position:relative}
.book .cov::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent)}
.book .cov span{font:400 8.5px/1.15 var(--type);color:#2a2320}
.book .ey{font:500 10.5px var(--mono);letter-spacing:.16em;color:#d9967a}
.book h1{margin:2px 0 0;font:400 28px/1.05 var(--type)}
.book .by{font:italic 15px var(--serif);color:rgba(244,238,229,.75);margin-top:3px}
.bk-acts{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.ba{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:9px;font:600 13.5px var(--serif);color:#fffaf3;box-shadow:inset 0 0 0 1px rgba(244,238,229,.25);white-space:nowrap}
.ba.pri{background:#fffaf3;color:var(--ink);box-shadow:none}
.ba svg{width:14px;height:14px}
#qz{display:flex}
.qv{height:224px!important;flex:none!important}
#qz>.fr{flex:1}
.qv{min-height:0}
.fw-f p{white-space:nowrap}

.strip{position:fixed;top:0;left:0;right:0;height:50px;z-index:90;background:#fffaf3;display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid #e3dbd0}
.strip b.T{font-size:17px}
.grp{display:flex;align-items:center;gap:7px}
.grp>span{font:13px var(--serif);color:var(--muted)}
.sg{display:flex;background:var(--fill);border-radius:999px;padding:3px}
.sg button{height:30px;padding:0 11px;border-radius:999px;font:600 13px var(--serif);color:var(--ink2);white-space:nowrap}
.sg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.copy{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--navy);color:#fff;font:600 13px var(--serif)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk7 em{font:normal 600 10.5px var(--serif);color:rgba(244,238,229,.6)}
.wk7 i{display:grid;place-items:center;width:26px;height:26px;margin:4px auto 0;border-radius:50%;font:normal 600 11px var(--serif);background:rgba(255,255,255,.1);color:rgba(255,255,255,.75)}
.wk7 i.s{background:#fffaf3;color:var(--navy)}.wk7 i.t{background:none;box-shadow:inset 0 0 0 2px #fffaf3;color:#fff}.wk7 i.f{background:none;color:rgba(255,255,255,.35)}
.wk7.lt em{color:var(--muted)}.wk7.lt i{background:var(--fill);color:var(--ink2)}.wk7.lt i.s{background:var(--navy);color:#fff}.wk7.lt i.t{background:#fff;box-shadow:inset 0 0 0 2px var(--navy);color:var(--navy)}.wk7.lt i.f{background:none;color:var(--faint)}
/* A */
.bx{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.bxrow{display:flex;align-items:center;gap:14px;margin-top:12px}
.flame{display:flex;align-items:center;gap:8px;font:13px var(--serif);color:rgba(244,238,229,.8)}
.flame b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8c8bc;color:var(--ink);font:400 16px var(--type)}
.stt{margin-left:auto;display:flex;gap:16px;font:13px var(--serif);color:rgba(244,238,229,.75)}
.stt b{display:block;font:400 22px/1 var(--type);color:#fff}
/* B */
.gsheet{background:#fff;border-radius:0 0 16px 16px;margin:-10px 0 0;padding:22px 16px 14px;box-shadow:0 2px 8px rgba(28,19,15,.06);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;z-index:0}
.book{position:relative;z-index:1}
.gring{position:relative;width:96px;height:96px}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 26px/1 var(--type)}
.gring small{font:11.5px var(--serif);color:var(--muted);margin-top:3px}
.gbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbox div{background:var(--page);border-radius:10px;padding:8px 10px}
.gbox b{display:block;font:400 22px/1 var(--type)}
.gbox span{font:12.5px var(--serif);color:var(--ink2)}
.gbox em{display:block;font:normal 11.5px var(--serif);color:var(--muted);margin-top:2px}
.gstreak{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--hair2);font:13.5px var(--serif)}
.gstreak i{width:20px;height:6px;border-radius:3px;background:var(--navy)}
.gstreak i.o{background:var(--fill)}
/* C */
.cells{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.cells>div{padding:12px 10px 2px;font:12.5px var(--serif);color:rgba(244,238,229,.72)}
.cells>div+div{border-left:1px solid rgba(255,255,255,.12)}
.cells b{display:block;font:400 24px/1.05 var(--type);color:#fff;margin-bottom:2px}
.minibar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.minibar i{display:block;height:100%;width:60%;background:#e8c8bc;border-radius:3px}
.dots{display:flex;gap:3px;margin-top:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#e8c8bc}.dots i.o{background:rgba(255,255,255,.18)}
/* up next variants */
.task{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:hidden}
.tk-h{display:flex;align-items:center;gap:10px;padding:10px 14px}
.tk-h .T{font-size:21px}
.pg{margin-left:auto;display:flex;align-items:center;gap:6px;font:14px var(--serif)}
.pg button{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center}
.pg svg{width:12px;height:12px}
.todo{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font:600 12px var(--serif)}
.box{width:26px;height:26px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--ink);flex:none;margin-top:3px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font:14px var(--serif);color:var(--ink2)}
.steps li{display:flex;gap:8px;align-items:center}
.steps li i{width:20px;height:20px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:normal 600 11px var(--serif);flex:none}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:10px;background:var(--navy);color:#fff;font:600 15.5px var(--serif)}
.tk-b{padding:14px}
.due{font:600 13px var(--serif);color:#7c3a2a}
.ticket{display:grid;grid-template-columns:96px 1fr;background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:hidden}
.stub{background:#7c3a2a;color:#fffaf3;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;position:relative;border-right:2px dashed rgba(255,250,243,.5)}
.stub small{font:500 10px var(--mono);letter-spacing:.14em}
.stub b{font:400 30px/1 var(--type)}
.stub span{font:12.5px var(--serif);opacity:.85}
/* right extras */
.tip{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.tip img{width:92px;flex:none}
.bubble{position:relative;background:#fff;border-radius:16px;padding:14px 14px 12px;box-shadow:0 2px 8px rgba(28,19,15,.06);flex:1}
.bubble::after{content:"";position:absolute;left:-8px;bottom:22px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bubble .T{font-size:19px}
.bubble p{margin:6px 0 10px;font:14.5px/1.45 var(--serif);color:var(--ink2)}
.bubble .nx{display:flex;justify-content:space-between;font:600 13.5px var(--serif)}
.bubble .nx span{color:var(--muted);font-weight:400}
.cu{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);padding:12px 14px 6px}
.cu .T{font-size:20px}
.cu-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair2)}
.cu-row:first-of-type{border-top:0}
.cal{width:38px;flex:none;text-align:center;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.cal small{display:block;background:var(--stone);font:600 9.5px var(--mono);letter-spacing:.08em;padding:2px 0}
.cal b{display:block;font:400 17px/1.4 var(--type)}
.cu-row .t b{display:block;font:600 14px var(--serif)}
.cu-row .t span{font:12.5px var(--serif);color:var(--muted)}
.cu-row .gd{margin-left:auto;display:grid;color:var(--ink)}
.cu .all{display:flex;justify-content:space-between;padding:10px 0 8px;border-top:1px solid var(--hair2);font:600 14px var(--serif)}
.sc{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:hidden}
.sc-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--slate);color:#fff;font:600 13px var(--serif)}
.sc-b{padding:12px 14px}
.sc-b .who{display:flex;gap:10px;align-items:center}
.sc-b .ini{width:38px;height:38px;border-radius:50%;background:#467a76;color:#fff;display:grid;place-items:center;font:600 13px var(--serif)}
.why{margin:10px 0;padding:9px 11px;border-radius:10px;background:#e3eaf0;font:13.5px var(--serif)}
.sc-b .acts{display:flex;gap:8px}
.sc-b .acts span{flex:1;display:flex;align-items:center;justify-content:center;height:36px;border-radius:9px;font:600 14px var(--serif);box-shadow:inset 0 0 0 1px #d9cfc1}
.sc-b .acts span.p{background:var(--navy);color:#fff;box-shadow:none}

.scs{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:hidden;margin-top:4px}
.scs .sc-h{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--slate);color:#fff;font:600 13.5px var(--serif)}
.soon{font:600 11.5px var(--serif);background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px}
.scs .sc-b{padding:12px 14px 14px}
.faces{display:flex;flex:none}
.faces span{width:32px;height:32px;border-radius:50%;background:#dfe6ec;color:#6a89a7;display:grid;place-items:center;font:600 13px var(--serif);box-shadow:0 0 0 2px #fff;margin-left:-8px}
.faces span:first-child{margin-left:0}
.notify{margin-top:12px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);box-shadow:inset 0 0 0 1px #d9cfc1}
.foot{padding:18px 4px 10px;border-top:1px solid #ddd5ca;margin-top:6px}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 18px;font:14.5px var(--serif);color:var(--ink2)}
.fsel{display:flex;gap:8px;margin:16px 0 12px}
.fsel span{height:38px;padding:0 14px;display:flex;align-items:center;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px #d9cfc1;font:14.5px var(--serif)}
.foot small{font:13.5px var(--serif);color:var(--muted)}
/* expanded sidebar: keep things from cramping */

/* narrower screens or expanded sidebar: two columns, tasks first */
.sheet{container-type:inline-size}
@container (max-width:1300px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr)!important;column-gap:26px!important;row-gap:14px}
  .cL{display:contents}
  .cL>*{grid-column:1}
  .cL>:first-child{grid-row:1}
  .cL>.gsheet,.cL>.bx{grid-row:2;margin-top:-14px}
  .cR{display:contents}
  .cR>*{grid-column:1;margin-top:0}
  .cR>:nth-child(1){grid-row:3}.cR>.tipc{grid-row:4}.cR>.scout2{grid-row:5}
  .cL>#qz{grid-row:6}.cL>.aof{grid-row:7}.cL>.fw{grid-row:8}.cR>.foot{grid-row:9}
  .feedcol{grid-column:2;grid-row:1 / span 9}
}
.bd{white-space:nowrap}

.scout2{--sc:#6a89a7;--sc-soft:#e3eaf0;--sc-line:#d5dfe8;--sc-ink:#fffaf3;--sc-mute:#c3cfdb;background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:hidden;margin-top:4px}
.s2-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--sc);color:var(--sc-ink)}
.s2-h .T{font-size:21px}
.s2-art{background:linear-gradient(var(--sc) 0 50%,#fff 50%);display:flex;justify-content:center;padding:0 0 4px}
.s2-art img{height:150px;width:150px;object-fit:contain;border-radius:50%;background:var(--sc-soft);box-shadow:0 0 0 6px #fff}
.s2-b{padding:10px 18px 18px}
.s2-b h3{margin:0 0 6px;font:400 21px/1.2 var(--type);text-align:center}
.s2-b p{margin:0 0 14px;font:14.5px/1.5 var(--serif);color:var(--ink2);text-align:center}
.ghost{position:relative;border-radius:12px;padding:12px;background:#fbfaf8;box-shadow:inset 0 0 0 1.5px var(--sc-line);opacity:.9}
.ghost .ex{position:absolute;top:-9px;right:12px;background:#fff;border-radius:999px;padding:1px 9px;font:600 11.5px var(--serif);color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc-line)}
.gw{display:flex;gap:10px;align-items:center}
.gi{width:36px;height:36px;border-radius:50%;background:#467a76;color:#fff;display:grid;place-items:center;font:600 12.5px var(--serif);flex:none;filter:saturate(.6)}
.gw b{display:block;font:600 14.5px var(--serif)}
.gw small{font:12.5px var(--serif);color:var(--muted)}
.gwhy{margin:9px 0;padding:7px 10px;border-radius:9px;background:var(--sc-soft);font:13px var(--serif)}
.gacts{display:flex;gap:6px}
.gacts span{flex:1;height:30px;border-radius:8px;display:grid;place-items:center;font:600 12.5px var(--serif);box-shadow:inset 0 0 0 1px var(--sc-line);color:var(--muted)}
.gacts span.p{background:var(--sc-mute);color:#fff;box-shadow:none}
.scout2 .notify{margin-top:14px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 14.5px var(--serif);background:var(--sc);color:var(--sc-ink);box-shadow:none}

.cL .fw{margin:4px 6px 0}
.tipc{position:relative;background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(28,19,15,.06);overflow:visible;margin-top:6px}
.tip-band{display:flex;align-items:center;gap:10px;padding:12px 16px 30px;border-radius:16px 16px 0 0;background:repeating-linear-gradient(-45deg,#f5e2da 0 12px,#efd5ca 12px 24px)}
.tip-band .T{font-size:22px}
.tip-n{font:600 12.5px var(--serif);background:#fff;border-radius:999px;padding:3px 10px;color:var(--ink2)}
.tip-art{position:absolute;right:10px;top:-34px;height:132px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(28,19,15,.12))}
.tip-b{position:relative;background:#fff;border-radius:16px 16px 16px 16px;margin-top:-18px;padding:16px 18px 14px}
.tip-b h4{margin:0 92px 8px 0;font:400 21px/1.2 var(--type)}
.tip-b p{margin:0;font:16px/1.5 var(--serif);color:var(--ink2)}
.tip-f{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair2)}
.tip-dots{display:flex;gap:5px;margin-right:auto}
.tip-dots i{width:7px;height:7px;border-radius:50%;background:var(--fill)}
.tip-dots i.on{width:18px;border-radius:4px;background:#b9786a}
.tip-x{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center}
.tip-x svg{width:14px;height:14px}
.tip-x:hover{background:var(--page)}

.scout2.sB{--sc:#5d5a7e;--sc-soft:#e7e5ef;--sc-line:#d9d6e6;--sc-mute:#bdb9d0}
.scout2.sC{--sc:#2d3a50;--sc-soft:#e4e8ee;--sc-line:#d6dbe3;--sc-mute:#aab3c1}
.scout2.sD{--sc:#c99a45;--sc-ink:#2a2118;--sc-soft:#f5ebd6;--sc-line:#ead9b6;--sc-mute:#dcc394}
.scout2.sD .soon{background:rgba(255,255,255,.4)}
/* tip B notebook */
.tB .nb-h{position:relative;border-radius:16px 16px 0 0;padding:20px 16px 12px 48px;background:#fbf7ee repeating-linear-gradient(transparent 0 23px,#dfe6ee 23px 24px);border-bottom:2px solid #e4b9ad}
.tB .nb-h::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:1.5px;background:#e4b9ad}
.tB .nb-holes{position:absolute;left:12px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly}
.tB .nb-holes i{width:11px;height:11px;border-radius:50%;background:var(--page);box-shadow:inset 0 1px 2px rgba(28,19,15,.3)}
.tB .nb-row{display:flex;align-items:center;gap:10px}
.tB .T{font-size:22px}
.tB .tip-art{top:-26px;height:118px}
.tB .tip-b{margin-top:0;border-radius:0 0 16px 16px}
/* tip C mentor says */
.tC{padding:16px 16px 0}
.tC .ms-h{display:flex;align-items:center;gap:12px}
.tC .ms-av{width:58px;height:58px;border-radius:50%;background:#f5e2da;overflow:hidden;flex:none;display:grid;place-items:end center}
.tC .ms-av img{height:66px;transform:translateY(8px)}
.tC .ms-h .T{font-size:22px;display:block}
.tC .ms-h small{font:13px var(--serif);color:var(--muted)}
.tC .ms-bub{position:relative;margin-top:14px;padding:14px 16px;border-radius:14px;background:#f8efe9}
.tC .ms-bub::before{content:"";position:absolute;left:22px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#f8efe9}
.tC .ms-bub h4{margin:0 0 6px;font:400 20px/1.2 var(--type)}
.tC .ms-bub p{margin:0;font:15.5px/1.5 var(--serif);color:var(--ink2)}
.tC .tip-b{margin:0;padding:0 0 14px;background:none}
.tC .tip-f{border-top:0;margin-top:10px;padding-top:0}
/* tip D pinned note */
.tD{background:#fbf1cf;transform:rotate(-.8deg);margin:12px 6px 0;border-radius:4px 4px 16px 4px;box-shadow:0 8px 18px rgba(28,19,15,.10),0 1px 0 rgba(28,19,15,.05)}
.tD .pin{position:absolute;left:50%;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7d93ab,#2d3a50);box-shadow:0 3px 4px rgba(28,19,15,.3);transform:translateX(-50%);z-index:2}
.tD .pn-h{display:flex;align-items:center;gap:10px;padding:18px 18px 4px}
.tD .T{font-size:22px}
.tD .tip-n{background:rgba(255,255,255,.65)}
.tD .tip-art{top:-24px;height:112px}
.tD .tip-b{background:none;margin:0;padding:8px 18px 14px}
.tD .tip-f{border-top-color:rgba(28,19,15,.12)}
.tD .tip-x{background:rgba(255,255,255,.5)}

.tip-art{transform:none}
.tA .tip-art,.tB .tip-art,.tD .tip-art{height:auto;width:150px;top:-40px;right:4px}
.tip-b h4{margin-right:120px}
.tC .ms-art{width:96px;margin:-30px 0 -6px -6px;flex:none}

.tA{overflow:hidden}
.tA .tip-band{background:#f7e49a;padding:12px 18px;border-bottom:1px solid #ecd47a}
.tA .tip-n{background:rgba(255,255,255,.7)}
.tA .tip-b{margin:0;border-radius:0 0 16px 16px;padding:14px 18px 14px}
.ta-row{display:flex;gap:10px;align-items:flex-end}
.ta-txt{flex:1;min-width:0}
.tA .tip-b h4{margin:0 0 8px}
.ta-art{width:118px;height:auto;flex:none;margin:0 -6px -4px 0}

.scout2.sE{--sc:#ecd3ca;--sc-ink:#3a2a24;--sc-soft:#f8ece7;--sc-line:#efdcd5;--sc-mute:#dcbcb1}
.scout2.sE .soon{background:#fff;color:#8a5a4c}
.tY{overflow:hidden;margin-top:6px}
.ty-h{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:112px;padding:0 10px 0 20px;background:#f8e9a8;background-image:radial-gradient(circle at 85% 120%,#fbf1c9 0 38%,transparent 39%)}
.ty-l{align-self:center;display:grid;gap:4px}
.ty-l .T{font-size:25px;line-height:1}
.ty-l small{font:13.5px var(--serif);color:#6f5d33}
.ty-h img{height:104px;width:auto;display:block;margin-bottom:-1px}
.ty-b{padding:16px 20px 14px}
.ty-b h4{margin:0 0 8px;font:400 21px/1.25 var(--type)}
.ty-b p{margin:0;font:16px/1.55 var(--serif);color:var(--ink2)}
.ty-b .tip-f{margin-top:14px}
.tY .tip-dots i.on{background:#c9a93f}
.scout2.sE .notify{background:#b9786a;color:#fff}.scout2.sE .ghost .ex{color:#a0675a}

.ty-swap{display:grid}
.ty-it{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .35s ease,transform .35s ease,visibility 0s linear .35s}
.ty-it.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease .12s,transform .35s ease .12s,visibility 0s}
.ty-it.leave{transform:translateX(calc(var(--dx) * -1))}
.ty-it.enter{transform:translateX(var(--dx));transition:none}
.ty-b .ty-it h4{margin:0 0 8px;font:400 21px/1.25 var(--type)}
.tY .tip-dots i{cursor:pointer;transition:width .25s ease,background .25s ease;position:relative;overflow:hidden}
.tY .tip-dots i.on{width:26px;background:#eadfb8}
.tY .tip-dots i.on::after{content:"";position:absolute;inset:0;background:#c9a93f;transform-origin:left;transform:scaleX(1)}
.tY .tip-dots i.run::after{animation:tipfill 7s linear forwards}
.tY.paused .tip-dots i.run::after{animation-play-state:paused}
@keyframes tipfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.ty-it,.ty-it.on{transition:none}}
</style>
</head>

function drawFill(){
  const c=document.getElementById('afill');if(!c)return;const box=document.getElementById('achart');
  const v=[2,4,7,9,11,13,14,15,16,17,18,18],W=300,H=150,max=26;
  const dpr=devicePixelRatio||1,cw=c.clientWidth,ch=c.clientHeight,bw=box.clientWidth;c.width=cw*dpr;c.height=ch*dpr;
  const k=c.getContext('2d');k.scale(dpr,dpr);
  const X=i=>(i*(W-10)/(v.length-1)+5)/W*bw,Y=n=>(H-n/max*H)/H*ch;
  const P=v.map((n,i)=>[X(i),Y(n)]);k.beginPath();k.moveTo(P[0][0],ch);k.lineTo(...P[0]);
  for(let i=1;i<P.length;i++){const[a,b]=P[i-1],[q,e]=P[i],m=(a+q)/2;k.bezierCurveTo(m,b,m,e,q,e);}
  k.lineTo(cw,P[11][1]);k.lineTo(cw,ch);k.closePath();
  const gr=k.createLinearGradient(0,P[11][1]-20,0,ch);gr.addColorStop(0,'rgba(45,58,80,.32)');gr.addColorStop(1,'rgba(45,58,80,0)');k.fillStyle=gr;k.fill();
  /* grain: dissolve into speckles from just past the last point to the edge */
  const x0=Math.max(P[11][0]+6,cw-90)*dpr,x1=(cw-14)*dpr,img=k.getImageData(0,0,c.width,c.height),d=img.data;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let yy=0;yy<c.height;yy++)for(let xx=Math.floor(x0);xx<c.width;xx++){const t=(xx-x0)/(x1-x0),i=(yy*c.width+xx)*4;
    if(t>=1||rnd()<Math.pow(t,1.6)*1.05)d[i+3]=0;}
  k.putImageData(img,0,0);
}

 C:()=>`<div class="tipc tC"><div class="ms-h"><img class="ms-art" src="${TIPDUO}" alt=""><div><span class="T">Top tip</span><small>From the Mentor · <span id="tipn"></span></small></div></div><div class="ms-bub">${tipText}</div><div class="tip-b">${tipFoot}</div></div>`,
 D:()=>`<div class="tipc tD"><span class="pin"></span><div class="pn-h"><span class="T">Top tip</span><span class="tip-n" id="tipn"></span></div><img class="tip-art" src="${TIPDUO}" alt=""><div class="tip-b">${tipText}${tipFoot}</div></div>`
};
const SCOUT=`<div class="scout2">
  <div class="s2-h"><span class="T">The Scout</span><span class="soon">Coming soon</span></div>
  <div class="s2-art"><img src="${SCOUTIMG}" alt=""></div>
  <div class="s2-b">
    <h3>Find agents who take on books like yours</h3>
    <p>The Scout looks at your comparable titles and suggests agents who’ve signed similar books. You’ll see why each one is suggested, and no one goes on your list unless you add them.</p>
    <div class="ghost"><span class="ex">Example</span>
      <div class="gw"><span class="gi">AL</span><div><b>Amara Lewis</b><small>Juniper &amp; Co · open to submissions</small></div></div>
      <div class="gwhy">Represents two of your comparable titles</div>
      <div class="gacts"><span class="p">Add to contacts</span><span>Not for me</span></div>
    </div>
    <div class="notify">${g('bell','width:16px;height:16px')}Tell me when it’s ready</div>
  </div></div>`;
const FOOT=`<footer class="foot"><nav><a>Help centre</a><a>What’s new</a><a>Pricing</a><a>About</a><a>Contact us</a><a>Privacy</a><a>Terms</a><a>Cookies</a></nav>
  <div class="fsel"><span>Give feedback</span><span>Follow us ⌄</span></div><small>© 2026 QueryHawk</small></footer>`;
function render(){
  cols.innerHTML=`<div class="col cL">${BOOKX[O1]()}${queries}${agents}${founding}</div><div class="col feedcol" id="feedcol">${feed}</div><div class="col cR">${UPX[O2]}${TIPX[O5]()}${SCOUT.replace('class="scout2"','class="scout2 s'+O6+'"')}${FOOT}</div>`;
  /* Top tip carousel: 7s per tip, pauses on hover/focus or when the tab is hidden, no auto-advance with reduced motion */
  const TIP_MS=7000,RM=matchMedia('(prefers-reduced-motion: reduce)').matches,card=document.querySelector('.tipc');
  const items=[...card.querySelectorAll('.ty-it')];
  const paint=()=>{document.getElementById('tipn').textContent=(TI+1)+' of '+TIPS.length;
    document.querySelectorAll('#tipd i').forEach((x,i)=>{x.classList.toggle('on',i===TI);x.classList.remove('run');});
    const on=document.querySelector('#tipd i.on');if(!RM){void on.offsetWidth;on.classList.add('run');}};
  const go=(n,dir)=>{const a=items[TI],b=items[n];card.style.setProperty('--dx',(dir*14)+'px');
    items.forEach(x=>x.classList.remove('on','leave','enter'));
    if(!RM){a.classList.add('leave');b.classList.add('enter');void b.offsetWidth;b.classList.remove('enter');}
    b.classList.add('on');TI=n;paint();};
  clearInterval(window.__tipT);let paused=false;
  const start=()=>{clearInterval(window.__tipT);if(RM)return;window.__tipT=setInterval(()=>{if(!paused&&!document.hidden)go((TI+1)%TIPS.length,1);},TIP_MS);};
  const pause=v=>{paused=v;card.classList.toggle('paused',v);};
  card.addEventListener('mouseenter',()=>pause(true));card.addEventListener('mouseleave',()=>pause(false));
  card.addEventListener('focusin',()=>pause(true));card.addEventListener('focusout',()=>pause(false));
  document.getElementById('tipnext').onclick=()=>{go((TI+1)%TIPS.length,1);start();};
  document.getElementById('tipprev').onclick=()=>{go((TI+TIPS.length-1)%TIPS.length,-1);start();};
  document.querySelectorAll('#tipd i').forEach((x,i)=>x.onclick=()=>{if(i!==TI){go(i,i>TI?1:-1);start();}});
  paint();start();
  document.querySelectorAll('#qz [data-q]').forEach(b=>b.onclick=()=>showQ(b.dataset.q));showQ('active');
  document.querySelectorAll('#fsw button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fsw button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('fscroll').innerHTML=feedHTML(b.dataset.f);});
}
/* ---------- render ---------- */
const cols=document.getElementById('cols');
const showQ=k=>{document.querySelectorAll('#qz [data-q]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.q===k));document.getElementById('qt').textContent=QV[k][0];document.getElementById('qv').innerHTML=QV[k][1]();drawFill();};
function seg(id,cb){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v);render();});}
seg('o1',v=>O1=v);seg('o4',v=>document.body.classList.toggle('wide',v==='w'));seg('o2',v=>O2=v);seg('o3',v=>O3=v);seg('o5',v=>O5=v);seg('o6',v=>O6=v);
document.getElementById('copy').onclick=()=>{const t='Top tip '+O5+' · Scout '+O6;try{navigator.clipboard.writeText(t)}catch(e){}document.getElementById('copy').textContent='Copied: '+t;};
render();
function fit(){}
addEventListener('resize',()=>drawFill());addEventListener('resize',fit);fit();
</script>
</body>
