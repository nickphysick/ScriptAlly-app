<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<title>ScriptAlly — the header on scroll</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{
  --page:#efe9e4;--band:#faf7f3;--sidebar:#fdfcfa;
  --ink:#191210;--ink2:#311e19;--sub:#4d413a;--mute:#8a7a70;
  --burg:#7c3a2a;--pink:#f5e2da;--pinkb:#e8c8bc;
  --rim:#e9e1d4;--edge:#e0d8cd;--hair:#e8e2d8;
  --sage-a:#dfe4dc;--sage-b:#d9dfd6;
  --win-r:18px;--gut:36px;
  --bar-h:44px;                       /* the slim header */
  --ease:cubic-bezier(.2,.8,.2,1);   /* deceleration curve — fast out, soft landing */
 }
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--page);font-family:'Inter',sans-serif;color:var(--ink);padding:14px 16px 24px}
 .tabs{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
 .tab{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:7px 12px;border:1px solid #cabfb5;border-radius:7px;background:#efe8e2;cursor:pointer;color:var(--ink)}
 .tab.on{background:var(--ink);color:#f6f0ea;border-color:var(--ink)}
 .rd{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:#8d7f75;margin:0 2px 8px}
 .rd b{color:var(--burg)}
 .spec{font-size:12.5px;color:#4d413a;margin:0 2px 11px;max-width:1160px;line-height:1.65}
 .spec b{color:var(--ink)} .spec code{font-family:'JetBrains Mono',monospace;font-size:10px;background:#f4efe7;border:1px solid #e2d8ca;border-radius:4px;padding:1px 5px}

 .shell{display:flex;background:var(--page);height:600px;overflow:hidden}
 .side{flex:0 0 184px;background:var(--sidebar);border-right:1px solid var(--hair);padding:14px 11px}
 .brand{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-size:18px;font-weight:700;padding:2px 4px 12px}
 .brand svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.4}
 .navh{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.16em;color:#a2968c;margin:11px 6px 4px}
 .nv{display:flex;align-items:center;gap:9px;font-size:12px;padding:7px 8px;border-radius:9px;color:#4d3b33}
 .nv svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
 .nv.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(58,28,20,.06)}
 .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
 .topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:50px}
 .crumb{font-family:'Playfair Display',serif;font-size:15.5px;color:var(--mute)}
 .crumb b{color:var(--ink);font-weight:700}
 .sp{flex:1}
 .np{background:#1c130f;color:#fdfaf5;border-radius:999px;font-size:12px;padding:8px 15px;font-weight:600}
 .win{background:var(--band);border:1px solid var(--edge);border-radius:var(--win-r) var(--win-r) 0 0;margin:0 18px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
 .scroll{flex:1;min-height:0;overflow-y:auto;position:relative}

 /* ══ THE SLIM HEADER ══
    Opaque. Content scrolls BEHIND it, never through it.
    A sticky element inside the scroller, drawn above content by z-index;
    its own background is the page band, fully opaque, so nothing reads through. */
 .slim{position:sticky;top:0;z-index:30;height:var(--bar-h);background:var(--band);
   display:flex;align-items:center;gap:10px;padding:0 var(--gut);
   margin-bottom:calc(var(--bar-h) * -1);          /* reserves no space */
   opacity:0;transform:translateY(-6px);pointer-events:none;
   border-bottom:1px solid transparent;
   transition:opacity 160ms linear,transform 220ms var(--ease),border-color 200ms,box-shadow 240ms}
 body.stuck .slim{opacity:1;transform:none;pointer-events:auto;
   border-bottom-color:var(--edge);
   box-shadow:0 8px 14px -12px rgba(25,18,16,.28)}
 .slim .ic{width:22px;height:22px;flex:0 0 22px}
 .slim .ic img{width:100%;height:100%;object-fit:contain;display:block}
 .slim b{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:600;letter-spacing:-.005em;color:var(--ink)}
 .slim .cnt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--mute);margin-left:4px}
 .slim .cta{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#1c130f;border-radius:999px;padding:6px 13px;
   font-size:12px;font-weight:600;color:#fdfaf5}
 .slim .cta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
 body[data-v="b"] .slim b{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
 body[data-v="c"] .slim .cta{display:none}
 body[data-v="c"] .slim .cnt{display:none}
 body[data-v="d"] .slim{transition:none}

 /* ══ THE FULL HEADER — scrolls away as content, never animated ══ */
 .toprule{height:1px;background:#e6ded3;margin:7px var(--gut) 0}
 .hd{border-bottom:1px solid var(--edge);background:var(--band)}
 .hdin{display:flex;align-items:center;gap:20px;padding:20px var(--gut)}
 .tile{flex:0 0 72px;width:72px;height:72px}
 .tile img{width:100%;height:100%;object-fit:contain;display:block}
 .hdt{flex:1;min-width:0}
 .hdt h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:1.16;letter-spacing:-.01em}
 .hdt p{font-family:'Playfair Display',serif;font-size:14.5px;color:var(--sub);margin-top:4px;line-height:1.4}
 .cta{display:inline-flex;align-items:center;gap:8px;background:#1c130f;border-radius:999px;padding:9px 17px;font-size:13px;font-weight:600;color:#fdfaf5;white-space:nowrap}
 .cta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

 /* ══ THE TOOLBAR — content; pins beneath the slim header ══ */
 .tools{display:flex;align-items:center;gap:10px;padding:13px var(--gut);background:var(--band);
   position:sticky;top:var(--bar-h);z-index:20;border-bottom:1px solid transparent;transition:border-color .2s}
 body.stuck .tools{border-bottom-color:var(--hair)}
 .cnt2{font-family:'Playfair Display',serif;font-size:17px;font-weight:600}
 .srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rim);border-radius:999px;padding:0 13px;height:34px;font-size:12.5px;color:#a2968c;width:270px}
 .tb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--rim);background:#fff;font-size:12.5px;color:#4d3b33;white-space:nowrap}

 .cards{padding:18px var(--gut) 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 .ac{border:1px solid var(--rim);border-radius:14px;background:#fff;overflow:hidden}
 .ach{background:linear-gradient(180deg,var(--sage-a),var(--sage-b));padding:9px 14px}
 .ach .pill{border:1px solid rgba(25,18,16,.18);border-radius:999px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.12em;color:#3f4c3c}
 .acb{padding:15px 16px}
 .acb .nm{display:flex;align-items:center;gap:12px}
 .avr{width:42px;height:42px;border-radius:50%;border:1px solid var(--rim);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7d6a60}
 .acb h3{font-family:'Playfair Display',serif;font-size:19px;font-weight:700}
 .acb i{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:#6b5a51}
 .acb .ln{border-top:1px solid #f2ece2;margin:11px 0 0;padding-top:10px;font-size:12.5px;color:#5d4d44}
</style></head><body data-v="a">

<script>
try{
const $=i=>document.getElementById(i);
const A=[["PL","Penhallow Literary","Agent not specified"],["AK","Aisha Kapoor","The Lantern Agency"],["DO","Daniel O'Rourke","Inkwell & Stone"],
["EW","Eleanor Whitfield","Greenfield Literary"],["WT","William Tan","Foxglove Literary"],["FS","Fenella Str","Brightwater Books"],
["SD","Sophie Dunn","Curtis Vane"],["MR","Marcus Reed","Hartley & Co"],["NA","Nina Alvarez","Redgate Books"],["TE","Tom Ellery","Curtis Vane"],
["AM","Ada Mensah","Copperline"],["RC","Rae Chowdhury","Sable & Finch"]];
$('cards').innerHTML=A.map(([i,n,a])=>`<div class="ac"><div class="ach"><span class="pill">ACTIVE QUERIES</span></div>
 <div class="acb"><div class="nm"><span class="avr">${i}</span><div><h3>${n}</h3><i>${a}</i></div></div><div class="ln">No wishlist recorded.</div></div></div>`).join('');

const N={
a:`<b>A &middot; Icon, Playfair, count, CTA.</b> The slim header is <b>44px</b>: the page's icon at 22px, the name in Playfair 15.5 semibold, the count in mono, and the primary action kept at the right so it never scrolls out of reach. <em>Model:</em> Linear's issue header and Notion's page header &mdash; the name stays in the display face, smaller, so it reads as the same page rather than a system label.`,
b:`<b>B &middot; Icon and mono caps.</b> The name in JetBrains Mono uppercase, your metadata voice. More "system", less continuous with the header it came from. The count sits naturally beside it since they share a face.`,
c:`<b>C &middot; Icon and name only.</b> No count, no action &mdash; the quietest possible bar. Right if the toolbar beneath keeps the primary, which is where it lives today.`,
d:`<b>D &middot; No animation.</b> The same bar with the transition removed, so you can see what the 220ms is buying. Notice the direction: it slides <b>down</b> 6px as it arrives, because content is moving up &mdash; opposing motion reads as the bar being placed, not as it flinching.`};
const S=`<b>The rules underneath all four.</b> &nbsp;
<b>Opaque:</b> the bar is <code>position: sticky</code> inside the scroller with the page's own ground as a solid fill and <code>z-index</code> above content &mdash; cards pass <i>behind</i> it, and nothing reads through because there is no alpha anywhere in the stack. &nbsp;
<b>Reserves no space:</b> a negative bottom margin equal to its height, so the layout is identical whether it is showing or not &mdash; that is what stops any feedback into scroll position. &nbsp;
<b>The full header is never animated:</b> it scrolls away as content. &nbsp;
<b>Arrival:</b> opacity 160ms linear, translate 220ms on a deceleration curve (<code>cubic-bezier(.2,.8,.2,1)</code>) &mdash; fast out, soft landing, the curve every native toolbar uses. Hairline and shadow fade in with it. &nbsp;
<b>Hysteresis:</b> appears past 120px, leaves below 90px. &nbsp;
<b>Toolbar:</b> content, not chrome; pins on its own at <code>top: var(--bar-h)</code> and gains a hairline once it is holding.`;
document.querySelectorAll('.tab[data-v]').forEach(b=>b.onclick=()=>{
 document.body.dataset.v=b.dataset.v;
 document.querySelectorAll('.tab[data-v]').forEach(x=>x.classList.toggle('on',x===b));
 $('spec').innerHTML=N[b.dataset.v]+'<br><br>'+S;});
const sc=$('sc');let stuck=false;
sc.addEventListener('scroll',()=>{const y=sc.scrollTop;
 if(!stuck&&y>120){stuck=true;document.body.classList.add('stuck');}
 else if(stuck&&y<90){stuck=false;document.body.classList.remove('stuck');}
 $('rd').innerHTML='scrollTop <b>'+Math.round(y)+'</b> &middot; bar '+(stuck?'<b>on</b>':'off')+' &middot; full header '+Math.round($('sc').querySelector('.hd').getBoundingClientRect().height)+'px &rarr; slim 44px';});
$('spec').innerHTML=N.a+'<br><br>'+S;
$('rd').innerHTML='scrollTop <b>0</b> &middot; bar off &middot; scroll to see the handoff';
}catch(e){console.error(e)}
</script></body></html>
