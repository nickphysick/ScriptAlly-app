<style>
:root{--ink:#1b2433;--band:#2d3a50;--page:#f3f2f0;--paper:#fffdf9;--paper2:#f7f4ef;--cream:#f4eee5;--terra:#d9967a;--terraD:#9a5638;--txt:#1c130f;--mute:rgba(28,19,15,.58);--faint:rgba(28,19,15,.42);--hair:rgba(28,19,15,.10);--dash:rgba(28,19,15,.16);
--c1:rgba(244,238,229,.92);--c2:rgba(244,238,229,.66);--c3:rgba(244,238,229,.42);
--type:'Special Elite',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:#10141c;font-family:var(--serif);color:var(--txt);padding:34px}
.cap{color:var(--cream);margin:0 0 14px;max-width:1380px}
.cap b{display:block;font:400 25px var(--type);margin-bottom:6px}
.cap span{font:15.5px/1.55 var(--serif);color:var(--c2)}
.cap em{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--terra);font-style:normal;margin-left:10px;vertical-align:4px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ── frame ── */
.fr{position:relative;width:1440px;height:900px;display:flex;background:var(--ink);border-radius:10px;overflow:hidden;margin-bottom:56px}
.sd{width:248px;flex:none;padding:14px 12px 12px;display:flex;flex-direction:column;color:var(--c2)}
.lg{display:flex;align-items:center;gap:9px;height:34px;padding:0 6px;font:600 18.5px var(--serif);color:var(--cream)}
.lg .hk{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a6a55,#4a3a30)}
.lg small{font:600 7.5px var(--mono);letter-spacing:.16em;padding:2px 5px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(244,238,229,.28);color:var(--c3)}
.lg .tg{margin-left:auto;color:var(--c3)}
.ms{margin:12px 0 6px;height:54px;border-radius:12px;background:rgba(244,238,229,.07);box-shadow:inset 0 0 0 1px rgba(244,238,229,.1);display:flex;align-items:center;gap:10px;padding:0 10px}
.ms .cv{width:27px;height:35px;background:#f6f1ea;border-radius:2px;position:relative}
.ms .cv::after{content:"";position:absolute;left:5px;right:5px;top:12px;height:2px;background:#c9c0b4;box-shadow:0 5px 0 #d8d0c5,0 10px 0 #d8d0c5}
.ms b{display:block;font:400 13.5px var(--type);color:var(--cream)}.ms span{font:600 7.5px var(--mono);letter-spacing:.14em;color:var(--c3)}.ms span i{color:var(--terra);font-style:normal}
.eb{font:600 8px var(--mono);letter-spacing:.2em;color:rgba(244,238,229,.36);margin:15px 8px 5px}
.r{height:33px;display:flex;align-items:center;gap:11px;padding:0 10px;font:14.5px var(--serif);border-radius:8px;color:var(--c2)}
.r svg{width:15px;height:15px;opacity:.85}
.r.on{background:rgba(244,238,229,.09);color:var(--cream);box-shadow:inset 2px 0 0 var(--terra);font-weight:600}.r.on svg{color:var(--terra);opacity:1}
.r .pl{margin-left:auto;font:600 10px var(--mono);padding:2px 7px;border-radius:99px;background:var(--terra);color:var(--ink)}
.r.b{font-weight:600;color:var(--c1)}
.sp{flex:1}
.fbb{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--terra);color:var(--cream);font:600 14.5px var(--serif);margin-bottom:10px}
.fbb svg{color:var(--terra)}.fbb em{margin-left:auto;font:600 8px var(--mono);letter-spacing:.16em;font-style:normal;padding:2px 6px;border-radius:5px;background:rgba(217,150,122,.18);color:var(--terra)}
.ft{display:flex;align-items:center;gap:10px;height:50px;padding:0 8px;border-radius:10px}
.ft.on{background:rgba(244,238,229,.09)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#2d3a50;box-shadow:inset 0 0 0 1px rgba(244,238,229,.18);font:600 10.5px var(--mono);color:var(--cream);flex:none}
.ft b{display:block;font:600 14px var(--serif);color:var(--cream)}.ft span{font:12.5px var(--serif);color:var(--c3)}
.ft .g{margin-left:auto;color:var(--c3)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.bar{height:56px;flex:none;display:flex;align-items:flex-end;position:relative}
.tab{height:41px;margin-bottom:-1px;background:var(--page);border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px;padding:0 22px;position:relative;z-index:2}
.tab small{font:600 9px var(--mono);letter-spacing:.2em;color:var(--faint)}.tab b{font:400 19px var(--type);color:var(--txt);font-weight:400}
.tab svg{position:absolute;right:-12px;bottom:0}
.sib{height:34px;margin-left:16px;padding:0 16px;display:flex;align-items:center;border-radius:10px 10px 0 0;background:rgba(244,238,229,.09);color:var(--c2);font:16px var(--type)}
.tools{position:absolute;right:22px;top:9px;display:flex;align-items:center}
.srch{width:168px;height:38px;border-radius:9px;background:rgba(244,238,229,.05);box-shadow:inset 0 0 0 1px rgba(244,238,229,.14);font:14.5px var(--serif);color:var(--c3);display:flex;align-items:center;gap:8px;padding:0 10px}
.srch kbd{margin-left:auto;font:600 9px var(--mono);padding:3px 5px;border-radius:4px;background:rgba(244,238,229,.1);color:var(--c2)}
.srch.act{box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.55);background:rgba(244,238,229,.1);color:var(--c1)}
.lq{margin-left:12px;height:38px;border-radius:9px;background:var(--cream);color:var(--ink);font:600 14.5px var(--serif);display:flex;overflow:hidden;white-space:nowrap}
.lq span{display:flex;align-items:center;gap:7px;padding:0 14px}.lq i{width:1px;background:rgba(27,36,51,.16)}.lq u{display:grid;place-items:center;width:32px}
.ghost{height:38px;padding:0 12px 0 10px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(244,238,229,.18);display:flex;align-items:center;gap:8px;font:14.5px var(--serif);color:var(--c1)}
.ghost kbd{font:600 8.5px var(--mono);letter-spacing:.08em;padding:3px 5px;border-radius:4px;background:rgba(244,238,229,.1);color:var(--c2)}
.sep{width:1px;height:18px;background:rgba(244,238,229,.16);margin:0 8.5px 0 9.5px}
.hp{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(244,238,229,.16);display:grid;place-items:center;color:var(--c2);font:600 15px var(--serif)}
.hp.on{background:rgba(244,238,229,.1);color:var(--c1);box-shadow:inset 0 0 0 1px rgba(244,238,229,.32)}
.sheet{flex:1;margin:0 8px 8px 0;background:var(--page);border-radius:0 12px 12px 12px;overflow:hidden;position:relative}
.sheet img.pg{display:block;width:100%}
.dim{position:absolute;inset:0;background:rgba(10,14,22,.42);z-index:5}
/* ── shared menu language ── */
.pop{position:absolute;z-index:10;background:var(--paper);border-radius:12px;box-shadow:0 0 0 1px rgba(28,19,15,.08),0 18px 44px rgba(8,12,20,.32),0 2px 6px rgba(8,12,20,.12);overflow:hidden}
.peb{font:600 8.5px var(--mono);letter-spacing:.2em;color:var(--faint);padding:12px 14px 6px}
.mi{display:flex;align-items:center;gap:11px;height:36px;margin:0 6px;padding:0 9px;border-radius:8px;font:14.5px var(--serif);color:var(--txt)}
.mi svg{color:rgba(28,19,15,.62)}
.mi.hv{background:rgba(217,150,122,.13);box-shadow:inset 2px 0 0 var(--terra)}.mi.hv svg{color:var(--terraD)}
.mi .k{margin-left:auto}
.kc{font:600 9.5px var(--mono);color:var(--mute);padding:2px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--dash);background:var(--paper)}
.mi.mute{color:var(--mute)}
.hr{height:1px;background:var(--hair);margin:6px 0}
/* palette */
.pal{width:660px}
.pin{height:62px;background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 16px 0 18px;color:var(--c1);font:19px var(--serif)}
.pin svg{width:19px;height:19px;color:var(--c3)}
.pin .ph{color:var(--c3)}
.pin .caret{display:inline-block;width:1.5px;height:22px;background:var(--terra);vertical-align:-4px;margin-left:1px}
.pin kbd{margin-left:auto;font:600 9px var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:5px;background:rgba(244,238,229,.1);color:var(--c2)}
.pbody{padding:4px 0 8px;max-height:560px}
.pr{display:flex;align-items:center;gap:12px;height:46px;margin:0 8px;padding:0 10px;border-radius:9px}
.pr .t{font:15px var(--serif);color:var(--txt);white-space:nowrap}
.pr .d{font:13.5px var(--serif);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .tl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(28,19,15,.05);color:rgba(28,19,15,.66);flex:none}
.pr .tl.act{background:rgba(217,150,122,.16);color:var(--terraD)}
.pr .tl.av2{border-radius:50%;background:var(--band);color:var(--cream);font:600 9.5px var(--mono)}
.pr .tl.qd{background:transparent;box-shadow:inset 0 0 0 1px var(--dash)}
.pr .k{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.pr.on{background:rgba(217,150,122,.14);box-shadow:inset 2px 0 0 var(--terra)}
.pr.on .tl{background:var(--paper);color:var(--terraD);box-shadow:0 0 0 1px rgba(217,150,122,.4)}
.pr.on .tl.av2{background:var(--band);color:var(--cream)}
.pr mark{background:rgba(217,150,122,.32);color:inherit;border-radius:2px;padding:0 1px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pfoot{height:40px;background:var(--paper2);border-top:1px solid var(--hair);display:flex;align-items:center;gap:16px;padding:0 16px;font:12.5px var(--serif);color:var(--mute)}
.pfoot .kc{margin-right:4px}.pfoot .e{margin-left:auto}
.st{font:600 8.5px var(--mono);letter-spacing:.12em;padding:3px 7px;border-radius:99px;background:rgba(28,19,15,.06);color:var(--mute)}
/* help + user */
.help{width:256px}
.user{width:232px}
.uh{display:flex;align-items:center;gap:11px;padding:14px 14px 12px}
.uh .av{width:38px;height:38px;background:rgba(217,150,122,.18);color:var(--terraD);box-shadow:none;font-size:11.5px}
.uh b{display:block;font:600 15px var(--serif)}.uh div span{display:block;font:12.5px var(--serif);color:var(--mute);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan{margin:0 10px 6px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--cream);display:flex;align-items:center}
.plan small{display:block;font:600 8px var(--mono);letter-spacing:.2em;color:var(--terra)}.plan b{display:block;font:400 17px var(--type);margin-top:3px;font-weight:400}
.plan a{margin-left:auto;font:13px var(--serif);color:var(--c2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(244,238,229,.3)}
/* ── board for close-ups ── */
.board{position:relative;width:1440px;height:720px;background:var(--ink);border-radius:10px;overflow:hidden;margin-bottom:56px}
.board .lbl{position:absolute;font:600 9px var(--mono);letter-spacing:.2em;color:var(--c3)}
/* ── settings ── */
.set{padding:44px 56px 40px;height:100%;overflow:hidden}
.set .hd{max-width:1060px;display:flex;align-items:flex-end;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--hair)}
.set h1{margin:0;font:400 36px/1 var(--type);font-weight:400}
.set .hd p{margin:0 0 3px;font:16px var(--serif);color:var(--mute)}
.sec{max-width:1060px;display:grid;grid-template-columns:268px 1fr;gap:40px;padding:30px 0;border-bottom:1px dashed var(--dash)}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font:400 19px var(--type);font-weight:400}
.sec .sd2{margin:7px 0 0;font:14px/1.5 var(--serif);color:var(--mute)}
.cd{background:var(--paper);border-radius:14px;box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(28,19,15,.04);overflow:hidden}
.row{display:flex;align-items:center;gap:28px;padding:18px 22px}
.row+.row{border-top:1px dashed var(--dash)}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font:600 15px var(--serif)}
.row .l span{display:block;margin-top:3px;font:14px/1.45 var(--serif);color:var(--mute)}
.inp{width:300px;height:40px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px rgba(28,19,15,.18);display:flex;align-items:center;padding:0 12px;font:15px var(--serif);color:var(--txt);flex:none}
.inp.fc{box-shadow:inset 0 0 0 1.5px var(--band),0 0 0 4px rgba(45,58,80,.12)}
.inp.ph{color:var(--faint)}.inp svg{margin-left:auto;color:var(--mute)}
.cf{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--paper2);border-top:1px solid var(--hair);font:italic 13.5px var(--serif);color:var(--mute)}
.btn{margin-left:auto;height:36px;padding:0 18px;border-radius:99px;background:var(--band);color:var(--cream);font:600 14px var(--serif);display:inline-flex;align-items:center;font-style:normal}
.btn.q{background:transparent;color:var(--txt);box-shadow:inset 0 0 0 1px rgba(28,19,15,.22);margin-left:0}
.me{display:flex;align-items:center;gap:16px;padding:20px 22px}
.me .av{width:56px;height:56px;font-size:15px;background:rgba(217,150,122,.18);color:var(--terraD);box-shadow:none}
.me b{display:block;font:600 17px var(--serif)}.me div span{display:block;margin-top:2px;font:14px var(--serif);color:var(--mute)}
.me .tag{margin-left:auto;font:600 8.5px var(--mono);letter-spacing:.16em;color:var(--terraD);padding:4px 8px;border-radius:6px;background:rgba(217,150,122,.14)}
.tg2{width:38px;height:22px;border-radius:99px;background:rgba(28,19,15,.16);position:relative;flex:none}
.tg2::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg2.on{background:var(--band)}.tg2.on::after{left:19px;background:var(--cream)}
.note{margin-top:10px;font:italic 13.5px var(--serif);color:var(--mute)}
.pc{display:flex;gap:10px}
/* settings sidebar */
.sd .back{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;margin:4px 0 0;font:13.5px var(--serif);color:var(--c3)}
.plan2{border-radius:12px;padding:12px 13px;background:linear-gradient(180deg,rgba(217,150,122,.14),rgba(217,150,122,.06));box-shadow:inset 0 0 0 1px rgba(217,150,122,.28)}
.plan2 small{display:block;font:600 8px var(--mono);letter-spacing:.2em;color:var(--terra)}
.plan2 b{display:block;margin-top:4px;font:400 18px var(--type);color:var(--cream);font-weight:400}
.plan2 span{display:block;margin-top:3px;font:12.5px/1.4 var(--serif);color:var(--c2)}
.plan2 a{display:inline-block;margin-top:8px;font:600 13px var(--serif);color:var(--terra)}
/* diagnosis */
.dx{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1440px;margin:0 0 50px}
.dx div{background:#1a212d;border-radius:12px;padding:16px 18px;color:var(--c2);font:14px/1.5 var(--serif)}
.dx b{display:block;font:400 18px var(--type);color:var(--cream);margin-bottom:6px;font-weight:400}
.rules{max-width:1440px;margin:-30px 0 56px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rules div{border-top:1px solid rgba(244,238,229,.14);padding-top:12px;color:var(--c2);font:14px/1.5 var(--serif)}
.rules b{display:block;font:600 9px var(--mono);letter-spacing:.18em;color:var(--terra);margin-bottom:6px}
