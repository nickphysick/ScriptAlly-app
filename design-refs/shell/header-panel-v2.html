<!-- Header panel v2 (frozen 9 Oct 2026). The chosen header format, shown on the Query Centre and the Contact list: a panel in the Analytics band blue on the page ground, hero number, stamp, one row of faces, two buttons, the art; badge cards beneath. The Page switch (bottom left) flips between the two pages; it is mock tooling, not part of the app. Everything below the desk is a sketch. -->
<title>Header Panel v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Special+Elite&display=swap">
<style>
:root{color-scheme:light}
/* ════════ THE APP MOCK — fixed colours on purpose: it depicts QueryHawk, which has one look ════════ */
.qh{position:absolute;left:0;top:0;width:1512px;height:900px;background:#1b2433;font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.3;color:#1c130f;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden;text-align:left;color-scheme:light}
.qh *{box-sizing:border-box;margin:0;padding:0}
.qh img{max-width:none;display:block}
.qh svg{display:block}
.qh-side{position:absolute;left:0;top:0;bottom:0;width:248px;color:rgba(244,238,229,.66);padding:0 16px}
.qh-brand{display:flex;align-items:center;gap:10px;height:77px}
.qh-brand img{width:38px;height:38px;border-radius:50%}
.qh-brand b{font:600 22px "Source Serif 4",serif;color:#f4eee5}
.qh-beta{font:500 9px "JetBrains Mono",monospace;letter-spacing:.14em;border:1px solid rgba(244,238,229,.3);border-radius:5px;padding:3px 6px 2px;color:rgba(244,238,229,.6)}
.qh-ms{display:flex;gap:11px;align-items:center;background:#2a303d;border:1px solid rgba(244,238,229,.12);border-radius:10px;padding:10px}
.qh-ms i{width:32px;height:42px;background:#f6f1e7;border-radius:3px;flex:none;box-shadow:inset 0 14px 0 -11px #c0705a}
.qh-ms b{display:block;font:400 16px "Special Elite",monospace;color:#f4eee5}
.qh-ms span{font:500 9px "JetBrains Mono",monospace;letter-spacing:.14em;color:rgba(244,238,229,.5)}
.qh-ms em{color:#d9967a;font-style:normal}
.qh-lab{font:500 9px "JetBrains Mono",monospace;letter-spacing:.18em;color:rgba(244,238,229,.42);margin:20px 0 6px 8px}
.qh-nav{display:flex;align-items:center;gap:13px;height:36px;padding:0 10px;border-radius:8px;font-size:16.5px}
.qh-nav svg{width:17px;height:17px;opacity:.6;flex:none}
.qh-nav.on{background:rgba(244,238,229,.09);color:#f4eee5;font-weight:600;box-shadow:inset 2px 0 0 #d9967a}
.qh-nav.on svg{color:#d9967a;opacity:1}
.qh-nav.b{color:#f4eee5;font-weight:600}
.qh-nav .pill{margin-left:auto;background:#d9967a;color:#1b2433;font:700 10px "JetBrains Mono",monospace;border-radius:10px;padding:3px 7px 2px}
.qh-foot{position:absolute;left:16px;right:16px;bottom:14px}
.qh-fb{display:flex;align-items:center;gap:11px;height:44px;border:1.5px solid #d9967a;border-radius:9px;padding:0 12px 0 14px;color:#f4eee5;font-weight:600;font-size:16px;white-space:nowrap}
.qh-fb svg{width:17px;height:17px}
.qh-fb .qh-beta{margin-left:auto;background:rgba(217,150,122,.14);border-color:transparent;color:#d9967a}
.qh-user{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(244,238,229,.12)}
.qh-user i{width:36px;height:36px;border-radius:50%;background:#2a303d;display:grid;place-items:center;font:500 10px "JetBrains Mono",monospace;color:#f4eee5;font-style:normal;flex:none}
.qh-user b{display:block;font-weight:600;color:#f4eee5;font-size:15.5px}
.qh-user span{font-size:13.5px}

.qh-bar{position:absolute;left:248px;right:0;top:0;height:77px}
.qh-tabs{position:absolute;left:0;bottom:0;display:flex;align-items:flex-end;gap:16px}
.qh-tab{height:41px;background:var(--tab,#fbf9f5);border-radius:12px 12px 0 0;padding:11px 22px 0 20px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.qh-tab small{font:500 9px "JetBrains Mono",monospace;letter-spacing:.18em;color:rgba(28,19,15,.5)}
.qh-tab b{font:400 20px "Special Elite",monospace}
.qh-tab .chip{display:inline-flex;align-items:center;gap:7px;font:400 15px "Special Elite",monospace;color:#9a5638;max-width:0;opacity:0;overflow:hidden;transition:max-width .28s ease,opacity .2s ease}
.qh-tab .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#b0603e;flex:none}
.is-away .qh-tab .chip{max-width:200px;opacity:1}
.qh-tab2{height:35px;background:#303742;color:rgba(244,238,229,.72);border-radius:10px 10px 0 0;padding:8px 18px 0;font:400 17px "Special Elite",monospace}
.qh-tools{position:absolute;right:26px;top:17px;display:flex;align-items:center;gap:12px}
.qh-search{width:168px;height:42px;background:#2c323f;border:1px solid rgba(244,238,229,.14);border-radius:9px;display:flex;align-items:center;gap:9px;padding:0 10px 0 13px;color:rgba(244,238,229,.6);font-size:15.5px}
.qh-search svg{width:15px;height:15px}
.qh-search kbd{margin-left:auto;font:500 9px "JetBrains Mono",monospace;background:rgba(244,238,229,.12);border-radius:4px;padding:3px 5px}
.qh-log{height:42px;background:#f3eee6;border-radius:9px;display:flex;align-items:center;font-weight:600;font-size:15.5px;color:#1b2433}
.qh-log span{padding:0 14px 0 15px;display:flex;gap:8px;align-items:center}
.qh-log svg{width:14px;height:14px}
.qh-log i{width:34px;height:100%;border-left:1px solid rgba(27,36,51,.18);display:grid;place-items:center}
.qh-rule{width:1px;height:26px;background:rgba(244,238,229,.18);margin:0 6px}
.qh-help{width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,238,229,.26);display:grid;place-items:center;color:#f4eee5;font:400 17px "Special Elite",monospace}

.qh-sheet{position:absolute;left:248px;top:77px;right:8px;bottom:8px;background:#f2eee8;border-radius:0 12px 12px 12px;overflow:hidden}
.qh-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.qh--strip{background:#f2eee8}
.qh--strip .qh-sheet{left:0;top:0;right:0;bottom:0;border-radius:0}
.qh--strip .qh-scroll{overflow:hidden}

/* the header sheet and its envelope flap */
.hd{position:relative;z-index:2}
.hd-bg{position:absolute;left:0;right:0;top:0;bottom:-26px;filter:drop-shadow(0 12px 12px rgba(28,19,15,.12))}
.hd-bg::before{content:"";position:absolute;inset:0;background:var(--hd-bg,#fbf9f5);clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),50% 100%,0 calc(100% - 26px))}
.hd-in{position:relative;padding:30px 48px 10px}
.fc{box-sizing:border-box;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 11px "JetBrains Mono",monospace;letter-spacing:.02em;box-shadow:0 0 0 3px var(--hd-bg,#fbf9f5);color:#f4eee5}
.fc + .fc{margin-left:-7px}
.fc.you{background:#b0603e}.fc.agent{background:#3d5070}.fc.closed{background:#b3aca5;color:#2b2622}
.faces{display:flex;align-items:center;white-space:nowrap}
.faces .more{margin-left:12px;font-size:15px;color:rgba(28,19,15,.62)}
.b1,.b2{box-sizing:border-box;height:44px;padding:0 22px;border-radius:22px;border:0;font:400 15.5px "Special Elite",monospace;white-space:nowrap;display:inline-flex;align-items:center;padding-top:2px}
.b1{background:#2a3a52;color:#f4eee5}
.b2{background:#fff;color:#2a3a52;box-shadow:inset 0 0 0 1.5px #2a3a52}
.hn{font:400 124px/.8 "Special Elite",monospace;letter-spacing:-.03em}

/* 0 — as built (v134 on the flap shell) */
.hd--now .hd-in{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:56px;align-items:center}
.hd--now h1,.hd--pair h1{display:flex;align-items:baseline;gap:18px;font:400 42px/1 "Special Elite",monospace;white-space:nowrap}
.hd--now .sub,.hd--pair .sub{margin-top:12px;font-size:19px;line-height:1.4;color:rgba(28,19,15,.66)}
.hd--now .faces,.hd--pair .faces{margin-top:16px}
.hd--now .acts,.hd--pair .acts{display:flex;gap:10px;margin-top:22px}
.hd--now .art{justify-self:end;height:326px;position:relative;top:30px;z-index:1}

/* 1 — the briefing */
.hd--brief .hd-in{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:40px;align-items:center;padding:24px 48px 14px}
.hd--brief h1{font:400 46px/1.12 "Special Elite",monospace;letter-spacing:-.01em}
.hd--brief h1 b{font-weight:400;color:#9a5638}
.hd--brief .sub{margin-top:8px;font-size:19px;line-height:1.4;color:rgba(28,19,15,.7)}
.hd--brief .sub b{font-weight:600;color:#1c130f}
.hd--brief .row{display:flex;align-items:center;gap:10px;margin-top:18px}
.hd--brief .b1,.hd--brief .b2{height:40px;border-radius:20px;padding:2px 19px 0}
.hd--brief .faces{margin-left:14px}
.hd--brief .fc{width:34px;height:34px;font-size:10px}
.hd--brief .art{height:168px;align-self:end;position:relative;top:6px}
.hd--brief .ph{height:150px;width:190px;border:1.5px dashed rgba(28,19,15,.3);border-radius:12px;display:grid;place-items:center;text-align:center;font:500 10px/1.5 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(28,19,15,.5);padding:14px}
.hd--ink.hd--brief h1,.hd--ink.hd--brief .sub b{color:#f4eee5}
.hd--ink.hd--brief h1 b{color:#e0a58c}
.hd--ink.hd--brief .sub,.hd--ink .faces .more{color:rgba(244,238,229,.72)}
.hd--ink .b1{background:#f3eee6;color:#1b2433}
.hd--ink .b2{background:transparent;color:#f4eee5;box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.7)}

/* 2 — the strip */
.hd--strip .hd-in{display:flex;align-items:center;gap:22px;padding:18px 48px 16px}
.hd--strip h1{font:400 22px/1 "Special Elite",monospace;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.hd--strip h1 b{font:400 40px/1 "Special Elite",monospace;letter-spacing:-.02em}
.needpill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:2px 13px 0;border-radius:15px;background:#f2ded4;color:#8a4a30;font:400 15px "Special Elite",monospace;white-space:nowrap}
.needpill::before{content:"";width:7px;height:7px;border-radius:50%;background:#b0603e;margin-top:-2px}
.hd--strip .fc{width:32px;height:32px;font-size:9.5px}
.hd--strip .sp{flex:1}
.hd--strip .b2,.hd--strip .b1{height:40px;border-radius:20px}

/* 3 — the header is the desk */
.hd--ledger .hd-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;column-gap:0;align-items:stretch;padding:38px 48px 16px}
.lg{padding:0 26px;border-left:1px solid rgba(28,19,15,.12);display:flex;flex-direction:column}
.lg:first-child{padding-left:0;border-left:0}
.lg h1,.lg h2{font:400 24px/1 "Special Elite",monospace;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.lg h1 b,.lg h2 b{font:400 76px/.8 "Special Elite",monospace;letter-spacing:-.03em}
.lg.you b{color:#a35a3c}.lg.agent b{color:#3d5070}.lg.closed b{color:#7a7269}
.lg ul{list-style:none;margin-top:16px;display:grid;gap:7px}
.lg li{display:flex;align-items:center;gap:11px;font-size:16.5px}
.lg li i{width:27px;height:27px;border-radius:6px;display:grid;place-items:center;font:400 15px "Special Elite",monospace;font-style:normal;padding-top:2px;background:#eceae6;color:#6d655d}
.lg li i.hot{background:#f2ded4;color:#a35a3c}
.lg .ft{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;font-size:14.5px;color:rgba(28,19,15,.6)}
.lg .ft > span:first-child{white-space:nowrap}
.lg .spark svg{width:78px;height:auto}
.hd--ledger .art{height:176px;align-self:end;margin-left:26px;position:relative;top:4px}

/* 4 — arrive large (centred pair), work small */
.hd--pair .hd-in{display:flex;justify-content:center;align-items:center;gap:64px;padding:26px 48px 22px}
.hd--pair .hn{font-size:112px}
.hd--pair .art{height:270px}
.stick{position:sticky;top:0;height:0;z-index:6}
.stick-in{position:absolute;left:0;right:0;top:0;height:60px;background:#fbf9f5;box-shadow:0 1px 0 rgba(28,19,15,.1),0 10px 18px -12px rgba(28,19,15,.28);display:flex;align-items:center;gap:20px;padding:0 48px;transform:translateY(-120%);transition:transform .26s cubic-bezier(.22,.8,.3,1)}
.is-away .stick-in{transform:none}
.stick-in h2{font:400 19px/1 "Special Elite",monospace;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.stick-in h2 b{font:400 30px/1 "Special Elite",monospace}
.stick-in .fc{width:28px;height:28px;font-size:8.5px}
.stick-in .fc + .fc{margin-left:-5px}
.stick-in .sp{flex:1}
.stick-in .b2{height:36px;border-radius:18px;font-size:14.5px;padding:2px 17px 0}
@media (prefers-reduced-motion: reduce){ .stick-in,.qh-tab .chip{transition:none} }

/* 5 — the ink plate */
.hd--plate .hd-in{padding:20px 48px 4px}
.plate{position:relative;background:#2d3a50;border-radius:18px;padding:28px 36px 30px;color:#f4eee5;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:40px;--hd-bg:#2d3a50}
.plate h1{display:flex;align-items:baseline;gap:16px;font:400 36px/1 "Special Elite",monospace;white-space:nowrap}
.plate .hn{font-size:96px}
.plate .sub{margin-top:12px;font-size:18px;color:rgba(244,238,229,.74)}
.plate .row{display:flex;align-items:center;gap:10px;margin-top:20px}
.plate .faces{margin-left:14px}
.plate .faces .more{color:rgba(244,238,229,.72)}
.plate .b1{background:#f3eee6;color:#1b2433;height:40px;border-radius:20px}
.plate .b2{background:transparent;color:#f4eee5;box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.7);height:40px;border-radius:20px}
.plate .art{height:212px;margin:-34px -6px -30px 0}

/* the rest of the page (simplified, same on every board) */
.desk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:72px 48px 54px}
.dk{position:relative;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(28,19,15,.07),0 3px 12px rgba(28,19,15,.05);padding:46px 28px 20px}
.dk-ic{position:absolute;left:26px;top:-28px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 5px #f2eee8,0 6px 10px rgba(28,19,15,.14);color:#fff}
.dk-ic svg{width:26px;height:26px}
.dk.you .dk-ic{background:#a66445}.dk.agent .dk-ic{background:#41506e}.dk.closed .dk-ic{background:#7a7269}
.dk h3{font:400 22px/1 "Special Elite",monospace;display:flex;align-items:baseline;gap:10px}
.dk h3 b{font:400 38px/1 "Special Elite",monospace}
.dk ul{list-style:none;margin-top:16px;display:grid;gap:8px}
.dk li{display:flex;align-items:center;gap:12px;font-size:17px}
.dk li i{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font:400 16px "Special Elite",monospace;font-style:normal;padding-top:2px;background:#eceae6;color:#6d655d}
.dk li i.hot{background:#f2ded4;color:#a35a3c}
.dk .ft{margin-top:26px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;color:rgba(28,19,15,.6)}
.spark{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10.5px;color:rgba(28,19,15,.45)}
.band{background:#fbf9f5;padding:46px 48px 50px}
.band.first{padding-top:66px}
.ru{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1.05fr);gap:30px;align-items:start}
.ru h2{font:400 30px/1.15 "Special Elite",monospace}
.ru .lede{margin-top:10px;font-size:16.5px;color:rgba(28,19,15,.66)}
.ru .b2{margin-top:18px;height:40px;border-radius:20px}
.qc{background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(28,19,15,.07),0 8px 22px -8px rgba(28,19,15,.18);overflow:hidden}
.qc .st{height:34px;background:#f5e6df;display:flex;align-items:center;justify-content:space-between;padding:2px 16px 0;font:500 9.5px "JetBrains Mono",monospace;letter-spacing:.14em;color:#8a4a30}
.qc .bd{padding:16px 18px 18px}
.qc .bd b{font:600 19px "Source Serif 4",serif;display:block}
.qc .bd span{font-size:14.5px;color:rgba(28,19,15,.6)}
.qc .ln{margin-top:14px;padding-top:12px;border-top:1px solid rgba(28,19,15,.08);font:400 15.5px "Special Elite",monospace}
.am{background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(28,19,15,.07);padding:6px 18px}
.am div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid rgba(28,19,15,.07);font-size:15px}
.am div:first-child{border-top:0;font:500 9.5px "JetBrains Mono",monospace;letter-spacing:.14em;color:rgba(28,19,15,.5)}
.am span{color:rgba(28,19,15,.56);white-space:nowrap}
.ban{position:relative;z-index:1}
.ban::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-26px;background:#f3ddd2;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),50% 100%,0 calc(100% - 26px))}
.ban p{position:relative;text-align:center;font:400 18.5px/1.4 "Special Elite",monospace;color:#5b2a1f;padding:24px 90px 16px}
.ql{padding:84px 48px 90px}
.ql-bar{background:#2d3a50;color:#f4eee5;border-radius:12px 12px 0 0;height:62px;display:flex;align-items:center;padding:0 22px;gap:12px}
.ql-bar b{font:400 21px "Special Elite",monospace;margin-right:8px;padding-top:2px}
.ql-bar em{font:400 14px "Special Elite",monospace;font-style:normal;background:rgba(244,238,229,.14);border-radius:14px;padding:6px 12px 4px}
.ql-bar em.hot{background:#f2ded4;color:#8a4a30}
.ql-bar .sp{flex:1}
.ql-bar span{font-size:14.5px;color:rgba(244,238,229,.7)}
.ql-panel{background:#fff;border-radius:0 0 12px 12px;box-shadow:0 0 0 1px rgba(28,19,15,.07)}
.qrow{display:grid;grid-template-columns:38px 1.35fr .7fr 1fr 1.1fr;gap:16px;align-items:center;height:66px;padding:0 22px;border-top:1px solid rgba(28,19,15,.07);font-size:15.5px}
.qrow:first-child{border-top:0}

.qrow b{display:block;font-weight:600}
.qrow small{font-size:13.5px;color:rgba(28,19,15,.56)}
.qrow .st{font:400 15px "Special Elite",monospace}
.qrow .nx{justify-self:start;font:400 14px "Special Elite",monospace;border-radius:13px;padding:5px 12px 3px;background:#eceae6;color:#5d564f}
.qrow .nx.hot{background:#f2ded4;color:#8a4a30}
.be{position:absolute;right:28px;bottom:26px;z-index:8;background:#2d3a50;color:#f4eee5;border-radius:14px;display:flex;align-items:center;gap:14px;padding:11px 16px 11px 12px;box-shadow:0 14px 28px -10px rgba(27,36,51,.6)}
.be img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.be b{display:block;font:400 19px "Special Elite",monospace}
.be span{font:500 9.5px "JetBrains Mono",monospace;letter-spacing:.12em;color:rgba(244,238,229,.72)}
.be i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(244,238,229,.5);margin-left:14px;display:grid;place-items:center;font-style:normal;font-size:12px}

/* ════════ FULL SCREEN — the mock is the page ════════ */
html,body{height:100%}
body{margin:0;background:#1b2433;overflow:hidden;font:16px/1.3 "Source Serif 4",Georgia,serif;color:#1c130f}
.stage{position:relative;height:100%;overflow:hidden;background:#1b2433}
.stage > .qh{width:100%;height:100%}
.qh .desk,.qh .band,.qh .ql{padding-inline:max(48px,calc((100% - 1264px)/2))}
.qh .hd .hd-in{padding-inline:max(48px,calc((100% - 1264px)/2))}
.qh .ban p{padding-inline:max(90px,calc((100% - 1180px)/2))}

/* ══ dev header, flat on the page ══ */
.qh .qh-sheet{left:248px;top:77px;right:8px;bottom:8px;border-radius:0 12px 12px 12px}
.qh .qh-scroll{overflow-y:auto;overflow-x:hidden}
.qh{--hd-bg:#f2eee8;--tab:#f2eee8}
.qh.f-flat .hd-bg{display:none}

const ROWS_CL = [['TE','agent','Tessa Eastwood','Marlow & Finch','Upmarket crime, book-club fiction','Query active','Offer to answer',1],['IO','none','Ines Okafor','Brackwater Literary','Upmarket crime, sense of place','Not queried','Ready to query',0],['JM','agent','Jonah Marsh','Hale Literary','Thrillers, police procedurals','Query active','Full requested',1],['DN','none','Dara Nwosu','Kestrel & Vane','Psychological suspense','Not queried','Ready to query',0],['GP','agent','Greta Pohl','Pohl & Carrow','Literary crime','Query active','Partial requested',1],['FS','closed','Farah Siddiqui','Siddiqui Lit','Historical mysteries','Query closed','Passed 30 Sep',0],['EW','agent','Edmund Wray','Wray Associates','Crime, noir','Query active','Reply due in 5 weeks',0],['MR','closed','Mark Ridley','Ridley & Co','Thrillers','Query closed','No response',0]];
const listCL = () => `<section class="ql" data-sec="list"><div class="ql-bar"><b>Your agents</b><em class="hot">4 waiting on you</em><em>14 ready to query</em><span class="sp"></span><span>Find · Grouped: A–Z · Sort: Surname</span></div>
  <div class="ql-panel">${ROWS_CL.map(r => `<div class="qrow"><span class="fc ${r[1]}" style="width:34px;height:34px;font-size:10px">${r[0]}</span><div><b>${r[2]}</b><small>${r[3]}</small></div><small>${r[4]}</small><span class="st">${r[5]}</span><span class="nx ${r[7]?'hot':''}">${r[6]}</span></div>`).join('')}</div></section>`;
const sideCL = () => side().replace('class="qh-nav on"', 'class="qh-nav "').replace(/class="qh-nav "(>(?:(?!qh-nav).)*?<span>Contact list)/s, 'class="qh-nav on"$1');
const barCL = () => bar().replace('<small>QUERIES</small><b>Query Centre</b>', '<small>AGENTS</small><b>Contact list</b>').replace('>Analytics<', '>Discover<');

const OPT = { pg: [['qc','Query Centre'],['cl','Contact list']] };
const st = { pg:'qc', v:'band', n:'off', d:'badge' };
(location.hash || '').slice(1).split('-').forEach((v, i) => { const key = ['pg'][i]; if (key && OPT[key].some(o => o[0] === v)) st[key] = v; });
const stage = document.querySelector('.stage');
stage.insertAdjacentHTML('afterbegin', `<div class="qh l-left f-flat i-2"></div>`);
const qh = stage.querySelector('.qh'), ctl = document.querySelector('.ctl');
let painted = '';
const paint = () => { if (painted === st.pg) return; painted = st.pg;
  qh.innerHTML = st.pg === 'cl'
    ? `${sideCL()}${barCL()}<div class="qh-sheet"><div class="qh-scroll">${PANEL_CL()}${deskBadgeCL()}${nextCL()}${bannerCL()}${listCL()}</div>${birds()}</div>`
    : `${side()}${bar()}<div class="qh-sheet"><div class="qh-scroll">${PANEL()}${deskBadge()}${recent()}${banner()}${list()}</div>${birds()}</div>`; };
const fs = (k, legend, cls) => `<fieldset><legend>${legend}</legend><div class="opts ${cls || ''}">${OPT[k].map(o => `<button type="button" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></fieldset>`;
ctl.innerHTML = `<button type="button" class="mini" id="ctl-show">Options</button>
  <header><b>Header panel v2</b><button type="button" id="ctl-hide" aria-label="Hide the options">Hide</button></header>
  ${fs('pg','Page')}
  <p class="meas" id="ctl-meas" aria-live="polite"></p>`;
const fit = () => { const w = stage.clientWidth, h = stage.clientHeight, W = Math.max(w, 1200), s = w / W; qh.style.width = W + 'px'; qh.style.height = (h / s) + 'px'; qh.style.setProperty('--s', s); qh.classList.toggle('lt', W < 1440); qh.classList.toggle('dc', W - 256 < 1440); };
const measure = () => { const hd = [...qh.querySelectorAll('.qh-sheet .hd')].find(e => e.offsetHeight), first = [...qh.querySelectorAll('.dk,.bd')].find(e => e.offsetHeight), sc = qh.querySelector('.qh-scroll'); if (!hd || !first) return;
  const s = parseFloat(qh.style.getPropertyValue('--s')) || 1, y = (first.getBoundingClientRect().top - sc.getBoundingClientRect().top) / s + sc.scrollTop;
  document.getElementById('ctl-meas').innerHTML = `Header <b>${hd.offsetHeight}px</b> · cards <b>${Math.round(y)}</b> to <b>${Math.round(y + first.offsetHeight)}px</b>`; };
const render = () => { const cl = st.pg === 'cl'; if (cl) { if (st.v === 'a') st.v = 'band'; st.d = 'badge'; }
  paint();
  qh.classList.remove('v-a','v-band','v-ink','v-paper','s-on','s-off','d-badge','d-icon','p-cl','p-qc'); qh.classList.add('v-' + st.v, 's-' + st.n, 'd-' + st.d, 'p-' + st.pg);
  ctl.querySelectorAll('[data-k]').forEach(b => { b.setAttribute('aria-pressed', String(st[b.dataset.k] === b.dataset.v)); b.disabled = cl && ((b.dataset.k === 'v' && b.dataset.v === 'a') || (b.dataset.k === 'd' && b.dataset.v === 'icon')); });
  try { history.replaceState(null, '', `#${st.pg}`); } catch (e) {}
  fit(); measure(); };
ctl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.k) { st[b.dataset.k] = b.dataset.v; render(); }
  else if (b.id === 'ctl-hide') ctl.classList.add('is-min');
  else if (b.id === 'ctl-show') ctl.classList.remove('is-min'); });
window.addEventListener('resize', () => { fit(); measure(); });
if ('ResizeObserver' in window) new ResizeObserver(() => { fit(); measure(); }).observe(stage);
render();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(measure);
window.addEventListener('load', measure);
</script>
