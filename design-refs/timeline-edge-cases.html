<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>ScriptAlly — journey bars (design ref v3)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#f2ede7;--parchment:#fdfaf5;--white:#fff;--ink:#3a1c14;--muted:#8a7a6c;--label:#9c8878;
--burgundy:#7c3a2a;--pink:#f5e2da;--pinkb:#e8c8bc;--pinkband:#f3e0d6;--sage:#8a9e88;--sagetint:#e9efe6;
--sagetxt:#5a6e58;--hair:#ece0d2;--line:#e0d0c4;--dash:#c9a89e;--rec:#b9a48f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);font-family:Inter,sans-serif;color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--label)}

/* slim masthead — the scrolled state */
.mast{flex:0 0 auto;background:var(--parchment);border-bottom:1px solid var(--hair);
padding:10px 26px;display:flex;align-items:center;gap:14px}
.mast h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:500}
.mast .crumb{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}

/* ONE control row, pinned beneath */
.ctrl{flex:0 0 auto;background:var(--white);border-bottom:1px solid var(--hair);
padding:8px 26px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden}
.btn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;font-weight:500;border-radius:9px;
padding:8px 11px;cursor:pointer;background:var(--white);border:1px solid var(--line);color:#6a5a50;line-height:1;white-space:nowrap}
.btn:hover{border-color:var(--dash);color:var(--burgundy)}
.vsep{width:1px;height:20px;background:var(--line);flex:0 0 auto;margin:0 2px}
.fchip{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
padding:7px 10px;border-radius:999px;cursor:pointer;background:var(--white);border:1px solid var(--line);color:var(--label);
display:inline-flex;align-items:center;gap:6px;line-height:1;white-space:nowrap}
.fchip .sw{width:7px;height:7px;border-radius:50%}
.fchip[data-on="true"]{color:var(--ink);border-color:var(--dash);background:var(--parchment)}
.fchip[data-on="false"]{opacity:.4}
.srch{flex:1 1 120px;min-width:90px;font-family:Inter,sans-serif;font-size:12px;color:var(--ink);background:var(--white);
border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
.srch:focus{border-color:var(--dash)}
.count{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);white-space:nowrap}

/* board takes everything left */
.board{flex:1 1 auto;min-height:0;margin:12px 26px 16px;background:var(--parchment);
border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.bscroll{overflow-y:auto;min-height:0}
.tl{display:grid;grid-template-columns:216px repeat(7,1fr)}
.dh{position:sticky;top:0;z-index:4;background:linear-gradient(135deg,#d7ddd5,#d5dbd3);border-bottom:1px solid var(--hair);padding:8px 0 7px;text-align:center}
.dh .dw{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--sagetxt)}
.dh .dd{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;color:#3f4d3d;margin-top:2px}
.dh.today .dd{background:var(--burgundy);color:#f8f5f0;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.corner{position:sticky;top:0;left:0;z-index:5;background:linear-gradient(135deg,#d7ddd5,#d5dbd3);border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);display:flex;align-items:center;padding:0 15px}
.rowhead{background:var(--parchment);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
padding:0 15px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:76px}
.rowhead .nm{font-family:'Playfair Display',serif;font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.rowhead .ag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.sd{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.sd.out{background:var(--pink);border:1.5px solid var(--burgundy)}
.sd.half{background:linear-gradient(90deg,var(--burgundy) 50%,var(--pink) 50%);border:1.5px solid var(--burgundy)}
.sd.you{border-radius:3px;border:1.5px solid var(--burgundy);background:transparent}
.dcell{border-bottom:1px solid var(--hair);border-right:1px solid #f2e9dd;min-height:76px;position:relative}
.dcell.wkend{background:#faf6ef}.dcell.today{background:#fdf5f2}

/* ---- the journey bar: ONE lane per agent ---- */
.lane{position:relative;grid-column:2 / -1;height:0}
.seg{position:absolute;top:-56px;height:36px;display:flex;align-items:center;padding:0 14px;
font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden}
.seg.their{background:var(--sagetint);border:1px solid #d9e1d5;color:var(--sagetxt)}
.seg.yours{background:var(--pinkband);border:1px solid var(--pinkb);color:#7a4636}
.seg.startcap{border-top-left-radius:999px;border-bottom-left-radius:999px}
.seg.endcap{border-top-right-radius:999px;border-bottom-right-radius:999px}
.seg.future{border-right:2px dashed var(--sage);border-top-right-radius:0;border-bottom-right-radius:0}
.seg.yours.future{border-right:2px dashed var(--dash)}
.seg.openleft{border-left:2px dotted var(--sage);border-top-left-radius:0;border-bottom-left-radius:0}
/* a segment that stops for an interruption keeps its round cap — the break is deliberate, not clipped */
.seg.stops{border-top-right-radius:999px;border-bottom-right-radius:999px}
.seg.resumes{border-top-left-radius:999px;border-bottom-left-radius:999px}
/* no reply time recorded — a rail, not a window: nothing is forecast */
.seg.norail{background:transparent;border:1px dashed var(--line);color:var(--dash);border-right:none;border-radius:999px}
/* open-ended: your move with no date (R&R, offer without a deadline) */
.seg.openend{border-right:none;border-top-right-radius:0;border-bottom-right-radius:0;
  -webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}
/* past weeks: nothing is provisional any more */
.past .seg.future{border-right:1px solid var(--sage);border-top-right-radius:999px;border-bottom-right-radius:999px}
.past .seg.yours.future{border-right-color:var(--pinkb)}
.past .wp{border-left-style:solid;opacity:.55}
/* closure stops everything */
.node.close{background:var(--white);border:2px solid var(--rec);color:var(--rec)}
/* second lane in one row */
.rowhead .ms{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dash);margin-top:2px}
.lane.two{height:0}
.seg.l2,.node.l2,.wp.l2,.chipx.l2{margin-top:42px}
.dcell.tall,.rowhead.tall{min-height:122px}
.mslab{position:absolute;left:4px;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.1em;
text-transform:uppercase;color:var(--dash)}
.emptywk{padding:34px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:var(--muted)}
.caseHd{grid-column:1/-1;background:#f7f1e8;border-bottom:1px solid var(--hair);padding:7px 15px;
font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--burgundy)}
.caseHd span{color:var(--muted);text-transform:none;letter-spacing:.02em;font-size:9.5px;margin-left:10px}

.seg.sel{box-shadow:0 0 0 1.5px var(--burgundy)}
/* nodes: record events, sitting ON the bar */
.node{position:absolute;top:-56px;width:36px;height:36px;border-radius:50%;z-index:2;cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:13px;transform:translateX(-18px)}
.node.out{background:var(--pink);border:2px solid var(--burgundy);color:var(--burgundy)}
.node.in{background:var(--sagetint);border:2px solid var(--sage);color:var(--sagetxt)}
.node .tip{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;
font-size:7.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--label);white-space:nowrap;background:var(--parchment);padding:1px 5px;border-radius:5px}
/* waypoints: forecast ticks on a segment */
.wp{position:absolute;top:-54px;width:0;height:32px;border-left:2px dashed var(--sage);z-index:3;transform:translateX(-1px)}
.wp .tip{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:7.5px;
letter-spacing:.09em;text-transform:uppercase;color:var(--sagetxt);white-space:nowrap}
.wp.yours{border-color:var(--dash)}.wp.yours .tip{color:#a06a55}
/* your-tasks chips unchanged */
.chipx{position:absolute;top:-52px;height:28px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
padding:0 11px;font-size:11px;font-weight:500;cursor:pointer;background:var(--white);border:1px solid var(--line)}
.chipx .d{width:8px;height:8px;border-radius:2px;border:1.5px solid var(--burgundy)}
.legend{flex:0 0 auto;padding:0 26px 12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.lg .b{width:26px;height:12px;border-radius:999px}
</style>
</head>
<body>

<div class="mast">
  <span class="crumb">Tasks · Calendar</span>
  <h1>Edge cases — every rule, drawn</h1>
</div>

<div class="ctrl">
  <button class="btn">‹</button><button class="btn">TODAY</button><button class="btn">›</button>
  <span class="vsep"></span>
  <span class="fchip" data-on="true"><span class="sw" style="background:var(--pinkband);border:1px solid var(--burgundy)"></span>Your move</span>
  <span class="fchip" data-on="true"><span class="sw" style="background:var(--sagetint);border:1px solid var(--sage)"></span>Their move</span>
  <span class="fchip" data-on="true"><span class="sw" style="background:var(--rec)"></span>Record</span>
  <span class="fchip" data-on="true"><span class="sw" style="border:1.5px solid var(--burgundy)"></span>Your tasks</span>
  <span class="vsep"></span>
  <button class="btn">SORT · SOONEST ▾</button>
  <input class="srch" placeholder="Find an agent or task…">
  <span class="count">rules, not a real week</span>
</div>

<div class="board"><div class="bscroll"><div class="tl" id="tl"></div></div></div>

<div class="legend">
  <span class="lg"><span class="b" style="background:var(--sagetint);border:1px solid #d9e1d5"></span>Their move — window running</span>
  <span class="lg"><span class="b" style="background:var(--pinkband);border:1px solid var(--pinkb)"></span>Your move</span>
  <span class="lg"><span class="b" style="width:12px;height:12px;background:var(--pink);border:2px solid var(--burgundy)"></span>You did</span>
  <span class="lg"><span class="b" style="width:12px;height:12px;background:var(--sagetint);border:2px solid var(--sage)"></span>They did</span>
  <span class="lg" style="color:var(--sagetxt)">┊ forecast waypoint</span>
</div>

<script>
/* one lane per agent; the bar tells the whole story left to right */
/* Segments are expressed in fractional days and STOP SHORT of every interruption.
   GAP = the clearance either side of a node or waypoint, in days. */
var GAP=0.34;
/* Each case carries a heading so the rule is legible beside the drawing. */
var CASES=[
 ['After a nudge \u2014 the bar always runs to the next thing due','a nudge restarts the clock; the label names the next reminder',[
   {nm:'R. Whitmore',ag:'Whitmore & Bond',dot:'out',
    nodes:[[1.5,'out','\u2191','Nudge sent']],
    segs:[[0,1.5-GAP,'their','openleft stops','Reply window'],
          [1.5+GAP,7,'their','resumes future','Next reminder due 9 Sep']]}]],

 ['No reply time recorded','nothing is forecast, so nothing is drawn as a forecast',[
   {nm:'S. Dunn',ag:'Curtis Vane',dot:'out',
    segs:[[0,7,'their','norail','No reply time recorded \u00b7 give it a date']]}]],

 ['R&R and offers \u2014 open-ended by nature','your move, no deadline; the bar fades rather than ending',[
   {nm:'T. Ellery',ag:'Ellery & Co',dot:'half',
    segs:[[0,7,'yours','openend','Your move \u00b7 revise & resubmit \u00b7 no date set']]},
   {nm:'G. Panetta',ag:'Panetta Literary',dot:'out',
    segs:[[0,4.5-GAP,'yours','stops','Decide on the offer'],
          [4.5+GAP,7,'yours','resumes future','Their deadline \u00b7 31 Aug']],
    wps:[[4.5,'yours','They asked by Sun']]}]],

 ['A query closed mid-week','the bar stops dead at the closure; nothing follows it, ever',[
   {nm:'H. Vane-Coe',ag:'Stillwater Reps',dot:'out',
    nodes:[[3.5,'close','\u00d7','Closed \u00b7 Sat']],
    segs:[[0,3.5-GAP,'their','openleft stops','Reply window']]}]],

 ['Two manuscripts with one agent','the row is agent \u00d7 manuscript \u2014 two lanes, one head',[
   {nm:'J. Marsh',ag:'The Marsh Agency',dot:'half',tall:true,
    ms:["Murphy\u2019s Day Out","The Longer Dark"],
    segs:[[0,2.5-GAP,'their','stops','Reply window'],
          [2.5+GAP,7,'yours','resumes future','Your move \u00b7 send the full'],
          [0,7,'their','future l2','Reply window \u00b7 to 2 Oct']],
    nodes:[[2.5,'in','\u21a4','Full requested']]}]],

 ['A past week \u2014 nothing is provisional any more','dashes become solid; overtaken waypoints render as passed',[
   {nm:'P. Kaur',ag:'Kaur & Finch',dot:'out',past:true,
    nodes:[[2.5,'out','\u2191','Nudge sent']],
    segs:[[0,2.5-GAP,'their','openleft stops','Reply window'],
          [2.5+GAP,7,'their','resumes future','Reply window']],
    wps:[[5.5,'their','Reminder was due']]}]],

 ['Events on adjacent days','if the gaps would eat the segment, none is drawn \u2014 nothing happened between them',[
   {nm:'E. Whitfield',ag:'Greenfield Literary',dot:'half',
    nodes:[[2.5,'in','\u21a4','Partial requested'],[3.5,'out','\u2191','Partial sent']],
    segs:[[0,2.5-GAP,'their','openleft stops','Reply window'],
          [3.5+GAP,7,'their','resumes future','Reply window \u00b7 to 14 Sep']]}]],

 ['A snooze','your attention pauses; the agent\u2019s clock does not',[
   {nm:'D. Okafor',ag:'Castle Lane',dot:'out',
    segs:[[0,7,'yours','future openleft','Your move \u00b7 nudge due']],
    wps:[[3.5,'yours','Back on Sat']]}]],

 ['An empty week','one line, no illustration, no encouragement',[]]
];
var W=['SUN','MON','TUE','WED','THU','FRI','SAT'],TODAY=new Date(2026,7,26);
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayHdr(){
  var h='<div class="corner"><span class="lbl">Agents &amp; you</span></div>';
  for(var i=0;i<7;i++){var d=addD(TODAY,i);
    h+='<div class="dh'+(i===0?' today':'')+'"><div class="dw">'+W[d.getDay()]+'</div><div class="dd">'+d.getDate()+'</div></div>';}
  return h;
}
function rowHTML(r){
  var tall=r.tall?' tall':'';
  var h='<div class="rowhead'+tall+(r.past?' past':'')+'"><div class="nm"><span class="sd '+r.dot+'"></span>'+r.nm+'</div>'
   +'<div class="ag">'+r.ag+'</div>'+(r.ms?'<div class="ms">'+r.ms.join(' \u00b7 ')+'</div>':'')+'</div>';
  for(var i=0;i<7;i++){var d=addD(TODAY,i),dw=d.getDay();
    h+='<div class="dcell'+tall+((dw===0||dw===6)?' wkend':'')+(i===0?' today':'')+'"></div>';}
  var lane='';
  (r.segs||[]).forEach(function(sg){
    var L=(sg[0]/7)*100, Wd=((sg[1]-sg[0])/7)*100, mods=sg[3]||'';
    var caps=(mods.indexOf('openleft')<0&&mods.indexOf('resumes')<0&&mods.indexOf('norail')<0?'startcap ':'')
            +(mods.indexOf('future')<0&&mods.indexOf('stops')<0&&mods.indexOf('openend')<0&&mods.indexOf('norail')<0?'endcap ':'');
    lane+='<div class="seg '+sg[2]+' '+caps+mods+'" style="left:'+L+'%;width:'+Wd+'%">'+sg[4]+'</div>';
  });
  (r.wps||[]).forEach(function(w){
    lane+='<div class="wp '+(w[1]==='yours'?'yours':'')+'" style="left:'+((w[0]/7)*100)+'%"><span class="tip">'+w[2]+'</span></div>';});
  (r.nodes||[]).forEach(function(n){
    lane+='<div class="node '+n[1]+'" style="left:'+((n[0]/7)*100)+'%">'+n[2]+'<span class="tip">'+n[3]+'</span></div>';});
  (r.tasks||[]).forEach(function(t){
    lane+='<div class="chipx" style="left:calc('+((t[0]/7)*100)+'% + 5px)"><span class="d"></span>'+t[1]+'</div>';});
  return h+'<div class="lane'+(r.tall?' two':'')+'">'+lane+'</div>';
}
var out='';
CASES.forEach(function(c){
  out+='<div class="caseHd">'+c[0]+'<span>'+c[1]+'</span></div>';
  if(!c[2].length){out+='<div class="emptywk" style="grid-column:1/-1">Nothing this week.</div>';return;}
  out+=c[2].map(rowHTML).join('');
});
document.getElementById('tl').innerHTML=dayHdr()+out;
document.querySelectorAll('.rowhead.past').forEach(function(el){
  var n=el.nextElementSibling; for(var i=0;i<8&&n;i++){n.classList.add('past');n=n.nextElementSibling;}});
</script>
</body>
</html>
