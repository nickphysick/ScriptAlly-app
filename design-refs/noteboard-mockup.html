<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptAlly — Noteboard mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ground:#f2ede7; --parchment:#fdfaf5; --ink:#3a1c14; --ink-deep:#1c130f;
  --burgundy:#7c3a2a; --pink:#f5e2da; --pink-deep:#e8c8bc; --pink-band:#f3e0d6;
  --sage:#e9ede6; --sage-mid:#c9d3c5; --sage-dark:#5a6e58; --sage-ring:#8a9e88;
  --yellow:#fbf3d9; --yellow-deep:#eddfae;
  --muted:#9c8878; --rule:rgba(124,58,42,0.28);
}
body{font-family:'Inter',sans-serif;background:var(--ground);color:var(--ink);padding:28px 32px 120px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;opacity:.22;pointer-events:none;z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0.04'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
body>*{position:relative;z-index:2}
.mono{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)}

/* ============ Mount panel (canonical 3-layer) ============ */
.mount{background:var(--parchment);border-radius:14px;padding:6px;box-shadow:0 1px 2px rgba(58,28,20,.06),0 6px 24px rgba(58,28,20,.1);max-width:1240px;margin:0 auto}
.frame{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--parchment)}
.band{background:linear-gradient(135deg,#dce0d9 0%,#d0d6cc 100%);padding:22px 28px 18px;position:relative}
.band::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:rgba(90,110,88,.2)}
.band-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:500;color:var(--ink)}
.band-sub{font-size:13.5px;color:#4d5a4b;margin-top:5px;font-weight:300}
.band-count{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-dark)}

/* ============ Toolbar ============ */
.toolbar{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid rgba(124,58,42,.12);flex-wrap:wrap;background:var(--parchment)}
.search{flex:1;min-width:220px;max-width:340px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(124,58,42,.18);border-radius:8px;padding:8px 12px}
.search input{border:0;outline:0;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);width:100%}
.search input::placeholder{color:var(--muted)}
.search svg{flex:none}
.chipset{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;padding:6px 11px;border-radius:99px;border:1px solid rgba(124,58,42,.18);background:#fff;color:#6f5a4c;cursor:pointer;transition:background .12s}
.chip:hover{background:var(--ground)}
.chip.on{background:var(--pink);border-color:var(--pink-deep);color:var(--burgundy)}
.spacer{flex:1}
.viewtog{display:flex;border:1px solid rgba(124,58,42,.18);border-radius:8px;overflow:hidden}
.viewtog button{border:0;background:#fff;padding:7px 13px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6f5a4c;cursor:pointer}
.viewtog button.on{background:var(--ground);color:var(--ink)}
.btn{border:0;cursor:pointer;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;border-radius:9px;padding:9px 16px;transition:background .12s}
.btn-primary{background:var(--pink);border:1px solid var(--pink-deep);color:var(--burgundy)}
.btn-primary:hover{background:var(--pink-deep)}
.btn-ghost{background:transparent;border:1px solid rgba(124,58,42,.22);color:var(--burgundy)}
.btn-ghost:hover{background:var(--ground)}

/* ============ Board ============ */
.boardwrap{padding:26px 28px 40px;background:var(--parchment)}
.board{columns:3;column-gap:18px}
.board.cols-1{columns:1;max-width:640px;margin:0 auto}
@media(max-width:1000px){.board{columns:2}}
@media(max-width:680px){.board{columns:1}}
.note{break-inside:avoid;margin:0 0 18px;border-radius:10px;padding:18px 18px 12px;position:relative;border:1px solid transparent;box-shadow:0 1px 2px rgba(58,28,20,.05),0 3px 10px rgba(58,28,20,.07);transition:box-shadow .15s}
.note:hover{box-shadow:0 2px 4px rgba(58,28,20,.07),0 8px 20px rgba(58,28,20,.11)}
.note.c-yellow{background:var(--yellow);border-color:var(--yellow-deep)}
.note.c-pink{background:var(--pink);border-color:var(--pink-deep)}
.note.c-sage{background:var(--sage);border-color:var(--sage-mid)}
.note-body{font-family:'Caveat',cursive;font-size:21px;line-height:1.32;color:var(--ink-deep);white-space:pre-wrap;word-break:break-word}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:26px}
.note-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:#8a7466;background:rgba(255,255,255,.55);border-radius:99px;padding:3px 9px}
.note-date{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:#8a7466;margin-left:auto}
.kebab{border:0;background:transparent;cursor:pointer;color:#8a7466;padding:4px;border-radius:6px;line-height:0}
.kebab:hover{background:rgba(255,255,255,.6);color:var(--burgundy)}
.taskbadge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage-dark);background:rgba(255,255,255,.6);border:1px dashed var(--sage-ring);border-radius:99px;padding:3px 10px;margin-top:10px}

/* pin affordance */
.ghost{break-inside:avoid;margin:0 0 18px;border:1.5px dashed rgba(124,58,42,.3);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--burgundy);font-size:13.5px;font-weight:500;background:transparent;width:100%;font-family:'Inter',sans-serif;transition:background .12s}
.ghost:hover{background:rgba(245,226,218,.4)}

/* ============ Composer (in-flow card) ============ */
.composer{break-inside:avoid;margin:0 0 18px;border-radius:10px;border:1px solid var(--yellow-deep);background:var(--yellow);padding:16px 16px 12px;box-shadow:0 4px 16px rgba(58,28,20,.12)}
.composer textarea{width:100%;border:0;outline:0;background:transparent;font-family:'Caveat',cursive;font-size:21px;line-height:1.32;color:var(--ink-deep);resize:none;min-height:84px}
.composer textarea::placeholder{color:rgba(58,28,20,.35)}
.composer-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.swatches{display:flex;gap:7px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1px solid rgba(58,28,20,.18);padding:0}
.sw.on{outline:2px solid var(--burgundy);outline-offset:2px}
.sw.s-yellow{background:var(--yellow)} .sw.s-pink{background:var(--pink)} .sw.s-sage{background:var(--sage)}
.taginput{font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid rgba(58,28,20,.16);background:rgba(255,255,255,.55);border-radius:99px;padding:5px 10px;outline:0;color:var(--ink);width:110px}
.composer-actions{margin-left:auto;display:flex;gap:8px}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px}

/* ============ Menus & popovers ============ */
.menu{position:absolute;z-index:80;background:#fff;border:1px solid rgba(124,58,42,.16);border-radius:10px;box-shadow:0 8px 28px rgba(58,28,20,.16);padding:5px;min-width:186px}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);padding:8px 11px;border-radius:7px;cursor:pointer}
.mi:hover{background:var(--ground)}
.mi.danger{color:var(--burgundy)}
.mi-swatches{display:flex;gap:8px;padding:8px 11px}
.menu hr{border:0;border-top:1px solid rgba(124,58,42,.1);margin:4px 6px}

.pop{position:absolute;z-index:81;background:var(--parchment);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 36px rgba(58,28,20,.2);padding:16px;width:300px}
.pop h4{font-family:'Playfair Display',serif;font-size:16px;font-weight:500;margin-bottom:4px}
.pop p{font-size:12px;color:#6f5a4c;line-height:1.45;margin-bottom:12px;font-weight:300}
.pop label{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.pop input{width:100%;border:1px solid rgba(124,58,42,.2);border-radius:8px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;background:#fff;color:var(--ink);outline:0}
.pop-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* ============ Examples drawer ============ */
.scrim{position:fixed;inset:0;background:rgba(58,28,20,.22);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--parchment);z-index:91;box-shadow:-12px 0 40px rgba(58,28,20,.18);transform:translateX(103%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:24px 26px 18px;border-bottom:1px solid rgba(124,58,42,.14)}
.drawer-head h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:500}
.drawer-head p{font-size:13px;font-weight:300;color:#6f5a4c;margin-top:6px;line-height:1.5}
.drawer-close{position:absolute;top:18px;right:18px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;padding:6px;border-radius:8px}
.drawer-close:hover{background:var(--ground);color:var(--burgundy)}
.drawer-body{overflow-y:auto;padding:18px 26px 40px;flex:1}
.exgroup{margin-bottom:22px}
.exgroup>.mono{display:block;margin-bottom:10px}
.exnote{border-radius:10px;border:1px solid transparent;padding:14px 14px 10px;margin-bottom:10px}
.exnote .note-body{font-size:19px}
.exnote-foot{display:flex;justify-content:flex-end;margin-top:8px}
.uselink{border:0;background:transparent;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--burgundy);padding:4px 8px;border-radius:6px}
.uselink:hover{background:rgba(255,255,255,.6)}

/* ============ Receipt toast ============ */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--parchment);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:14px;z-index:95;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 10px 30px rgba(28,19,15,.3)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:transparent;color:#f0c9ba;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}

.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;font-weight:300}
</style>
</head>
<body>

<div class="mount">
  <div class="frame">
    <div class="band">
      <div class="band-row">
        <div>
          <h1>Noteboard</h1>
          <div class="band-sub">Thoughts, snippets, and things worth keeping — pinned where you can see them.</div>
        </div>
        <div class="band-count" id="bandCount"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9c8878" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchBox" type="text" placeholder="Search your notes…">
      </div>
      <div class="chipset" id="tagChips"></div>
      <div class="spacer"></div>
      <div class="viewtog">
        <button id="tgBoard" class="on">Board</button>
        <button id="tgColumn">Column</button>
      </div>
      <button class="btn btn-ghost" id="btnExamples">Examples</button>
      <button class="btn btn-primary" id="btnPin">+ Pin a note</button>
    </div>

    <div class="boardwrap">
      <div class="board" id="board"></div>
      <div class="empty" id="emptyState" hidden>Nothing matches that search.</div>
    </div>
  </div>
</div>

<!-- Examples drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Example notes">
  <div class="drawer-head">
    <h2>What writers keep here</h2>
    <p>Real kinds of notes from writers in the query trenches. Use any of these as a starting point — it lands on your board ready to edit.</p>
    <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
'use strict';
/* ---------- state ---------- */
var COLOURS=['yellow','pink','sage'];
var seedDate=function(d){return d;};
var notes=[
  {id:1,c:'yellow',tag:'agents',date:'12 Aug',body:'Kate Burke (Diamond Kahn & Woods) said on The Bestseller Experiment she wants "thrillers with a domestic heart" — lead the letter with that.',task:null},
  {id:2,c:'sage',tag:'letter',date:'14 Aug',body:'Synopsis rules to remember:\n• present tense\n• spoil the ending\n• one page, ~500 words\n• plot, not theme',task:null},
  {id:3,c:'pink',tag:'comps',date:'15 Aug',body:'Possible comp: The Last Word by Taylor Adams? Check the publication year — comps should be under five years old.',task:null},
  {id:4,c:'yellow',tag:'calls',date:'17 Aug',body:'Questions if an agent calls:\n— editorial vision for the book?\n— which editors do they have in mind?\n— how do they like to communicate?\n— what happens if book one doesn\u2019t sell?',task:null},
  {id:5,c:'sage',tag:'strategy',date:'19 Aug',body:'Two form passes mentioned the opening pace. One is noise, two is a pattern — look at chapter one again before the next batch goes out.',task:{label:'Revisit chapter one pacing',date:'26 Aug'}},
  {id:6,c:'pink',tag:'agents',date:'20 Aug',body:'Mushens Entertainment closed to queries until October — check their #MSWL posts when the window reopens.',task:null}
];
var nextId=7;
var filterTag='All';
var searchQ='';
var view='board';
var composerOpen=false;
var composerDraft={body:'',c:'yellow',tag:''};
var lastRemoved=null, toastTimer=null;

/* ---------- example content (querying-writer canon) ---------- */
var EXAMPLES=[
 {group:'Personalisation',items:[
   {c:'yellow',tag:'agents',body:'Heard [agent] on [podcast] — she\u2019s hunting locked-room mysteries with an unreliable narrator. Save the exact quote for the opening line of the letter.'},
   {c:'pink',tag:'agents',body:'[Agent]\u2019s #MSWL: "speculative fiction that feels like literary fiction wearing a disguise." That\u2019s the book. Query when their window opens.'}
 ]},
 {group:'The letter & package',items:[
   {c:'sage',tag:'letter',body:'One-line pitch, draft 4: When a small-town archivist vanishes, the sister who stopped believing in her must decide which of the town\u2019s stories were ever true.'},
   {c:'yellow',tag:'letter',body:'Standard UK package: letter + one-page synopsis + first three chapters (or first 50 pages). Always check the agency page — some want 5k words, some want 10k.'}
 ]},
 {group:'Comps',items:[
   {c:'pink',tag:'comps',body:'Comp shortlist: recent (under 5 yrs), same shelf, sold well but not a phenomenon. "X meets Y" only if both halves pull weight.'}
 ]},
 {group:'Reading the responses',items:[
   {c:'sage',tag:'strategy',body:'Response patterns so far: two mentioned the opening, one asked for the full off the same pages. Wait for one more data point before changing anything.'},
   {c:'yellow',tag:'strategy',body:'Batch plan: 6–8 queries at a time. If a batch comes back quiet, revise the letter before the next one — don\u2019t burn the whole list on draft one.'}
 ]},
 {group:'If the call comes',items:[
   {c:'pink',tag:'calls',body:'Before saying yes: ask for time to notify other agents with the full (1–2 weeks is normal), and ask to speak to one of their current clients.'}
 ]},
 {group:'While you wait',items:[
   {c:'sage',tag:'next-book',body:'Book two seed: a coastal village where the tide brings back things people threw away. Write 200 words on it every time a response lands.'}
 ]}
];

/* ---------- helpers ---------- */
function el(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function today(){var d=new Date();return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];}
function allTags(){var s={};notes.forEach(function(n){if(n.tag)s[n.tag]=1;});return Object.keys(s).sort();}
function closeFloats(){document.querySelectorAll('.menu,.pop').forEach(function(m){m.remove();});}

/* ---------- render ---------- */
var board=document.getElementById('board');
function render(){
  closeFloats();
  board.className='board'+(view==='column'?' cols-1':'');
  board.innerHTML='';
  /* composer or ghost first */
  if(composerOpen){board.appendChild(renderComposer());}
  else{
    var g=el('<button class="ghost">+ Pin a note</button>');
    g.onclick=function(){openComposer();};
    board.appendChild(g);
  }
  var visible=notes.filter(function(n){
    if(filterTag!=='All'&&n.tag!==filterTag)return false;
    if(searchQ&&n.body.toLowerCase().indexOf(searchQ)===-1)return false;
    return true;
  });
  visible.forEach(function(n){board.appendChild(renderNote(n));});
  document.getElementById('emptyState').hidden=!(visible.length===0&&(searchQ||filterTag!=='All'));
  var c=notes.length;
  document.getElementById('bandCount').textContent=c+(c===1?' note pinned':' notes pinned');
  renderChips();
}
function renderChips(){
  var wrap=document.getElementById('tagChips');wrap.innerHTML='';
  ['All'].concat(allTags()).forEach(function(t){
    var b=el('<button class="chip'+(filterTag===t?' on':'')+'">#'+esc(t)+'</button>');
    b.onclick=function(){filterTag=t;render();};
    wrap.appendChild(b);
  });
}
function renderNote(n){
  var card=el('<div class="note c-'+n.c+'" data-id="'+n.id+'"></div>');
  card.appendChild(el('<div class="note-body">'+esc(n.body)+'</div>'));
  if(n.task){
    card.appendChild(el('<div class="taskbadge">✓ On your to-do list · '+esc(n.task.date)+'</div>'));
  }
  var foot=el('<div class="note-foot"></div>');
  if(n.tag)foot.appendChild(el('<span class="note-tag">#'+esc(n.tag)+'</span>'));
  foot.appendChild(el('<span class="note-date">'+esc(n.date)+'</span>'));
  var kb=el('<button class="kebab" aria-label="Note actions"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>');
  kb.onclick=function(e){e.stopPropagation();openMenu(n,card,kb);};
  foot.appendChild(kb);
  card.appendChild(foot);
  return card;
}

/* ---------- kebab menu ---------- */
function openMenu(n,card,anchor){
  closeFloats();
  var m=el('<div class="menu"></div>');
  var edit=el('<button class="mi">✎&nbsp; Edit</button>');
  edit.onclick=function(){closeFloats();startEdit(n);};
  m.appendChild(edit);
  var swr=el('<div class="mi-swatches"></div>');
  COLOURS.forEach(function(c){
    var s=el('<button class="sw s-'+c+(n.c===c?' on':'')+'" aria-label="'+c+'"></button>');
    s.onclick=function(){n.c=c;render();};
    swr.appendChild(s);
  });
  m.appendChild(swr);
  m.appendChild(el('<hr>'));
  if(!n.task){
    var mk=el('<button class="mi">☑&nbsp; Turn into a task…</button>');
    mk.onclick=function(){closeFloats();openTaskPop(n,card);};
    m.appendChild(mk);
  }else{
    var un=el('<button class="mi">☐&nbsp; Detach from tasks</button>');
    un.onclick=function(){n.task=null;render();showToast('Task detached — the note stays here.',null);};
    m.appendChild(un);
  }
  var rm=el('<button class="mi danger">🗑&nbsp; Remove note</button>');
  rm.onclick=function(){removeNote(n);};
  m.appendChild(rm);
  card.appendChild(m);
  var r=anchor.getBoundingClientRect(), cr=card.getBoundingClientRect();
  m.style.top=(r.bottom-cr.top+6)+'px';
  m.style.right='10px';
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.menu')&&!e.target.closest('.pop')&&!e.target.closest('.kebab'))closeFloats();
});

/* ---------- edit-in-place ---------- */
function startEdit(n){
  var card=board.querySelector('[data-id="'+n.id+'"]');if(!card)return;
  var bodyEl=card.querySelector('.note-body');
  var ta=el('<textarea style="width:100%;border:0;outline:0;background:transparent;font-family:Caveat,cursive;font-size:21px;line-height:1.32;color:var(--ink-deep);resize:none"></textarea>');
  ta.value=n.body;
  bodyEl.replaceWith(ta);
  autosize(ta);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  function commit(){n.body=ta.value.trim()||n.body;render();}
  ta.addEventListener('blur',commit);
  ta.addEventListener('input',function(){autosize(ta);});
}
function autosize(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight)+'px';}

/* ---------- composer ---------- */
function openComposer(seed){
  composerDraft={body:seed&&seed.body||'',c:seed&&seed.c||'yellow',tag:seed&&seed.tag||''};
  composerOpen=true;render();
  var ta=board.querySelector('.composer textarea');
  if(ta){autosize(ta);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}
function renderComposer(){
  var c=el('<div class="composer"></div>');
  c.classList.remove('c-yellow','c-pink','c-sage');
  c.style.background='var(--'+(composerDraft.c==='yellow'?'yellow':composerDraft.c==='pink'?'pink':'sage')+')';
  c.style.borderColor=composerDraft.c==='yellow'?'var(--yellow-deep)':composerDraft.c==='pink'?'var(--pink-deep)':'var(--sage-mid)';
  var ta=el('<textarea placeholder="Write it down before it goes…"></textarea>');
  ta.value=composerDraft.body;
  ta.addEventListener('input',function(){composerDraft.body=ta.value;autosize(ta);});
  c.appendChild(ta);
  var row=el('<div class="composer-row"></div>');
  var swr=el('<div class="swatches"></div>');
  COLOURS.forEach(function(col){
    var s=el('<button class="sw s-'+col+(composerDraft.c===col?' on':'')+'" aria-label="'+col+'"></button>');
    s.onclick=function(){composerDraft.c=col;composerDraft.body=ta.value;render();openComposerFocus();};
    swr.appendChild(s);
  });
  row.appendChild(swr);
  var tg=el('<input class="taginput" placeholder="#tag">');
  tg.value=composerDraft.tag;
  tg.addEventListener('input',function(){composerDraft.tag=tg.value.replace(/^#/,'');});
  row.appendChild(tg);
  var acts=el('<div class="composer-actions"></div>');
  var cancel=el('<button class="btn btn-ghost btn-sm">Cancel</button>');
  cancel.onclick=function(){composerOpen=false;render();};
  var pin=el('<button class="btn btn-primary btn-sm">Pin it</button>');
  pin.onclick=function(){
    var body=ta.value.trim();if(!body){composerOpen=false;render();return;}
    notes.unshift({id:nextId++,c:composerDraft.c,tag:composerDraft.tag.trim(),date:today(),body:body,task:null});
    composerOpen=false;render();
  };
  acts.appendChild(cancel);acts.appendChild(pin);
  row.appendChild(acts);
  c.appendChild(row);
  return c;
}
function openComposerFocus(){var ta=board.querySelector('.composer textarea');if(ta){autosize(ta);ta.focus();}}

/* ---------- turn into a task ---------- */
function openTaskPop(n,card){
  var pop=el('<div class="pop"></div>');
  pop.appendChild(el('<h4>Turn into a task</h4>'));
  pop.appendChild(el('<p>The task appears on your to-do list and calendar. The note stays here, unchanged.</p>'));
  pop.appendChild(el('<label>Task</label>'));
  var firstLine=n.body.split('\n')[0].slice(0,60);
  var ti=el('<input type="text">');ti.value=firstLine;pop.appendChild(ti);
  pop.appendChild(el('<label>Date</label>'));
  var di=el('<input type="date">');pop.appendChild(di);
  var acts=el('<div class="pop-actions"></div>');
  var cancel=el('<button class="btn btn-ghost btn-sm">Cancel</button>');
  cancel.onclick=function(){closeFloats();};
  var go=el('<button class="btn btn-primary btn-sm">Add to tasks</button>');
  go.onclick=function(){
    var d=di.value?new Date(di.value+'T00:00:00'):new Date();
    var lbl=d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    n.task={label:ti.value.trim()||firstLine,date:lbl};
    render();
    showToast('Added to your to-do list for '+lbl+'.',null);
  };
  acts.appendChild(cancel);acts.appendChild(go);
  pop.appendChild(acts);
  card.appendChild(pop);
  pop.style.top='30px';pop.style.right='6px';
  ti.focus();
}

/* ---------- remove + undo receipt ---------- */
function removeNote(n){
  var idx=notes.indexOf(n);
  lastRemoved={note:n,index:idx};
  notes.splice(idx,1);render();
  showToast('Note removed.',function(){
    if(lastRemoved){notes.splice(lastRemoved.index,0,lastRemoved.note);lastRemoved=null;render();}
  });
}
var toast=document.getElementById('toast');
function showToast(msg,undoFn){
  document.getElementById('toastMsg').textContent=msg;
  var ub=document.getElementById('toastUndo');
  ub.style.display=undoFn?'':'none';
  ub.onclick=function(){if(undoFn)undoFn();hideToast();};
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,5000);
}
function hideToast(){toast.classList.remove('show');}

/* ---------- examples drawer ---------- */
var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function buildDrawer(){
  var b=document.getElementById('drawerBody');b.innerHTML='';
  EXAMPLES.forEach(function(g){
    var grp=el('<div class="exgroup"><span class="mono">'+esc(g.group)+'</span></div>');
    g.items.forEach(function(it){
      var card=el('<div class="exnote c-'+it.c+' note"></div>');
      card.classList.remove('note');card.classList.add('exnote','c-'+it.c);
      card.style.background='var(--'+(it.c==='yellow'?'yellow':it.c==='pink'?'pink':'sage')+')';
      card.style.borderColor=it.c==='yellow'?'var(--yellow-deep)':it.c==='pink'?'var(--pink-deep)':'var(--sage-mid)';
      card.appendChild(el('<div class="note-body">'+esc(it.body)+'</div>'));
      var f=el('<div class="exnote-foot"></div>');
      var use=el('<button class="uselink">Use as a starting point →</button>');
      use.onclick=function(){closeDrawer();openComposer({body:it.body,c:it.c,tag:it.tag});window.scrollTo({top:0,behavior:'smooth'});};
      f.appendChild(use);card.appendChild(f);
      grp.appendChild(card);
    });
    b.appendChild(grp);
  });
}
function openDrawer(){buildDrawer();drawer.classList.add('open');scrim.classList.add('open');}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('btnExamples').onclick=openDrawer;
document.getElementById('drawerClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;

/* ---------- toolbar wiring ---------- */
document.getElementById('btnPin').onclick=function(){openComposer();window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('searchBox').addEventListener('input',function(e){searchQ=e.target.value.trim().toLowerCase();render();});
document.getElementById('tgBoard').onclick=function(){view='board';this.classList.add('on');document.getElementById('tgColumn').classList.remove('on');render();};
document.getElementById('tgColumn').onclick=function(){view='column';this.classList.add('on');document.getElementById('tgBoard').classList.remove('on');render();};

render();
})();
</script>
