<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>ScriptAlly — filter · sort · group</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--app:#f2ede7;--ground:#faf7f2;--ink:#1c130f;--body:#3a1c14;--muted:#8a7a6c;--label:#9c8878;
--pink:#f5e2da;--pinkb:#e8c8bc;--pinkd:#efd5ca;--pinkdd:#e6c3b4;--sage:#e9ede6;--sagetx:#5a6e58;--sagebd:#d6ddd2;
--slate:#e3eaf0;--slatetx:#4b5f73;--slatebd:#cfdbe6;--grey:#efebe4;--greytx:#8a7a6c;
--cardbd:#e0d5c8;--hair:#efe6da;--railbd:#e0d3bf;--railline:#e3d7c4;--tick:#cdbfa8;
--row-h:62px;--bar-h:54px;--mk-size:28px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--app);font-family:Inter,sans-serif;color:var(--body);-webkit-font-smoothing:antialiased;padding:18px 20px 70px}
.lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--label)}
.sw{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid #e5d8c9;border-radius:9px;overflow:hidden}
.seg button{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;font-weight:500;border:none;background:transparent;color:#6a5a50;padding:8px 12px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--hair)}
.seg button[data-on="true"]{background:var(--pink);color:var(--ink)}
.panel{background:var(--ground);border:1px solid #e9dfd0;border-radius:18px;box-shadow:0 2px 10px rgba(58,28,20,.05)}
.masthead{padding:22px 26px 12px}
.crumb{display:inline-flex;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--label);border:1px solid #e5d8c9;border-radius:999px;padding:5px 11px;background:#fff;margin-bottom:9px}
h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:500;line-height:1.2;color:var(--ink)}
/* control rows */
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 26px 10px;position:relative}
.ctrl.second{padding-top:0;padding-bottom:14px;min-height:0}
.btn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;font-weight:500;border-radius:9px;padding:8px 12px;cursor:pointer;background:#fff;border:1px solid #e5d8c9;color:#6a5a50}
.srch{font-size:11px;border:1px solid #e5d8c9;border-radius:9px;padding:8px 12px;background:#fff;width:140px}
.count{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--label);margin-left:auto;white-space:nowrap}
.dd{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.09em;font-weight:500;border-radius:3px;padding:8px 11px;background:#fff;border:1px solid #d4c3ae;color:#54402f;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.dd.on{background:var(--pink);border-color:var(--pinkb);color:var(--ink)}
.dd .n{background:var(--ink);color:#fff;border-radius:999px;font-size:7.5px;padding:2px 5px;line-height:1}
.pop{position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid var(--hair);border-radius:9px;box-shadow:0 8px 24px rgba(58,28,20,.14);padding:10px;z-index:40;min-width:230px;display:none}
.pop.open{display:block}
.pop .h{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);margin:6px 0 6px 4px}
.pop .h:first-child{margin-top:0}
.pop .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.opt{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.08em;padding:6px 9px;border-radius:999px;border:1px solid #e5d8c9;background:#fff;color:#6a5a50;cursor:pointer;white-space:nowrap}
.opt.on{background:var(--pink);border-color:var(--pinkb);color:var(--ink)}
.opt.sq{border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.08em;padding:5px 9px;border-radius:999px;border:1px solid var(--pinkb);background:var(--pink);color:var(--ink);display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chip i{font-style:normal;opacity:.55}
.tabs{display:inline-flex;gap:2px;border-bottom:1px solid #e6dbc9;padding-bottom:0}
.tab{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;font-weight:500;color:#8a7a6c;padding:8px 12px 9px;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.facet{display:flex;align-items:center;gap:6px}
.facet .k{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
/* rail */
.inner{padding:0 26px 30px}
.railwrap{position:sticky;top:0;z-index:20;background:var(--ground);padding:6px 0 0}
.rail{display:flex;height:42px;border-bottom:1px solid var(--railbd)}
.rail .c-nm{display:flex;align-items:center}
.rail .c-tl{overflow:visible;position:relative}
.rl-line{position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--railline)}
.tick{position:absolute;bottom:0;width:0;height:5px;border-left:1px solid var(--tick);z-index:2}
.dlab{position:absolute;bottom:7px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.1em;color:var(--label);z-index:2}
.tdchip{position:absolute;bottom:4px;transform:translateX(-50%);background:var(--ink);color:#f8f5f0;font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.1em;padding:3px 7px;border-radius:999px;z-index:5}
.tdstem{position:absolute;bottom:0;width:0;height:5px;border-left:1.5px solid var(--ink);z-index:4}
/* groups + rows */
.gt{display:flex;align-items:baseline;gap:9px;padding:18px 2px 6px}
.gt .t{font-family:'Playfair Display',serif;font-size:19px;font-weight:500;color:var(--ink)}
.gt .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--label)}
.rrow{display:flex;align-items:stretch;min-height:var(--row-h);position:relative}
.rrow:hover{background:#f5f0e7}
.rrow.asks::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--pinkb);z-index:3}
.c-nm{flex:0 0 300px;display:flex;align-items:center;gap:11px;padding:0 13px}
.c-nm .nm{font-family:'Playfair Display',serif;font-size:14.5px;font-weight:500;line-height:1.15;color:var(--ink)}
.c-nm .ag{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:var(--label);margin-top:2px;display:block}
.c-tl{flex:1 1 auto;position:relative;overflow:visible}
.rrow.quietrow .nm,.rrow.quietrow .ag{opacity:.62}
.empty{padding:34px 0 10px;font-family:'Playfair Display',serif;font-size:17px;color:var(--muted);text-align:center}
.past{position:absolute;top:0;bottom:0;left:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(58,28,20,.055))}
.td{position:absolute;top:0;bottom:0;z-index:7;pointer-events:none;border-left:1.5px solid var(--ink);opacity:.55}
/* cards — no fill */
.card{position:absolute;height:var(--bar-h);top:50%;transform:translateY(-50%);border-radius:9px;z-index:2;
  background:#fff;border:1px solid var(--cardbd);box-shadow:0 1px 3px rgba(58,28,20,.06);
  display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 13px;cursor:pointer;transition:box-shadow .13s,transform .13s}
.card:hover{box-shadow:0 5px 16px rgba(58,28,20,.17);transform:translateY(-50%) scale(1.004);z-index:6}
.card .pill{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.card .line{display:block;overflow:hidden;min-width:0;position:relative;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.card .line.fits{-webkit-mask-image:none;mask-image:none}
.card .track{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap;will-change:transform,opacity}
.card .track .dup{display:inline-flex;align-items:baseline;gap:10px;margin-left:38px}
.card .hl{font-family:'Playfair Display',serif;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.25}
.card .sep{width:1px;align-self:stretch;background:#e2d7c9;flex:0 0 auto}
.card .dt{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.pill.you{background:var(--pink);color:var(--ink);border:1px solid var(--pinkb)}
.pill.them{background:var(--sage);color:var(--sagetx);border:1px solid var(--sagebd)}
.pill.wait{background:var(--slate);color:var(--slatetx);border:1px solid var(--slatebd)}
.pill.quiet{background:var(--grey);color:var(--greytx);border:1px solid #e5dfd4}
.pill.closed{background:transparent;color:var(--label);border:1px solid #ddd0c0}
.card.owed .pill{background:var(--pinkd);border-color:var(--pinkdd);font-weight:700}
.card.owed{border-color:var(--pinkb);box-shadow:0 6px 16px rgba(58,28,20,.16);transform:translateY(-50%) scale(1.006);z-index:4}
.card.quietc{background:#fcfaf6;box-shadow:none}.card.quietc .hl{color:var(--muted)}
.card.closedc{border-style:dashed;box-shadow:none;background:transparent}.card.closedc .hl{color:var(--label)}
.card.fadeR{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 38px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 38px),transparent)}
.card.fadeL{border-top-left-radius:0;border-bottom-left-radius:0;border-left:none;padding-left:46px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38px);mask-image:linear-gradient(90deg,transparent,#000 38px)}
.card.fadeL.fadeR{-webkit-mask-image:linear-gradient(90deg,transparent,#000 38px,#000 calc(100% - 38px),transparent);mask-image:linear-gradient(90deg,transparent,#000 38px,#000 calc(100% - 38px),transparent)}
.ghost{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:999px;border:1.5px dotted #cdbfa8;background:var(--ground);display:flex;align-items:center;justify-content:center;color:#9c8878;z-index:5}
.ghost svg{width:13px;height:13px}
.ghost.yours{border-color:var(--pinkdd);color:#a5735c}
.ghost.due{border-style:solid;border-color:var(--pinkdd);background:#fff;color:#a5735c;box-shadow:0 2px 6px rgba(58,28,20,.14)}
.ghost .bdg{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:999px;background:var(--pinkd);border:1px solid var(--pinkdd);color:#7a4a35;font-family:'Playfair Display',serif;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
.ghost.suggest{border-color:#d5cec3;color:#8a7a6c}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:var(--mk-size);height:var(--mk-size);border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 0 0 3px var(--ground);border:1.5px solid #cdbfa8;color:#6a5a50}
.mk svg{width:12px;height:12px}
.task{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;z-index:3;white-space:nowrap}
.task .ic{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
.task .ic i{width:8px;height:8px;border-radius:2px;background:var(--pink)}
.task .tl1{font-family:'Playfair Display',serif;font-size:13px;font-weight:500;color:var(--ink)}
.task .tl2{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--label);display:block;margin-top:1px}
.note{margin-top:20px;font-size:12px;color:#5c4c40;line-height:1.65;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:13px 16px;max-width:1080px}
.note b{color:var(--ink)}.note p{margin-bottom:7px}
</style>
</head>
<body>

<div class="sw">
  <span class="lbl">Long text</span>
  <div class="seg" id="mq"><button data-a="reset" data-on="true">SCROLL · PAUSE · BACK TO START</button><button data-a="loop" data-on="false">CONTINUOUS LOOP</button></div>
  <span class="lbl">Control model</span>
  <div class="seg" id="model">
    <button data-m="A" data-on="true">A · FILTER · SORT · GROUP</button>
    <button data-m="B" data-on="false">B · VIEWS + DISPLAY</button>
    <button data-m="C" data-on="false">C · FACETS ON THE SURFACE</button>
  </div>
</div>

<div class="panel">
  <div class="masthead"><span class="crumb">TASKS</span><h1>Calendar</h1></div>
  <div id="controls"></div>
  <div class="inner" id="inner">
    <div class="railwrap"><div class="rail">
      <div class="c-nm"><span class="lbl">Agent</span></div>
      <div class="c-tl" id="railtl"></div>
    </div></div>
    <div id="board"></div>
  </div>
</div>

<div class="note" id="note"></div>

<script>
/* ————— data ————— */
var TP=30;
var STATUS_ORDER=['Queried','Partial requested','Partial sent','Full requested','Full sent','Revise & resubmit','Offer','No response','Rejected','Withdrawn'];
var CLOSED=['Rejected','Withdrawn','No response'];
var MS={m1:"Murphy's Day Out",m2:'The Salt Path Home'};
var CLOCK='<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.6 V6 L7.8 7.2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>';
var ARR='<svg viewBox="0 0 10 10"><path d="M8 5 H2.6 M4.6 2.8 L2.4 5 L4.6 7.2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
var GLYPH={nudge:'<svg viewBox="0 0 14 14"><path d="M3 7 H10 M8 4.6 L10.6 7 L8 9.4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
 half:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 2.4 A4.6 4.6 0 0 1 7 11.6 Z" fill="currentColor"/></svg>',
 answer:'<svg viewBox="0 0 14 14"><path d="M3.4 7.4 L6 10 L10.8 4.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
 close:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.2 5.2 L8.8 8.8 M8.8 5.2 L5.2 8.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'};
function card(o){
  var h='<div class="card '+(o.cls||'')+(o.ongoing?' fadeR':'')+(o.clipL?' fadeL':'')+'" style="left:'+o.l+'%;width:calc('+o.w+'% + '+(o.ongoing?38:0)+'px)">';
  h+='<span class="pill '+o.pk+'">'+o.pill+'</span><span class="line"><span class="track"><span class="hl">'+o.hl+'</span><span class="sep"></span><span class="dt">'+o.dt+'</span></span></span></div>';
  return h;
}
function ghost(at,kind,side,mod){
  var h='<div class="ghost '+side+(mod?' '+mod:'')+'" style="left:'+at+'%">'+GLYPH[kind];
  if(mod==='due')h+='<span class="bdg">!</span>';return h+'</div>';
}
function task(o){return '<div class="task" style="left:'+o.l+'%"><span class="ic"><i></i></span><span><span class="tl1">'+o.t1+'</span><span class="tl2">'+o.t2+'</span></span></div>';}
/* whose: you | them | none | closed ; pressing: days (neg = past), null = undated ; waiting/recent in days */
var ROWS=[
 {id:'pan',nm:'Greg Panetta',ag:'Panetta Literary',ms:'m1',status:'Partial requested',whose:'you',pressing:-64,waiting:64,recent:64,
  tl:card({cls:'owed',l:0,w:TP,pk:'you',pill:'Send the partial',hl:'Partial requested',dt:'64 days ago · no date promised',clipL:1,ongoing:1})+ghost(TP+7,'half','yours','due')},
 {id:'tan',nm:'William Tan',ag:'Foxglove Literary',ms:'m1',status:'Queried',whose:'you',pressing:-32,waiting:33,recent:33,
  tl:card({cls:'owed',l:0,w:TP,pk:'you',pill:'Nudge due',hl:'Queried',dt:'sent 29 Jul · nudge due 30 Jul',clipL:1,ongoing:1})+ghost(TP+7,'nudge','yours','due')},
 {id:'ell',nm:'Tom Ellery',ag:'Curtis Vane',ms:'m1',status:'Offer',whose:'you',pressing:6,waiting:120,recent:12,
  tl:card({l:TP-20,w:15,pk:'you',pill:'Answer the offer',hl:'Offer',dt:'respond by 6 Sept · three others hold material'})+ghost(TP-3,'answer','yours')},
 {id:'t1',task:1,nm:'Draft the Ellery reply',ag:'Your task',ms:'m1',status:'Task',whose:'you',pressing:2,waiting:0,recent:1,
  tl:task({l:TP+1,t1:'Draft the Ellery reply',t2:'due 2 Sept'})},
 {id:'dun',nm:'Sophie Dunn',ag:'Curtis Vane',ms:'m1',status:'Queried',whose:'them',pressing:3,waiting:39,recent:39,
  tl:card({l:6,w:TP+6,pk:'them',pill:'Queried',hl:'Queried',dt:'sent 23 Jul · reply expected 3 Sept'})+ghost(TP+13.5,'nudge','yours')},
 {id:'whi',nm:'Eleanor Whitfield',ag:'Greenfield Literary',ms:'m2',status:'Partial sent',whose:'them',pressing:10,waiting:60,recent:18,
  tl:card({l:10,w:19,pk:'them',pill:'Partial sent',hl:'Partial sent',dt:'sent 13 Aug · reply expected 10 Sept'})+ghost(32.5,'nudge','yours')},
 {id:'mar',nm:'Jonathan Marsh',ag:'The Marsh Agency',ms:'m2',status:'Partial requested',whose:'you',pressing:14,waiting:19,recent:10,
  tl:card({l:4,w:9,pk:'them',pill:'Queried',hl:'Queried',dt:'sent 12 Aug'})+'<div class="mk" style="left:14.6%">'+ARR+'</div>'
    +card({l:16.5,w:52,pk:'you',pill:'Send the partial',hl:'Partial requested',dt:'respond by 14 Sept'})+ghost(71.5,'half','yours')},
 {id:'van',nm:'Harriet Vane-Coe',ag:'Stillwater Reps',ms:'m1',status:'Full sent',whose:'them',pressing:23,waiting:70,recent:13,
  tl:card({l:8,w:56,pk:'wait',pill:'Full sent',hl:'Full sent',dt:'sent 18 Aug · reminder 23 Sept'})+ghost(67.5,'nudge','yours')},
 {id:'t2',task:1,nm:'Nudge Marcus Reed',ag:'Your task',ms:'m2',status:'Task',whose:'you',pressing:25,waiting:0,recent:3,
  tl:task({l:TP+30,t1:'Nudge Marcus Reed',t2:'due 25 Sept'})},
 {id:'ram',nm:'Priya Raman',ag:'Raman &amp; Hale',ms:'m1',status:'No response',whose:'none',pressing:null,waiting:72,recent:72,
  tl:card({l:0,w:13,pk:'them',pill:'Queried',hl:'Queried',dt:'sent 20 Jun'})+'<div class="mk" style="left:14.5%">'+CLOCK+'</div>'
    +card({cls:'quietc',l:16.2,w:TP-16.2,pk:'quiet',pill:'No response',hl:'No response yet',dt:'72 days since sending',ongoing:1})},
 {id:'pen',quiet:1,nm:'Penhallow Literary',ag:'Agent not specified',ms:'m1',status:'No response',whose:'none',pressing:null,waiting:858,recent:858,
  tl:card({cls:'quietc',l:0,w:TP,pk:'quiet',pill:'No response',hl:'No response yet',dt:'858 days since sending',clipL:1,ongoing:1})+ghost(TP+7,'close','suggest')},
 {id:'ree',quiet:1,nm:'Marcus Reed',ag:'Bloomsbury Quill',ms:'m2',status:'No response',whose:'none',pressing:null,waiting:769,recent:769,
  tl:card({cls:'quietc',l:0,w:TP,pk:'quiet',pill:'No response',hl:'No response yet',dt:'769 days since sending',clipL:1,ongoing:1})+ghost(TP+7,'close','suggest')},
 {id:'oka',quiet:1,nm:'D. Okafor',ag:'Castle Lane Literary',ms:'m1',status:'Rejected',whose:'closed',pressing:null,waiting:40,recent:5,
  tl:card({cls:'closedc',l:TP-17,w:17,pk:'closed',pill:'Rejected',hl:'Rejected',dt:'form rejection · 26 Aug'})}
];
/* ————— state ————— */
var S={model:'A',whose:'all',statuses:[],ms:'all',hideClosed:false,sort:'soon',group:'none',range:'m',view:'all',q:''};
var OPEN=null;
/* ————— derive ————— */
function passes(r){
  if(S.whose==='you'&&r.whose!=='you')return false;
  if(S.whose==='them'&&r.whose!=='them')return false;
  if(S.statuses.length&&S.statuses.indexOf(r.status)<0)return false;
  if(S.ms!=='all'&&r.ms!==S.ms)return false;
  if(S.hideClosed&&(r.whose==='closed'||r.status==='No response'))return false;
  if(S.q&&(r.nm+' '+r.ag).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
  return true;
}
function sorter(a,b){
  if(S.sort==='soon'){
    var ka=a.pressing,kb=b.pressing;
    if(ka===null&&kb===null)return b.waiting-a.waiting;
    if(ka===null)return 1;if(kb===null)return -1;return ka-kb;
  }
  if(S.sort==='long')return b.waiting-a.waiting;
  return a.recent-b.recent;
}
function groupKey(r){
  if(S.group==='whose')return r.task?'Your tasks':(r.whose==='you'?'Needs you':r.whose==='them'?'With agents':r.whose==='none'?'No response':'Closed');
  if(S.group==='status')return r.task?'Your tasks':r.status;
  if(S.group==='ms')return r.task?'Your tasks':MS[r.ms];
  return null;
}
var GORDER={whose:['Your tasks','Needs you','With agents','No response','Closed'],status:['Your tasks'].concat(STATUS_ORDER),ms:['Your tasks',MS.m1,MS.m2]};
/* ————— render ————— */
function railHTML(){
  var h='<div class="rl-line"></div>';
  [[8,'23'],[18,'27'],[42,'4'],[54,'8'],[66,'12'],[78,'16'],[90,'20']].forEach(function(t){
    if(Math.abs(t[0]-TP)<5)return;h+='<div class="tick" style="left:'+t[0]+'%"></div><div class="dlab" style="left:'+t[0]+'%">'+t[1]+'</div>';});
  return h+'<div class="tdstem" style="left:'+TP+'%"></div><div class="tdchip" style="left:'+TP+'%">31 AUG</div>';
}
function rowHTML(r){
  var head=r.task?'<span style="width:18px;height:18px;border-radius:5px;border:1.5px solid #1c130f;display:block;flex:0 0 auto"></span><div><div class="nm">'+r.nm+'</div><span class="ag">'+r.ag+'</span></div>'
    :'<div><div class="nm">'+r.nm+'</div><span class="ag">'+r.ag+'</span></div>';
  return '<div class="rrow'+(r.whose==='you'?' asks':'')+(r.quiet?' quietrow':'')+'"><div class="c-nm">'+head+'</div>'
    +'<div class="c-tl"><div class="past" style="width:'+TP+'%"></div>'+r.tl+'<div class="td" style="left:'+TP+'%"></div></div></div>';
}
function renderBoard(){
  document.getElementById('railtl').innerHTML=railHTML();
  var rows=ROWS.filter(passes).sort(sorter);
  var h='';
  if(!rows.length)h='<div class="empty">Nothing matches — clear a filter.</div>';
  else if(S.group==='none')h=rows.map(rowHTML).join('');
  else{
    var g={};rows.forEach(function(r){var k=groupKey(r);(g[k]=g[k]||[]).push(r)});
    GORDER[S.group].forEach(function(k){if(!g[k])return;
      h+='<div class="gt"><span class="t">'+k+'</span><span class="n">'+g[k].length+'</span></div>'+g[k].map(rowHTML).join('');});
  }
  document.getElementById('board').innerHTML=h;
  var n=rows.filter(function(r){return !r.task}).length,t=rows.filter(function(r){return r.task}).length;
  var c=document.getElementById('cnt');if(c)c.textContent=n+' RELATIONSHIPS · '+t+' TASKS';
}
function activeFilters(){
  var a=[];
  if(S.whose!=='all')a.push({k:'whose',l:'Whose move: '+(S.whose==='you'?'mine':'theirs')});
  S.statuses.forEach(function(x){a.push({k:'st:'+x,l:'Status: '+x})});
  if(S.ms!=='all')a.push({k:'ms',l:'Manuscript: '+MS[S.ms]});
  if(S.hideClosed)a.push({k:'hide',l:'Hiding closed'});
  return a;
}
function opt(on,label,attr){return '<span class="opt'+(on?' on':'')+'" '+attr+'>'+label+'</span>';}
function rangeSeg(){return '<div class="seg">'+['w','m','s'].map(function(k){return '<button data-range="'+k+'" data-on="'+(S.range===k)+'">'+({w:'WEEKLY',m:'MONTHLY',s:'SIX-MONTHLY'})[k]+'</button>'}).join('')+'</div>'
  +'<button class="btn">‹</button><button class="btn">TODAY</button><button class="btn">›</button>';}
function filterPop(){
  return '<div class="pop'+(OPEN==='filter'?' open':'')+'" data-pop="filter">'
    +'<div class="h">Whose move</div><div class="row">'+['all','you','them'].map(function(k){return opt(S.whose===k,({all:'ALL',you:'MINE',them:'THEIRS'})[k],'data-whose="'+k+'"')}).join('')+'</div>'
    +'<div class="h">Status</div><div class="row">'+STATUS_ORDER.map(function(x){return opt(S.statuses.indexOf(x)>=0,x.toUpperCase(),'data-st="'+x+'"')}).join('')+'</div>'
    +'<div class="h">Manuscript</div><div class="row">'+opt(S.ms==='all','ALL','data-ms="all"')+opt(S.ms==='m1',MS.m1.toUpperCase(),'data-ms="m1"')+opt(S.ms==='m2',MS.m2.toUpperCase(),'data-ms="m2"')+'</div>'
    +'<div class="h">Show</div><div class="row">'+opt(!S.hideClosed,'CLOSED &amp; NO RESPONSE','data-hide="toggle"')+'</div></div>';
}
function sortPop(){
  return '<div class="pop'+(OPEN==='sort'?' open':'')+'" data-pop="sort"><div class="h">Order rows by</div><div class="row">'
    +opt(S.sort==='soon','SOONEST','data-sort="soon"')+opt(S.sort==='long','LONGEST WAITING','data-sort="long"')+opt(S.sort==='recent','RECENTLY ACTIVE','data-sort="recent"')+'</div></div>';
}
function groupPop(){
  return '<div class="pop'+(OPEN==='group'?' open':'')+'" data-pop="group"><div class="h">Group rows by</div><div class="row">'
    +opt(S.group==='none','ONE LIST','data-group="none"')+opt(S.group==='whose','WHOSE MOVE','data-group="whose"')+opt(S.group==='status','STATUS','data-group="status"')+opt(S.group==='ms','MANUSCRIPT','data-group="ms"')+'</div></div>';
}
function renderControls(){
  var c=document.getElementById('controls'),h='',af=activeFilters();
  if(S.model==='A'){
    h='<div class="ctrl">'+rangeSeg()
      +'<span style="position:relative"><button class="dd'+(af.length?' on':'')+'" data-open="filter">FILTER'+(af.length?' <span class="n">'+af.length+'</span>':'')+' ▾</button>'+filterPop()+'</span>'
      +'<span style="position:relative"><button class="dd" data-open="sort">SORT · '+({soon:'SOONEST',long:'LONGEST WAITING',recent:'RECENTLY ACTIVE'})[S.sort]+' ▾</button>'+sortPop()+'</span>'
      +'<span style="position:relative"><button class="dd'+(S.group!=='none'?' on':'')+'" data-open="group">GROUP'+(S.group!=='none'?' · '+({whose:'WHOSE MOVE',status:'STATUS',ms:'MANUSCRIPT'})[S.group]:'')+' ▾</button>'+groupPop()+'</span>'
      +'<input class="srch" placeholder="Search…" data-q value="'+S.q+'"><span class="count" id="cnt"></span></div>'
      +(af.length?'<div class="ctrl second"><div class="chips">'+af.map(function(f){return '<span class="chip" data-clear="'+f.k+'">'+f.l+'<i>✕</i></span>'}).join('')+'<span class="opt" data-clear="all">CLEAR ALL</span></div></div>':'');
  } else if(S.model==='B'){
    h='<div class="ctrl"><div class="tabs">'+[['all','ALL'],['me','NEEDS ME'],['agents','WITH AGENTS'],['closed','CLOSED']].map(function(v){return '<button class="tab'+(S.view===v[0]?' on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>'
      +'<span style="position:relative;margin-left:8px"><button class="dd'+(S.group!=='none'||S.sort!=='soon'?' on':'')+'" data-open="display">DISPLAY ▾</button>'
      +'<div class="pop'+(OPEN==='display'?' open':'')+'" data-pop="display" style="min-width:300px">'
      +'<div class="h">Group</div><div class="row">'+opt(S.group==='none','ONE LIST','data-group="none"')+opt(S.group==='whose','WHOSE MOVE','data-group="whose"')+opt(S.group==='status','STATUS','data-group="status"')+opt(S.group==='ms','MANUSCRIPT','data-group="ms"')+'</div>'
      +'<div class="h">Order</div><div class="row">'+opt(S.sort==='soon','SOONEST','data-sort="soon"')+opt(S.sort==='long','LONGEST WAITING','data-sort="long"')+opt(S.sort==='recent','RECENTLY ACTIVE','data-sort="recent"')+'</div>'
      +'<div class="h">Manuscript</div><div class="row">'+opt(S.ms==='all','ALL','data-ms="all"')+opt(S.ms==='m1',MS.m1.toUpperCase(),'data-ms="m1"')+opt(S.ms==='m2',MS.m2.toUpperCase(),'data-ms="m2"')+'</div>'
      +'<div class="h">Range</div><div class="row">'+opt(S.range==='w','WEEKLY','data-range="w"')+opt(S.range==='m','MONTHLY','data-range="m"')+opt(S.range==='s','SIX-MONTHLY','data-range="s"')+'</div>'
      +'</div></span>'
      +'<input class="srch" placeholder="Search…" data-q value="'+S.q+'"><span class="count" id="cnt"></span></div>'
      +'<div class="ctrl second"><button class="btn">‹</button><button class="btn">TODAY</button><button class="btn">›</button><span class="lbl">'+({w:'WEEKLY',m:'MONTHLY',s:'SIX-MONTHLY'})[S.range]+'</span></div>';
  } else {
    h='<div class="ctrl">'+rangeSeg()
      +'<span class="facet"><span class="k">Whose move</span><div class="seg">'+['all','you','them'].map(function(k){return '<button data-whose="'+k+'" data-on="'+(S.whose===k)+'">'+({all:'ALL',you:'MINE',them:'THEIRS'})[k]+'</button>'}).join('')+'</div></span>'
      +'<span class="facet"><span class="k">Manuscript</span><div class="seg">'+['all','m1','m2'].map(function(k){return '<button data-ms="'+k+'" data-on="'+(S.ms===k)+'">'+(k==='all'?'ALL':MS[k].toUpperCase())+'</button>'}).join('')+'</div></span>'
      +'<span class="count" id="cnt"></span></div>'
      +'<div class="ctrl second"><span class="facet"><span class="k">Status</span><div class="chips">'+STATUS_ORDER.map(function(x){return '<span class="opt'+(S.statuses.indexOf(x)>=0?' on':'')+'" data-st="'+x+'">'+x.toUpperCase()+'</span>'}).join('')+'</div></span>'
      +'<span style="position:relative;margin-left:auto"><button class="dd" data-open="sort">SORT · '+({soon:'SOONEST',long:'LONGEST WAITING',recent:'RECENTLY ACTIVE'})[S.sort]+' ▾</button>'+sortPop()+'</span>'
      +'<span style="position:relative"><button class="dd'+(S.group!=='none'?' on':'')+'" data-open="group">GROUP'+(S.group!=='none'?' · '+({whose:'WHOSE MOVE',status:'STATUS',ms:'MANUSCRIPT'})[S.group]:'')+' ▾</button>'+groupPop()+'</span>'
      +'<input class="srch" placeholder="Search…" data-q value="'+S.q+'"></div>';
  }
  c.innerHTML=h;
}
function applyView(v){
  S.view=v;
  if(v==='all'){S.whose='all';S.statuses=[];S.hideClosed=false}
  if(v==='me'){S.whose='you';S.statuses=[];S.hideClosed=false}
  if(v==='agents'){S.whose='them';S.statuses=[];S.hideClosed=false}
  if(v==='closed'){S.whose='all';S.statuses=CLOSED.slice();S.hideClosed=false}
}
function marquee(){
  document.querySelectorAll('.card .line').forEach(function(line){
    var track=line.firstElementChild;if(!track)return;
    if(track._anim){track._anim.cancel();track._anim=null}
    if(track._dup){track._dup.remove();track._dup=null}
    track.style.transform='';track.style.opacity='';
    var over=track.scrollWidth-line.clientWidth;
    line.classList.toggle('fits',over<=1);
    if(over<=1)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var card=line.closest('.card');
    var start=function(){
      if(track._anim)track._anim.cancel();
      if(MODE==='loop'){
        /* seamless ticker: the text is duplicated, so it never reverses */
        if(!track._dup){
          var dup=document.createElement('span');
          dup.className='dup';dup.setAttribute('aria-hidden','true');
          dup.innerHTML=track.innerHTML;
          track.appendChild(dup);track._dup=dup;
        }
        var half=track.scrollWidth/2;
        track._anim=track.animate(
          [{transform:'translateX(0)'},{transform:'translateX('+(-half)+'px)'}],
          {duration:Math.max(4000,half*26),iterations:Infinity,easing:'linear'});
        return;
      }
      /* scroll, pause, fade back to the start — the macOS / Spotify behaviour */
      var d=over+10;
      var delay=250, scroll=Math.max(700,d*17), hold=900, out=170, back=190;
      var total=delay+scroll+hold+out+back;
      var o1=delay/total, o2=(delay+scroll)/total, o3=(delay+scroll+hold)/total,
          o4=(delay+scroll+hold+out)/total;
      track._anim=track.animate([
        {transform:'translateX(0)',opacity:1,offset:0,easing:'linear'},
        {transform:'translateX(0)',opacity:1,offset:o1,easing:'linear'},
        {transform:'translateX('+(-d)+'px)',opacity:1,offset:o2,easing:'linear'},
        {transform:'translateX('+(-d)+'px)',opacity:1,offset:o3,easing:'linear'},
        {transform:'translateX('+(-d)+'px)',opacity:0,offset:o4,easing:'linear'},
        {transform:'translateX(0)',opacity:0,offset:o4+0.001,easing:'linear'},
        {transform:'translateX(0)',opacity:1,offset:1}
      ],{duration:total,iterations:Infinity});
    };
    var stop=function(){
      if(track._anim){track._anim.cancel();track._anim=null}
      if(track._dup){track._dup.remove();track._dup=null}
      track.style.transform='';track.style.opacity='';
    };
    card.addEventListener('mouseenter',start);
    card.addEventListener('mouseleave',stop);
  });
}
var MODE='reset';
function render(){renderControls();renderBoard();note();requestAnimationFrame(marquee);}
document.addEventListener('click',function(ev){
  var t=ev.target;
  var open=t.closest('[data-open]');
  if(open){OPEN=(OPEN===open.dataset.open)?null:open.dataset.open;render();ev.stopPropagation();return}
  if(t.closest('.pop')){
    var o=t.closest('[data-whose],[data-st],[data-ms],[data-hide],[data-sort],[data-group],[data-range]');
    if(!o)return;
    if(o.dataset.whose)S.whose=o.dataset.whose;
    if(o.dataset.st){var i=S.statuses.indexOf(o.dataset.st);i<0?S.statuses.push(o.dataset.st):S.statuses.splice(i,1)}
    if(o.dataset.ms)S.ms=o.dataset.ms;
    if(o.dataset.hide)S.hideClosed=!S.hideClosed;
    if(o.dataset.sort){S.sort=o.dataset.sort;OPEN=null}
    if(o.dataset.group){S.group=o.dataset.group;OPEN=null}
    if(o.dataset.range)S.range=o.dataset.range;
    render();ev.stopPropagation();return;
  }
  var f=t.closest('[data-whose],[data-ms],[data-st],[data-range],[data-view],[data-clear]');
  if(f){
    if(f.dataset.whose)S.whose=f.dataset.whose;
    if(f.dataset.ms)S.ms=f.dataset.ms;
    if(f.dataset.st){var j=S.statuses.indexOf(f.dataset.st);j<0?S.statuses.push(f.dataset.st):S.statuses.splice(j,1)}
    if(f.dataset.range)S.range=f.dataset.range;
    if(f.dataset.view)applyView(f.dataset.view);
    if(f.dataset.clear){var k=f.dataset.clear;
      if(k==='all'){S.whose='all';S.statuses=[];S.ms='all';S.hideClosed=false}
      else if(k==='whose')S.whose='all';else if(k==='ms')S.ms='all';else if(k==='hide')S.hideClosed=false;
      else if(k.indexOf('st:')===0)S.statuses=S.statuses.filter(function(x){return x!==k.slice(3)});}
    OPEN=null;render();return;
  }
  var q=t.closest('#mq button');
  if(q){MODE=q.dataset.a;document.querySelectorAll('#mq button').forEach(function(x){x.dataset.on='false'});q.dataset.on='true';render();return}
  var m=t.closest('#model button');
  if(m){S.model=m.dataset.m;OPEN=null;document.querySelectorAll('#model button').forEach(function(x){x.dataset.on='false'});m.dataset.on='true';render();return}
  OPEN=null;render();
});
document.addEventListener('input',function(ev){if(ev.target.matches('[data-q]')){S.q=ev.target.value;renderBoard()}});
function note(){
  document.getElementById('note').dataset.mq='1';
  document.getElementById('note').innerHTML={
   A:'<p><b>A · Filter · Sort · Group.</b> The Linear / Notion model: three verbs, three popovers, and <b>active filters become removable chips</b> in a second row so the state is never hidden inside a menu. Filter counts on the button. Best when people combine filters often; the chips row is the honest answer to "why can\u2019t I see Marsh".</p><p><b>Filter</b> covers whose move, status (multi), manuscript, and show/hide closed. <b>Sort</b> is the three orders from the ordering law. <b>Group</b> reintroduces the six groups as one of four groupings — whose move, status, manuscript, or none — rather than as a separate mode. Try <i>Filter → Mine</i>, then <i>Group → Status</i>.</p>',
   B:'<p><b>B · Views + Display.</b> Named views as tabs — <b>All · Needs me · With agents · Closed</b> — do the filtering people actually do, in one click, and a single <b>Display</b> popover holds grouping, ordering, manuscript and range. This is Linear\u2019s "Display" idea: the common cases are one tap, the rare ones are in one place. Calmest control row of the three; the cost is that an ad-hoc status filter needs the search box.</p><p><i>Needs me</i> is the old RIGHT NOW. Try it, then Display → Group by status.</p>',
   C:'<p><b>C · Facets on the surface.</b> Nothing hidden: whose move and manuscript as segmented controls, status as a chip strip, sort and group as small dropdowns. Zero clicks to see the state, one click to change it. Densest of the three — two control rows at rest — and it scales poorly if a third manuscript or fourth facet arrives. Best for a power user who filters constantly.</p>'
  }[S.model];
}
render();
</script>
