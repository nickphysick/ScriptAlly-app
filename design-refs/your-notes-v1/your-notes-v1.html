.fbx{
  --shell:#1b2433;--navy:#2d3a50;--page:#f5f1eb;--card:#fff;
  --ink:#1c130f;--ink2:#3b322c;--muted:#7d7067;--faint:#a39a91;
  --hair:#ebe4da;--fill:#f1ece4;--blush:#f6e9e3;--rose:#a0675a;
  --req:#e7ebf2;--offer:#f6edd9;
  --type:"Special Elite","Courier New",monospace;--serif:"Source Serif 4",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
.fbx *{box-sizing:border-box}
.fbx,.fbx{margin:0}
.fbx{background:var(--shell);font:16px/1.5 var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
.fbx button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.fbx a{color:inherit}
.fbx .T{font-family:var(--type);font-weight:400}
.fbx .gl{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fbx .sd{fill:none;stroke:currentColor;stroke-width:2}
.fbx .rail{position:fixed;inset:0 auto 0 0;width:68px;background:var(--shell);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.fbx .rail img{width:38px;margin-bottom:16px}
.fbx .rail i{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.05)}
.fbx .rail i.on{background:rgba(255,255,255,.15)}
.fbx .rail .me{margin-top:auto;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#f4eee5;display:grid;place-items:center;font:600 12px var(--serif)}
.fbx .tbar{position:fixed;top:0;left:68px;right:0;height:64px;background:var(--shell);display:flex;align-items:flex-end;padding:0 20px 0 12px;z-index:5}
.fbx .ftab{background:var(--page);border-radius:12px 12px 0 0;padding:12px 26px 14px;font:400 22px var(--type)}
.fbx .tbar .r{margin-left:auto;align-self:center;display:flex;gap:10px}
.fbx .srch{width:200px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);color:rgba(244,238,229,.55);display:flex;align-items:center;padding:0 12px;font-size:15px}
.fbx .help{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#f4eee5;font-weight:600}
.fbx .page{margin-left:68px;padding-top:64px}
.fbx .sheet{background:var(--page);border-radius:0 18px 0 0;min-height:calc(100vh - 64px);padding:28px 32px 48px}
.fbx .wrap{max-width:1360px;margin:0 auto}
.fbx .head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.fbx .head .k{font:15px var(--serif);color:var(--muted)}
.fbx .head .k b{font-weight:600;color:var(--rose)}
.fbx .head h1{margin:4px 0 0;font:400 38px/1.05 var(--type);letter-spacing:-.01em}
.fbx .head .acts{margin-left:auto;display:flex;gap:8px}
.fbx .btn{height:40px;padding:0 16px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font:600 15px var(--serif);background:#fff;box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.fbx .btn svg{width:16px;height:16px}
.fbx a.btn{text-decoration:none;color:inherit}
.fbx a.btn.pri{color:#fff}
.fbx .btn.pri{background:var(--navy);color:#fff;box-shadow:none}
.fbx .fnote{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;margin:22px 0 26px;padding:16px 22px 16px 16px;border-radius:16px;background:linear-gradient(100deg,#f7e8e1 0%,#f9efe9 60%,#fbf4ef 100%);box-shadow:inset 0 0 0 1px #f0dcd3}
.fbx .fn-badge{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(160,103,90,.15);position:relative}
.fbx .fn-badge img{width:36px;height:36px}
.fbx .fn-badge small{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;border-radius:999px;padding:1px 8px;font:600 10.5px var(--serif);white-space:nowrap}
.fbx .fn-tx h3{margin:0;font:400 20px/1.2 var(--type)}
.fbx .fn-tx p{margin:3px 0 0;font:14.5px/1.45 var(--serif);color:var(--ink2)}
.fbx .fn-road{display:flex;align-items:center;gap:6px;margin-top:9px;font:12.5px var(--serif);color:var(--muted)}
.fbx .fn-road span{display:inline-flex;align-items:center;gap:6px}
.fbx .fn-road i{width:8px;height:8px;border-radius:50%;background:#e6cfc6}
.fbx .fn-road .on{color:var(--rose);font-weight:600}
.fbx .fn-road .on i{background:var(--rose);box-shadow:0 0 0 3px #f1d9cf}
.fbx .fn-road em{width:18px;height:1px;background:#e2c9bf}
.fbx .fn-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fbx .fn-act small{font:13px var(--serif);color:var(--muted)}
.fbx .fn-btns{display:flex;gap:6px}
.fbx .fn-btns button{height:36px;padding:0 14px;border-radius:10px;background:#fff;display:inline-flex;align-items:center;gap:7px;font:600 14px var(--serif);color:var(--ink);box-shadow:0 1px 2px rgba(28,19,15,.06),inset 0 0 0 1px #efdcd4}
.fbx .fn-btns button:hover{box-shadow:0 2px 6px rgba(28,19,15,.1),inset 0 0 0 1px #e4c7bb}
.fbx .fn-btns svg{width:15px;height:15px;color:var(--rose)}
.fbx .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.fbx .main{display:grid;gap:20px;min-width:0}
.fbx .pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fbx .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(28,19,15,.04),0 4px 14px rgba(28,19,15,.05)}
.fbx .ch{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.fbx .ch h2{margin:0;font:400 20px var(--type)}
.fbx .ch .r{margin-left:auto;font:14px var(--serif);color:var(--muted)}
.fbx .ch .r a{font-weight:600;color:var(--ink);text-decoration:none}
.fbx .cb{padding:14px 22px 20px}
.fbx .nup{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--fill)}
.fbx .nup .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#6b625a}
.fbx .nup .t{flex:1;min-width:0}
.fbx .nup .t b{display:block;font:600 17px/1.3 var(--serif)}
.fbx .nup .t span{font:14.5px var(--serif);color:var(--muted)}
.fbx .nup .t span em{font-style:normal;color:var(--rose);font-weight:600}
.fbx .later{list-style:none;margin:10px 0 0;padding:0}
.fbx .later li{display:flex;align-items:center;gap:14px;padding:10px 18px;font:15px var(--serif);color:var(--ink2)}
.fbx .later li+li{border-top:1px solid var(--hair)}
.fbx .later li .sd{color:var(--faint)}
.fbx .later li time{margin-left:auto;font:14px var(--serif);color:var(--muted)}
.fbx .pipe{background:var(--navy);color:#fffaf3;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(27,36,51,.16)}
.fbx .pipe .ch h2{color:#fffaf3}
.fbx .seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-left:auto}
.fbx .seg button{height:30px;padding:0 14px;border-radius:999px;font:600 13.5px var(--serif);color:rgba(255,250,243,.75)}
.fbx .seg button[aria-pressed="true"]{background:#fffaf3;color:var(--ink)}
.fbx .nums{display:flex;gap:40px;padding:14px 22px 0}
.fbx .nums b{display:block;font:400 30px/1 var(--type)}
.fbx .nums span{font:14px var(--serif);color:rgba(244,238,229,.7)}
.fbx .plot{position:relative;height:230px;margin-top:6px}
.fbx .plot canvas{position:absolute;inset:0;width:100%;height:100%}
.fbx .plot .hk{position:absolute;right:18px;bottom:0;height:200px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.fbx .axis{position:absolute;left:22px;right:210px;bottom:10px;z-index:2;color:rgba(255,250,243,.75)!important;display:flex;justify-content:space-between;font:12.5px var(--serif);color:rgba(244,238,229,.5)}
.fbx .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;color:#fffaf3}
.fbx .pin .g{width:22px;height:22px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.fbx .pin i{width:1.5px;height:16px;background:rgba(255,250,243,.55)}
.fbx .closedv{display:flex;align-items:center;justify-content:center;gap:36px;height:100%;padding-bottom:20px}
.fbx .ringrow{display:flex;align-items:center;gap:22px}
.fbx .ring{position:relative;width:110px;height:110px;flex:none}
.fbx .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fbx .ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 30px/1 var(--type)}
.fbx .ring div small{font:12.5px var(--serif);color:var(--muted);margin-top:4px}
.fbx .ring img{position:absolute;inset:14px;width:82px;height:82px;object-fit:contain}
.fbx .key{display:grid;gap:7px;font:15px var(--serif)}
.fbx .key div{display:flex;align-items:center;gap:10px}
.fbx .key i{width:10px;height:10px;border-radius:3px;flex:none}
.fbx .key b{font:400 19px var(--type);min-width:22px}
.fbx .key a{font-weight:600;font-size:14.5px;margin-top:4px;text-decoration:none}
.fbx .feed{position:sticky;top:88px;height:calc(100vh - 112px);display:flex;flex-direction:column;min-width:0}
.fbx .fsw{display:flex;background:var(--fill);border-radius:999px;padding:3px;margin-bottom:10px;flex:none}
.fbx .fsw button{flex:1;height:32px;border-radius:999px;font:600 14px var(--serif);color:var(--ink2)}
.fbx .fsw button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,19,15,.12)}
.fbx .fscroll{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px 8px;mask-image:linear-gradient(#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.fbx .day{display:flex;align-items:baseline;gap:8px;margin:12px 2px 8px;font:600 14px var(--serif)}
.fbx .day:first-child{margin-top:2px}
.fbx .day span{color:var(--muted);font-weight:400}
.fbx .day::after{content:"";flex:1;height:1px;background:#ddd5ca;transform:translateY(-4px)}

/* ── Mock only: Your notes, in the Dashboard's own parts (dashboard-v2-2) ── */
.fbx { background: var(--page) !important; min-height: 100%; }
.fbx-wrap { max-width: 1660px; margin: 0 auto; padding: 28px 32px 64px; }
.fbx .fwb { margin-top: 18px; }
.fbx .fwb-body.nolast { row-gap: 0; }
.fbx .head.nv .by b { font-style: normal; font-weight: 600; color: #fffaf3; }
.fbx .head.nv .btn { height: 44px; padding: 0 18px; font-size: 16px; border-radius: 999px; }
.fbx .head.nv .btn svg { width: 17px; height: 17px; }

.fbx .fgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; margin-top: 24px; }
.fbx .fgrid > aside { display: grid; gap: 20px; position: sticky; top: 20px; }

/* filters: the feed's own switch */
.fbx .nf { padding: 14px 18px 4px; }
.fbx .nf .fsw { margin: 0; max-width: 560px; }
.fbx .nf .fsw button small { font: 400 12.5px var(--serif); color: var(--muted); margin-left: 5px; }

/* a note */
.fbx .nl { list-style: none; margin: 0; padding: 6px 10px 10px; }
.fbx .nr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: start; width: 100%; padding: 16px 12px; border-radius: 12px; text-align: left; cursor: pointer; }
.fbx .nl li + li .nr { border-top: 1px solid var(--hair); border-radius: 0 0 12px 12px; }
.fbx .nr:hover { background: #faf6f1; }
.fbx .nr:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.fbx .nk { width: 38px; height: 38px; border-radius: 50%; background: #f6e2d9; color: var(--rose); display: grid; place-items: center; }
.fbx .nk svg { width: 16px; height: 16px; }
.fbx .nt b { display: block; font: 600 17px/1.35 var(--serif); color: var(--ink); }
.fbx .nt .nm { display: block; margin-top: 3px; font: 14px var(--serif); color: var(--muted); }
.fbx .nt .nm em { font-style: normal; color: var(--ink2); font-weight: 600; }
.fbx .nrep { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 9px 12px; border-radius: 11px; background: #fbf0ea; box-shadow: inset 0 0 0 1px #f0dbd1; font: 14.5px/1.45 var(--serif); color: var(--ink2); }
.fbx .nrep img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 2px #fff; }
.fbx .nrep span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fbx .nrep b { color: #7a3f31; font-weight: 700; }
.fbx .nnew { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--rose); color: #fff; font: 600 11.5px var(--serif); vertical-align: 2px; }
.fbx .ns { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 2px; }
.fbx .ns small { font: 13px var(--serif); color: var(--muted); white-space: nowrap; }
.fbx .ns small b { color: #7a3f31; font-weight: 700; }

/* outcome chips: the band's "Your last note" chip, one per status */
.fbx .oc { font: 600 12.5px var(--serif); padding: 3px 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.fbx .oc svg { width: 12px; height: 12px; }
.fbx .oc.ok { background: #e1ebe1; color: #355a3a; }
.fbx .oc.rd { background: #efe7df; color: #6b5a4e; }
.fbx .oc.pl { background: #f6e2d9; color: #7a3f31; }
.fbx .oc.wt { background: #fff; color: var(--muted); box-shadow: inset 0 0 0 1px #e2d6cc; }

/* the side cards */
.fbx .key2 { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.fbx .key2 li { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: start; font: 14.5px/1.4 var(--serif); color: var(--ink2); }
.fbx .key2 li .oc { justify-self: start; }
.fbx .howp { margin: 0; font: 15px/1.5 var(--serif); color: var(--ink2); }
.fbx .howp + .howp { margin-top: 10px; }
.fbx .howp b { color: var(--ink); }
.fbx .howfine { margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed #e3d5c9; font: 13.5px/1.45 var(--serif); color: var(--muted); }

/* empty */
.fbx .nempty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 20px 44px; text-align: center; }
.fbx .nempty h3 { margin: 0; font: 400 24px var(--type); }
.fbx .nempty p { margin: 0; max-width: 460px; font: 15.5px/1.5 var(--serif); color: var(--ink2); }

/* the note's panel and the pop-up share the band's frame */
.fbd2-wrap { position: fixed; inset: 0; z-index: 70; }

.fbx.fbd2 { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 560px; max-width: calc(100vw - 20px); background: transparent !important; min-height: 0; transform: translateX(30px); opacity: 0; transition: transform .26s cubic-bezier(.2,.9,.3,1), opacity .2s ease; }

.fbx .dtl { list-style: none; margin: 22px 0 0; padding: 0; }
.fbx .dtl li { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding-bottom: 14px; font: 15px var(--serif); }
.fbx .dtl li::before { content: ""; position: absolute; left: 9px; top: 16px; bottom: -2px; border-left: 2px solid #ead7ce; }

.fbx .dmsg.me { flex-direction: row-reverse; }

.fbx .df { padding: 12px 16px 14px; border-top: 1px solid var(--hair); }
.fbx textarea.ta { width: 100%; min-height: 84px; resize: vertical; padding: 11px 13px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px #e3d5c9; background: #fff; font: 15.5px/1.5 var(--serif); color: var(--ink); }

.fbx .dfr { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.fbx .dfr > span { margin-right: auto; font: 13.5px var(--serif); color: var(--muted); }

  function chip(f) { const [c, t] = OUT[f.st]; return `<i class="oc ${c}">${c === "ok" ? D.tick : ""}${t}</i>`; }

  function listCard() {

  function ring() {
    const c = Object.fromEntries(RB.map(b => [b.key, empty ? 0 : FB.filter(f => f.st === b.key || (b.also && f.st === b.also)).length]));

  /* ── one note's panel ── */

    close(true);
    const f = FB.find(x => x.id === id); if (!f) return;

      + (f.mine ? `<div class="dmsg me"><span class="disc me">BC</span><div class="bub">${esc(f.mine.text)}<span class="when">${esc(f.mine.at)}</span></div></div>` : "");

  /* ── the pop-up: the band's frame, the band's three ways in ── */

  const pageName = () => (document.querySelector(".ws-pagebar .ws-ftn")?.textContent || "Your notes").trim();
  function fpHtml() {

        <div class="p3sent"><span class="nk">${KIND[sent.kind].ic}</span><div><b>“${esc(sent.msg.length > 110 ? sent.msg.slice(0, 108).trim() + "…" : sent.msg)}”</b><span>${esc(sent.sub || KIND[sent.kind].label)} · from ${esc(sent.page)}</span></div><i class="oc wt">Not read yet</i></div>
      </div>
      <div class="p3f">${rankFoot}<a class="p3notes" data-pagain>Send another</a><button class="btn pri" data-psee>See your notes</button></div></section>`;

  /* ── the page in the sheet ── */
  let host;
  function repaint() {

    const rv = document.createElement("div"); rv.className = "rv";
    rv.innerHTML = `<button class="rv-x" aria-label="Hide">×</button><h4>Your notes</h4>
      <p>Built from the Dashboard’s own parts: the navy head, the founding writer band, the banded cards, the feed’s switch and the “Your last note” chips.</p>
      <p>Statuses are the ones you already set in the console: read, planned, built (Now in the app) and fixed. Counting is the server’s: 1 · 3 · 8 · 15 · 25, and a built note counts four.</p>
      <p class="rv-k">The pop-up</p>
      <p class="rv-s">Like, Don’t like and Idea, as on the band. Opens from the rail’s Feedback, the band’s buttons and Tell us something.</p>
      <div class="rv-who"><button data-fbpop>Open the pop-up</button></div>
      <p class="rv-k">Show</p>
      <div class="rv-who"><button data-fbv="full" class="on">Notes sent</button><button data-fbv="empty">Nothing sent yet</button></div>`;
    document.body.appendChild(rv);
    const reopen = document.createElement("button"); reopen.className = "rv-open"; reopen.textContent = "Notes"; document.body.appendChild(reopen);
    rv.querySelector(".rv-x").onclick = () => { rv.style.display = "none"; reopen.style.display = "block"; };
    reopen.onclick = () => { rv.style.display = ""; reopen.style.display = "none"; };
    rv.addEventListener("click", e => {
      if (e.target.closest("[data-fbpop]")) { e.stopPropagation(); setTimeout(() => fpOpen(), 0); return; }
      const b = e.target.closest("[data-fbv]"); if (!b) return;
      rv.querySelectorAll("[data-fbv]").forEach(x => x.classList.toggle("on", x === b));
      if (window.__qv.page !== "fb") window.__railGo("fb");
      window.__fb.setEmpty(b.dataset.fbv === "empty");
    });
  };

  /* open on the page once the app and the rail are up */
  const boot = setInterval(() => {
    if (!document.querySelector(".qr") || !document.querySelector(".ws-window") || !window.__railGo) return;
    clearInterval(boot); setTimeout(() => window.__railGo("fb"), 150);
  }, 100);
})();
</script>
<script>const h=document.querySelector('.qv-page');h.innerHTML=window.__fb.page();window.__fb.after(h);</script></body></html>
