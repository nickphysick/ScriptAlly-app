<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<title>ScriptAlly — collapse transition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{
  --page:#e4dcd7;--band:#f8f5f0;--sidebar:#fdfcfa;
  --ink:#191210;--ink2:#311e19;--sub:#4d413a;--mute:#8a7a70;
  --burg:#7c3a2a;--pink:#f5e2da;--pinkb:#e8c8bc;
  --rim:#e9e1d4;--edge:#e0d8cd;--hair:#e8e2d8;
  --sage-a:#d7ddd5;--sage-b:#d5dbd3;
  --win-r:18px;--gut:36px;--bar-h:46px;
  --ease:cubic-bezier(.4,0,.2,1);
 }
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--page);font-family:'Inter',sans-serif;color:var(--ink);padding:14px 16px 26px}
 .tabs{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
 .tab{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:7px 12px;border:1px solid #cabfb5;border-radius:7px;background:#efe8e2;cursor:pointer;color:var(--ink)}
 .tab.on{background:var(--ink);color:#f6f0ea;border-color:var(--ink)}
 .note{font-size:12.5px;color:#4d413a;margin:0 2px 11px;max-width:1150px;line-height:1.6;min-height:52px}
 .note b{color:var(--ink)}
 .hint{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#9d8d83;margin:0 2px 8px}

 .shell{display:flex;background:var(--page);height:600px;overflow:hidden}
 .side{flex:0 0 200px;background:var(--sidebar);border-right:1px solid var(--hair);padding:16px 12px}
 .brand{display:flex;align-items:center;gap:9px;font-family:'Playfair Display',serif;font-size:19px;font-weight:700;padding:2px 4px 14px}
 .brand svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
 .navh{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.16em;color:#a2968c;margin:12px 6px 4px}
 .nv{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 9px;border-radius:9px;color:#4d3b33}
 .nv svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
 .nv.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(58,28,20,.06)}
 .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
 .topbar{display:flex;align-items:center;gap:13px;padding:0 20px;height:52px}
 .crumb{font-family:'Playfair Display',serif;font-size:16px;color:var(--mute)}
 .crumb b{color:var(--ink);font-weight:700}
 .sp{flex:1}
 .np{background:#1c130f;color:#fdfaf5;border-radius:999px;font-size:12.5px;padding:9px 17px;font-weight:600}
 .win{background:var(--band);border-radius:var(--win-r) var(--win-r) 0 0;margin:0 18px;flex:1;min-height:0;overflow-y:auto;position:relative}
 .toprule{height:1px;background:#e6ded3;margin:7px var(--gut) 0}

 .mast{position:relative;overflow:hidden;border-bottom:1px solid var(--edge);background:var(--band)}

 .mastin{position:relative;z-index:2;padding:26px var(--gut) 28px}
 .kick{display:inline-block;border:1px solid rgba(25,18,16,.28);border-radius:999px;padding:5px 15px 4px;
   font-family:'Playfair Display',serif;font-size:13px;font-weight:600;letter-spacing:.15em;color:rgba(25,18,16,.72);text-transform:uppercase;margin-bottom:14px}
 .mastin h1{font-family:'Playfair Display',serif;font-size:56px;font-weight:700;line-height:1.14;letter-spacing:-.012em}
 .mastin p{font-family:'Playfair Display',serif;font-size:19px;color:var(--sub);margin-top:11px;line-height:1.45;max-width:62ch}
 .cta{display:inline-flex;align-items:center;gap:9px;margin-top:20px;background:var(--pink);border:1px solid var(--pinkb);
   border-radius:999px;padding:11px 22px;font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--ink2)}

 /* ══ the collapsed bar — a separate object, not a morph ══ */
 .bar{position:sticky;top:0;z-index:20;height:var(--bar-h);background:var(--band);
   display:flex;align-items:center;gap:11px;padding:0 var(--gut);margin-bottom:calc(var(--bar-h) * -1);
   box-shadow:0 10px 16px -12px rgba(25,18,16,0);pointer-events:none}
 .bar .mk{flex:0 0 20px;width:20px;height:20px;display:grid;place-items:center}
 .bar .mk svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .bar b{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
 body.stuck .bar{box-shadow:0 10px 16px -12px rgba(25,18,16,.32)}

 /* A · handoff — bar cross-fades in, header untouched */
 body[data-v="a"] .bar{opacity:0;transition:opacity .18s var(--ease),box-shadow .2s}
 body[data-v="a"].stuck .bar{opacity:1}

 /* B · handoff with slide */
 body[data-v="b"] .bar{opacity:0;transform:translateY(-8px);transition:opacity .2s var(--ease),transform .24s var(--ease),box-shadow .2s}
 body[data-v="b"].stuck .bar{opacity:1;transform:none}

 /* C · snap */
 body[data-v="c"] .bar{opacity:0;transition:none}
 body[data-v="c"].stuck .bar{opacity:1}

 /* D · morph — the header itself shrinks (the jittery one) */
 body[data-v="d"] .bar{display:none}
 body[data-v="d"] .mast{position:sticky;top:0;z-index:20;
   transition:padding .26s var(--ease)}
 body[data-v="d"] .mastin{transition:padding .26s var(--ease)}
 body[data-v="d"] .mastin h1{transition:font-size .26s var(--ease)}
 body[data-v="d"].stuck .mastin{padding:12px var(--gut) 11px}
 body[data-v="d"].stuck .mastin h1{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
 body[data-v="d"].stuck .kick,body[data-v="d"].stuck .mastin p,body[data-v="d"].stuck .cta{display:none}
 body[data-v="d"].stuck .mast::after{display:none}
 body[data-v="d"].stuck .mast{border-bottom-color:transparent;box-shadow:0 10px 16px -12px rgba(25,18,16,.32)}

 .body{padding:24px var(--gut) 70px}
 .sect{display:flex;align-items:baseline;gap:13px;margin:0 0 15px}
 .sect h2{font-family:'Playfair Display',serif;font-size:25px;font-weight:700}
 .sect span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#a2968c}
 .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
 .card{border:1px solid var(--rim);border-radius:14px;background:#fff;overflow:hidden}
 .ch{background:linear-gradient(180deg,var(--sage-a),var(--sage-b));padding:11px 15px;font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#2f3a2e}
 .cb{padding:14px 15px;font-size:12.5px;color:#5d4d44;line-height:1.75}
 .cb span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.11em;color:#a2968c;margin-right:7px}

<div class="tabs">

<div class="shell">

  <div class="win" id="win">
    <div class="bar"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg></span><b>Submission packages</b></div>

      <span class="kick">Materials</span>
      <h1>Submission Packages</h1>
      <p>Sort your submission materials into packages and track what performs best</p>
      <span class="cta">+ New package</span>
    </div></div>
    <div class="body" id="bd"></div>
  </div>
 </div>
</div>

<script>
try{
const rows=[["Standard UK","Covering letter","Hook-first"],["First 50","Synopsis","Two-page"],["Full request","Synopsis","One-page"],
["Voice-led","Covering letter","Not in a package"],["Comps-forward","Covering letter","Not in a package"],["Hook-first","Covering letter","In 1 package"]];
const blk=()=>'<div class="g3">'+rows.map(([a,b,c])=>`<div class="card"><div class="ch">${a}</div><div class="cb"><div><span>TYPE</span>${b}</div><div><span>USED</span>${c}</div></div></div>`).join('')+'</div>';
document.getElementById('bd').innerHTML='<div class="sect"><h2>Your packages</h2><span>1 BUILT</span></div>'+blk()+
 '<div class="sect"><h2>Your materials</h2><span>6 HELD</span></div>'+blk();
const N={
a:"<b>A &middot; Handoff, cross-fade.</b> The masthead is not animated at all &mdash; it simply scrolls away, as any content does. The bar is a separate sticky object that fades in once the title has passed. No height animation, so nothing can feed back into scroll position. <b>This is why it can't jitter.</b>",
b:"<b>B &middot; Handoff, slide down.</b> The same handoff, but the bar drops 8px into place as it fades. A little more deliberate; the movement draws the eye to the top of the page just as you start reading downward, which may be the wrong moment.",
c:"<b>C &middot; Snap.</b> The same handoff with no transition at all. Instant, honest, and impossible to get wrong. Worth trying &mdash; at 46px the bar is small enough that an animation may be ceremony the page doesn't need.",
d:"<b>D &middot; Morph.</b> What is on dev: the masthead itself shrinks. Two things make it jittery. <b>Font-family cannot be interpolated</b>, so Playfair 56 snaps to mono 14 mid-animation while the height is still moving. And the header's height changes in flow, which shifts content, which can change scroll position and re-fire the threshold."};
const note=document.getElementById('note'),win=document.getElementById('win');
let stuck=false;
win.addEventListener('scroll',()=>{
 const y=win.scrollTop;
 if(!stuck&&y>150){stuck=true;document.body.classList.add('stuck');}
 else if(stuck&&y<120){stuck=false;document.body.classList.remove('stuck');}
});
document.querySelectorAll('.tab[data-v]').forEach(b=>b.onclick=()=>{
 document.body.dataset.v=b.dataset.v;
 document.querySelectorAll('.tab[data-v]').forEach(x=>x.classList.toggle('on',x===b));
 note.innerHTML=N[b.dataset.v];});
note.innerHTML=N.a;
}catch(e){console.error(e)}
</script></body></html>
