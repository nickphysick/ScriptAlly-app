<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity feed drawer v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c130f;--ink70:rgba(28,19,15,.7);--ink45:rgba(28,19,15,.45);--hair:rgba(28,19,15,.1);
 --btn:#2a3a52;--cream:#f5f1eb;--frame:#7c3a2a;--rust:#8a4a3c;
 --page:#f3f2f0;--side:#e6e4e0;
 --slate:#5f7b93;--slate-pale:#cfd9e2;--slate-tray:#d6dfe6;--slate-ink:#3f566b;
 --band:var(--btn);
 --q:#f7efe3;--q-d:#e7d9bd;--ag:#e0e5dd;--ag-d:#c7d0c2;--you:#f5e6df;--you-d:#e8c9bb;--of:#d7e0e8;--of-d:#c9d6e1;--cl:#e4e1db;--cl-d:#cfc9c1;
 --machine:'Special Elite',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace;
 --cw:1360px;--gut:clamp(28px,3.2vw,52px)}
body[data-band="slate"]{--band:#3f566b}
*{box-sizing:border-box}
html,body{margin:0;background:#2b3547;color:var(--ink);font-family:var(--serif)}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}
/* shell, greige (Query Centre v126 phase 1) */
.side{background:var(--side);border-right:1px solid var(--hair);padding:16px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;padding:4px 6px 14px}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--slate)}
.side h6{margin:12px 8px 4px;font:400 9px var(--mono);letter-spacing:.16em;color:var(--ink45)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:15px;cursor:pointer}
.side a::before{content:"";width:14px;height:14px;border:1.4px solid var(--ink70);border-radius:3px}
.side a.on{background:var(--btn);color:#fff}.side a.on::before{border-color:#fff}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--page);position:relative}
.bar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--page);border-bottom:1px solid var(--hair);position:relative;z-index:5}
.tog{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink70)}
.bar .sp{flex:1}
.tbc{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.tbc em{font-style:normal;font:400 9.5px var(--mono);letter-spacing:.16em;color:var(--ink45);text-transform:uppercase}
.tbc b{font-family:var(--machine);font-weight:400;font-size:21px;line-height:1}
.vr{width:1px;height:26px;background:rgba(28,19,15,.14)}
.ms{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 6px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(28,19,15,.06),inset 0 0 0 1px var(--hair);white-space:nowrap}
.ms .cov{width:30px;height:30px;border-radius:7px;background:#b4553f}
.ms b{font-family:var(--machine);font-weight:400;font-size:15px;display:block;line-height:1.1}
.ms small{display:block;font:400 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink45);margin-top:3px}
.tb{height:40px;min-width:40px;border:0;border-radius:10px;background:none;color:var(--ink70);font-size:15px}
.scroll{flex:1;min-height:0;overflow:auto;position:relative}
.wrap{max-width:var(--cw);margin:0 auto;padding:0 var(--gut)}

/* ---------- 1. the header band ---------- */
.band{position:relative;background:var(--band);color:var(--cream);transition:background .3s}
.band-in{max-width:var(--cw);margin:0 auto;padding:0 var(--gut);min-height:337px;display:flex;align-items:center;justify-content:center}
.bgrp{display:grid;grid-template-columns:auto 290px;column-gap:64px;align-items:center}
.btxt{max-width:640px}
.btxt h1{margin:0;font-family:var(--machine);font-weight:400;font-size:clamp(44px,4.4vw,66.5px);line-height:1.02;white-space:nowrap}
.btxt p{margin:16px 0 0;font-size:18px;line-height:26px;color:rgba(245,241,235,.78);max-width:44ch}
.btxt p b{color:var(--cream);font-weight:600}.btxt p code{font-family:var(--machine);color:var(--cream);font-size:17px}
.bacts{display:flex;gap:12px;margin-top:26px}
.bb1{height:48px;padding:0 24px;border-radius:24px;border:0;background:var(--cream);color:var(--btn);font-family:var(--machine);font-size:16px}
.bb2{height:48px;padding:0 24px;border-radius:24px;border:0;background:transparent;color:var(--cream);font-family:var(--machine);font-size:16px;box-shadow:inset 0 0 0 1.5px rgba(245,241,235,.6)}
.disc{width:290px;height:290px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 18px 40px -22px rgba(0,0,0,.6)}
.disc img{width:92%;height:92%;object-fit:contain;transform:translateY(4px)}

/* ---------- 2. the carousel ---------- */
.sec{margin-top:40px}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.chead h2{margin:0;font-family:var(--machine);font-weight:400;font-size:22px;white-space:nowrap}
@media (max-width:1440px){.chead .k{display:none}}
.chead .k{font:400 9.5px var(--mono);letter-spacing:.14em;color:var(--ink45);text-transform:uppercase}
.chead .sp{flex:1}
.seg{display:flex;padding:3px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{border:0;background:none;height:32px;padding:0 14px;border-radius:16px;font-size:14px;color:var(--ink70);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--cream)}
.seg em{font-style:normal;font:400 9px var(--mono);margin-left:6px;opacity:.7}
.arw{width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);font-size:16px}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 90px 22px 2px;margin:0 -2px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(28,19,15,.18)}.dots i.on{background:var(--btn);width:18px;border-radius:3px}
/* the agent quick-view card, landing-page dress */
.ac{flex:none;width:318px;scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(28,19,15,.06),0 14px 30px -18px rgba(28,19,15,.35);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s}
.ac:hover{transform:translateY(-3px)}
.ac .bd{height:40px;background:var(--slate);display:flex;align-items:center;gap:8px;padding:0 12px}
.ac .bd .chip{font:500 8px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:10px}
.ac .bd .st{margin-left:auto;color:#fff;font-size:12px;letter-spacing:1px;opacity:.9}
.ac .hd{display:flex;gap:12px;padding:14px 16px 6px;align-items:center}
.ini{width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--cream);font:500 11px var(--mono);display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.04em}
.ac .nm b{display:block;font-weight:600;font-size:17px;line-height:1.2}
.ac .nm small{display:block;font:400 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink45);margin-top:3px}
.ac .lb{font:400 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink45);margin:10px 16px 6px}
.gch{display:flex;flex-wrap:wrap;gap:5px}
.gch span{font:500 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;height:21px;display:inline-flex;align-items:center;padding:0 8px;border-radius:5px;background:#f7f3ee;box-shadow:inset 0 0 0 1px var(--hair)}
.gch span.hit{background:#fff;box-shadow:inset 0 0 0 1px var(--ink70)}.gch span.hit::before{content:"✓";margin-right:5px}
.ac .gch{margin:0 16px}
.ac .wl{margin:0 16px;font-style:italic;font-size:14px;line-height:1.4;color:var(--ink70);min-height:40px}
.ac .mats{display:flex;gap:5px;margin:0 16px;flex-wrap:wrap}
.ac .mats span{font:400 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair)}
.ac .ft{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--hair);margin-top:14px}
.ac .ft small{font:400 8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink45);line-height:1.5}
.ac .ft .go{margin-left:auto;height:32px;padding:0 14px;border-radius:16px;border:0;background:var(--btn);color:var(--cream);font-family:var(--machine);font-size:13px;white-space:nowrap}
.ac.more{width:200px;align-items:center;justify-content:center;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(28,19,15,.2);font-family:var(--machine);font-size:15px;color:var(--ink70);text-align:center;padding:20px}

/* ---------- 3. the list: open banner, perched archivist, slate workspace ---------- */
.lban{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:end;padding-top:10px;position:relative;z-index:2}
.perch{width:170px;display:block;margin-bottom:-14px;position:relative;z-index:3}
.ltxt{padding-bottom:24px}
.ltxt .k{font:400 9.5px var(--mono);letter-spacing:.14em;color:var(--ink45);text-transform:uppercase}
.ltxt h2{margin:6px 0 0;font-family:var(--machine);font-weight:400;font-size:42px;line-height:1.05;white-space:nowrap}
.lrow{display:flex;align-items:flex-end;gap:18px;margin-top:10px;flex-wrap:wrap}
.lrow p{margin:0;font-size:16.5px;line-height:24.75px;color:var(--ink70);max-width:56ch;flex:1 1 360px}
.lrow p b{color:var(--ink);font-weight:600}
.ctl{display:flex;gap:8px;align-items:center;margin-left:auto}
.find{width:260px;height:40px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);display:flex;align-items:center;padding:0 16px;gap:8px;color:var(--ink45);font-size:14.5px}
.pill{height:40px;padding:0 16px;border-radius:20px;border:0;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px var(--hair);font-family:var(--machine);font-size:14px;white-space:nowrap}
.pill i{font-style:italic;font-family:var(--serif);font-size:13px;color:var(--ink70);margin-left:5px}
.ws{background:var(--slate-tray);border-radius:22px;padding:22px 22px 26px;position:relative;z-index:1;margin-bottom:60px}
.idx{display:grid;grid-template-columns:76px repeat(26,minmax(0,1fr));background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(28,19,15,.05);margin-bottom:22px}
.idx button{border:0;background:none;height:54px;border-left:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--machine);font-size:17px;padding:0}
.idx button:first-child{border-left:0;font-size:12.5px;background:#f7f3ee}
.idx button small{font:400 7px var(--mono);color:var(--ink45);margin-top:2px}
.idx button.off{color:rgba(28,19,15,.3);cursor:default}
.idx button.on{background:var(--btn);color:var(--cream)}.idx button.on small{color:rgba(245,241,235,.7)}
.gband{position:relative;display:flex;align-items:flex-end;margin:24px 0 10px;scroll-margin-top:80px}
.gband:first-of-type{margin-top:0}
.gband b{font-family:var(--machine);font-weight:400;font-size:17px;background:var(--btn);color:var(--cream);border-radius:9px 9px 0 0;padding:6px 16px 5px;line-height:1.1}
.gband i{flex:1;height:2px;background:var(--btn);border-radius:1px}
.gband span{position:absolute;right:4px;bottom:8px;font:400 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--slate-ink)}
.row{position:relative;display:grid;grid-template-columns:34px minmax(170px,.8fr) minmax(0,1.6fr) 210px;gap:18px;align-items:center;background:#fff;border-radius:12px;padding:12px 18px 12px 20px;margin-bottom:10px;min-height:80px;box-shadow:0 1px 2px rgba(28,19,15,.05),0 10px 24px -18px rgba(28,19,15,.22);cursor:pointer;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--edge,transparent)}
.row:hover{background:#fdfbf8}
.row .who b{display:block;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{display:block;font-style:italic;font-size:13.5px;color:var(--ink45);margin-top:2px}
.row .dos p{margin:0 0 6px;font-style:italic;font-size:13.5px;line-height:1.4;color:var(--ink70);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.torn{display:inline-flex;align-items:center;gap:8px;font:400 8px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink45);background:repeating-linear-gradient(90deg,#efebe5 0 6px,#f4f1ec 6px 12px);padding:4px 6px 4px 10px;border-radius:4px;margin:0 6px 4px 0}
.mini{height:18px;padding:0 7px;border-radius:9px;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--ink45);font:500 7.5px var(--mono);letter-spacing:.1em}
.row .q{text-align:right}
.row .q .s{display:inline-flex;align-items:center;gap:7px;font-family:var(--machine);font-size:14px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--ink);display:inline-block;position:relative;flex:none}
.dot.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}.dot.full{background:var(--ink);box-shadow:inset 0 0 0 2px #fff}.dot.gnone,.dot.none{border-color:var(--ink45)}.dot.gbar::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1.6px;background:var(--ink)}
.row .q small{display:block;font:400 8px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink45);margin-top:5px}
.ym{font:500 7.5px var(--mono);letter-spacing:.12em;background:var(--btn);color:var(--cream);padding:3px 6px;border-radius:4px;margin-left:6px}
.tray{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .15s;background:linear-gradient(90deg,transparent,#fdfbf8 18px);padding-left:30px}
.row:hover .tray{opacity:1;pointer-events:auto}.row:hover .q{opacity:0}
.tray button{height:32px;padding:0 13px;border-radius:16px;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);font-family:var(--machine);font-size:13px;white-space:nowrap}
.tray button.p{background:var(--btn);color:var(--cream);box-shadow:none}
/* sticky slim bar */
.stick{position:sticky;top:0;z-index:20;height:0}
.stick .in{position:absolute;left:0;right:0;top:0;transform:translateY(-100%);transition:transform .22s;background:rgba(214,223,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.stick.on .in{transform:none}
.stick .row2{max-width:var(--cw);margin:0 auto;padding:10px var(--gut);display:flex;align-items:center;gap:14px}
.stick b{font-family:var(--machine);font-weight:400;font-size:20px;white-space:nowrap}
@media (max-width:1440px){.mz{display:none!important}.stick .find{width:170px!important}}.stick .k{font:400 9px var(--mono);letter-spacing:.14em;color:var(--ink45)}
.mz{display:flex;gap:1px;margin-left:8px}.mz button{border:0;background:none;width:18px;height:26px;font-family:var(--machine);font-size:13px;padding:0;border-radius:4px}.mz button.off{color:rgba(28,19,15,.28)}.mz button.on{background:var(--btn);color:var(--cream)}
.stick .find{width:200px;height:34px}.stick .pill{height:34px}

/* ---------- 4. footer ---------- */
.foot{background:#ebe9e5;border-top:1px solid var(--hair);padding:60px 0 26px}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px}
.fg .wm{font:600 25px 'Playfair Display',Georgia,serif}
.fg p{font-size:15.5px;line-height:1.5;color:var(--ink70);margin:10px 0 14px;max-width:34ch}
.gl{display:flex;gap:7px}.gl i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink70)}.gl i:nth-child(2){background:linear-gradient(90deg,var(--ink70) 50%,transparent 50%)}.gl i:nth-child(3){background:var(--ink70)}
.fg h5{margin:0 0 12px;font-family:var(--machine);font-weight:400;font-size:15px;color:#8a4a3c}
.fg a{display:block;font-size:16px;margin:0 0 8px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;cursor:pointer}.fg a:hover{text-decoration-color:currentColor}
.fb{display:grid;grid-template-columns:1fr auto 1fr;margin-top:50px;padding-top:18px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--ink70)}.fb span:last-child{text-align:right}

/* ---------- 5. Housekeeping: the floating tab and the half-screen drawer ---------- */
.hkt{position:absolute;right:24px;bottom:24px;z-index:30;display:flex;align-items:center;gap:12px;background:var(--btn);color:var(--cream);border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 18px 36px -16px rgba(20,28,40,.6);cursor:pointer;border:0;text-align:left;transition:transform .18s,opacity .2s}
.hkt:hover{transform:translateY(-2px)}
.hkt.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
.hkt .hh{width:44px;height:44px;border-radius:50%;background:var(--slate-tray);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
.hkt .hh img{width:40px;display:block}
.hkt b{display:block;font-family:var(--machine);font-weight:400;font-size:17px}
.hkt small{display:block;font:400 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:3px}
.hkt .rg{position:relative;width:38px;height:38px;flex:none;margin-left:6px}
.hkt .rg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 9.5px var(--mono)}
.hkt .ex{font-size:15px;opacity:.75;margin-left:4px}
.dim{position:absolute;inset:0;background:rgba(28,19,15,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.hkd{position:absolute;top:0;right:0;bottom:0;width:min(780px,56vw);background:#fff;z-index:41;box-shadow:-24px 0 48px -24px rgba(28,19,15,.35);transform:translateX(102%);transition:transform .32s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column}
.hkd.on{transform:none}
.dh{position:relative;background:var(--btn);color:var(--cream);padding:16px 16px 16px 132px;flex:none;overflow:hidden}
.dh .r1{display:flex;align-items:center;gap:14px}
.dh h3{margin:0;font-family:var(--machine);font-weight:400;font-size:30px;line-height:1.1}
.dh .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(245,241,235,.35);font-size:15px}
.dh .r2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dp{height:34px;border-radius:17px;border:0;padding:0 14px;background:rgba(245,241,235,.10);box-shadow:inset 0 0 0 1px rgba(245,241,235,.2);color:var(--cream);font-family:var(--machine);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dp em{font-style:normal;opacity:.62}
.dp.on{background:var(--cream);color:var(--btn);box-shadow:none}
.dsg{display:inline-flex;padding:3px;border-radius:17px;background:rgba(245,241,235,.10);box-shadow:inset 0 0 0 1px rgba(245,241,235,.2)}
.dsg button{border:0;background:none;color:var(--cream);height:28px;padding:0 13px;border-radius:14px;font-family:var(--machine);font-size:13.5px;opacity:.75}
.dsg button[aria-pressed=true]{background:var(--cream);color:var(--btn);opacity:1}
.dh .r3{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;color:rgba(245,241,235,.8)}
.dh .r3 b{color:var(--cream)}
.pbar{flex:1;max-width:260px;height:6px;border-radius:3px;background:rgba(245,241,235,.16);overflow:hidden}.pbar i{display:block;height:100%;background:var(--cream);border-radius:3px}
.dh .hawk{position:absolute;left:22px;bottom:0;width:96px;-webkit-mask:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%)}
.db{flex:1;overflow:auto;padding:22px 28px 30px}

/* =================== v14: the ink shell and the v131 page dress =================== */
:root{--shell:#1b2433;--cr:#f4eee5;--cr92:rgba(244,238,229,.92);--cr66:rgba(244,238,229,.66);--cr42:rgba(244,238,229,.42);--cr12:rgba(244,238,229,.12);--terra:#d9967a;--ink58:rgba(28,19,15,.58);--ink10:rgba(28,19,15,.10);--ink14:rgba(28,19,15,.14);--ink16:rgba(28,19,15,.16)}

/* =========== v14k: Ready to query =========== */
.kk-on #nx,.kk-on #sp,.kk-on #car .chead{display:none!important}

/* text column */
.kk-t{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}

.kk-bar{display:block;height:6px;border-radius:3px;background:var(--tr);overflow:hidden;max-width:260px}.kk-bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}

:root{--type:'Special Elite',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace;--fc:#2a3a52;--fct:#fbf9f5;--fcs:rgba(255,255,255,.12);--fcl:rgba(255,255,255,.3);--fcm:rgba(251,249,245,.7);--anth:#2a3a52;--ink:#1c130f;--ink2:rgba(28,19,15,.72);--ink3:rgba(28,19,15,.45);--rule:rgba(28,19,15,.1);--you:#b0603e;--page:#f2eee8}

:root{
  --ink:#1c130f; --ink2:rgba(28,19,15,.62); --ink3:rgba(28,19,15,.42); --rule:rgba(28,19,15,.1);
  --page:#f2eee8; --parch:#fdfaf5;
  --frame:rgba(124,58,42,.55);
  --blush:#f3ddd2; --blushInk:#5b2a1f;
  --anth:#2a3a52; --shell:#242d3c; --shell2:#2c3646;
  --you:#b0603e; --st-req:#f5e6df; --st-sent:#e0e5dd; --st-q:#f7efe3; --st-closed:#e4e1db;
  --serif:'Source Serif 4',Georgia,serif; --type:'Special Elite',Courier,monospace; --mono:'IBM Plex Mono',monospace;
  --gut:50px; --gap:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--shell);font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ───── Shell stand-in (as today) ───── */
.app{display:grid;grid-template-columns:288px 1fr;height:100vh}
.side{padding:22px 18px 18px;display:flex;flex-direction:column;color:#e9e4dc;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;margin:4px 6px 22px}
.brand .logo{width:30px;height:30px;border-radius:50%;background:#b0603e;display:grid;place-items:center;font-family:var(--type);font-size:14px;color:#fff}
.brand .beta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:2px 6px;font-weight:500;color:rgba(255,255,255,.7)}
.ms{background:var(--shell2);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:20px}
.ms .pg{width:34px;height:42px;background:#fbf9f5;border-radius:3px;flex:none}
.ms b{font-family:var(--type);font-weight:400;font-size:16px;display:block}
.ms small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.45);margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;font-size:17px;color:rgba(233,228,220,.82)}
.nav i{width:18px;height:18px;border:1.5px solid rgba(233,228,220,.45);border-radius:4px;display:inline-block}
.nav.on{background:rgba(255,255,255,.08);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #b0603e}
.nav .ct{margin-left:auto;background:#b0603e;color:#fff;font-family:var(--mono);font-size:11px;border-radius:20px;padding:1px 8px}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:12px;align-items:center}
.side .foot .av{width:38px;height:38px;border-radius:50%;background:var(--shell2);display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.side .foot b{display:block;font-size:16px}.side .foot small{color:rgba(255,255,255,.55);font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.bar{height:62px;display:flex;align-items:flex-end;justify-content:space-between;padding-right:22px;flex:none}
.tab{background:var(--page);border-radius:14px 14px 0 0;padding:14px 26px 12px;display:flex;align-items:baseline;gap:14px}
.tab small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3)}
.tab b{font-family:var(--type);font-weight:400;font-size:21px}
.bar .tools{align-self:center;display:flex;gap:10px;align-items:center}
.search{width:220px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.55);display:flex;align-items:center;padding:0 14px;font-size:15px}
.split{display:flex;border-radius:10px;overflow:hidden;background:#fbf9f5}
.split span{padding:9px 16px;font-weight:600;font-size:15px}.split em{border-left:1px solid rgba(28,19,15,.15);padding:9px 11px;font-style:normal}
.page{flex:1;min-height:0;overflow:auto;background:var(--page);border-radius:0 14px 0 0}

/* ───── One screen ───── */
.summary{height:100%;min-height:520px;display:flex;flex-direction:column;padding:0 var(--gut) 26px;max-width:1640px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:30px;padding:clamp(14px,2.6vh,26px) 0 clamp(12px,2.2vh,20px);flex:none}
.hello{font-family:var(--type);font-weight:400;font-size:clamp(40px,6vh,56px);line-height:.92;letter-spacing:-.02em;white-space:nowrap}
.facts{margin-top:8px;font-size:18px;color:var(--ink2);white-space:nowrap}
.facts b{color:var(--ink);font-weight:600}
.facts i{font-style:normal;color:var(--ink3);margin:0 9px}
.btns{margin-left:auto;display:flex;gap:10px;flex:none}
.btn{height:42px;border-radius:11px;padding:0 18px;display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:600;border:1px solid rgba(28,19,15,.18);background:#fff;color:var(--ink);white-space:nowrap;box-shadow:0 6px 14px -10px rgba(28,19,15,.4)}
.btn.pri{background:var(--anth);border-color:var(--anth);color:#fbf9f5}
.btn svg{width:16px;height:16px}

.closedm{flex:.8!important}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1.32fr 1fr;grid-template-rows:minmax(0,1fr);gap:var(--gap)}
.left{display:flex;flex-direction:column;gap:var(--gap);min-height:0;min-width:0}

/* ───── MountCard, as today: white rim, burgundy hairline frame, anthracite band ───── */
.mount{background:#fff;border-radius:16px;padding:8px;box-shadow:0 0 0 1px rgba(28,19,15,.06),0 18px 34px -28px rgba(28,19,15,.45);display:flex;min-height:0;min-width:0}
.frame{flex:1;border:1px solid var(--frame);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#fff}
.band{background:var(--anth);color:#fbf9f5;display:flex;align-items:center;gap:14px;padding:10px 22px;flex:none}
.band h2{font-family:var(--type);font-weight:400;font-size:26px;line-height:1;white-space:nowrap}
.pillc{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.18em;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 15px;white-space:nowrap}
.ph{border:1.5px dashed rgba(28,19,15,.22);display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;line-height:1.6;color:var(--ink3)}

/* Active queries */
.active{flex:1.35}
.range{margin-left:auto;width:220px;height:26px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);position:relative;overflow:hidden}
.range svg{position:absolute;inset:0;width:100%;height:100%}
.range i{position:absolute;right:3px;top:3px;bottom:3px;width:24px;border-radius:5px;background:#fbf9f5}
.active .plot{flex:1;min-height:0;position:relative;padding:10px 22px 6px}
.active svg.chart{width:100%;height:100%;display:block}
.active .hawk{position:absolute;right:14px;bottom:30px;width:96px;height:150px;border-radius:12px;background:rgba(255,255,255,.75)}


/* ───── Closed: open feature, no container ───── */
.closedm{flex:1}
.band.grey{background:#e4e1db;color:var(--ink)}
.closedf{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:10px 28px;overflow:hidden}
.ringart{position:relative;width:clamp(96px,15vh,150px);height:clamp(96px,15vh,150px);flex:none}
.ringart svg{position:absolute;inset:0}
.ringart .ph{position:absolute;inset:13%;border-radius:50%;background:#fbf9f5}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink3)}
.cftext h2{font-family:var(--type);font-weight:400;font-size:30px;line-height:1.05;margin:8px 0 14px;white-space:nowrap}
.cftext h2 span{font-size:46px;margin-right:6px;vertical-align:-4px}
.cftext .line{font-size:18px;line-height:1.3;padding:6px 0;border-bottom:1px solid var(--rule);max-width:440px}
.cftext .line b{font-family:var(--type);font-weight:400;font-size:21px;margin-right:6px}
.cftext .small{font-size:14px;color:var(--ink2);margin-top:6px}
.cftext .more{display:inline-block;margin-top:6px;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}

/* ───── To-do: shared bones ───── */
.todo{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.tdframe{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tdh{display:flex;align-items:center;gap:14px;flex:none;position:relative}
.tdart{width:48px;height:48px;border-radius:50%;font-size:7.5px;flex:none}
.tdt h2{font-family:var(--type);font-weight:400;font-size:32px;line-height:1;white-space:nowrap}
.tdt small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:7px;opacity:.65}
.tdh .all{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border-radius:20px;padding:6px 13px;white-space:nowrap}
.tdbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 22px 84px;scrollbar-width:thin;scrollbar-color:rgba(28,19,15,.2) transparent}
.grph{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--you);font-weight:600;display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.grph:after{content:"";flex:1;height:1px;background:var(--rule)}
.grph b{font-weight:500;min-width:20px;height:20px;border-radius:10px;background:rgba(28,19,15,.06);display:grid;place-items:center;color:var(--ink2);font-size:10px;letter-spacing:0;padding:0 5px}
.grph.q{color:var(--ink3)}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:14px;align-items:start;position:relative}
.box{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(28,19,15,.3);background:#fff;margin-top:2px}
.tx{min-width:0}
.task b{font-size:17.5px;font-weight:400;display:block;line-height:1.25}
.task b strong{font-weight:600}

/* D · Spine: the list hangs off a line, each checkbox a stop on it */

.nx-spine .agent{grid-template-columns:1fr auto}

.nx-spine .grph{padding-left:38px;position:relative}

.left{display:flex;flex-direction:column;gap:var(--gap);min-height:0;min-width:0}

/* ───── MountCard, as today: white rim, burgundy hairline frame, anthracite band ───── */
.mount{background:#fff;border-radius:16px;padding:8px;box-shadow:0 0 0 1px rgba(28,19,15,.06),0 18px 34px -28px rgba(28,19,15,.45);display:flex;min-height:0;min-width:0}
.frame{flex:1;border:1px solid var(--frame);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#fff}
.band{background:var(--anth);color:#fbf9f5;display:flex;align-items:center;gap:14px;padding:10px 22px;flex:none}
.band h2{font-family:var(--type);font-weight:400;font-size:26px;line-height:1;white-space:nowrap}
.pillc{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.18em;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 15px;white-space:nowrap}
.ph{border:1.5px dashed rgba(28,19,15,.22);display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;line-height:1.6;color:var(--ink3)}

/* Active queries */
.active{flex:1.35}
.range{margin-left:auto;width:220px;height:26px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);position:relative;overflow:hidden}
.range svg{position:absolute;inset:0;width:100%;height:100%}
.range i{position:absolute;right:3px;top:3px;bottom:3px;width:24px;border-radius:5px;background:#fbf9f5}
.active .plot{flex:1;min-height:0;position:relative;padding:10px 22px 6px}
.active svg.chart{width:100%;height:100%;display:block}
.active .hawk{position:absolute;right:14px;bottom:30px;width:96px;height:150px;border-radius:12px;background:rgba(255,255,255,.75)}


/* ───── Closed: open feature, no container ───── */
.closedm{flex:1}
.band.grey{background:#e4e1db;color:var(--ink)}
.closedf{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:10px 28px;overflow:hidden}
.ringart{position:relative;width:clamp(96px,15vh,150px);height:clamp(96px,15vh,150px);flex:none}
.ringart svg{position:absolute;inset:0}
.ringart .ph{position:absolute;inset:13%;border-radius:50%;background:#fbf9f5}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--ink3)}
.cftext h2{font-family:var(--type);font-weight:400;font-size:30px;line-height:1.05;margin:8px 0 14px;white-space:nowrap}
.cftext h2 span{font-size:46px;margin-right:6px;vertical-align:-4px}
.cftext .line{font-size:18px;line-height:1.3;padding:6px 0;border-bottom:1px solid var(--rule);max-width:440px}
.cftext .line b{font-family:var(--type);font-weight:400;font-size:21px;margin-right:6px}
.cftext .small{font-size:14px;color:var(--ink2);margin-top:6px}
.cftext .more{display:inline-block;margin-top:6px;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}

/* ───── To-do: shared bones ───── */
.todo{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.tdframe{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tdh{display:flex;align-items:center;gap:14px;flex:none;position:relative}
.tdart{width:48px;height:48px;border-radius:50%;font-size:7.5px;flex:none}
.tdt h2{font-family:var(--type);font-weight:400;font-size:32px;line-height:1;white-space:nowrap}
.tdt small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:7px;opacity:.65}
.tdh .all{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border-radius:20px;padding:6px 13px;white-space:nowrap}
.tdbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow:auto;padding:4px 22px 84px;scrollbar-width:thin;scrollbar-color:rgba(28,19,15,.2) transparent}
.grph{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--you);font-weight:600;display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.grph:after{content:&quot;&quot;;flex:1;height:1px;background:var(--rule)}
.grph b{font-weight:500;min-width:20px;height:20px;border-radius:10px;background:rgba(28,19,15,.06);display:grid;place-items:center;color:var(--ink2);font-size:10px;letter-spacing:0;padding:0 5px}
.grph.q{color:var(--ink3)}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:14px;align-items:start;position:relative}
.box{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(28,19,15,.3);background:#fff;margin-top:2px}
.tx{min-width:0}
.task b{font-size:17.5px;font-weight:400;display:block;line-height:1.25}
.task b strong{font-weight:600}
.msn{font-family:var(--type);font-size:14.5px;color:var(--ink2);margin-top:2px}
.meta{display:flex;align-items:center;gap:10px;margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);white-space:nowrap;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);background:var(--st-req);border-radius:20px;padding:3px 9px;flex:none}
.pill.q{background:var(--st-q)}.pill.s{background:var(--st-sent)}
.when{font-family:var(--type);font-size:13.5px;color:var(--ink2);white-space:nowrap;padding-top:3px}

/* A · Ink workspace (Query Centre / Contact list bar), rows not cards */
.td-ink{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(28,19,15,.08),0 26px 50px -34px rgba(28,19,15,.5)}
.td-ink .tdh{background:var(--anth);color:#fbf9f5;padding:16px 22px}
.td-ink .tdart{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.55)}
.td-ink .all{border:1px solid rgba(255,255,255,.3)}
.td-ink .task{padding:13px 0 13px 14px;border-top:1px solid var(--rule)}
.td-ink .task:before{content:&quot;&quot;;position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px}
.td-ink .grph + .task{border-top:0}
.task.req:before{background:#e3bfb1}.task.q:before{background:#e3d2b6}.task.s:before{background:#c3cfbe}

/* B · Desk notepad: ruled paper, rust margin, punched ink binding */
.td-pad{background:#fdf9ef;border-radius:6px 6px 14px 14px;box-shadow:0 1px 0 rgba(28,19,15,.08),0 2px 0 -1px #f2ecdf,0 4px 0 -2px rgba(28,19,15,.08),0 6px 0 -3px #f2ecdf,0 30px 50px -34px rgba(28,19,15,.55)}
.td-pad:before{content:&quot;&quot;;position:absolute;left:0;right:0;top:0;height:18px;background:var(--anth) radial-gradient(circle,var(--page) 4px,transparent 4.5px) 14px 50%/36px 18px repeat-x;border-radius:6px 6px 0 0;z-index:2}
.td-pad .tdh{padding:34px 24px 10px 66px}
.td-pad .tdart{display:none}
.td-pad .tdt h2{font-size:34px}
.td-pad .all{border:1px solid rgba(28,19,15,.2);color:var(--ink2)}
.td-pad .tdbody{background:repeating-linear-gradient(transparent 0 37px,rgba(42,58,82,.13) 37px 38px)}
.td-pad .tdbody:before,.td-pad .tdh:before{content:&quot;&quot;;position:absolute;left:48px;top:0;bottom:0;width:1.5px;background:rgba(176,96,62,.55)}
.td-pad .scroll{padding-left:66px}
.td-pad .task{padding:9px 0 10px;grid-template-columns:1fr auto}
.td-pad .box{position:absolute;left:-46px;top:11px;background:transparent}
.td-pad .task b{font-family:var(--type);font-size:17px}
.td-pad .task b strong{font-weight:400;text-decoration:underline;text-decoration-color:rgba(176,96,62,.5);text-underline-offset:3px}
.td-pad .msn{display:none}
.td-pad .grph{margin:16px 0 4px}
.td-pad .grph:after{display:none}

/* C · Blush banner head with the flap edge, white body */
.td-blush{background:#fff;border-radius:16px;padding:8px;box-shadow:0 0 0 1px rgba(28,19,15,.06),0 18px 34px -28px rgba(28,19,15,.45)}
.td-blush .tdframe{border:1px solid var(--frame);border-radius:10px;overflow:hidden;background:#fff}
.td-blush .tdt small{margin-top:5px}
.td-blush .tdh{background:var(--blush);color:var(--blushInk);padding:11px 22px 28px;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),50% 100%,0 calc(100% - 22px))}
.td-blush .tdart{border-color:rgba(91,42,31,.35);color:rgba(91,42,31,.6);width:40px;height:40px}
.td-blush .tdt h2{font-size:26px}
.td-blush .all{background:#fff;color:var(--blushInk)}
.td-blush .tdbody{margin-top:-6px}
.td-blush .task{padding:12px 14px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(28,19,15,.08)}
.td-blush .task:hover{box-shadow:0 0 0 1px rgba(28,19,15,.14),0 10px 18px -14px rgba(28,19,15,.4)}
.td-blush .grph:after{display:none}

/* D · Open on the page: typewriter head on a double rule, floating row cards */
.td-open .tdh{padding:0 2px 14px;border-bottom:3px double rgba(28,19,15,.55)}
.td-open .tdart{display:none}
.td-open .tdt h2{font-size:38px}
.td-open .tdt small{color:var(--you);opacity:1}
.td-open .all{background:var(--anth);color:#fbf9f5}
.td-open .scroll{padding:2px 4px 84px}
.td-open .task{padding:13px 16px 13px 18px;margin-bottom:10px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px rgba(28,19,15,.06),0 12px 22px -18px rgba(28,19,15,.45);overflow:hidden}
.td-open .task:before{content:&quot;&quot;;position:absolute;left:0;top:0;bottom:0;width:4px}

/* format switcher */
.fmt{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:25;background:var(--ink);color:#fbf9f5;border-radius:12px;padding:7px 9px;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.fmt button{background:transparent;color:#fbf9f5;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.fmt button.on{background:#fbf9f5;color:var(--ink)}

@media (max-width:1439px){
  .closedf{padding:10px 22px}
  .closedf{gap:26px}
  .cftext h2{font-size:26px;margin:6px 0 10px}.cftext h2 span{font-size:40px}
  .cftext .line{font-size:17px;padding:5px 0}.cftext .line b{font-size:20px}
  .cftext .small,.cftext .more{font-size:14px;margin-top:6px}
  .tdt h2{font-size:27px}.td-open .tdt h2,.td-pad .tdt h2{font-size:29px}.td-blush .tdt h2{font-size:23px}
  .task b{font-size:16px}
  .scroll{padding-left:16px;padding-right:16px}
  .td-pad .scroll{padding-left:58px}.td-pad .tdh{padding-left:58px}.td-pad .tdbody:before,.td-pad .tdh:before{left:42px}
}


/* ───── Closed: ring + outcome tiles + latest ───── */
.closedf{grid-template-columns:auto 1fr!important;gap:30px!important;padding:14px 26px!important}
.cfr{display:flex;flex-direction:column;gap:12px;min-width:0;align-self:stretch;justify-content:center}
.otiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ot{background:#f7f5f1;border-radius:10px;padding:10px 12px 9px;box-shadow:inset 0 0 0 1px rgba(28,19,15,.07)}
.ot b{display:block;font-family:var(--type);font-weight:400;font-size:30px;line-height:1}
.ot span{display:block;font-size:13.5px;line-height:1.25;color:var(--ink2);margin-top:6px}
.ot.zero b,.ot.zero span{color:var(--ink3)}
.latest{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--rule)}
.latest .mono{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink3)}
.latest b{color:var(--ink);font-weight:600}
.latest&gt;span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.latest a{margin-left:auto;font-size:14px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.cfempty h3{font-family:var(--type);font-weight:400;font-size:22px}
.cfempty p{font-size:15.5px;color:var(--ink2);line-height:1.45;margin-top:6px;max-width:460px}
.ringart.empty #arc{display:none}

/* ───── To-do: extra row kinds ───── */
.grph.h{color:#5f6f86}
.task.hk:before{background:#cfd6e0}
.task.hk .box{display:none}
.task.hk{grid-template-columns:30px 1fr auto}
.hkic{width:28px;height:28px;border-radius:50%;background:#eef1f5;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:#5f6f86}
.fill{font-family:var(--type);font-size:13px;padding:5px 10px;border-radius:8px;background:#eef1f5;color:#2a3a52;white-space:nowrap;align-self:center}
.lead{padding:16px 2px 4px}
.lead h3{font-family:var(--type);font-weight:400;font-size:22px;line-height:1.15}
.lead p{font-size:15px;color:var(--ink2);line-height:1.45;margin-top:6px}
.agent{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(28,19,15,.08)}
.agent .ini{width:38px;height:38px;border-radius:50%;background:var(--anth);color:#fbf9f5;font-family:var(--mono);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.agent b{font-size:16.5px;display:block}
.agent small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);margin-top:3px}
.agent .why{font-size:13.5px;color:var(--ink2);margin-top:3px}
.agent .lq{font-size:13.5px;font-weight:600;padding:7px 11px;border-radius:9px;background:var(--anth);color:#fbf9f5;white-space:nowrap}
.date{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.cal{border-radius:7px;overflow:hidden;text-align:center;box-shadow:0 0 0 1px rgba(28,19,15,.1);background:#fff}
.cal small{display:block;background:var(--anth);color:#fbf9f5;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;padding:2px 0}
.cal b{display:block;font-family:var(--type);font-weight:400;font-size:18px;padding:2px 0 1px}
.date .w{font-size:16px}.date .w b{font-weight:600}
.date .d{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);margin-top:3px}
.nextrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.nextrow .btn{height:36px;font-size:14px;padding:0 13px}
.soon{font-family:var(--mono);font-size:9px;letter-spacing:.14em;background:rgba(28,19,15,.07);border-radius:10px;padding:2px 7px;margin-left:4px}
.fmt span{font-family:var(--mono)}
@media (max-width:1439px){
  .otiles{grid-template-columns:repeat(2,1fr);gap:7px}
  .ot{padding:7px 10px}.ot b{font-size:22px}.ot span{font-size:12.5px;margin-top:3px}
  .closedf{gap:20px!important;padding:10px 18px!important}
  .latest{font-size:13.5px;padding-top:7px}.latest .mono{display:none}
}
@media (max-height:780px){
  .otiles{grid-template-columns:repeat(4,1fr)}
  .ot b{font-size:22px}.ot span{font-size:12px}
  .latest .mono{display:none}
}


/* ───── To-do: one item in focus, the list behind it ───── */
.tdcol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.tdcol&gt;.todo{flex:1}
.td-blush .tdh{padding:13px 22px 34px!important}
.fband{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 16px}
.fpill{font-family:var(--mono);font-size:10px;letter-spacing:.18em;font-weight:600;background:var(--anth);color:#fbf9f5;border-radius:6px;padding:4px 8px}
.fpos{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink2)}
.fpos button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(28,19,15,.2);background:rgba(255,255,255,.7);font-size:13px;line-height:1;color:var(--ink)}
.fpos button:disabled{opacity:.35;cursor:default}
.fbody{padding:14px 18px 4px}
.fwho{display:flex;gap:12px;align-items:center}
.fwho .ini{width:42px;height:42px;border-radius:50%;background:var(--anth);color:#fbf9f5;font-family:var(--mono);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.fwho .ic2{width:42px;height:42px;border-radius:50%;background:#eef1f5;color:#2a3a52;font-family:var(--mono);font-size:12px;display:grid;place-items:center;flex:none}
.fwho h3{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.2}
.fwho h3 b{font-weight:600}
.fwho small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink3);margin-top:4px}
.fnote{font-size:15px;color:var(--ink2);line-height:1.45;margin-top:10px}
.ftl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin:14px 0 2px;position:relative}
.ftl:before{content:&quot;&quot;;position:absolute;left:12%;right:12%;top:7px;height:1px;background:rgba(28,19,15,.18)}
.ftl div{text-align:center;position:relative}
.ftl svg{background:#fff;padding:0 4px;box-sizing:content-box}
.ftl b{display:block;font-family:var(--type);font-weight:400;font-size:11.5px;margin-top:3px;white-space:nowrap}
.ftl small{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink3)}
.ffoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px 12px 18px;margin-top:10px;border-top:1px solid var(--rule)}
.ffoot span{font-size:14px;color:var(--ink2)}
.ffoot .btn{height:36px;font-size:14px;padding:0 14px}
/* the list behind: plain rows, quieter */
.bglist{padding-top:2px!important}
.bglist .task{background:transparent!important;box-shadow:none!important;border-radius:0!important;margin:0!important;padding:10px 0 10px 14px!important;border-top:1px solid var(--rule)}
.bglist .task:before{content:&quot;&quot;;position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px}
.bglist .task b{font-size:15.5px}
.bglist .msn{display:none}
.bglist .grph{margin:14px 0 4px}
.bglist .grph + .task{border-top:0}
.bglist .agent{background:transparent;box-shadow:none;border-radius:0;margin:0;padding:10px 0;border-top:1px solid var(--rule)}
.bglist .agent .lq{background:transparent;color:var(--anth);border:1px solid rgba(42,58,82,.3)}
.bglist .lead{display:none}
@media (max-width:1439px){
  .td-blush .tdh{padding:10px 18px 30px!important}
  .fwho h3{font-size:17.5px}
  .fbody{padding:11px 14px 2px}.ffoot{padding:9px 12px 10px 14px}
}
@media (max-height:780px){ .ftl{display:none} .fnote{display:none} }


/* ───── Next up at the top: four recognised patterns ───── */
#focus{flex:none;padding:6px 18px 4px;position:relative;z-index:1}
.then{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3);display:flex;align-items:center;gap:10px;padding:12px 0 0}
.then:after{content:&quot;&quot;;flex:1;height:1px;background:var(--rule)}
.fcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(28,19,15,.1),0 14px 28px -20px rgba(28,19,15,.45)}

/* A · Featured card (Linear / Things &quot;up next&quot;) */
.sty-hero #focus{margin-top:-14px}

/* B · Queue (Spotify &quot;Now playing / Next in queue&quot;) */
.qnow{border-radius:12px;background:linear-gradient(#fbeee8,#fdf7f3);padding:12px 16px 14px;box-shadow:inset 0 0 0 1px rgba(176,96,62,.18);margin-top:-14px}
.qnow .qlab{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--you);font-weight:600}
.qnow .qlab .fpos{color:var(--ink2);font-weight:400}
.qnow .fwho{margin-top:10px}
.qnow .fwho h3{font-family:var(--type);font-size:21px}
.qnow .fwho h3 b{font-weight:400;text-decoration:underline;text-decoration-color:rgba(176,96,62,.45);text-underline-offset:4px}
.qnow .qact{display:flex;align-items:center;gap:12px;margin-top:12px}
.qnow .qact .btn{height:36px;font-size:14px;padding:0 14px}
.qnow .qact span{font-size:14px;color:var(--ink2)}
.sty-queue .bglist{counter-reset:q 1}
.sty-queue .bglist .grph{display:none}

.sty-queue .bglist .task:before{display:none}
.sty-queue .bglist .task:after,.sty-queue .bglist .agent:after,.sty-queue .bglist .date:after{content:counter(q);position:absolute;left:0;top:12px;width:26px;height:26px;border-radius:50%;background:rgba(28,19,15,.06);font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:var(--ink2)}

.sty-queue .bglist .agent .ini{display:none}.sty-queue .bglist .agent{grid-template-columns:1fr auto}
.sty-queue .bglist .task:first-of-type{border-top:0}

/* ───── To-do without a container: Next up, then the list ───── */

/* A · Open: floating row cards on the page (Query Centre rows) */
.nx-open .task,.nx-open .agent{background:#fff!important;border-radius:12px!important;box-shadow:0 0 0 1px rgba(28,19,15,.07),0 10px 20px -16px rgba(28,19,15,.4)!important;margin:0 0 8px!important;padding:11px 14px 11px 18px!important;border-top:0!important;overflow:hidden}

/* B · Sheet: one plain white sheet holding the list, rows ruled */
.nx-sheet .scroll{background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(28,19,15,.08),0 18px 34px -28px rgba(28,19,15,.45);padding:2px 18px 86px!important}

/* C · Tray: Next up sits on a blush tray, the list runs open beneath */

/* D · Spine: the list hangs off a line, each checkbox a stop on it */
.nx-spine .scroll{position:relative}
.nx-spine .task,.nx-spine .agent,.nx-spine .date{position:relative;padding:10px 0 10px 38px!important;border-top:0!important;border-bottom:0!important}
.nx-spine .task:before,.nx-spine .agent:before,.nx-spine .date:before{content:&quot;&quot;;position:absolute;left:12px!important;top:0!important;bottom:0!important;width:1.5px!important;background:rgba(28,19,15,.14)!important;border-radius:0!important}

.nx-spine .task.hk{grid-template-columns:30px 1fr auto!important}

.nx-spine .task.hk{padding-left:38px!important;grid-template-columns:1fr auto!important}
.nx-spine .agent .ini{position:absolute;left:-2px;top:10px;width:28px;height:28px;font-size:9.5px}
.nx-spine .agent{grid-template-columns:1fr auto}
.nx-spine .date .cal{position:absolute;left:-6px;top:6px;width:38px}
.nx-spine .date{grid-template-columns:1fr}
.nx-spine .grph{padding-left:38px;position:relative}
.nx-spine .grph:before{content:&quot;&quot;;position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:currentColor}

@media (max-width:1439px){ .nxh h2{font-size:26px} .nx-tray .nxtop{padding:12px 14px 14px} }

.nxban{align-self:center;width:max-content;max-width:100%;background:var(--bn-bg)!important;color:var(--bn-fg)!important;box-shadow:inset 0 0 0 var(--bn-bw,0px) var(--bn-bd,transparent);padding:12px 26px 13px!important}
.nxban p{font-size:22px}
.nxarrow{fill:var(--bn-bg)!important}
.nxarrow path{stroke:var(--bn-bd,transparent);stroke-width:var(--bn-sw,0)}
/* colours */
.bc-blush{--bn-bg:#f3ddd2;--bn-fg:#5b2a1f}
.bc-ink{--bn-bg:#2a3a52;--bn-fg:#fbf9f5}
.bc-sand{--bn-bg:#efe3cf;--bn-fg:#4a3622}
.bc-sage{--bn-bg:#dfe6dc;--bn-fg:#2f4433}
.bc-rust{--bn-bg:#b0603e;--bn-fg:#fdf6f1}
.bc-paper{--bn-bg:#fff;--bn-fg:#1c130f;--bn-bw:1px;--bn-bd:rgba(28,19,15,.16);--bn-sw:1.2px}
/* shapes */
.bs-bubble .nxban{border-radius:12px}
.bs-pill .nxban{border-radius:999px;padding:10px 26px 11px!important;margin-bottom:14px!important}
.bs-pill .nxarrow{display:none}
.bs-pill .nxban p{font-size:19px}
.bs-tab .nxban{border-radius:12px 12px 0 0;margin-bottom:-1px!important;padding:10px 24px 9px!important;align-self:flex-start;margin-left:22px}
.bs-tab .nxarrow{display:none}
.bs-tab .nxban p{font-size:19px}
.bs-tab #focus .fcard{border-top-left-radius:12px}
.bs-tab #focus .fband{border-top:3px solid var(--bn-bg)}
.bs-stamp .nxban{border-radius:4px;transform:rotate(-1.6deg);background:transparent!important;color:var(--bn-stamp,#9a4f31)!important;box-shadow:inset 0 0 0 2px currentColor,inset 0 0 0 4px transparent,inset 0 0 0 5px currentColor!important;margin-bottom:16px!important;padding:9px 22px 10px!important;opacity:.92}
.bs-stamp .nxarrow{display:none}
.bs-stamp .nxban p{font-size:19px;letter-spacing:.02em}
.bs-stamp.bc-ink{--bn-stamp:#2a3a52}.bs-stamp.bc-sage{--bn-stamp:#3f5a45}.bs-stamp.bc-sand{--bn-stamp:#7a5a33}.bs-stamp.bc-paper{--bn-stamp:#1c130f}.bs-stamp.bc-blush{--bn-stamp:#a45a42}
@media (max-width:1439px){ .nxban p{font-size:19px} .nxban{padding:10px 20px 11px!important} }
.bswitch{position:absolute;left:24px;bottom:66px;z-index:40;background:var(--ink);color:#fbf9f5;border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:620px}
.bswitch button{display:flex;align-items:center;gap:5px;background:transparent;color:#fbf9f5;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.bswitch button i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.bswitch button.on{background:#fbf9f5;color:var(--ink)}
.bswitch .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 3px}


/* ───── Right-hand side: open / hairline / tinted well ───── */
.tdcol{transition:background .2s}
.rw-hair{border:1px solid rgba(124,58,42,.45);border-radius:16px;padding:16px 16px 0;background:transparent}
.rw-well{background:#ebe5dc;border-radius:18px;padding:16px 16px 0;box-shadow:inset 0 1px 3px rgba(28,19,15,.06)}
.rw-well .nxarrow{fill:var(--bn-bg)}
.rw-hair .scroll,.rw-well .scroll{padding-left:0!important;padding-right:0!important}
.rw-well .nx-open .task,.rw-well .task{box-shadow:0 0 0 1px rgba(28,19,15,.05),0 8px 16px -14px rgba(28,19,15,.35)!important}

.rw-well.wl-oat{background:#ebe5dc}
.rw-well.wl-stone{background:#e4ded5}
.rw-well.wl-paper{background:#fbf9f5}
.rw-well.wl-sand{background:#f1e7d6}
.rw-well.wl-blush{background:#f7e9e2}
.rw-well.wl-sage{background:#e5eae1}
.rw-well.wl-slate{background:#e3e8ee}
.rw-well.wl-paper{box-shadow:0 0 0 1px rgba(28,19,15,.06)}
.rw-well.wl-blush{box-shadow:inset 0 0 0 1px rgba(176,96,62,.1)}
.rw-well.wl-sage{box-shadow:inset 0 0 0 1px rgba(63,90,69,.1)}
.rw-well.wl-slate{box-shadow:inset 0 0 0 1px rgba(42,58,82,.1)}


/* ───── Banner inside the oat well ───── */
.tdcol{position:relative}
.bw-band .nxban{align-self:stretch;width:auto;max-width:none;border-radius:18px 18px 0 0!important;margin:-16px -16px 32px!important;padding:14px 20px 15px!important}
.bw-straddle{margin-top:24px}
.bw-straddle .nxban{margin-top:-40px!important;margin-bottom:30px!important;box-shadow:0 0 0 5px #ebe5dc!important}
.bw-tab{margin-top:44px;border-top-left-radius:0!important}
.bw-tab .nxtop{position:static}
.bw-tab .nxban{position:absolute;top:-44px;left:0;margin:0!important;border-radius:14px 14px 0 0!important;padding:11px 22px 12px!important}
.bw-tab .nxban p{font-size:19px}
.bw-tab .nxarrow{display:none}
.bw-tab .nxtop&gt;#focus{margin-top:0}
.bw-plain .nxban{background:transparent!important;color:var(--ink)!important;align-self:flex-start;padding:2px 2px 0!important;margin-bottom:14px!important;box-shadow:none!important}
.bw-plain .nxban p{font-size:25px}
.bw-plain .nxban:after{content:&quot;&quot;;display:block;width:44px;height:3px;background:var(--you);border-radius:2px;margin-top:8px}
.bw-plain .nxarrow{display:none}
@media (max-width:1439px){ .bw-plain .nxban p{font-size:21px} }

/* ───── Page header backgrounds ───── */
.hdr{position:relative;isolation:isolate}
.hsw{display:none;position:absolute;z-index:-1;pointer-events:none}
.hb-flap .hsw{display:block;top:-200px;bottom:-26px;left:-200vw;right:-200vw;filter:drop-shadow(0 12px 12px rgba(28,19,15,.12))}
.hb-flap .hsh{position:absolute;inset:0;background:#fbf9f5;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),50% 100%,0 calc(100% - 26px))}
.hb-flap .body{margin-top:26px}
.hb-flap .tab{background:#fbf9f5!important}
.page{overflow-x:hidden!important}
.hb-plate .hsw{display:block;inset:10px -22px 0;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(28,19,15,.06),0 18px 34px -28px rgba(28,19,15,.45)}
.hb-plate .hdr{padding-top:clamp(20px,3.2vh,30px)!important;padding-bottom:clamp(16px,2.6vh,24px)!important;margin-bottom:14px}

@media (max-height:780px){ .hB .ttl{font-size:36px} }
/* ───── Closed card is sized by its content, never clipped; the chart gives way ───── */
.closedm{flex:none!important}
.closedm .frame{min-height:auto}
.closedf{overflow:visible!important;flex:none!important}
.active{flex:1 1 0!important;min-height:170px}
.active .plot{min-height:120px}
/* if the screen is very short, the page scrolls rather than anything being cut */
.summary{min-height:560px}
/* ───── Floating tab (as the Birds-eye view&#x27;s) ───── */
.fab{position:absolute;right:28px;bottom:26px;z-index:20;display:flex;align-items:center;gap:12px;background:var(--fc);color:var(--fct);border:0;border-radius:16px;padding:12px 18px 12px 14px;box-shadow:0 18px 34px -14px rgba(28,19,15,.6);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.fab .ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.fab b{font-family:var(--type);font-weight:400;font-size:20px;display:block;line-height:1}
.fab small{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.6);display:block;margin-top:5px;text-align:left}
.fab .new{background:var(--you);color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 8px;margin-left:4px}

/* ───── Drawer: half screen from the right, in focus ───── */
.dim{position:absolute;inset:0;background:rgba(24,29,40,.45);opacity:0;pointer-events:none;transition:opacity .28s;z-index:30}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(640px,52%);background:var(--page);z-index:31;transform:translateX(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
.open .dim{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.dhead{background:var(--anth);color:#fbf9f5;padding:22px 26px 18px;flex:none}
.dhead .row{display:flex;align-items:center;gap:14px}
.dhead .ph{width:52px;height:52px;border-radius:50%;border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.55);font-size:7.5px;flex:none}
.dhead h2{font-family:var(--type);font-weight:400;font-size:34px;line-height:1}
.dhead .x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fbf9f5;font-size:18px}
.filters{display:flex;gap:8px;margin-top:16px}
.filters button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fbf9f5;border-radius:20px;padding:6px 14px;font-size:14px}
.filters button.on{background:#fbf9f5;color:var(--ink);border-color:#fbf9f5}
.filters .rng{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:7px 13px}
.dbody{flex:1;min-height:0;overflow:auto;padding:6px 30px 40px}
.day{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink3);display:flex;align-items:center;gap:16px;margin:26px 0 10px}
.day:before,.day:after{content:&quot;&quot;;flex:1;height:1px;background:var(--rule)}
.ev{padding:12px 0 14px;border-bottom:1px solid var(--rule)}
.ev:last-child{border-bottom:0}
.ev .top{display:flex;align-items:center;gap:12px}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-weight:500;border-radius:20px;padding:5px 12px}
.ev time{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.ev p{font-size:19px;line-height:1.45;margin-top:10px}
.ev p i{font-family:var(--type);font-style:normal}
.ev p b{font-weight:600}
.ev .ag{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink3);margin-top:6px}
.ev .note{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink2);margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.ev .do{display:inline-block;margin-top:10px;font-size:15px;font-weight:600;border:1px solid rgba(28,19,15,.2);border-radius:9px;padding:6px 12px;background:#fff}

@media (max-width:1439px){
  :root{--gut:34px;--gap:18px}
  .app{grid-template-columns:248px 1fr}
  .facts{font-size:16px}
  .hdr{gap:20px}
  .btn{height:40px;padding:0 14px;font-size:14.5px}
  .band{padding:9px 18px}.band h2{font-size:23px}
  .range{width:180px}
  .active .hawk{width:76px;height:118px}
  .fab{right:20px;bottom:20px}
}

:root{--mono:&#x27;JetBrains Mono&#x27;,monospace}
.fmt{display:none!important}
/* ===== the new feed, in the drawer ===== */
.af-body{padding:0 24px 40px!important}
.nf{--c:#3d5070;--t:#e2e7ef;position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;margin:0 -12px;border-radius:10px;border-top:1px solid rgba(28,19,15,.08)}
.af-day+.nf{border-top:0}
.nf[data-k=offer]{--c:#b8862f;--t:#f6ecd6}.nf[data-k=req]{--c:#3d5070;--t:#e2e7ef}.nf[data-k=sent]{--c:#8a6a3c;--t:#f4ead9}.nf[data-k=msent]{--c:#3d5070;--t:#e2e7ef}.nf[data-k=nudge]{--c:#a2452a;--t:#f3ddd2}.nf[data-k=closed]{--c:#7c7168;--t:#ece8e3}.nf[data-k=admin]{--c:#a39c94;--t:#f0ede9}
.nf-ico{width:34px;height:34px;border-radius:50%;background:var(--t);display:grid;place-items:center;color:#1c130f;margin-top:1px}
.nf-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.nf-ico svg.gl{width:16px;height:16px;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.nf-top{display:flex;align-items:baseline;gap:10px}
.nf-tag{font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.nf time{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:rgba(28,19,15,.45);white-space:nowrap}
.nf-say{margin:3px 0 0;font-size:15.5px;line-height:1.4;color:#1c130f}
.nf-say b{font-weight:600}.nf-say i{font-family:var(--type);font-style:normal;font-size:14.5px}
.nf-meta{display:block;margin-top:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,19,15,.45)}
/* news rows: tinted, ringed disc, bigger sentence, action */
.nf[data-k=offer],.nf[data-k=req]{background:var(--t);border-top-color:transparent;margin:6px -12px;padding:12px 14px 13px 12px}
.nf[data-k=offer]+.nf,.nf[data-k=req]+.nf{border-top-color:transparent}
.nf[data-k=offer] .nf-ico,.nf[data-k=req] .nf-ico{background:#fff;box-shadow:0 0 0 1.5px var(--c)}
.nf[data-k=offer] .nf-say,.nf[data-k=req] .nf-say{font-size:17px}
.nf-act{display:inline-flex;margin-top:10px;font-size:13.5px;font-weight:600;background:#2a3a52;color:#fbf9f5;border-radius:9px;padding:7px 12px;text-decoration:none}
.nf-done{display:inline-block;margin-top:9px;font-size:13.5px;color:#5c6b55}
/* housekeeping: one muted line */
.nf[data-k=admin]{padding:6px 12px;align-items:center}
.nf[data-k=admin] .nf-ico{width:22px;height:22px;margin:0 6px}.nf[data-k=admin] .nf-ico svg.gl{width:11px;height:11px}
.nf[data-k=admin] .nf-top,.nf[data-k=admin] .nf-meta{display:none}
.nf[data-k=admin] .nf-main{display:flex;align-items:baseline;gap:10px}
.nf[data-k=admin] .nf-say{margin:0;font-size:13px;color:rgba(28,19,15,.5)}.nf[data-k=admin] .nf-say b{font-weight:400}
.nf[data-k=admin]::after{content:attr(data-time);font-family:var(--mono);font-size:10px;color:rgba(28,19,15,.4);position:absolute;right:12px;top:50%;transform:translateY(-50%)}
/* new since last visit: rust rule in the body&#x27;s margin */
.nf.new::before{content:&quot;&quot;;position:absolute;left:-7px;top:12px;bottom:12px;width:3px;border-radius:0 2px 2px 0;background:#a2452a}
/* spine option */
body[data-sp=on] .nf::after{content:&quot;&quot;;position:absolute;left:29px;top:0;bottom:0;width:1.5px;background:rgba(28,19,15,.09);z-index:0}
body[data-sp=on] .nf[data-k=admin]::after{content:attr(data-time);left:auto;width:auto;background:none}
body[data-sp=on] .nf-ico{position:relative;z-index:1;box-shadow:0 0 0 4px #fbf9f5}
body[data-sp=on] .nf[data-k=offer] .nf-ico,body[data-sp=on] .nf[data-k=req] .nf-ico{box-shadow:0 0 0 1.5px var(--c),0 0 0 5px var(--t)}
body[data-sp=on] .nf{border-top:0}
/* action option: link on the right */
body[data-ac=link] .nf-act{background:none;color:#1c130f;padding:0;margin:0;border-radius:0;text-decoration:underline;text-underline-offset:3px;font-weight:400;position:absolute;right:14px;bottom:13px}
body[data-ac=link] .nf[data-k=req]:has(.nf-act) .nf-main{padding-right:110px}
/* filters */
body[data-fl=in] .nf[data-who=out],body[data-fl=out] .nf[data-who=in]{display:none}
#lab{position:fixed;left:18px;bottom:18px;z-index:99;width:270px;background:#1c130f;color:#f4eee5;border-radius:16px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);padding:12px 16px 14px;font:400 14px var(--serif)}
#lab b{font:400 16px var(--type)}#lab h5{margin:10px 0 6px;font:600 9px var(--mono);letter-spacing:.16em;color:rgba(244,238,229,.55)}
#lab .seg{display:flex;flex-wrap:wrap;gap:5px}#lab button{border:0;border-radius:14px;padding:6px 10px;background:rgba(255,255,255,.1);color:#f4eee5;font:400 12.5px var(--type);cursor:pointer}
#lab button[aria-pressed=true]{background:#f4eee5;color:#1c130f}#lab .x{position:absolute;right:10px;top:8px;background:none;padding:2px 6px;width:auto;height:auto;border:0;font-size:14px}
