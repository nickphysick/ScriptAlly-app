<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptAlly — Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2e2723; --ink-soft:#6a615a; --muted:#9c8878; --burgundy:#7c3a2a;
  --parch:#f2ede7; --chrome:#fbf9f5; --line:#ece7de; --edge:#e6e0d5;
  --rail-tx:#a89a8a; --rail-hi:#f4efe7;
  --railw:52px; --panelw:186px;
  --head:66px; --frame:14px; --cardr:16px;
  --bartint:rgba(234,227,217,.92); --bartint-solid:#eae3d9;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Inter,sans-serif;background:var(--chrome);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100%;display:flex;background:var(--chrome)}

/* ---------- RAIL ---------- */
.rail{flex:none;width:var(--railw);background:#2e2723;display:flex;flex-direction:column;align-items:center;
  padding:12px 0 10px;position:relative;z-index:6}
.tile{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:17px;color:var(--rail-hi);cursor:pointer;margin-bottom:10px;transition:background .15s}
.tile:hover{background:rgba(255,255,255,.08)}
.ri{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--rail-tx);cursor:pointer;margin:2px 0;position:relative;transition:all .15s;outline:none}
.ri svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ri:hover{color:var(--rail-hi)}
.ri.on{background:rgba(255,255,255,.12);color:var(--rail-hi)}
.ri:focus-visible{box-shadow:inset 0 0 0 2px rgba(244,239,231,.5)}
.ri .bdg{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#c96f52;border:2px solid #2e2723}
.rail .grow{flex:1}
.rail .xtog{display:none}
body.closed .rail .xtog{display:flex}
.rava{width:30px;height:30px;border-radius:50%;background:#f5e3da;border:1px solid rgba(124,58,42,.35);
  color:var(--burgundy);font-family:'Playfair Display',serif;font-size:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;margin:4px 0 2px}
.ri::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);
  background:#2e2723;color:#f4efe7;font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;white-space:nowrap;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;z-index:30;box-shadow:0 2px 8px rgba(46,39,35,.25)}
.ri:hover::after{opacity:1;visibility:visible;transition-delay:.3s}
body.flyopen .ri::after{display:none}

/* ---------- PANEL ---------- */
.panel{flex:none;width:var(--panelw);position:relative;background:var(--chrome);overflow:hidden;
  transition:width .22s cubic-bezier(.4,0,.2,1),opacity .18s}
.panel::before{content:'';position:absolute;top:0;bottom:0;left:0;width:18px;
  background:linear-gradient(90deg,rgba(46,39,35,.10),transparent);pointer-events:none;z-index:5}
body.closed .panel{width:0;opacity:0}
.pin{width:var(--panelw);height:100%;display:flex;flex-direction:column;padding:0 10px 10px}

/* head zone matches the bar's 66px so the pill centres against the breadcrumb */
.phead{height:var(--head);flex:none;display:flex;align-items:center}
.mspill{flex:1;min-width:0;height:38px;background:#fff;border:1px solid var(--edge);border-radius:9px;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;cursor:pointer;transition:border-color .15s}
.mspill:hover{border-color:#d6cdbf}
.mspill svg{width:14px;height:14px;stroke:var(--burgundy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mspill .t{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.mspill .chev{color:var(--muted);display:flex;flex:none}
.mspill .chev svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.8}

.nav{flex:1;min-height:0;overflow:auto;padding-top:20px}
.glabel{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 6px;margin-top:18px}
.glabel.first{margin-top:0}
.ni{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:#544b44;transition:background .13s,color .13s;outline:none}
.ni svg.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.9}
.ni:hover{background:rgba(242,237,231,.6);color:var(--ink)}
.ni.on{background:var(--parch);color:var(--ink);font-weight:600}
.ni:focus-visible{box-shadow:inset 0 0 0 2px rgba(124,58,42,.45)}
.ct{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.ct .dot{width:5px;height:5px;border-radius:50%;background:var(--burgundy)}

.crow2{height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:8px;flex:none;margin-top:6px;
  color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .13s;outline:none}
.crow2 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.crow2:hover{background:rgba(242,237,231,.6);color:var(--ink-soft)}
.pdiv{height:1px;background:var(--line);margin:8px 4px 6px;flex:none}
.uacct{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .13s;outline:none;flex:none}
.uacct:hover{background:rgba(242,237,231,.6)}
.uacct .n{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.uacct .sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.uacct .pl{font-size:11.5px;color:var(--muted)}
.uacct .upg{font-size:11px;font-weight:600;color:var(--burgundy);border:1px solid rgba(124,58,42,.3);
  border-radius:999px;padding:4px 10px;background:#fdf6f2;transition:background .15s}
.uacct .upg:hover{background:#f5e3da}

.fly{position:absolute;left:calc(var(--railw) + 10px);min-width:186px;background:#fff;border:1px solid var(--edge);border-radius:12px;
  box-shadow:0 4px 14px rgba(46,39,35,.14),0 16px 38px rgba(46,39,35,.12);padding:6px;z-index:40;display:none}
.fly.show{display:block}
.fly .fh{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);padding:7px 10px 5px}
.fly .fi{height:32px;display:flex;align-items:center;border-radius:7px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;outline:none}
.fly .fi:hover{background:rgba(242,237,231,.6);color:var(--ink)}
.fly .fi.on{background:var(--parch);color:var(--ink);font-weight:600}
.fly .fi .ct{margin-left:auto}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;background:var(--chrome);padding:var(--frame) var(--frame) var(--frame) 12px}
.card{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:var(--cardr);
  border:1px solid rgba(46,39,35,.06);box-shadow:0 1px 2px rgba(46,39,35,.05),0 8px 24px rgba(46,39,35,.08);overflow:hidden}
.cscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.bar{height:var(--head);flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:8;
  background:var(--bartint);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 18px -10px rgba(46,39,35,.22)}
@supports not (backdrop-filter:blur(10px)){.bar{background:var(--bartint-solid)}}
.logotype{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;transition:opacity .15s}
.logotype:hover{opacity:.72}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px}
.crumb .sep{color:#cfc4b4}
.crumb .seg{color:var(--muted);cursor:pointer}
.crumb .seg:hover{color:var(--ink)}
.crumb .cur{color:var(--ink);font-weight:600}
.bright{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a2947f;white-space:nowrap}
.vdiv{width:1px;height:18px;background:#d9cec0}
.swrap{position:relative}
.bsearch{height:34px;width:210px;border-radius:9px;background:#fff;border:1px solid #d9cec0;display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--muted);font-size:12px;cursor:pointer;transition:border-color .15s;outline:none}
.bsearch:hover{border-color:#d6cdbf}
.bsearch svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.bsearch .k{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;background:#f2ede7;border-radius:4px;padding:1px 5px}
.pal2{position:absolute;top:calc(100% + 8px);right:0;width:min(560px,calc(100vw - 24px));background:#fff;
  border:1px solid var(--edge);border-radius:14px;overflow:hidden;display:none;z-index:60;
  box-shadow:0 10px 30px rgba(46,39,35,.16),0 34px 70px rgba(46,39,35,.2)}
.pal2.show{display:block}
.pal2 .prow{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.pal2 .prow svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
.pal2 .prow input{all:unset;flex:1;font-size:14px;color:var(--ink)}
.pal2 .prow input::placeholder{color:var(--muted)}
.pal2 .esc{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);background:#f4f0e9;border-radius:4px;padding:2px 6px}
.pal2 .plist{max-height:min(340px,calc(100vh - 220px));overflow:auto;padding:6px}
.pal2 .pg{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:9px 10px 4px}
.pal2 .pi{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink)}
.pal2 .pi .pic{width:26px;height:26px;border-radius:7px;background:var(--parch);display:flex;align-items:center;justify-content:center;color:var(--burgundy);font-size:12px;flex:none}
.pal2 .pi .kind{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted)}
.pal2 .pi:hover,.pal2 .pi.sel{background:var(--parch)}
.help{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:all .15s}
.help:hover{color:var(--ink);background:rgba(255,255,255,.55)}
.help svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nbtn{height:34px;padding:0 14px;border-radius:9px;background:#2e2723;border:1px solid #2e2723;color:#f4efe7;
  font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;transition:background .15s}
.nbtn:hover{background:#3f372f}
.nbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.work{flex:none;background:#fff;padding:26px 28px}
.work h2{font-family:'Playfair Display',serif;font-size:23px;font-weight:600;margin-bottom:4px}
.work .sub2{font-size:12.5px;color:var(--muted);margin-bottom:20px}
.skrow{display:flex;gap:14px}
.sk{border:1px solid #eeeae2;border-radius:14px;background:#fdfcfa;height:300px;flex:1;padding:16px}
.sk .l{height:10px;border-radius:5px;background:#f1ece3;margin-bottom:12px}
.sk .l.w60{width:60%}.sk .l.w40{width:40%}.sk .l.w80{width:80%}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="app">

  <aside class="rail" id="rail">
    <div class="tile" id="logoTile" title="Dashboard">S</div>
    <div id="railnav"></div>
    <div class="grow"></div>
    <div class="ri xtog" data-tip="Expand" id="expandBtn"><svg viewBox="0 0 24 24"><path d="M13 17l5-5-5-5"/><path d="M6 17l5-5-5-5"/></svg></div>
    <div class="rava" title="Nick Physick">NP</div>
    <div class="ri" style="margin:0" data-tip="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div class="fly" id="fly"></div>
  </aside>

  <div class="panel">
    <div class="pin">
      <div class="phead">
        <div class="mspill">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="t">Murphy's Day Out</span>
          <span class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg></span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="crow2" id="collapseBtn" tabindex="0">
        <svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>Collapse sidebar
      </div>
      <div class="pdiv"></div>
      <div class="uacct" tabindex="0">
        <span class="n">Nick Physick</span>
        <span class="sub"><span class="pl">Free plan</span><span class="upg">Upgrade</span></span>
      </div>
      <div class="ni" style="height:34px;font-size:13px" tabindex="0">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Settings
      </div>
    </div>
  </div>

  <div class="main">
    <div class="card">
     <div class="cscroll" id="cscroll">
      <div class="bar">
        <span class="crumb"><span class="logotype" id="logoHome">ScriptAlly</span><span class="sep">/</span><span id="crumb"></span></span>
        <div class="bright">
          <span class="sync">All changes saved</span>
          <span class="vdiv"></span>
          <div class="swrap">
            <div class="bsearch" id="searchBtn" tabindex="0"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>Search<span class="k">⌘K</span></div>
            <div class="pal2" id="pal2">
              <div class="prow"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="Search pages, actions, agents, queries…"><span class="esc">esc</span></div>
              <div class="plist">
                <div class="pg">Actions</div>
                <div class="pi sel"><span class="pic">＋</span><span class="t">Log a query</span><span class="kind">↵</span></div>
                <div class="pi"><span class="pic">↩</span><span class="t">Record a response</span></div>
                <div class="pg">Pages</div>
                <div class="pi"><span class="pic">▤</span><span class="t">Query Centre</span></div>
                <div class="pi"><span class="pic">▤</span><span class="t">Contact list</span></div>
              </div>
            </div>
          </div>
          <div class="help" tabindex="0" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 0 1 5.5.7c0 1.8-2.7 2.3-2.7 3.8"/><circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/></svg></div>
          <button class="nbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
        </div>
      </div>
      <div class="work">
        <h2 id="wtitle">Dashboard</h2>
        <div class="sub2" id="wsub">Everything at a glance</div>
        <div class="skrow">
          <div class="sk" style="max-width:320px"><div class="l w60"></div><div class="l w80"></div><div class="l w40"></div><div class="l w80"></div></div>
          <div class="sk"><div class="l w40"></div><div class="l w80"></div><div class="l w60"></div></div>
        </div>
        <div class="skrow" style="margin-top:14px"><div class="sk" style="height:240px"><div class="l w40"></div><div class="l w80"></div></div></div>
      </div>
     </div>
    </div>
  </div>

</div>

<script>
const IC={
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
 people:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
 check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'
};
/* every destination is visible; groups map 1:1 to rail icons */
const GROUPS=[
 {id:'workspace',label:'Workspace',icon:'dash',items:[
   {id:'dash',label:'Dashboard',icon:'dash'},
   {id:'todo',label:'To-do',icon:'check',count:42}]},
 {id:'queries',label:'Queries',icon:'send',items:[
   {id:'q-centre',label:'Query Centre',icon:'send'},
   {id:'q-analytics',label:'Analytics',icon:'chart'}]},
 {id:'agents',label:'Agents',icon:'people',items:[
   {id:'a-list',label:'Contact list',icon:'people'},
   {id:'a-disc',label:'Discover',icon:'compass'}]},
 {id:'materials',label:'Materials',icon:'folder',items:[
   {id:'m-pkg',label:'Submission packages',icon:'folder'}]}
];
let active='dash';
const nav=document.getElementById('nav'),railnav=document.getElementById('railnav'),
      fly=document.getElementById('fly'),rail=document.getElementById('rail'),
      crumb=document.getElementById('crumb'),wtitle=document.getElementById('wtitle'),wsub=document.getElementById('wsub');
const el={items:{},ris:{}};
const closed=()=>document.body.classList.contains('closed');
const groupOf=id=>GROUPS.find(g=>g.items.some(i=>i.id===id));
const itemOf=id=>GROUPS.flatMap(g=>g.items).find(i=>i.id===id);
const chip=n=>`<span class="ct"><span class="dot"></span>${n}</span>`;

GROUPS.forEach((g,gi)=>{
  const lb=document.createElement('div');
  lb.className='glabel'+(gi===0?' first':'');lb.textContent=g.label;nav.appendChild(lb);
  g.items.forEach(it=>{
    const r=document.createElement('div');r.className='ni';r.tabIndex=0;
    r.innerHTML=`<svg class="ic" viewBox="0 0 24 24">${IC[it.icon]}</svg>${it.label}${it.count?chip(it.count):''}`;
    r.onclick=()=>{active=it.id;closeFly();update()};
    r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();active=it.id;update()}};
    nav.appendChild(r);el.items[it.id]=r;
  });

  const ri=document.createElement('div');ri.className='ri';ri.tabIndex=0;
  ri.innerHTML=`<svg viewBox="0 0 24 24">${IC[g.icon]}</svg>${g.items.some(i=>i.count)?'<span class="bdg"></span>':''}`;
  ri.onclick=()=>{
    if(closed()){active=groupOf(active)===g&&itemOf(active)?active:g.items[0].id;
      closeFly();document.body.classList.remove('closed');update();return}
    if(groupOf(active)===g){document.body.classList.add('closed');closeFly();update();return}
    active=g.items[0].id;update();
  };
  ri.onmouseenter=()=>{if(!closed())return;clearTimeout(gT);
    if(fly.classList.contains('show'))openFly(g);else fT=setTimeout(()=>openFly(g),120)};
  ri.onmouseleave=()=>{clearTimeout(fT);if(closed())scheduleFlyClose()};
  railnav.appendChild(ri);el.ris[g.id]=ri;
});

let fT=null,gT=null;
function openFly(g){
  if(fly.classList.contains('show')&&fly.dataset.g===g.id)return;
  fly.dataset.g=g.id;
  fly.innerHTML=`<div class="fh">${g.label}</div>`+g.items.map(i=>
    `<div class="fi${active===i.id?' on':''}" data-i="${i.id}">${i.label}${i.count?chip(i.count):''}</div>`).join('');
  fly.querySelectorAll('.fi').forEach(f=>f.onclick=e=>{e.stopPropagation();
    active=f.dataset.i;closeFly();document.body.classList.remove('closed');update()});
  const r=el.ris[g.id].getBoundingClientRect(),rr=rail.getBoundingClientRect();
  fly.style.top=(r.top-rr.top)+'px';
  fly.classList.add('show');document.body.classList.add('flyopen');
}
function closeFly(){fly.classList.remove('show');document.body.classList.remove('flyopen')}
function scheduleFlyClose(){clearTimeout(gT);gT=setTimeout(closeFly,160)}
fly.onmouseenter=()=>clearTimeout(gT);
fly.onmouseleave=scheduleFlyClose;

function toggleCollapse(){closeFly();document.body.classList.toggle('closed');update()}
document.getElementById('collapseBtn').onclick=toggleCollapse;
document.getElementById('expandBtn').onclick=toggleCollapse;
document.getElementById('logoTile').onclick=()=>{active='dash';if(closed())document.body.classList.remove('closed');closeFly();update()};
document.getElementById('logoHome').onclick=()=>{active='dash';closeFly();update()};

const pal2=document.getElementById('pal2'),searchBtn=document.getElementById('searchBtn');
function togglePal(open){pal2.classList.toggle('show',open===undefined?!pal2.classList.contains('show'):open);
  if(pal2.classList.contains('show'))pal2.querySelector('input').focus()}
searchBtn.onclick=e=>{e.stopPropagation();togglePal()};
pal2.onclick=e=>e.stopPropagation();
document.addEventListener('click',e=>{if(!rail.contains(e.target))closeFly();togglePal(false)});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();togglePal();return}
  if(e.key==='Escape'){togglePal(false);closeFly();return}
  if(e.key==='['&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))toggleCollapse();
});

function update(){
  Object.entries(el.items).forEach(([id,r])=>r.classList.toggle('on',id===active));
  const g=groupOf(active),it=itemOf(active);
  GROUPS.forEach(x=>{el.ris[x.id].classList.toggle('on',x===g);
    el.ris[x.id].dataset.tip=x.label+' · '+x.items.map(i=>i.label).join(', ')});
  crumb.innerHTML=g.items.length>1
    ? `<span class="seg" id="cs">${g.label}</span> <span class="sep">/</span> <span class="cur">${it.label}</span>`
    : `<span class="cur">${it.label}</span>`;
  const cs=document.getElementById('cs');
  if(cs)cs.onclick=()=>{active=g.items[0].id;update()};
  wtitle.textContent=it.label;
  wsub.textContent=it.id==='dash'?'Everything at a glance':'';
  if(fly.classList.contains('show'))fly.querySelectorAll('.fi').forEach(f=>f.classList.toggle('on',f.dataset.i===active));
}
update();
</script>
