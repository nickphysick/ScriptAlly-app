<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8">
<title>ScriptAlly — how the toolbar behaves</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{
  --white:#fff;--content:#fefcfa;--paper:#faf6f0;--ground:#f7f4ee;
  --wash-a:#f5efe6;--wash-b:#f9f5ee;
  --burg:#7c3a2a;--ink:#3a1c14;--ink2:#311e19;
  --edge:#e4ddd1;--rim:#e9e1d4;--hair:#e8e2d8;--pink:#f5e2da;--pinkb:#e8c8bc;
  --sage-a:#d7ddd5;--sage-b:#d5dbd3;
  --work-max:1240px;--mast-gutter:35px;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:#e9e4dc;font-family:'Inter',sans-serif;color:var(--ink);padding:15px 18px 34px}
 .bar{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
 .lab{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:#7d7267;margin:0 4px 0 10px}
 .tab{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:6px 10px;border:1px solid #cfc6b8;border-radius:7px;background:#f4efe7;cursor:pointer;color:var(--ink)}
 .tab.on{background:var(--ink);color:#fdfaf5;border-color:var(--ink)}
 .rd{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:#8a7a70;margin:0 2px 8px}
 .rd b{color:var(--burg)}
 .note{font-size:12.5px;color:#5d5048;margin:0 2px 11px;max-width:1180px;line-height:1.65;min-height:58px}
 .note b{color:var(--ink)} .note em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.11em;color:#8a7a70}

 .shell{display:flex;width:100%;background:var(--ground);border-radius:13px;overflow:hidden;height:560px;
        box-shadow:0 2px 6px rgba(58,28,20,.08),0 14px 34px rgba(58,28,20,.10)}
 .side{flex:0 0 168px;background:#fff;border-right:1px solid var(--hair)}
 .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
 .topbar{display:flex;align-items:center;gap:11px;padding:0 15px;background:#fff;border-bottom:1px solid var(--hair);height:50px;flex:0 0 auto}
 .topbar .brand{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;line-height:1.3}
 .topbar .crumb{font-size:12.5px;color:#6b5a51;line-height:1.3}
 .topbar .crumb b{color:var(--ink);font-weight:600}
 .window{background:var(--content);border:1px solid var(--edge);border-radius:14px 14px 0 0;margin:10px 12px 0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
 .scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
 .mm{width:100%;max-width:var(--work-max);margin-inline:auto;padding-inline:var(--mast-gutter)}

 .chrome{position:sticky;top:0;z-index:20;transition:transform .24s cubic-bezier(.4,0,.2,1)}
 .mast{background-color:var(--wash-b);background-image:linear-gradient(180deg,var(--wash-a),var(--wash-b))}
 .mastin{display:flex;align-items:center;gap:18px;padding:28px 0 22px;transition:padding .22s}
 body.settled .mastin{padding:12px 0 10px}
 .mk{flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center;transition:all .22s}
 .mk svg{width:36px;height:36px;stroke:var(--burg);fill:none;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;transition:all .22s}
 body.settled .mk{flex-basis:32px;width:32px;height:32px}
 body.settled .mk svg{width:23px;height:23px}
 .mtx h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;line-height:1.3;color:var(--ink2);transition:font-size .22s}
 body.settled .mtx h1{font-size:21px}
 .mtx p{font-size:13.5px;color:#8a7a70;margin-top:3px;line-height:1.45;transition:opacity .16s,max-height .22s,margin .22s;max-height:24px;overflow:hidden}
 body.settled .mtx p{opacity:0;max-height:0;margin-top:0}
 .msp{flex:1;display:none}
 .inline{display:none;align-items:center;gap:8px}

 .tools{background:var(--content);overflow:hidden;transition:max-height .22s cubic-bezier(.4,0,.2,1),opacity .16s}
 .toolsin{display:flex;align-items:center;gap:9px;padding:13px 0}
 .cnt{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;white-space:nowrap}
 .cnt i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.12em;color:#a2968c;margin-left:9px}
 .sp{flex:1}
 .cbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #e2d8ca;
       background:var(--white);color:#4d3b33;font-size:12px;font-weight:500;white-space:nowrap}
 .cbtn.dark{background:#3a2118;border-color:#3a2118;color:#fdfaf5;font-weight:600}
 .baserule{height:1px;background:var(--rim)}
 body.stuck .chrome{box-shadow:0 12px 16px -13px rgba(58,28,20,.18)}

 /* B - merge into the settled title row */
 body[data-v="b"].settled .tools{max-height:0;opacity:0}
 body[data-v="b"].settled .msp{display:block}
 body[data-v="b"].settled .inline{display:flex}

 /* C - toolbar retracts on scroll down, returns on scroll up */
 body[data-v="c"].down .tools{max-height:0;opacity:0}
 body[data-v="c"] .tools{max-height:60px}

 /* D - masthead leaves entirely, toolbar pins alone */
 body[data-v="d"] .mast{position:static}
 body[data-v="d"] .chrome{position:static}
 body[data-v="d"] .tools{position:sticky;top:0;z-index:20}
 body[data-v="d"].stuck .tools{box-shadow:0 12px 16px -13px rgba(58,28,20,.18)}
 body[data-v="d"] .baserule{display:none}
 body[data-v="d"].settled .mastin{padding:28px 0 22px}
 body[data-v="d"].settled .mk{flex-basis:52px;width:52px;height:52px}
 body[data-v="d"].settled .mk svg{width:36px;height:36px}
 body[data-v="d"].settled .mtx h1{font-size:30px}
 body[data-v="d"].settled .mtx p{opacity:1;max-height:24px;margin-top:3px}

 .work{padding:20px 0 28px}
 .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 .cd{border:1px solid var(--rim);border-radius:13px;background:var(--white);box-shadow:0 1px 2px rgba(58,28,20,.04);overflow:hidden}
 .cdh{background:linear-gradient(180deg,var(--sage-a),var(--sage-b));padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.11em;color:#3f4c3c}
 .cdb{padding:14px}
 .cdb b{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;display:block}
 .cdb i{font-family:'Playfair Display',serif;font-style:italic;font-size:12.5px;color:#6b5a51}
</style></head><body data-v="a">

<div class="bar">
 <span class="lab" style="margin-left:0">TOOLBAR BEHAVIOUR</span>
 <button class="tab on" data-v="a">A &middot; TRAVELS, UNCHANGED</button>
 <button class="tab" data-v="b">B &middot; MERGES INTO THE TITLE ROW</button>
 <button class="tab" data-v="c">C &middot; RETRACTS GOING DOWN</button>
 <button class="tab" data-v="d">D &middot; PINS ALONE, MASTHEAD LEAVES</button>
</div>
<div class="rd" id="rd">pinned chrome height: <b>—</b></div>
<div class="note" id="note"></div>

<div class="shell">
 <aside class="side"></aside>
 <div class="main">
  <div class="topbar"><span class="brand">ScriptAlly</span>
    <span class="crumb">ScriptAlly&nbsp; / &nbsp;Agents&nbsp; / &nbsp;<b>Contact list</b></span></div>
  <div class="window">
   <div class="scroll" id="sc">

    <div class="chrome" id="chrome">
      <div class="mast">
        <div class="mm"><div class="mastin">
          <span class="mk"><svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M19 8h4M21 6v4"/></svg></span>
          <div class="mtx"><h1>Contact list</h1><p>Everyone you're querying, watching, or saving for later.</p></div>
          <span class="msp"></span>
          <span class="inline">
            <span class="cbtn">Filters</span><span class="cbtn">Group</span><span class="cbtn">Sort</span>
            <span class="cbtn dark">&#65291; Add new agent</span>
          </span>
        </div></div>
      </div>
      <div class="tools" id="tools">
        <div class="mm"><div class="toolsin">
          <span class="cnt">16 agents<i>4 WITH LIVE QUERIES</i></span><span class="sp"></span>
          <span class="cbtn">Filters</span><span class="cbtn">Group</span><span class="cbtn">Sort</span>
          <span class="cbtn dark">&#65291; Add new agent</span>
        </div></div>
      </div>
      <div class="baserule"></div>
    </div>

    <div class="mm"><div class="work"><div class="g3" id="g3"></div></div></div>

   </div>
  </div>
 </div>
</div>

<script>
try{
const AG=[["Penhallow Literary","Agent not specified"],["Aisha Kapoor","The Lantern Agency"],["Daniel O'Rourke","Inkwell & Stone"],
["Eleanor Whitfield","Greenfield Literary"],["Fenella Str","Brightwater Books"],["Greg Panetta","Marlowe Literary"],
["Priya Raman","No agency"],["Marcus Reed","Hartley & Co"],["Nina Alvarez","Redgate Books"],["Tom Ellery","Curtis Vane"],
["Sophie Dunn","Curtis Vane"],["Ada Mensah","Copperline Agency"],["Rae Chowdhury","Sable & Finch"],["Ben Iyer","Halloway Lit"],
["Cara Boyne","Two Rivers"]];
document.getElementById('g3').innerHTML=AG.map(([n,a])=>`<div class="cd"><div class="cdh">ACTIVE QUERIES</div>
 <div class="cdb"><b>${n}</b><i>${a}</i></div></div>`).join('');

const N={
a:"<b>A &middot; Travels, unchanged.</b> What the spec says now: the toolbar rides with the settled masthead, same size, same ground. Simple and predictable &mdash; but two stacked rows is the most permanent chrome of any option, and the toolbar is the part that never earns its height back.",
b:"<b>B &middot; Merges into the title row.</b> Once settled, the controls move up beside the title and the toolbar row disappears &mdash; one row of chrome instead of two. <em>WHO</em> Linear, Height, Superhuman. Makes the settle earn its keep: the header doesn't just shrink, it <b>absorbs the tools</b>. The count is the one casualty &mdash; it drops on settle, or moves inline if it fits.",
c:"<b>C &middot; Retracts going down, returns going up.</b> Reading downward, the toolbar folds away and only the settled masthead stays; the moment you scroll up it comes back. <em>WHO</em> Medium, iOS Safari, Google Docs' mobile bar. Maximum reading room, and the tools appear exactly when you reach for them &mdash; but chrome that moves on direction can feel restless on a short list.",
d:"<b>D &middot; The masthead leaves, the toolbar pins alone.</b> The original design before the slab: full masthead at rest, gone once you scroll, toolbar holding the top by itself. Least chrome of all, and no settle to build. The cost is that the page loses its name and its picture the moment you start working."};
const sc=document.getElementById('sc'), chrome=document.getElementById('chrome'), rd=document.getElementById('rd'), note=document.getElementById('note');
let last=0;
function report(){requestAnimationFrame(()=>{
 const h=(document.body.dataset.v==='d')?document.getElementById('tools').getBoundingClientRect().height:chrome.getBoundingClientRect().height;
 rd.innerHTML='pinned chrome height: <b>'+Math.round(h)+'px</b>';});}
sc.addEventListener('scroll',()=>{
 const y=sc.scrollTop;
 document.body.classList.toggle('settled',y>4);
 document.body.classList.toggle('stuck',y>4);
 if(document.body.dataset.v==='c') document.body.classList.toggle('down', y>last && y>60);
 last=y; report();});
document.querySelectorAll('.tab[data-v]').forEach(b=>b.onclick=()=>{
 document.body.dataset.v=b.dataset.v; document.body.classList.remove('down');
 document.querySelectorAll('.tab[data-v]').forEach(x=>x.classList.toggle('on',x===b));
 note.innerHTML=N[b.dataset.v]; report();});
note.innerHTML=N.a; report();
}catch(e){console.error('mockup:',e)}
</script></body></html>
