:root{
  --shell:#1b2433;--navy:#2d3a50;--page:#f5f1eb;--card:#fff;
  --ink:#1c130f;--ink2:#3b322c;--muted:#7d7067;--faint:#a39a91;
  --hair:#ebe4da;--fill:#f1ece4;--blush:#f6e9e3;--rose:#a0675a;
  --req:#e7ebf2;--offer:#f6edd9;
  --type:'Special Elite','Courier New',monospace;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--shell);font:16px/1.5 var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit}
.T{font-family:var(--type);font-weight:400}
.gl{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sd{fill:none;stroke:currentColor;stroke-width:2}

/* shell (stand-in) */
.rail{position:fixed;inset:0 auto 0 0;width:68px;background:var(--shell);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail img{width:38px;margin-bottom:16px}.rail i{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.05)}.rail i.on{background:rgba(255,255,255,.15)}
.rail .me{margin-top:auto;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#f4eee5;display:grid;place-items:center;font:600 12px var(--serif)}
.tbar{position:fixed;top:0;left:68px;right:0;height:64px;background:var(--shell);display:flex;align-items:flex-end;padding:0 20px 0 12px;z-index:5}
.ftab{background:var(--page);border-radius:12px 12px 0 0;padding:12px 26px 14px;font:400 22px var(--type)}
.tbar .r{margin-left:auto;align-self:center;display:flex;gap:10px}
.srch{width:200px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);color:rgba(244,238,229,.55);display:flex;align-items:center;padding:0 12px;font-size:15px}
.help{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#f4eee5;font-weight:600}
.page{margin-left:68px;padding-top:64px}
.sheet{background:var(--page);border-radius:0 18px 0 0;min-height:calc(100vh - 64px);padding:28px 32px 48px}
.wrap{max-width:1360px;margin:0 auto}

/* heading */
.head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head .k{font:15px var(--serif);color:var(--muted)}
.head .k b{font-weight:600;color:var(--rose)}
.head h1{margin:4px 0 0;font:400 38px/1.05 var(--type);letter-spacing:-.01em}
.head .acts{margin-left:auto;display:flex;gap:8px}
.btn{height:40px;padding:0 16px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font:600 15px var(--serif);background:#fff;box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.btn svg{width:16px;height:16px}a.btn{text-decoration:none;color:inherit}a.btn.pri{color:#fff}
.btn.pri{background:var(--navy);color:#fff;box-shadow:none}

/* founding banner */
.fnote{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;margin:22px 0 26px;padding:16px 22px 16px 16px;border-radius:16px;background:linear-gradient(100deg,#f7e8e1 0%,#f9efe9 60%,#fbf4ef 100%);box-shadow:inset 0 0 0 1px #f0dcd3}
.fn-badge{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(160,103,90,.15);position:relative}
.fn-badge img{width:36px;height:36px}
.fn-badge small{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;border-radius:999px;padding:1px 8px;font:600 10.5px var(--serif);white-space:nowrap}
.fn-tx h3{margin:0;font:400 20px/1.2 var(--type)}
.fn-tx p{margin:3px 0 0;font:14.5px/1.45 var(--serif);color:var(--ink2)}
.fn-road{display:flex;align-items:center;gap:6px;margin-top:9px;font:12.5px var(--serif);color:var(--muted)}
.fn-road span{display:inline-flex;align-items:center;gap:6px}
.fn-road i{width:8px;height:8px;border-radius:50%;background:#e6cfc6}
.fn-road .on{color:var(--rose);font-weight:600}.fn-road .on i{background:var(--rose);box-shadow:0 0 0 3px #f1d9cf}
.fn-road em{width:18px;height:1px;background:#e2c9bf}
.fn-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fn-act small{font:13px var(--serif);color:var(--muted)}
.fn-btns{display:flex;gap:6px}
.fn-btns button{height:36px;padding:0 14px;border-radius:10px;background:#fff;display:inline-flex;align-items:center;gap:7px;font:600 14px var(--serif);color:var(--ink);box-shadow:0 1px 2px rgba(28,19,15,.06),inset 0 0 0 1px #efdcd4}
.fn-btns button:hover{box-shadow:0 2px 6px rgba(28,19,15,.1),inset 0 0 0 1px #e4c7bb}
.fn-btns svg{width:15px;height:15px;color:var(--rose)}
/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.main{display:grid;gap:20px;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* cards — one style everywhere */
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(28,19,15,.04),0 4px 14px rgba(28,19,15,.05)}
.ch{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.ch h2{margin:0;font:400 20px var(--type)}
.ch .r{margin-left:auto;font:14px var(--serif);color:var(--muted)}
.ch .r a{font-weight:600;color:var(--ink);text-decoration:none}
.cb{padding:14px 22px 20px}

/* next up */
.nup{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--fill)}
.nup .ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#6b625a}
.nup .t{flex:1;min-width:0}
.nup .t b{display:block;font:600 17px/1.3 var(--serif)}
.nup .t span{font:14.5px var(--serif);color:var(--muted)}
.nup .t span em{font-style:normal;color:var(--rose);font-weight:600}
.later{list-style:none;margin:10px 0 0;padding:0}
.later li{display:flex;align-items:center;gap:14px;padding:10px 18px;font:15px var(--serif);color:var(--ink2)}
.later li+li{border-top:1px solid var(--hair)}
.later li .sd{color:var(--faint)}
.later li time{margin-left:auto;font:14px var(--serif);color:var(--muted)}

/* pipeline (the one dark card) */
.pipe{background:var(--navy);color:#fffaf3;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(27,36,51,.16)}
.pipe .ch h2{color:#fffaf3}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-left:auto}
.seg button{height:30px;padding:0 14px;border-radius:999px;font:600 13.5px var(--serif);color:rgba(255,250,243,.75)}
.seg button[aria-pressed="true"]{background:#fffaf3;color:var(--ink)}
.nums{display:flex;gap:40px;padding:14px 22px 0}
.nums b{display:block;font:400 30px/1 var(--type)}
.nums span{font:14px var(--serif);color:rgba(244,238,229,.7)}
.plot{position:relative;height:230px;margin-top:6px}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.plot .hk{position:absolute;right:18px;bottom:0;height:200px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.axis{position:absolute;left:22px;right:210px;bottom:10px;z-index:2;color:rgba(255,250,243,.75)!important;display:flex;justify-content:space-between;font:12.5px var(--serif);color:rgba(244,238,229,.5)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;color:#fffaf3}
.pin .g{width:22px;height:22px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.pin i{width:1.5px;height:16px;background:rgba(255,250,243,.55)}
.closedv{display:flex;align-items:center;justify-content:center;gap:36px;height:100%;padding-bottom:20px}

/* rings */
.ringrow{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 30px/1 var(--type)}
.ring div small{font:12.5px var(--serif);color:var(--muted);margin-top:4px}
.ring img{position:absolute;inset:14px;width:82px;height:82px;object-fit:contain}
.key{display:grid;gap:7px;font:15px var(--serif)}
.key div{display:flex;align-items:center;gap:10px}
.key i{width:10px;height:10px;border-radius:3px;flex:none}
.key b{font:400 19px var(--type);min-width:22px}
.key a{font-weight:600;font-size:14.5px;margin-top:4px;text-decoration:none}

/* feed, as designed */
.feed{position:sticky;top:88px;height:calc(100vh - 112px);display:flex;flex-direction:column;min-width:0}
.fsw{display:flex;background:var(--fill);border-radius:999px;padding:3px;margin-bottom:10px;flex:none}
.fsw button{flex:1;height:32px;border-radius:999px;font:600 14px var(--serif);color:var(--ink2)}
.fsw button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,19,15,.12)}
.fscroll{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px 8px;mask-image:linear-gradient(#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.day{display:flex;align-items:baseline;gap:8px;margin:12px 2px 8px;font:600 14px var(--serif)}
.day:first-child{margin-top:2px}
.day span{color:var(--muted);font-weight:400}
.day::after{content:"";flex:1;height:1px;background:#ddd5ca;transform:translateY(-4px)}
.entry{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,19,15,.07);padding:16px 16px 14px;margin-bottom:10px}
.eh{display:flex;gap:11px;align-items:center}
.disc{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 13px var(--serif);flex:none}
.disc.me{background:#8a4a3c}
.eh b{display:block;font:600 15.5px var(--serif)}
.eh small{display:block;font:13px var(--serif);color:var(--muted)}
.et{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.et .ico{width:24px;flex:none;display:grid;place-items:center}
.et h3{margin:0;font:400 21px/1.2 var(--type)}
.figs{display:flex;margin-left:34px}
.figs div{padding-right:14px;margin-right:14px;border-right:1px solid var(--hair2)}
.figs div:last-child{border:0;margin-right:0}
.figs small{display:block;font:12.5px var(--serif);color:var(--muted)}
.figs b{display:block;font:400 19px var(--type);margin-top:1px}
.journey{margin-top:12px;border-radius:10px;background:var(--t,#fdfaf5);padding:14px 14px 10px}
.trk{display:flex}
.trk .s{flex:1;position:relative;min-width:0}
.trk .s .d{position:relative;z-index:1;width:18px;height:18px;display:block}
.trk .s .d svg{width:18px;height:18px;background:var(--t,#fdfaf5);border-radius:50%}

.fw3-btns button{height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 14.5px var(--serif);background:#fff;box-shadow:inset 0 0 0 1px #e8d7cf;color:var(--ink)}
.fw3-btns button:hover{background:#fbefe9;box-shadow:inset 0 0 0 1px #d9b8ab}
.fw3-btns svg{width:16px;height:16px;color:var(--rose)}
.fw3-note{display:flex;align-items:center;gap:10px;margin:0 24px 16px;padding:11px 14px;border-radius:12px;background:#f8f4ef;font:14px var(--serif)}
.fw3-note .tg{font:600 12.5px var(--serif);color:var(--rose);white-space:nowrap}
.fw3-note .q{flex:1;min-width:0;font-style:italic;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw3-note .st{flex:none;font:600 12px var(--serif);color:#3f5a46;background:#e4ece4;border-radius:999px;padding:3px 9px}
.fw3-f{padding:11px 24px;background:#fbf4ef;border-top:1px solid #f0e6df;font:13.5px var(--serif);color:var(--rose);text-align:center}
@media (max-width:1320px){.fw3-hero{grid-template-columns:104px 1fr;gap:16px;padding:18px}.fw3-badge{width:104px;height:104px}.fw3-art{inset:11px}.fw3-ask,.fw3-f{padding-left:18px;padding-right:18px}.fw3-note{margin:0 18px 14px}}
</style>

const WK=['27 Jul','3 Aug','10 Aug','17 Aug','24 Aug','31 Aug','7 Sep','14 Sep','21 Sep','28 Sep','5 Oct','12 Oct','19 Oct','26 Oct','2 Nov'];
const VV=[12,13,16,17,17,17,17,17,17,18,18,18,18,18,18];let LM='B',FM='smart';const OPEN=new Set();
const BR=VV.map((n,i)=>{const f=Math.min(3,Math.floor(i/4)),p=i>3?1:0,u=i>4&&i<9?1:0;return [Math.max(0,n-f-p-u),p,f,u]});
const BK=[['Queried','#2d3a50'],['Partial out','#8592a8'],['Full out','#c9d1dd'],['Stage not dated','#dcd6cc']];
function draw(){const box=document.getElementById('plot');if(!box)return;
 const V=VV,cv=box.querySelector('canvas'),dpr=devicePixelRatio||1,W=box.clientWidth,H=box.clientHeight;
 if(!W||!H)return;cv.width=W*dpr;cv.height=H*dpr;const k=cv.getContext('2d');k.scale(dpr,dpr);
 const mx=Math.max(...V)*1.35,x0=22,x1=W-22,top=30,bot=H-34,X=i=>x0+i*(x1-x0)/(V.length-1),Y=n=>bot-(n/mx)*(bot-top),P=V.map((n,i)=>[X(i),Y(n)]);
 const step=LM==='D';
 const path=()=>{k.lineTo(...P[0]);for(let i=1;i<P.length;i++){const[a,b]=P[i-1],[c,e]=P[i];if(step){k.lineTo(c,b);k.lineTo(c,e);}else{const m=(a+c)/2;k.bezierCurveTo(m,b,m,e,c,e);}}};
 k.beginPath();k.moveTo(0,H);k.lineTo(0,P[0][1]);path();k.lineTo(W,P.at(-1)[1]);k.lineTo(W,H);k.closePath();
 const gr=k.createLinearGradient(0,top,0,H);gr.addColorStop(0,'rgba(45,58,80,.92)');gr.addColorStop(1,'rgba(45,58,80,.5)');k.fillStyle=gr;k.fill();
 k.beginPath();k.moveTo(0,P[0][1]);path();k.lineTo(W,P.at(-1)[1]);k.strokeStyle='#1c130f';k.lineWidth=2.2;k.stroke();
 const last=P.length-1,chg=i=>i===0||V[i]!==V[i-1];
 let h=`<i class="vline" id="vline" hidden></i>`;
 P.forEach(([x,y],i)=>{const now=i===last,lab=`aria-label="Week of ${WK[i]}: ${V[i]} active queries"`;
  if(LM==='A'){h+=(chg(i)||now)?`<button class="wk${now?' now':''}" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}>${V[i]}</button>`:`<button class="dot" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}></button>`;}
  else if(LM==='B'){h+=now?`<button class="wk now big" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}>${V[i]}</button>`:`<button class="dot" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}></button>`;}
  else if(LM==='C'){h+=`<button class="lab${now?' now':''}" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}><span>${(chg(i)||now)?V[i]:''}</span></button>`;}
  else if(LM==='D'){h+=(chg(i)||now)?`<button class="flag${now?' now':''}" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}><span>${chg(i)&&i?'+'+(V[i]-V[i-1]):V[i]}</span></button>`:`<button class="hit" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}></button>`;}
  else {h+=`<button class="hit" data-i="${i}" style="left:${x}px;top:${y}px" ${lab}></button>`;}
 });
 if(LM==='E'){const[x,y]=P[last];h+=`<span class="endlab" style="left:${x}px;top:${y}px"><b>${V[last]}</b>now</span><span class="startlab" style="left:${P[0][0]}px;top:${P[0][1]}px">${V[0]}</span>`;}
 box.querySelector('.pins').innerHTML=h;
 box.querySelectorAll('[data-i]').forEach(b=>{b.onmouseenter=b.onfocus=()=>tip(+b.dataset.i,b);b.onmouseleave=b.onblur=hideTip;});
 if(LM==='E'){box.onmousemove=e=>{const r=box.getBoundingClientRect();const i=Math.max(0,Math.min(last,Math.round((e.clientX-r.left-x0)/((x1-x0)/last))));const b=box.querySelector(`[data-i="${i}"]`);tip(i,b);};box.onmouseleave=hideTip;}else{box.onmousemove=null;box.onmouseleave=null;}
}
function tip(i,b){const t=document.getElementById('wtip'),r=b.getBoundingClientRect(),v=document.getElementById('vline'),pr=b.parentElement.getBoundingClientRect();
 const ch=i?VV[i]-VV[i-1]:0,tot=VV[i];
 t.innerHTML=`<small>Week of</small><b class="dt">${WK[i]}</b><div class="big"><b>${tot}</b><span>active<br>queries</span><em>${ch===0?'no change':(ch>0?'+':'')+ch+' on last week'}</em></div>
  <div class="bar">${BR[i].map((n,j)=>n?`<i style="flex:${n};background:${BK[j][1]}"></i>`:'').join('')}</div>
  <ul>${BR[i].map((n,j)=>n?`<li><i style="background:${BK[j][1]}"></i>${BK[j][0]}<b>${n}</b></li>`:'').join('')}</ul>`;
 t.hidden=false;const tw=t.offsetWidth,th=t.offsetHeight;let x=r.left+r.width/2+14;if(x+tw>innerWidth-12)x=r.left-tw-14;let y=Math.max(12,Math.min(r.top-th/2,innerHeight-th-12));
 t.style.left=x+'px';t.style.top=y+'px';v.style.left=(r.left+r.width/2-pr.left)+'px';v.hidden=false;}
function hideTip(){document.getElementById('wtip').hidden=true;const v=document.getElementById('vline');if(v)v.hidden=true;}
addEventListener('resize',draw);
[].slice.call([]).forEach(b=>b.onclick=()=>{FM=b.dataset.v;OPEN.clear();document.querySelectorAll('#fm button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
