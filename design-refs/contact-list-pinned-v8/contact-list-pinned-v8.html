<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Contact list v8 — Query Centre layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --sp-type:"Special Elite","Courier New",Courier,monospace;
  --sp-serif:"Source Serif 4",Georgia,serif;
  --ink:#1c130f; --mut:#5b4f47; --faint:#8a8076; --navy:#2a3a52; --page:#f2eee8; --cream:#f4eee5;
}
*{box-sizing:border-box}
body{margin:0;background:#1f2b3d;font-family:var(--sp-serif);color:var(--ink)}
button{font:inherit;color:inherit}

/* ── the option switcher (mock chrome, not app) ── */
.sw{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e3d5c9;padding:12px 20px 12px;display:flex;flex-direction:column;gap:8px}
.sw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw-row b{font:400 17px/1 var(--sp-type);margin-right:10px}
.sw button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#faf7f2;box-shadow:inset 0 0 0 1px #e9e0d4;font:400 14.5px/1 var(--sp-serif)}
.sw button:hover{box-shadow:inset 0 0 0 1px #d6cabb;background:#fff}
.sw button.on{background:var(--navy);color:var(--cream);box-shadow:none}
.sw-note{font:400 14.5px/1.45 var(--sp-serif);color:var(--mut);max-width:1100px}
.sw-note em{color:var(--ink);font-style:normal;font-weight:600}

/* ── app shell ── */
.app{display:grid;grid-template-columns:56px 1fr;min-height:calc(100vh - 90px)}
.nav{background:#1f2b3d;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 0;color:#b9c2cf;font:400 11px/1.2 var(--sp-serif)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:5px}
.nav span.on{color:#fff}
.nav i{display:block;width:22px;height:18px;border:1.6px solid currentColor;border-radius:5px}
.main{padding:8px 12px 12px 0}
.tabs{display:flex;gap:6px;padding-left:2px}
.tabs span{padding:10px 18px 9px;border-radius:12px 12px 0 0;font:400 16px/1 var(--sp-type);color:#c9d0da;background:#2a3a52}
.tabs span.on{background:var(--page);color:var(--ink)}
.ws{background:var(--page);border-radius:0 16px 16px 16px;padding:22px 26px 40px;min-height:900px}

/* header (as built, simplified) */
.hd{display:grid;grid-template-columns:240px 1fr auto;align-items:center;gap:20px;margin-bottom:24px}
.hd img{width:150px;transform:scaleX(-1);display:block;margin-left:20px}
.hd h1{margin:0;font:400 38px/1.1 var(--sp-type)}
.hd p{margin:8px 0 18px;font:italic 400 17px/1.3 var(--sp-serif);color:var(--mut)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:42px;padding:0 20px;border-radius:10px;background:var(--navy);color:#fff;font:400 16px/1 var(--sp-type)}
.lh{display:flex;align-items:center;gap:18px;margin-right:30px}
.lh svg{width:96px;height:96px}
.lh b{display:block;font:400 21px/1.2 var(--sp-type)}
.lh small{display:block;margin:4px 0 10px;font:italic 400 14px/1.2 var(--sp-serif);color:var(--mut)}
.lh small em{color:#b25a43;font-style:normal}
.lh .ghost{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--navy);font:400 14px/1 var(--sp-type)}

.body{display:grid;grid-template-columns:272px minmax(0,1fr);gap:22px;align-items:start}
.body.norail{grid-template-columns:minmax(0,1fr)}

/* ── the rail, as built (qc153 / qc1533 / clp) ── */
.rail{position:sticky;top:104px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #e3d5c9,0 1px 2px rgba(28,19,15,.06),0 18px 36px -24px rgba(28,19,15,.3);overflow:hidden}
.rbd{display:flex;align-items:baseline;gap:10px;padding:14px 16px 12px;background:#fff;box-shadow:inset 0 -2px 0 var(--navy)}
.rbd b{font:400 20px/1.3 var(--sp-type)}
.ron{font:400 13px/1 var(--sp-serif);color:var(--mut)}
.rst{all:unset;margin-left:auto;cursor:pointer;font:600 13.5px/1 var(--sp-serif);text-decoration:underline;text-underline-offset:3px}
.rst:disabled{opacity:.35;cursor:default;text-decoration:none}
.rsec{border-top:1px solid #f1ebe2}
.rbd+.rsec,.rbd+.apo{border-top:0}
.rh5{all:unset;cursor:pointer;display:flex;width:100%;box-sizing:border-box;justify-content:space-between;align-items:center;padding:13px 16px 8px;font:400 15px/1.2 var(--sp-type)}
.rh5 i{color:#8a8076;font-style:normal;font-size:11px}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.pill{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 12px;border-radius:999px;background:#faf7f2;box-shadow:inset 0 0 0 1px #e9e0d4;font:400 14px/1.25 var(--sp-serif)}
.pill .n{font:400 12.5px/1 var(--sp-type);color:var(--mut)}
.pill:hover:not(.on){background:#fff;box-shadow:inset 0 0 0 1px #d6cabb}
.pill.on{background:var(--navy);color:var(--cream);box-shadow:none}
.pill.on .n{color:rgba(244,238,229,.75)}
.pill.hit:not(.on){background:#e3e8ef;box-shadow:none}
.zero{opacity:.45;pointer-events:none}
.courts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 14px}
.court{all:unset;cursor:pointer;border-radius:12px;padding:10px 11px 9px}
.court b{display:block;font:400 20px/1 var(--sp-type)}
.court span{display:block;margin-top:4px;font:400 12.5px/1.25 var(--sp-serif);color:var(--mut)}
.court[data-k=you]{background:#ecd6d2}.court[data-k=agent]{background:#efe7da}.court[data-k=none]{background:#f3efe9}
.court[data-k=closed]{background:repeating-linear-gradient(135deg,#f3f0eb 0 6px,#ebe6df 6px 8px)}
.court.on{background:var(--navy)!important;color:var(--cream)}.court.on span{color:rgba(244,238,229,.78)}
.swr{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:4px 16px 14px;font:400 14.5px/1.3 var(--sp-serif)}
.swr .tx{flex:1}.swr .n{font:400 13.5px/1 var(--sp-type);color:var(--faint)}
.tog{width:34px;height:20px;border-radius:999px;background:#d9d0c5;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.on .tog,.tog.on{background:var(--navy)}.on .tog::after,.tog.on::after{transform:translateX(14px)}
.mf{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;min-height:40px;padding:10px 14px;border-top:1px solid #efe8de;font:600 14px/1.3 var(--sp-serif)}
.mf small{margin-left:6px;font:400 13px/1.3 var(--sp-serif);color:#6b6058}
.mf:hover{background:#faf7f2}
.rft{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px;border-top:1px solid #efe8de;font:400 14px/1.3 var(--sp-serif);color:var(--mut)}
.rft button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

/* ── option 1 · checklist ── */
.apo{padding:12px 14px 12px;border-top:1px solid #f1ebe2;background:#faf7f2}
.apo-t{font:400 13.5px/1.3 var(--sp-serif);color:var(--mut);margin:0 2px 8px}
.apo-l{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;border-radius:999px;background:var(--navy);color:var(--cream);font:400 13.5px/1.2 var(--sp-serif)}
.chip i{font-style:normal;opacity:.75}
.chip:hover i{opacity:1}
.ck{list-style:none;margin:0;padding:0 8px 10px}
.ck li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;padding:7px 8px;border-radius:8px;font:400 14.5px/1.3 var(--sp-serif)}
.ck li button:hover{background:#faf7f2}
.ck .tx{flex:1;min-width:0}
.ck .n{font:400 13px/1 var(--sp-type);color:var(--faint)}
.box{flex:none;width:17px;height:17px;border-radius:4px;box-shadow:inset 0 0 0 1.5px #b9afa3;display:grid;place-items:center;color:#fff;font-size:11px;line-height:1}
.rad{flex:none;width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #b9afa3;display:grid;place-items:center}
.on .box{background:var(--navy);box-shadow:none}
.on .rad{box-shadow:inset 0 0 0 5px var(--navy)}
.on .tx{font-weight:600}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.more-l{all:unset;cursor:pointer;margin:0 16px 12px;font:400 13.5px/1 var(--sp-serif);text-decoration:underline;text-underline-offset:3px;color:var(--mut)}
.mine{font:400 12.5px/1 var(--sp-serif);color:var(--navy);background:#e3e8ef;border-radius:999px;padding:3px 7px}

/* ── option 2 · views ── */
.rbd.navy{min-height:62px;align-items:center;padding:0 16px 0 18px;background:var(--navy);color:var(--cream);box-shadow:none}
.rbd.navy b{font:400 21px/1 var(--sp-type)}
.rbd.navy .ron{color:rgba(244,238,229,.75)}
.rbd.navy .rst{color:var(--cream)}
.rbd.navy+.rsec{border-top:0}

.subh{margin:0;padding:2px 16px 4px;font:400 13.5px/1.2 var(--sp-serif);color:var(--mut)}
.views{list-style:none;margin:0;padding:10px 8px 8px}
.views button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:9px;font:400 15px/1.2 var(--sp-serif)}
.views button:hover{background:#faf7f2}
.views svg{flex:none;width:17px;height:17px;color:var(--mut)}
.views .tx{flex:1}
.views .n{font:400 13.5px/1 var(--sp-type);color:var(--faint)}
.views .on{background:var(--navy);color:var(--cream)}
.views .on svg,.views .on .n{color:rgba(244,238,229,.8)}
.views .on:hover{background:var(--navy)}
.rlab{padding:12px 16px 4px;font:400 15px/1.2 var(--sp-type);border-top:1px solid #f1ebe2;display:flex;justify-content:space-between;align-items:baseline}
.rlab small{font:400 13px/1 var(--sp-serif);color:var(--faint)}

/* ── option 5 · at a glance ── */
.gl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 14px}
.gl-tiles .court{background:#faf7f2;box-shadow:inset 0 0 0 1px #e9e0d4}
.gl-tiles .court{display:flex;flex-direction:column;justify-content:space-between;min-height:66px}.gl-tiles .court b{font-size:24px}
.gbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:2px 16px 10px;background:#f1ebe2}
.gbar i{display:block;height:100%;cursor:pointer;transition:opacity .15s}
.gbar.some i{opacity:.35}.gbar.some i.on{opacity:1}
.bars{list-style:none;margin:0;padding:0 8px 12px}
.bars button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 70px 22px;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;font:400 14px/1.3 var(--sp-serif)}
.bars button:hover{background:#faf7f2}
.bars .track{height:8px;border-radius:999px;background:#f1ebe2;overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:999px;background:#c9b9a8}
.bars .on{background:#e3e8ef}
.bars .on .track i{background:var(--navy)}
.bars .n{font:400 13px/1 var(--sp-type);color:var(--faint);text-align:right}
.bars .lg{display:flex;align-items:center;gap:8px;min-width:0}

/* ── the list card (cl26) — with the border continuous ── */
.card{padding:10px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px #1c130f14,0 18px 34px -22px #1c130f73}
.frame{border:1px solid #a5837b;border-radius:13px;overflow:clip}
.band{display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 12px 10px 18px;background:var(--navy);color:var(--cream)}
.band .count{font:400 21px/1 var(--sp-type);margin-right:6px;white-space:nowrap}
.find{flex:0 1 320px;min-width:160px;height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(244,238,229,.22);color:rgba(244,238,229,.8)}
.find input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--cream);font:italic 400 15px/1 var(--sp-serif)}
.find input::placeholder{color:rgba(244,238,229,.65)}
.sp{flex:1}
.ch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:9px;background:#fff;color:var(--ink);font:400 14.5px/1 var(--sp-type);white-space:nowrap}
.ch.on{background:#e3e8ef;box-shadow:inset 0 0 0 1.5px var(--navy)}
.ch .cn{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--navy);color:var(--cream);font:400 12px/1 var(--sp-type)}
.ap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 18px;background:#faf7f2;border-bottom:1px solid rgba(28,19,15,.08);font:400 14px/1.3 var(--sp-serif);color:var(--mut)}
.ap b{color:var(--ink)}
.apc{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #d6cabb;color:var(--ink);font:400 13.5px/1.2 var(--sp-serif)}
.apx{all:unset;cursor:pointer;margin-left:auto;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.th,.row{display:grid;grid-template-columns:22px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr) 34px;align-items:center}
.th{height:42px;background:#fbf9f6;border-bottom:1px solid rgba(28,19,15,.1);font:400 14px/1 var(--sp-type);color:var(--mut)}
.row{min-height:72px;padding:10px 0;border-top:1px solid rgba(28,19,15,.08);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:#fbf9f6}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font:400 14px/1 var(--sp-type)}
.av i{position:absolute;top:-4px;right:-4px;width:17px;height:17px;border-radius:50%;background:#c9705b;color:#fff;font:700 11px/17px var(--sp-serif);text-align:center;font-style:normal;box-shadow:0 0 0 2px #fff}
.who b{display:block;font:400 19px/1.2 var(--sp-type);white-space:nowrap}
.who b .st{font-size:14px;letter-spacing:1px;color:var(--navy);margin-left:8px}
.who b .st s{text-decoration:none;color:#d6cabb}
.who small{display:block;margin-top:4px;font:400 15px/1.2 var(--sp-serif);color:var(--mut)}
.want{display:flex;flex-wrap:wrap;gap:6px}
.gp{padding:4px 10px;border-radius:6px;background:#f3efe9;font:400 14px/1.2 var(--sp-type)}
.gp.hit{background:#e3e8ef}
.none{font:italic 400 15px/1 var(--sp-serif);color:var(--faint)}
.q{display:flex;align-items:center;gap:10px;font:400 16px/1 var(--sp-type)}
.q .o{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--ink)}
.q .o.f{box-shadow:inset 0 0 0 1.6px var(--ink),inset 0 0 0 4px #fff;background:var(--ink)}
.q .o.c{box-shadow:inset 0 0 0 1.6px var(--faint)}
.chev{color:var(--faint);font:400 18px/1 var(--sp-serif)}
.empty{padding:46px 20px;text-align:center}
.empty h3{margin:0 0 8px;font:400 20px/1.2 var(--sp-type)}
.empty p{margin:0;color:var(--mut)}

/* ── option 3 · tabs on the list ── */
.ltabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid rgba(28,19,15,.1);overflow-x:auto}
.ltabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 12px 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px;font:400 15px/1 var(--sp-serif);color:var(--mut);white-space:nowrap}
.ltabs button .n{font:400 13px/1 var(--sp-type);padding:3px 7px;border-radius:999px;background:#f3efe9;color:var(--mut)}
.ltabs button:hover{color:var(--ink)}
.ltabs button.on{color:var(--ink);border-bottom-color:var(--navy);font-weight:600}
.ltabs button.on .n{background:var(--navy);color:var(--cream)}

/* ── option 4 · filter bar ── */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;background:#fbf9f6;border-bottom:1px solid rgba(28,19,15,.1);position:relative}
.fb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #d6cabb;font:400 14.5px/1 var(--sp-serif)}
.fb:hover{box-shadow:inset 0 0 0 1px #a99b8b}
.fb.on{background:var(--navy);color:var(--cream);box-shadow:none}
.fb .cv{font-size:10px;opacity:.7}
.fb .cn{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--cream);color:var(--navy);font:400 12px/1 var(--sp-type)}
.fbsep{width:1px;height:22px;background:#e3d5c9;margin:0 4px}
.fbr{margin-left:auto;font:400 14px/1 var(--sp-serif);color:var(--mut)}
.fbr button{all:unset;cursor:pointer;margin-left:12px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.pop{position:absolute;top:52px;z-index:20;width:280px;padding:8px 0 6px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #e3d5c9,0 18px 36px -18px rgba(28,19,15,.45)}
.pop h4{margin:4px 16px 6px;font:400 15px/1.2 var(--sp-type)}
.pop .pf{display:flex;justify-content:space-between;padding:8px 16px 6px;border-top:1px solid #f1ebe2;margin-top:4px;font:400 13.5px/1 var(--sp-serif);color:var(--mut)}
.pop .pf button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

/* ── the navy page header (Contact list v26's panel, today's words) ── */
.np{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:32px;margin-bottom:24px;padding:24px 34px 24px 26px;border-radius:20px;background:#2a3a52;color:#f4eee5;box-shadow:0 18px 34px -26px rgba(28,19,15,.6)}
.np.bird{grid-template-columns:auto minmax(0,1fr) auto;padding-left:14px}
.np .bd{width:132px;transform:scaleX(-1);display:block;margin:-6px 6px -10px 0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.np h1{margin:0;font:400 34px/1.3 var(--sp-type);color:#f4eee5}
.np .ln{margin:6px 0 0;font:italic 400 16.5px/1.5 var(--sp-serif);color:rgba(244,238,229,.75)}
.np .b1{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:42px;margin-top:18px;padding:0 18px;border-radius:10px;background:#f4eee5;color:#1c130f;font:400 15px/1 var(--sp-type)}
.np .b1:hover{background:#fffaf2}
.nh{display:flex;align-items:center;gap:18px;height:124px}
.ring{position:relative;width:124px;height:124px;flex:none;cursor:pointer}
.ring svg{position:absolute;inset:0;overflow:visible}
.ring img{position:absolute;left:50%;bottom:24px;width:100px;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.ring .pct{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:6px 11px 5px;border-radius:999px;background:#f4eee5;color:#1c130f;font:400 15px/1 var(--sp-type);box-shadow:0 0 0 2.5px #e8bdb4,0 0 0 7.5px #2a3a52}
.nhw{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.nhw b{font:400 21px/1.2 var(--sp-type)}
.nhw small{font:italic 400 15px/1.3 var(--sp-serif);color:rgba(244,238,229,.7)}
.nhw small em{font:400 15.5px/1 var(--sp-type);font-style:normal;color:#e8bdb4}
.nhw button{all:unset;cursor:pointer;margin-top:4px;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:8px;background:#f4eee5;color:#1c130f;font:400 14.5px/1 var(--sp-type)}

/* ── v4 · the Query Centre's header, as built (from Nick's screenshot, at 75% zoom) ── */
.ws{padding:44px 40px 40px}
.qh{display:grid;grid-template-columns:300px minmax(0,1fr) auto;align-items:center;min-height:227px;margin-bottom:30px;padding:0 30px 0 0;border-radius:24px;background:#2a3a52;color:#f4eee5}
.qh-art{display:flex;align-items:center;padding-left:39px}
.qh-art img{width:190px;transform:scaleX(-1);display:block}
.qh-mid{padding:28px 0;max-width:600px}
.qh h1{margin:0;font:400 66px/1.05 var(--sp-type);color:#f4eee5;white-space:nowrap}
.qh-sub{display:flex;align-items:center;gap:16px;margin:16px 0 22px}
.qh-sub i{flex:1;height:1px;background:rgba(244,238,229,.4)}
.qh-sub span{font:italic 400 21px/1 var(--sp-serif);color:rgba(244,238,229,.85)}
.qh-btns{display:flex;gap:14px}
.qb1,.qb2{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:45px;padding:0 22px;border-radius:10px;font:400 19px/1 var(--sp-serif)}
.qb1{background:#f4eee5;color:#1c130f}.qb1:hover{background:#fffaf2}
.qb2{box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.75);color:#f4eee5}.qb2:hover{background:rgba(244,238,229,.08)}
.qh-side{width:384px;margin-left:40px}
.qh-big{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid rgba(244,238,229,.3)}
.qh-big b{font:400 50px/1 var(--sp-type)}
.qh-big em{flex:1;font:italic 400 19px/1 var(--sp-serif);color:rgba(244,238,229,.85)}
.qh-big svg{width:40px;height:40px}
.qh-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:600 17px/1.2 var(--sp-serif)}
.qh-foot b{font:400 18px/1 var(--sp-type);color:#e8bdb4}
.qh-foot button{all:unset;cursor:pointer;font:italic 400 17px/1.2 var(--sp-serif);color:rgba(244,238,229,.9);text-decoration:underline;text-decoration-color:rgba(244,238,229,.4);text-underline-offset:4px}
/* the page grid: the list's left edge lines up with the headline */
.body{grid-template-columns:270px minmax(0,1fr)!important;gap:30px!important}
/* ── v4 · the Query Centre's views panel ── */
.rail{top:20px}
.vh{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 12px;border-bottom:2.5px solid #2a3a52}
.vh b{font:400 25px/1 var(--sp-type)}
.vh button{all:unset;cursor:pointer;font:400 15.5px/1 var(--sp-serif);color:var(--mut)}
.vh button:disabled{opacity:.6;cursor:default}
.views{padding:10px 8px 10px!important}
.views button{padding:9px 12px!important;font:400 17px/1.2 var(--sp-serif)!important}
.views .on .tx{font-weight:600}
.views .n{font-size:14.5px!important}
.rf{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 4px;border-top:1px solid #f1ebe2}
.rf b{font:400 19px/1 var(--sp-type)}
.rf small{font:600 14.5px/1 var(--sp-serif);color:var(--mut)}
.rf-l{padding:8px 18px 2px;font:400 15px/1 var(--sp-serif);color:var(--mut)}
.ck li button{font-size:16px!important}
/* ── v4 · the Query Centre's bar above the list ── */
.tb{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.tb .cnt{flex:none;font:400 19px/1 var(--sp-serif);color:var(--ink);margin-right:4px}
.tb .fd{flex:1;min-width:200px;display:flex;align-items:center;gap:12px;height:39px;padding:0 10px 0 14px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #e3d5c9;color:var(--mut)}
.tb .fd input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 17px/1 var(--sp-serif);color:var(--ink)}
.tb .fd input::placeholder{color:#8a8076}
.tb kbd{display:grid;place-items:center;width:20px;height:22px;border-radius:5px;box-shadow:inset 0 0 0 1px #d6cabb;font:400 12px/1 var(--sp-serif);color:var(--mut)}
.tb .cb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;height:39px;padding:0 13px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #e3d5c9;font:600 17px/1 var(--sp-serif);color:var(--ink);white-space:nowrap}
.tb .cb:hover{box-shadow:inset 0 0 0 1px #c9bba9}
.tb .cb svg{width:16px;height:16px;color:var(--mut)}
.tb .cb .cv{font-size:10px;color:var(--mut);margin-left:2px}
.card .frame{border-color:#e3d5c9}
.card .th{border-radius:12px 12px 0 0}

/* ── v5 · List health as built (ring, words, Fill the gaps), at its own size, on the navy ── */
.qh-lh{display:flex;align-items:center;gap:22px;margin:0 22px 0 40px}
.qh-ring{all:unset;cursor:pointer;position:relative;width:132px;height:132px;flex:none}
.qh-ring svg{position:absolute;inset:0;width:100%;height:100%}
.qh-ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 30px/1 var(--sp-type);color:#f4eee5}
.qh-ring:focus-visible{outline:2px solid #e8bdb4;outline-offset:4px;border-radius:50%}
.qh-lw{display:flex;flex-direction:column;align-items:flex-start}
.qh-lw b{font:400 28px/1.2 var(--sp-type)}
.qh-lw small{margin:6px 0 14px;font:italic 400 17px/1.3 var(--sp-serif);color:rgba(244,238,229,.75)}
.qh-lw small em{font:400 17px/1 var(--sp-type);font-style:normal;color:#e8bdb4}
.qh-lw button{all:unset;cursor:pointer;height:38px;display:inline-flex;align-items:center;padding:0 16px;border-radius:9px;box-shadow:inset 0 0 0 1.5px rgba(244,238,229,.8);font:400 16px/1 var(--sp-type);color:#f4eee5}
.qh-lw button:hover{background:rgba(244,238,229,.08)}

/* ── v6 · the archivist breaking out of the ring, the score on a pill at its foot (Contact list v26) ── */
.qh-ring{width:140px;height:140px;margin-top:-10px}
.qh-arch{position:absolute;left:50%;bottom:30px;width:118px;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));pointer-events:none}
.qh-pct{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:1;white-space:nowrap;padding:6px 12px 5px;border-radius:999px;background:#f4eee5;color:#1c130f;font:400 16px/1 var(--sp-type);box-shadow:0 0 0 2.5px #e8bdb4,0 0 0 7.5px #2a3a52}

/* ── v8 · the pinned state, as on the Query Centre ── */
body{overflow:hidden}
.sw{position:fixed;left:auto;right:16px;bottom:16px;top:auto;z-index:100;max-width:520px;border:1px solid #e3d5c9;border-radius:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.35)}
.app{height:100vh}
.main{display:flex;flex-direction:column;height:100vh;padding-bottom:0}
.ws{--pc:0px;flex:1;min-height:0;overflow:auto;border-radius:0 16px 0 0;padding-top:0;position:relative;font-family:var(--sp-serif)}
.ws *{font-family:inherit}
/* the collapsed header: 60px, sticky at the top, taking no space; its ground the sheet's full width, a hairline at its foot */
.slim{position:sticky;top:0;z-index:40;height:60px;margin:0 0 -30px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(-6px);pointer-events:none;visibility:hidden;transition:opacity 180ms ease-out,transform 180ms ease-out,visibility 0s linear 180ms}
.slim::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-40px;right:-40px;background:var(--page);box-shadow:inset 0 -1px 0 #e0d9ce}
.slim[data-shown]{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity 180ms ease-out,transform 180ms ease-out,visibility 0s}
.sl-t{margin:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.sl-t b{font:400 24px/1.2 var(--sp-type)!important;color:var(--ink)}
.sl-t i{font:italic 400 16px/1.2 var(--sp-serif)!important;color:#5b4f47}
.sl-a{margin-left:auto;display:flex;align-items:center}
.sl-h{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:9px;white-space:nowrap}
.sl-h:hover{background:rgba(28,19,15,.05)}
.sl-h b{font:400 18px/1 var(--sp-type)!important;color:var(--ink)}
.sl-h em{font:italic 400 15px/1 var(--sp-serif)!important;color:#5b4f47}
.sl-b{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:40px;margin-left:26px;padding:0 18px;border-radius:10px;background:#2a3a52;color:#fbf7f0;font:400 16px/1 var(--sp-type)!important}
.sl-b:hover{background:#334763}
.qh h1,.qh-big b,.qh-lw b,.qh-pct{font-family:var(--sp-type)!important}
.qb1,.qb2{font-family:var(--sp-serif)!important}
.vh b,.rf b{font-family:var(--sp-type)!important}
.views .n,.ck .n,.th,.who b,.av,.gp,.q{font-family:var(--sp-type)!important}
.who small,.none{font-family:var(--sp-serif)!important}
.none{font-style:italic}
/* the panel pins 14px under the bar's line */
.rail{top:calc(var(--pc) + 14px)!important;transition:top 180ms ease-out}
/* the bar pins on a strip of the page's ground, which reaches past the list column far enough to hide the card's ring and
   shadow (14px, inside the 30px gap), so nothing of the card ever shows beside or above the bar */
.strip{position:sticky;top:var(--pc);z-index:30;padding:12px 0 18px;margin:-12px 0 0;transition:top 180ms ease-out}
.strip::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-14px;right:-14px;background:var(--page)}
.tb{margin-bottom:0!important}
/* the card: its top — the white edge, its ring, the frame's rounded top and the headings — is one block that pins
   directly under the strip, so pinned, the card looks as if it begins at the headings */
.card2{position:relative;border-radius:22px;background:#fff;box-shadow:0 0 0 1px #1c130f14,0 18px 34px -22px #1c130f73;padding:0 10px 10px}
.cap{position:sticky;top:calc(var(--pc) + 69px);z-index:6;margin:0 -24px;padding:0 14px;background:var(--page);transition:top 180ms ease-out}
.capin{padding:10px 10px 0;border-radius:22px 22px 0 0;background:#fff;box-shadow:0 0 0 1px #1c130f14;clip-path:inset(-2px -2px 0 -2px)}
.captop{border:1px solid #e3d5c9;border-bottom:0;border-radius:13px 13px 0 0;overflow:hidden}
.rowsf{border:1px solid #e3d5c9;border-top:0;border-radius:0 0 13px 13px;overflow:clip}
.card2 .th{border-radius:0}
</style>
</head>

/* ── data: 17 agents (the first six as in your screenshot) ── */
const A=[
 ["Rosalind","Achebe","Hartley & Co",4,"agent",[],"Queried",1,1],
 ["Mister","Bean","Bean Publications · London",0,"agent",["thr","hist","scifi"],"Queried",0,1],
 ["Sophie","Dunn","Curtis Vane",3,"you",[],"Full sent",1,1],
 ["Tom","Ellery","Curtis Vane",3,"you",["thr"],"Offer",1,1],
 ["Aisha","Kapoor","The Lantern Agency",3,"you",[],"Queried",1,1],
 ["Penhallow","Literary","London",3,"agent",[],"Queried",1,0],
 ["Hannah","Marsh","Greenway Literary",4,"you",["rom"],"Partial sent",1,1],
 ["Owen","Pryce","Fable & Ink",2,"agent",[],"Queried",1,1],
 ["Clara","Whitlow","Marlow Hayes",4,"you",["hist"],"Queried",1,1],
 ["Jonah","Reyes","Northlight",3,"agent",["scifi"],"Queried",1,0],
 ["Imogen","Taft","Hartley & Co",2,"you",[],"Queried",1,1],
 ["Felix","Ward","The Bramble Agency",3,"agent",[],"Queried",1,1],
 ["Leah","Osei","Curtis Vane",4,"you",[],"Full sent",1,1],
 ["Daniel","Hart","The Lantern Agency",2,"closed",[],"Passed",1,0],
 ["Maya","Lund","Greenway Literary",3,"agent",[],"Queried",1,1],
 ["Rupert","Vale","Fable & Ink",2,"closed",[],"Passed",1,0],
 ["Zara","Quinn","Marlow Hayes",3,"you",[],"Queried",1,1],
].map(([f,l,ag,fit,stand,g,q,missing,open])=>({f,l,ag,fit,stand,g,q,missing:!!missing,open:!!open}));
const GEN={thr:"Thriller",hist:"Historical fiction",scifi:"Sci-fi",rom:"Romance"};
const GORDER=["hist","scifi","thr","rom"];
const HIT=new Set(["thr"]); /* genres the book in scope carries */
const PICKS=[["you","Your move","Agents waiting on you"],["ready","Ready to query","Not queried, details complete"],["wait","Waiting to hear back","Queried, no answer yet"],["missing","Missing details","Agents with gaps in their profile"]];
const SETS=[["you","Your move","#c9705b"],["agent","Querying","#2a3a52"],["none","Not queried","#b9afa3"],["closed","Closed","#8a8076"]];
const SETBG={you:"#c9705b",agent:"#2a3a52",none:"#d6cabb",closed:"#8a8076"};

let S={pick:null,genres:new Set(),sets:new Set(),open:false,find:""};
let opt="b", more=false, fold={}, showAllG=false, pop=null;

const pickFn={you:a=>a.stand==="you",ready:a=>a.stand==="none"&&!a.missing,wait:a=>a.stand==="you"||a.stand==="agent",missing:a=>a.missing};
const passes=(a,skip)=>{
  if(skip!=="pick"&&S.pick&&!pickFn[S.pick](a))return false;
  if(skip!=="genres"&&S.genres.size&&!a.g.some(x=>S.genres.has(x)))return false;
  if(skip!=="sets"&&S.sets.size&&!S.sets.has(a.stand))return false;
  if(skip!=="open"&&S.open&&!a.open)return false;
  if(S.find){const t=(a.f+" "+a.l+" "+a.ag).toLowerCase();if(!t.includes(S.find.toLowerCase()))return false}
  return true};
const pool=()=>A.filter(a=>passes(a));
const cPick=k=>A.filter(a=>passes(a,"pick")&&pickFn[k](a)).length;
const cGen=k=>A.filter(a=>passes(a,"genres")&&a.g.includes(k)).length;
const cSet=k=>A.filter(a=>passes(a,"sets")&&a.stand===k).length;
const cOpen=()=>A.filter(a=>passes(a,"open")&&a.open).length;
const onCount=()=>(S.pick?1:0)+S.genres.size+S.sets.size+(S.open?1:0);
const applied=()=>{const r=[];
  if(S.pick)r.push([PICKS.find(p=>p[0]===S.pick)[1],()=>S.pick=null]);
  S.sets.forEach(k=>r.push([SETS.find(s=>s[0]===k)[1],()=>S.sets.delete(k)]));
  S.genres.forEach(k=>r.push([GEN[k],()=>S.genres.delete(k)]));
  if(S.open)r.push(["Open to queries",()=>S.open=false]);return r};
const reset=()=>{S.pick=null;S.genres.clear();S.sets.clear();S.open=false};
const tog=(set,k)=>set.has(k)?set.delete(k):set.add(k);

const OPTS={
 today:{label:"Today (as built)",note:"<em>For comparison.</em> Pills for Most used and Genres, then a More filters row hiding Where they stand and Submissions."},
 a:{label:"1 · Checklist",note:"<em>Inspired by John Lewis, Airbnb and Etsy.</em> The calmest option: every filter is a plain row with a tick box (or a round radio for Most used, as you can only pick one), counts lined up on the right so they're easy to scan. What you've switched on sits at the top of the rail as chips you can take off one at a time — Baymard's testing found an overview like this, above the filters, works as well as one above the list. Where they stand comes out from behind More filters with its status colours."},
 b:{label:"Query Centre layout",note:"<em>v8:</em> scroll to see the pinned state. The collapsed bar is the Query Centre’s (60px, its title size, its button, its ground across the whole sheet with the hairline at its foot); the panel and bar are in the Query Centre’s serif; and pinned, the list card begins at its headings, with nothing of the card beside or above the bar."},
 c:{label:"3 · Tabs on the list",note:"<em>Inspired by Shopify's admin, GitHub issues and Gmail's inbox tabs.</em> The four quick picks move onto the list itself as tabs with counts, right under the navy band, so the most common choice sits where your eye already is. The rail gets shorter and only holds the finer filters: genres, where they stand and submissions."},
 d:{label:"4 · Filter bar, no rail",note:"<em>Inspired by Airbnb, SSENSE and Notion.</em> The rail goes; the list takes the full width. A row of buttons opens a small menu for each filter, and a button turns navy with a count when it's in use. Works because your filter set is small — Baymard warns horizontal bars get cramped with many filter types, so it's less roomy if you add filters later."},
 e:{label:"5 · At a glance",note:"<em>Inspired by Amazon's star-rating bars and GitHub's language bar.</em> The rail doubles as a picture of your list: the quick picks are number tiles, where they stand is one stacked bar you can click, and each genre shows a bar for how many agents want it. Follows your steer on creative ways to show data, built from the existing tiles."},
};

function render(){
  npRender();
  document.getElementById("sw").innerHTML="<b>Contact list v8 — scroll the page</b>"+Object.entries(OPTS).filter(([k])=>k==="b").map(([k,o])=>`<button class="${k===opt?"on":""}" data-opt="${k}">${o.label}</button>`).join("")+"";
  document.getElementById("note").innerHTML=OPTS[opt].note;
  const body=document.getElementById("body");
  body.className="body"+(opt==="d"?" norail":"");
  body.innerHTML=(opt==="d"?"":rail())+list();
  const fi=body.querySelector(".fdi");
  if(fi){fi.value=S.find;fi.oninput=e=>{S.find=e.target.value;const pos=e.target.selectionStart;render();const n=document.querySelector(".fdi");n.focus();n.setSelectionRange(pos,pos)}}
}
const foldNote=k=>{if(!fold[k])return "";const t=k==="views"?(S.pick?PICKS.find(p=>p[0]===S.pick)[1]:"All agents"):k==="gen"?[...S.genres].map(g=>GEN[g]).join(", "):"";return t?`<small style="flex:1;margin-left:10px;font:400 13.5px/1.2 var(--sp-serif);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</small>`:""};
const head=(k,t)=>`<button class="rh5" data-fold="${k}">${t}${foldNote(k)}<i>${fold[k]?"▸":"▾"}</i></button>`;
const railTop=()=>{const n=onCount();return `<div class="rbd"><b>Filter</b>${n?`<span class="ron">${n} on</span>`:""}<button class="rst" data-act="reset" ${n?"":"disabled"}>Reset</button></div>`};
const railFoot=()=>{const p=pool().length;return `<div class="rft"><span>${onCount()?`${p} of 17 showing`:`${p} showing`}</span><button>Export ${p} agent${p===1?"":"s"}</button></div>`};
const pillsPicks=()=>`<div class="pills">${PICKS.map(([k,t,l])=>{const n=cPick(k),on=S.pick===k;return `<button class="pill${on?" on":""}${!on&&!n?" zero":""}" data-pick="${k}" title="${l}">${t}<span class="n">${n}</span></button>`}).join("")}</div>`;
const pillsGen=()=>`<div class="pills">${GORDER.map(k=>{const n=cGen(k),on=S.genres.has(k),h=HIT.has(k);return `<button class="pill${on?" on":""}${h?" hit":""}${!on&&!n?" zero":""}" data-gen="${k}">${h?"✓ ":""}${GEN[k]}<span class="n">${n}</span></button>`}).join("")}</div>`;
const courts=()=>`<div class="courts">${SETS.map(([k,t])=>{const n=cSet(k),on=S.sets.has(k);return `<button class="court${on?" on":""}${!on&&!n?" zero":""}" data-k="${k}" data-set="${k}"><b>${n}</b><span>${t}</span></button>`}).join("")}</div>`;
const openSw=()=>{const n=cOpen();return `<button class="swr${S.open?" on":""}${!S.open&&!n?" zero":""}" data-act="open"><span class="tx">Open to queries only</span><span class="n">${n}</span><span class="tog"></span></button>`};
const sec=(k,t,inner)=>`<section class="rsec">${head(k,t)}${fold[k]?"":inner}</section>`;

function rail(){
  if(opt==="today"){
    return `<aside class="rail">${railTop()}${sec("quick","Most used",pillsPicks())}${sec("gen","Genres",pillsGen())}
    ${more?sec("where","Where they stand",courts())+sec("subs","Submissions",openSw()):""}
    <button class="mf" data-act="more"><span>More filters<small>Where they stand, submissions</small></span><span>${more?"▴":"▾"}</span></button>${railFoot()}</aside>`}
  if(opt==="a"){
    const ap=applied();
    const ckRow=(attr,k,txt,n,on,mark,extra="")=>`<li><button class="${on?"on":""}${!on&&!n?" zero":""}" ${attr}="${k}">${mark}<span class="tx">${txt}${extra}</span><span class="n">${n}</span></button></li>`;
    const gens=showAllG?GORDER:GORDER.slice(0,3);
    return `<aside class="rail">${railTop()}
    ${ap.length?`<div class="apo"><p class="apo-t">Showing ${pool().length} of 17 agents</p><div class="apo-l">${ap.map(([t],i)=>`<button class="chip" data-drop="${i}">${t}<i>✕</i></button>`).join("")}</div></div>`:""}
    ${sec("quick","Most used",`<ul class="ck">${PICKS.map(([k,t])=>ckRow("data-pick",k,t,cPick(k),S.pick===k,'<span class="rad"></span>')).join("")}</ul>`)}
    ${sec("where","Where they stand",`<ul class="ck">${SETS.map(([k,t,c])=>ckRow("data-set",k,t,cSet(k),S.sets.has(k),'<span class="box">✓</span>',"")).join("").replace(/<span class="tx">/g,(m,i)=>m)}</ul>`)}
    ${sec("gen","Genres",`<ul class="ck">${gens.map(k=>ckRow("data-gen",k,GEN[k],cGen(k),S.genres.has(k),'<span class="box">✓</span>',HIT.has(k)?' <span class="mine">your book</span>':"")).join("")}</ul>${showAllG?"":`<button class="more-l" data-act="allg">Show all ${GORDER.length} genres</button>`}`)}
    ${sec("subs","Submissions",openSw())}${railFoot()}</aside>`}
  if(opt==="b"){
    const ic={all:'<path d="M3 5h12M3 9h12M3 13h12"/>',you:'<path d="M9 3v8M9 14.5v.5"/><circle cx="9" cy="9" r="7.2"/>',ready:'<path d="M3 9.5 15 3l-4 12-2.5-5L3 9.5Z"/>',wait:'<circle cx="9" cy="9" r="7"/><path d="M9 5v4l2.5 2"/>',missing:'<path d="M4 3h7l3 3v9H4z"/><path d="M7 9h4M7 12h3"/>'};
    const v=(k,t,n)=>{const on=k==="all"?!S.pick:S.pick===k;return `<li><button class="${on?"on":""}${!on&&!n?" zero":""}" data-view="${k}"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg><span class="tx">${t}</span><span class="n">${n}</span></button></li>`};
    const allN=A.filter(a=>passes(a,"pick")).length;
    const ck=(attr,k,txt,n,on,extra="")=>`<li><button class="${on?"on":""}${!on&&!n?" zero":""}" ${attr}="${k}"><span class="box">✓</span><span class="tx">${txt}${extra}</span><span class="n">${n}</span></button></li>`;
    const refN=S.genres.size+S.sets.size+(S.open?1:0);
    const n=onCount();
    return `<aside class="rail"><div class="vh"><b>Views</b><button data-act="reset" ${n?"":"disabled"}>Reset</button></div>
    <ul class="views">${v("all","All agents",allN)}${PICKS.map(([k,t])=>v(k,t,cPick(k))).join("")}</ul>
    <div class="rf"><b>Refine</b><small>within this view</small></div>
    <div class="rf-l">Genres</div>
    <ul class="ck">${GORDER.map(k=>ck("data-gen",k,GEN[k],cGen(k),S.genres.has(k),HIT.has(k)?' <span class="mine">your book</span>':"")).join("")}</ul>
    ${more?sec("where","Where they stand",courts())+sec("subs","Submissions",openSw()):""}
    <button class="mf" data-act="more"><span>More filters<small>Where they stand, submissions</small></span><span>${more?"▴":"▾"}</span></button>${railFoot()}</aside>`}
  if(opt==="c"){
    return `<aside class="rail">${railTop()}${sec("gen","Genres",pillsGen())}${sec("where","Where they stand",courts())}${sec("subs","Submissions",openSw())}${railFoot()}</aside>`}
  if(opt==="e"){
    const tiles=`<div class="gl-tiles">${PICKS.map(([k,t,l])=>{const n=cPick(k),on=S.pick===k;return `<button class="court${on?" on":""}${!on&&!n?" zero":""}" data-pick="${k}" title="${l}"><b>${n}</b><span>${t}</span></button>`}).join("")}</div>`;
    const tot=SETS.reduce((s,[k])=>s+cSet(k),0)||1;
    const bar=`<div class="gbar${S.sets.size?" some":""}">${SETS.map(([k])=>{const n=cSet(k);return n?`<i class="${S.sets.has(k)?"on":""}" data-set="${k}" title="${SETS.find(s=>s[0]===k)[1]}: ${n}" style="width:${n/tot*100}%;background:${SETBG[k]}"></i>`:""}).join("")}</div>`;
    const setRows=`<ul class="bars">${SETS.map(([k,t])=>{const n=cSet(k),on=S.sets.has(k);return `<li><button class="${on?"on":""}${!on&&!n?" zero":""}" data-set="${k}"><span class="lg"><span class="dot" style="background:${SETBG[k]}"></span>${t}</span><span class="track"><i style="width:${n/17*100}%;background:${SETBG[k]};opacity:${on||!S.sets.size?1:.5}"></i></span><span class="n">${n}</span></button></li>`}).join("")}</ul>`;
    const max=Math.max(1,...GORDER.map(cGen));
    const genRows=`<ul class="bars">${GORDER.map(k=>{const n=cGen(k),on=S.genres.has(k);return `<li><button class="${on?"on":""}${!on&&!n?" zero":""}" data-gen="${k}"><span class="lg">${HIT.has(k)?"✓ ":""}${GEN[k]}</span><span class="track"><i style="width:${n/max*100}%"></i></span><span class="n">${n}</span></button></li>`}).join("")}</ul>`;
    return `<aside class="rail">${railTop()}${sec("quick","Most used",tiles)}${sec("where","Where they stand",bar+setRows)}${sec("gen","Genres",genRows)}${sec("subs","Submissions",openSw())}${railFoot()}</aside>`}
  return ""}

function list(){
  const p=pool(), ap=applied();
  const stars=n=>n?`<span class="st">${"★".repeat(n)}<s>${"★".repeat(5-n)}</s></span>`:"";
  const qi=q=>q==="Passed"?'<span class="o c"></span>':q==="Offer"?'<span style="font-size:15px">🗎</span>':/sent/.test(q)?'<span class="o f"></span>':'<span class="o"></span>';
  const rows=p.map(a=>`<div class="row"><span></span><div class="who"><span class="av">${(a.f[0]+a.l[0]).toUpperCase()}${a.stand==="you"?"<i>!</i>":""}</span><div><b>${a.f} ${a.l}${stars(a.fit)}</b><small>${a.ag}</small></div></div>
    <div class="want">${a.g.length?a.g.map(g=>`<span class="gp${HIT.has(g)?" hit":""}">${HIT.has(g)?"✓ ":""}${GEN[g]}</span>`).join(""):'<span class="none">No genres yet</span>'}</div>
    <div class="q">${qi(a.q)}${a.q}</div><span class="chev">›</span></div>`).join("");
  let extra="";
  if(opt==="c"){const allN=A.filter(a=>passes(a,"pick")).length;
    extra=`<div class="ltabs"><button class="${!S.pick?"on":""}" data-view="all">All agents<span class="n">${allN}</span></button>${PICKS.map(([k,t])=>{const n=cPick(k),on=S.pick===k;return `<button class="${on?"on":""}${!on&&!n?" zero":""}" data-pick="${k}">${t}<span class="n">${n}</span></button>`}).join("")}</div>`}
  if(opt==="d"){
    const fb=(k,t,n)=>`<button class="fb${n?" on":""}" data-pop="${k}">${t}${n?`<span class="cn">${n}</span>`:""}<span class="cv">▾</span></button>`;
    const pickName=S.pick?PICKS.find(x=>x[0]===S.pick)[1]:"Most used";
    let menu="";
    if(pop){const ck=(attr,k,txt,n,on,mark)=>`<li><button class="${on?"on":""}${!on&&!n?" zero":""}" ${attr}="${k}">${mark}<span class="tx">${txt}</span><span class="n">${n}</span></button></li>`;
      const left={pick:14,gen:150,set:252}[pop];
      const inner=pop==="pick"?PICKS.map(([k,t])=>ck("data-pick",k,t,cPick(k),S.pick===k,'<span class="rad"></span>')).join("")
        :pop==="gen"?GORDER.map(k=>ck("data-gen",k,GEN[k]+(HIT.has(k)?' <span class="mine">your book</span>':""),cGen(k),S.genres.has(k),'<span class="box">✓</span>')).join("")
        :SETS.map(([k,t])=>ck("data-set",k,t,cSet(k),S.sets.has(k),'<span class="box">✓</span>')).join("");
      const ttl={pick:"Most used",gen:"Genres",set:"Where they stand"}[pop];
      menu=`<div class="pop" style="left:${left}px"><h4>${ttl}</h4><ul class="ck">${inner}</ul><div class="pf"><button data-act="clearpop">Clear</button><span>${p.length} agents</span></div></div>`}
    extra=`<div class="fbar">${fb("pick",pickName,0).replace('class="fb','class="fb'+(S.pick?" on":""))}${fb("gen","Genres",S.genres.size)}${fb("set","Where they stand",S.sets.size)}<span class="fbsep"></span>
      <button class="fb${S.open?" on":""}" data-act="open">Open to queries <span class="tog${S.open?" on":""}"></span></button>
      <span class="fbr">${onCount()?`${p.length} of 17 showing<button data-act="reset">Clear all</button>`:`17 showing`}</span>${menu}</div>`}
  const apL=opt==="c"?ap.filter(([t])=>!PICKS.some(p=>p[1]===t)):ap; const showAp=apL.length&&opt!=="a"&&opt!=="d";
  const GI='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="4" rx="1"/><rect x="2" y="9.5" width="12" height="4" rx="1"/></svg>';
  const SI='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 13V3M2.5 5.5 5 3l2.5 2.5M11 3v10M8.5 10.5 11 13l2.5-2.5"/></svg>';
  return `<div><div class="strip"><div class="tb"><span class="cnt">${p.length} agent${p.length===1?"":"s"}</span>
    <label class="fd"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.8"/><path d="m10.5 10.5 3.2 3.2"/></svg><input class="fdi" placeholder="Find an agent or agency"><kbd>/</kbd></label>
    <button class="cb">${SI}Surname</button><button class="cb">${GI}No grouping</button></div></div>
    <section class="card2"><div class="cap"><div class="capin"><div class="captop">
    ${showAp?`<div class="ap"><span>Showing <b>${p.length}</b> of 17</span>${apL.map(([t])=>`<button class="apc" data-drop="${ap.findIndex(x=>x[0]===t)}">${t} ×</button>`).join("")}<button class="apx" data-act="reset">Clear filters</button></div>`:""}
    <div class="th"><span></span><span>Agent ↓</span><span>What they want</span><span>Your query</span><span></span></div></div></div></div>
    <div class="rowsf">${rows||`<div class="empty"><h3>No agents match.</h3><p>Try taking a filter off.</p></div>`}</div>
  </section></div>`}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-set]"); if(!b){if(pop){pop=null;render()}return}
  const d=b.dataset;
  if(d.hb){withBird=d.hb==="1";render();return}
  if(d.opt){opt=d.opt;pop=null;render();scrollTo(0,0);return}
  if(d.fold){fold[d.fold]=!fold[d.fold]}
  else if(d.pick){S.pick=S.pick===d.pick?null:d.pick}
  else if(d.view){S.pick=d.view==="all"?null:d.view}
  else if(d.gen){tog(S.genres,d.gen)}
  else if(d.set){tog(S.sets,d.set)}
  else if(d.drop){applied()[+d.drop][1]()}
  else if(d.pop){pop=pop===d.pop?null:d.pop;render();return}
  else if(d.act==="reset"){reset()}
  else if(d.act==="open"){S.open=!S.open}
  else if(d.act==="more"){more=!more}
  else if(d.act==="allg"){showAllG=true}
  else if(d.act==="clearpop"){if(pop==="pick")S.pick=null;if(pop==="gen")S.genres.clear();if(pop==="set")S.sets.clear()}
  else return;
  if(!b.closest(".pop"))pop=null;
  render();
});
render();
/* the slim bar shows once the navy header has gone under it; while it shows, everything that pins sits under it */
const ws=document.getElementById("ws"), slim=document.getElementById("slim");
function onScroll(){
  const hd=document.querySelector(".qh"); if(!hd)return;
  const show=hd.getBoundingClientRect().bottom<=ws.getBoundingClientRect().top+60;
  slim.toggleAttribute("data-shown",show); slim.setAttribute("aria-hidden",show?"false":"true");
  ws.style.setProperty("--pc",show?"60px":"0px");
}
ws.addEventListener("scroll",onScroll,{passive:true}); onScroll();
</script>
