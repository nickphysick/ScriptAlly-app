name: CI retry

# ⚠️ THIS RETRIES INFRASTRUCTURE FAILURES ONLY — runs where NOTHING WAS EVER EXECUTED.
#
# ⚠️ THE DISCRIMINATOR IS "ZERO COMPLETED STEPS", not `runner_name`. The first version keyed off an
# empty `runner_name`, which covers the queue timeout ("The job was not acquired by Runner of type
# hosted") but MISSED the very next infrastructure failure to arrive: "The hosted runner lost
# communication with the server" (6 Aug, the tail of the same Actions incident). That job HAD a
# runner name and still ran nothing, so the guard sat out a failure it existed for.
#
# Zero completed steps is the honest signal, and it is safe in the direction that matters: a real
# code failure always leaves steps behind — checkout, setup, install, and the one that went red.
# Retrying on `failure` alone would re-run genuinely red builds until they passed by luck, which is
# the opposite of a safety net.
#
# One retry only (`run_attempt == 1`). If the second attempt also fails to find a runner, that is a
# real capacity problem and it should be visible rather than papered over.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only if no runner was ever assigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate)
          total=$(echo "$jobs_json" | jq '[.jobs[]] | length')
          # a step that reports a conclusion RAN; a job with none of those executed nothing
          ran_nothing=$(echo "$jobs_json" \
            | jq '[.jobs[] | select([.steps[]? | select(.conclusion != null and .conclusion != "skipped")] | length == 0)] | length')
          echo "run $RUN_ID: $ran_nothing of $total jobs executed no steps"
          # EVERY job must have run nothing. A mixed run had something actually execute, and
          # whatever that was is the thing to look at.
          if [ "$total" -gt 0 ] && [ "$ran_nothing" -eq "$total" ]; then
            echo "Nothing was ever executed — re-running $RUN_ID."
            gh run rerun "$RUN_ID" -R "$REPO"
          else
            echo "This run failed for a real reason. Leaving it red."
          fi
