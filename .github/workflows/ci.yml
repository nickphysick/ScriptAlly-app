name: CI

# Verify every push to main and every PR: typecheck, tests, production build.
# No secrets needed — the Firebase web config in .env.production is non-secret (it ships to the
# browser), so `vite build` works in CI as-is. This is the safety net the app lacked (no staging).

on:
  push:
    branches: [main]
  pull_request:
  # ⚠️ SO MAIN CAN BE VERIFIED WITHOUT AN EMPTY COMMIT. During the 6 Aug outage a push landed on
  # main and GitHub created no run for it — the tip sat unverified with no way to ask for a run
  # except by pushing again. `gh workflow run CI --ref main` covers that, and any other case where
  # a run is missing or a re-run is wanted on an unchanged tree.
  workflow_dispatch:

# ⚠️ SUPERSEDED RUNS ARE CANCELLED — but read the next paragraph before crediting this with a fix.
#
# Twice on 6 Aug a run sat queued for exactly 15 minutes and died with "The job was not acquired by
# Runner of type hosted" — GitHub's queue timeout, reported as a RUN FAILURE (job conclusion
# `cancelled`, run conclusion `failure`), which is what sent the red CI emails. Nothing in this repo
# failed on either occasion.
#
# ⚠️ THE CAUSE WAS A GITHUB ACTIONS OUTAGE, NOT ANYTHING HERE. githubstatus.com logged a critical
# incident from 15:22 UTC that day — "workflow runs are failing or delayed, and some queued jobs may
# time out", plus webhook delivery delays. The correlation is exact: every run before 15:22 either
# passed or failed for a real reason; both starvations, and a later push that produced NO run at all,
# are after it. The first read of this — that bursts of commits caused it — was wrong, and the
# evidence for it (the starved run being the older of two in flight) was a coincidence of timing.
#
# So this block is HYGIENE, NOT THE CURE. It is still right: main is linear, only the tip is ever
# the tree we care about, and holding a second job in a queue that is degraded buys nothing. It
# narrows the window. It cannot make GitHub hand out a runner. A run cancelled this way ends as
# `cancelled`, not `failure`, so it does not notify.
#
# Grouped PER REF so a PR can never cancel main's run, or vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java is required by the Firebase Firestore emulator (it ships as a JVM JAR).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ⚠️ THE ROOT INSTALL DOES NOT REACH `functions/` — IT HAS ITS OWN package.json.
      # `functions/src/waitlist.emulator.spec.ts` imports `firebase-admin`, declared only in
      # functions/package.json. Node resolves it by walking up from the spec:
      # functions/src/node_modules → functions/node_modules → root node_modules. Without the
      # second install the middle directory does not exist here and the emulator step dies with
      # "Cannot find package 'firebase-admin'" — while passing on the author's machine, where
      # functions/node_modules is present from a `firebase deploy` build. Five consecutive red
      # runs on exactly this, from 89ca6ccb (25 Aug), the commit that added both the spec and
      # the step that runs it.
      - name: Install
        run: |
          npm ci --cache /tmp/npm-cache
          npm ci --prefix functions --cache /tmp/npm-cache

      - name: Typecheck
        run: npx tsc --noEmit

      # ⚠️ THE ROOT TYPECHECK DOES NOT COVER `functions/` — tsconfig.json excludes it, so the step
      # above is blind to every type error in a Cloud Function. Until this step existed the ONLY
      # thing that typechecked them was `firebase.json`'s predeploy hook, which means a type error
      # surfaced to whoever was mid-deploy rather than to CI. Measured: a deliberate TS2322 in
      # functions/src went completely unmentioned by the root run and was caught by this one.
      - name: Typecheck (functions)
        run: npx tsc --noEmit -p functions/tsconfig.json

      - name: Test
        run: npm test

      - name: Rules tests (Firestore emulator)
        run: npm run test:rules

      # ⚠️ THE FIRST PLACE THESE EVER RUN. The Firestore emulator is a JVM jar and the author's
      # machine has no JDK, so the waitlist's transactions — the cap race above all — are
      # typechecked locally and EXECUTED here. If this step is ever removed, the only test that
      # can catch two writers taking the same founding place goes with it.
      - name: Functions tests (Firestore emulator)
        run: npm run test:functions

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
